name: CI

on:
  push:
    branches: ['**']   # feature branches must be green before review
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conflict-marker gate
        run: node test/conflict-markers.js
      - name: Syntax check server
        run: node --check server.js
      - name: Run test suite
        run: node test/run.js
