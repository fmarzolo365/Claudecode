const TEST_KEY = "telefontrainer.tests";

function saveTestResult(rec) {

/* score history + dashed projection as a small self-contained SVG */
function chartSVG(tests) {
  const W = 340, H = 180, PL = 26, PR = 34, PT = 12, PB = 20;
  const pts = tests.slice(-8);
  const bands = [[20, "A1"], [40, "A2"], [55, "B1"], [70, "B2"], [85, "C1"]];
  const y = (s) => PT + (100 - s) / 100 * (H - PT - PB);
  // projection: average improvement of the recent gaps, 3 weekly points ahead
  let proj = [];
  if (pts.length >= 2) {
    const recent = pts.slice(-4);
    const delta = (recent[recent.length - 1].score - recent[0].score) / (recent.length - 1);
    let last = pts[pts.length - 1].score;
    for (let k = 1; k <= 3; k++) proj.push(Math.max(5, Math.min(98, last + delta * k)));
  }
  const total = pts.length + proj.length;
  const x = (i) => total > 1 ? PL + i / (total - 1) * (W - PL - PR) : W / 2;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">`;
  for (const [s, name] of bands) {
    svg += `<line x1="${PL}" y1="${y(s)}" x2="${W - PR}" y2="${y(s)}" stroke="rgba(22,19,13,.1)" stroke-width="1"/>` +
           `<text x="${W - PR + 5}" y="${y(s) + 3.5}" font-size="9" fill="#6f6858" font-family="monospace">${name}</text>`;
  }
  if (pts.length > 1) {
    svg += `<polyline fill="none" stroke="#16130d" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p, i) => `${x(i)},${y(p.score)}`).join(" ")}"/>`;
  }
  if (proj.length) {
    const start = `${x(pts.length - 1)},${y(pts[pts.length - 1].score)}`;
    svg += `<polyline fill="none" stroke="#2e7d5b" stroke-width="2" stroke-dasharray="5 5" points="${start} ${proj.map((s, k) => `${x(pts.length + k)},${y(s)}`).join(" ")}"/>`;
    proj.forEach((s, k) => svg += `<circle cx="${x(pts.length + k)}" cy="${y(s)}" r="4" fill="#f7f3e6" stroke="#2e7d5b" stroke-width="2"/>`);
    svg += `<text x="${x(total - 1)}" y="${y(proj[proj.length - 1]) - 10}" font-size="10" font-weight="700" fill="#2e7d5b" text-anchor="end" font-family="sans-serif">${Math.round(proj[proj.length - 1])}</text>`;
  }
  pts.forEach((p, i) => {
    svg += `<circle cx="${x(i)}" cy="${y(p.score)}" r="4.5" fill="#6f9d43" stroke="#16130d" stroke-width="2"/>`;
    svg += `<text x="${x(i)}" y="${y(p.score) - 10}" font-size="10" font-weight="700" fill="#16130d" text-anchor="middle" font-family="sans-serif">${p.score}</text>`;
  });
  return svg + "</svg>";
}

let TST = null;
function startProgress() {
  TST = { phase: "home" };
  const L = t();
  $("testTitle").textContent = L.progress.toUpperCase();
  $("testBack").textContent = L.back;

}
async function beginTest() {
  const L = t();
  TST = { phase: "loading" };
  renderTest();
  try {
    const help = HELP_LANG[S.lang] || "English";
    const res = await chatFetch({
      system: `You create a short ${TARGET.name} speaking test. Return ONLY a JSON array, no markdown, of exactly 6 items: [{"tr":"...","ref":"..."}]
"tr": a sentence in ${help} that the learner must say in ${TARGET.name}. "ref": a natural, correct ${TARGET.name} version.
Difficulty ladder: items 1-2 very easy (greeting, name, a simple need - A0/A1), items 3-4 everyday A2 (appointment, time, buying something), items 5-6 B1 (politely declining a date, explaining a problem, a request with a subordinate clause).
Each sentence 4-12 words, everyday phone/errand situations, fresh content every time.`,
      messages: [{ role: "user", content: "Create the test." }],
    });
    const data = await res.json();
    const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = raw.replace(/```json|```/g, "").trim();
    const items = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]") + 1))
      .filter((x) => x && x.tr && x.ref).slice(0, 6);
    if (items.length < 4) throw new Error("bad test");
    TST = { phase: "item", items, i: 0, answers: items.map(() => ""), listening: false, err: null, heard: null };
  } catch (e) {
    TST = { phase: "home", err: t().testFail };
  }
  renderTest();
}
function testListen() {
  const L = t();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || TST.listening) return;
  speechSynthesis.cancel(); stopAudio();
  const r = new SR();
  r.lang = TARGET.locale; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = (e) => {
    TST.answers[TST.i] = e.results[0][0].transcript;
    nextTestItem();
  };
  r.onerror = (e) => {
    TST.listening = false;
    const c = e && e.error;
    TST.err = c === "no-speech" ? L.noSpeech : c === "not-allowed" ? L.micBlocked : c !== "aborted" ? L.micErr : null;
    renderTest();
  };
  r.onend = () => { TST.listening = false; renderTest(); };
  try { r.start(); TST.listening = true; TST.err = null; renderTest(); } catch (e) { TST.listening = false; }
}
function nextTestItem() {
  TST.i++; TST.listening = false; TST.err = null;
  if (TST.i >= TST.items.length) scoreTest();
  else renderTest();
}
async function scoreTest() {
  const L = t();
  TST.phase = "scoring";
  renderTest();
  try {
    const help = HELP_LANG[S.lang] || "English";
    const lines = TST.items.map((it, i) =>
      `${i + 1}. target (${help}): "${it.tr}" | reference ${TARGET.name}: "${it.ref}" | learner said: "${TST.answers[i] || "(nothing)"}"`).join("\n");
    const res = await chatFetch({
      system: `You grade a ${TARGET.name} speaking test. The learner's answers come from speech recognition, so minor transcription noise is normal - grade the communication, not the transcription.
Return ONLY a JSON object: {"score": <0-100 holistic speaking score>, "cefr": "<A0|A1|A2|B1|B2|C1>", "comment": "<2 short encouraging sentences in ${help}: one strength, one concrete thing to improve>"}
Scoring guide: 0-19 barely any ${TARGET.name} yet, 20-39 A1 basics, 40-54 simple everyday A2, 55-69 solid B1, 70-84 confident B2, 85+ C1.`,
      messages: [{ role: "user", content: `Test answers:\n${lines}` }],
    });
    const data = await res.json();
    const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = raw.replace(/```json|```/g, "").trim();
    const p = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    const rec = { date: new Date().toISOString(), score: Math.max(0, Math.min(100, Math.round(p.score))), cefr: p.cefr || "?" };
    saveTestResult(rec);
    addXp(15);
    const prev = loadTests().slice(-2)[0];
    if (!prev || rec.score >= (prev.score || 0)) confettiBurst();
    TST = { phase: "result", rec, comment: p.comment || "" };
  } catch (e) {
    TST = { phase: "home", err: L.testFail };
  }
  renderTest();
}
function renderTest() {
  const L = t();
  const tests = loadTests();
  if (TST.phase === "loading" || TST.phase === "scoring") {
    $("testBody").innerHTML = `<p class="note">${esc(TST.phase === "scoring" ? L.scoring : L.vocabLoading)}</p>`;
  } else if (TST.phase === "item") {
    const it = TST.items[TST.i];
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    $("testBody").innerHTML =
      `<div class="drill-prog">${TST.i + 1} / ${TST.items.length}</div>
       <div class="v-card" style="margin-top:10px;cursor:default">
         <div class="v-flip">${esc(L.testSay)}</div>
         <div class="v-de" style="font-size:22px">${esc(it.tr)}</div>
       </div>
       ${TST.err ? `<div class="v-verdict bad">${esc(TST.err)}</div>` : ""}
       ${SR
         ? `<div class="row"><button class="ghost" data-ta="say" ${TST.listening ? "disabled" : ""}>${TST.listening ? esc(L.listening) : esc(L.sayWord)}</button></div>`
         : `<div class="row"><input type="text" id="testInput" placeholder="…" /><button class="ghost" data-ta="type" style="flex:0 0 auto">${esc(L.send)}</button></div>`}
       <div class="row"><button class="mini" data-ta="skip" style="margin:8px auto 0">${esc(L.skip)}</button></div>`;
  } else if (TST.phase === "result") {
    $("testBody").innerHTML =
      `<div class="hero" style="margin:0 0 14px">
         <div style="display:flex;align-items:baseline;gap:12px">
           <span style="font-family:var(--font-sans);font-size:44px;font-weight:700">${TST.rec.score}</span>
           <span class="chip">${esc(L.yourLevel)}: ${esc(TST.rec.cefr)}</span>
         </div>
         <p style="font-size:14px;line-height:1.55;margin:10px 0 0">${esc(TST.comment)}</p>
       </div>
       ${tests.length >= 2 ? chartSVG(tests) : `<p class="note">${esc(L.firstPoint)}</p>`}
       ${tests.length >= 2 ? `<p class="note" style="margin-top:6px">${esc(L.projected)}</p>` : ""}`;
  } else { // home
    $("testBody").innerHTML =
      (TST.err ? `<div class="v-verdict bad">${esc(TST.err)}</div>` : "") +
      (tests.length
        ? `<div class="hero" style="margin:0 0 14px">
             <div style="display:flex;align-items:baseline;gap:12px">
               <span style="font-family:var(--font-sans);font-size:34px;font-weight:700">${tests[tests.length - 1].score}</span>
               <span class="chip">${esc(tests[tests.length - 1].cefr)}</span>
               <span class="drill-prog">${esc(new Date(tests[tests.length - 1].date).toISOString().slice(0, 10))}</span>
             </div>
           </div>
           ${tests.length >= 2 ? chartSVG(tests) + `<p class="note" style="margin-top:6px">${esc(L.projected)}</p>` : `<p class="note">${esc(L.firstPoint)}</p>`}
           ${daysSinceTest() >= 7 ? `<p class="note" style="margin-top:10px">${esc(L.weeklyHint)}</p>` : ""}`
        : `<p class="note">${esc(L.pretestHint)}</p>`) +
      `<button class="big cta" data-ta="begin" style="margin-top:18px">${esc(L.takeTest)}</button>`;
  }
  $("testBody").querySelectorAll("[data-ta]").forEach((b) => b.onclick = () => {
    switch (b.dataset.ta) {
      case "begin": beginTest(); break;
      case "say": testListen(); break;
      case "skip": nextTestItem(); break;
      case "type": {
        const v = ($("testInput") && $("testInput").value || "").trim();
        TST.answers[TST.i] = v;
        nextTestItem();
        break;
      }
    }
  });
}

/* ---------- pre-call preparation: produce German from your own language ---------- */
let P = null;
const PREP_MAX_BATCH = 5;
async function startPrep() {
  const L = t();
  P = { steps: null, i: 0, revealed: false, failed: false, batch: 1, awarded: {},
        learned: [], loadingMore: false, listening: false, verdict: null, heard: null, err: null };
  $("prepTitle").textContent = L.prepTitle;
  $("prepSub").textContent = S.scenario.id === "custom" ? S.customTopic : `${S.scenario.de} · ${S.scenario.who}`;
  $("prepBack").textContent = L.back;
  show("prep");
  renderPrep();
  try {
    const deck = await loadDeck();
    // smallest words first, then a few mini sentences - the level-zero ladder
    const words = deck.slice().sort((a, b) => normDe(a.de).length - normDe(b.de).length)
      .slice(0, 7).map((x) => ({ de: x.de, tr: x.tr }));
    const sents = deck.filter((x) => x.ex).slice(0, 3).map((x) => ({ de: x.ex, tr: x.exTr || "" }));
    P.steps = words.concat(sents);
    P.learned = P.steps.map((x) => x.de);
  } catch (e) { P.failed = true; }
  renderPrep();
}

/* extra rolling batches: reaction phrases the learner will actually need */
async function loadPrepBatch(batchNo) {
  const sc = S.scenario;
  const topic = sc.id === "custom" ? (S.customTopic || "").trim() : "";
  const key = VOCAB_NS + "prepx." + sc.id + "." + (topic ? encodeURIComponent(topic).slice(0, 60) + "." : "") + S.lang + "." + S.level + "." + batchNo;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(c) && c.length) return c;
  } catch (e) {}
  const help = HELP_LANG[S.lang] || "English";
  const what = topic ? `a conversation about: ${topic}`
    : sc.kind === "face" ? `${sc.de} - an in-person conversation at ${sc.place}`
    : `${sc.de} - calling ${sc.place}`;
  const res = await chatFetch({
    system: `You create extra preparation batch ${batchNo} for a ${TARGET.name} learner at CEFR level ${S.level} preparing for ${what}.
Return ONLY a JSON array, no markdown, of exactly 10 items: [{"de":"...","tr":"..."}]
"de": a short useful ${TARGET.name} word or a very short sentence (3-7 words). "tr": its translation in ${help}.
Focus on REACTING inside this conversation: saying a day or time does not work ("An dem Tag kann ich nicht."), proposing or asking for alternatives, confirming and declining politely, numbers, dates and times, thanking and closing. Order from easiest to hardest.
Do not repeat any of these already-learned items: ${P.learned.slice(-40).join(" | ")}`,
    messages: [{ role: "user", content: "Create the batch." }],
  });
  const data = await res.json();
  const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const clean = raw.replace(/```json|```/g, "").trim();
  const items = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]") + 1))
    .filter((x) => x && x.de && x.tr).slice(0, 10);
  if (!items.length) throw new Error("empty batch");
  try { localStorage.setItem(key, JSON.stringify(items)); } catch (e) {}
  return items;
}
async function morePrep() {
  if (P.loadingMore || P.batch >= PREP_MAX_BATCH) return;
  P.loadingMore = true;
  renderPrep();
  try {
    const items = await loadPrepBatch(P.batch + 1);
    P.batch++;
    P.steps = items.map((x) => ({ de: x.de, tr: x.tr }));
    P.learned = P.learned.concat(P.steps.map((x) => x.de));
    P.i = 0; P.revealed = false; P.verdict = null; P.heard = null; P.err = null;
  } catch (e) {}
  P.loadingMore = false;
  renderPrep();
}
function renderPrep() {
  const L = t();
  if (P.failed) {
    $("prepBody").innerHTML =
      `<p class="note">${esc(L.vocabFail)}</p>
       <button class="ghost" style="width:100%;margin-top:12px" data-pa="reload">${esc(L.retry)}</button>`;
  } else if (!P.steps) {
    $("prepBody").innerHTML = `<p class="note">${esc(L.vocabLoading)}</p>`;
  } else if (P.i >= P.steps.length) {
    if (!P.awarded[P.batch]) {
      P.awarded[P.batch] = true;
      PREPPED.add(S.scenario.id);
      addXp(10);
      addCoins(10);
      if (P.batch === 1) markDay("vocabDays");
      confettiBurst();
    }
    $("prepBody").innerHTML =
      `<div class="said" style="font-family:var(--font-sans);font-size:19px;font-weight:700">🎉 ${esc(L.ready)}</div>
       <div style="margin-top:10px"><span class="chip">+${P.batch * 10} XP</span> <span class="chip coin">+${P.batch * 10} ${IC.coin(ICON.xxs)}</span> <span class="drill-prog" style="margin-left:8px">${P.learned.length} ✓</span></div>
       ${P.loadingMore
         ? `<p class="note" style="margin-top:14px">${esc(L.vocabLoading)}</p>`
         : P.batch < PREP_MAX_BATCH
           ? `<p class="note" style="margin-top:14px">${esc(L.wantMore)}</p>
              <button class="ghost" data-pa="more" style="width:100%;margin-top:8px">${esc(L.moreWords)}</button>`
           : ""}
       <button class="big cta" data-pa="go" style="margin-top:20px">${S.scenario.kind === "face" ? IC.chat(ICON.md) + " " + esc(L.startNow) : IC.phone(ICON.md) + " " + esc(L.startNow)}</button>`;
  } else {
    const st = P.steps[P.i];
    $("prepBody").innerHTML =
      `<div class="drill-prog">${P.i + 1} / ${P.steps.length}</div>
       <div class="v-card" data-pa="card" style="margin-top:10px">
         ${P.revealed
           ? `<div class="v-de">${esc(st.de)}</div><div class="v-tr">${esc(st.tr)}</div><div class="v-flip">&#9834;</div>`
           : `<div class="v-flip">${esc(L.howSay)}</div><div class="v-de">${esc(st.tr)}</div><div class="v-flip">${esc(L.dontKnow)} &darr;</div>`}
       </div>
       ${P.revealed && clipsOK && S.scenario.id !== "custom" && S.scenario.id !== "random" ? `<div class="row"><button class="ghost" data-pa="watch">▶ ${esc(L.watchIt)}</button></div>` : ""}
       ${clipHTML(P, L)}
       ${verdictHTML(P, L)}
       <div class="row">
         ${P.revealed
           ? `<button class="ghost" data-pa="hear">&#9834; ${esc(L.sayIt)}</button>`
           : `<button class="ghost" data-pa="reveal">${esc(L.dontKnow)}</button>`}
         <button class="ghost" data-pa="say" ${P.listening ? "disabled" : ""}>${P.listening ? esc(L.listening) : esc(L.sayWord)}</button>
       </div>
       <div class="row"><button class="ghost" data-pa="next">${esc(L.next)} &rsaquo;</button></div>`;
  }
  $("prepBody").querySelectorAll("[data-pa]").forEach((b) => b.onclick = () => {
    const st = P.steps && P.steps[P.i];
    switch (b.dataset.pa) {
      case "reload": startPrep(); break;
      case "more": morePrep(); break;
      case "go": stopAudio(); speechSynthesis.cancel(); startConversation(); break;
      case "hear": if (st) speak(st.de, true); break;
      case "watch": if (st) loadClip(P, st.de, S.scenario.id, S.scenario.voice || "", renderPrep); break;
      case "say": if (st) listenFor(st.de, P, renderPrep); break;
      case "card":
        if (!st) break;
        if (P.revealed) { speak(st.de, true); break; }
        // falls through to reveal behaviour below
      case "reveal":
        if (!st) break;
        P.revealed = true; renderPrep();
        // show it, say it, then the mic opens so the learner repeats it
        speak(st.de, true, () => { if (P && P.steps && P.steps[P.i] === st && P.revealed && !P.listening) listenFor(st.de, P, renderPrep); });
        break;
      case "next":
        stopAudio(); speechSynthesis.cancel();
        P.i++; P.revealed = false; P.verdict = null; P.heard = null; P.err = null; P.clip = null; P.clipUrl = null;
        renderPrep();
        break;
    }
  });
}

/* ---------- guided dialogue (Dialog üben) ----------
   Step machine over DIALOGUES: the character portrait speaks its line
   (auto-play, like vocab hear mode), the learner sees the answer in the
   help language and speaks the German. Forgiving match (saidWord over the
   accepted variants) advances; two misses open the scaffold hint with
   tap-to-reveal + repeat-after. Completion pays XP and celebrates. */
const DLG_XP = 15;
let DG = null;
function dialogAvailable() {
  return DIALOGUES.filter((d) => SCENARIOS.some((s) => s.id === d.scenario));
}
function dlgMarzi() {
  return marziSVG(currentMarziStage());
}
function startDialog() {
  const L = t();
  DG = { stage:"pick" };
  S.active = null;
  $("dlgTitle").textContent = L.dialog.toUpperCase();
  $("dlgSub").textContent = "";
  $("dlgBack").textContent = L.back;
  show("dialog");
  renderDialog();
}
function openDialog(id) {
  const d = DIALOGUES.find((x) => x.id === id);
  const sc = SCENARIOS.find((s) => s.id === d.scenario);
  if (!d || !sc) return;
  DG = { stage:"scene", d, sc, i:0, tries:0, revealed:false, showTr:false,
         listening:false, verdict:null, heard:null, err:null, counted:true };
  S.active = sc; // speak() reads voice + character persona from here
  $("dlgSub").textContent = `${d.de} · ${sc.who}`;
  renderDialog();
  dlgPlayLine();
}
function dlgPlayLine() {
  const step = DG.d.steps[DG.i];
  if (step) speak(step.say, false);
}
function dlgPortrait(sc) {
  $("dlgEmoji").textContent = sc.avatar || "🎧";
  $("dlgWho").textContent = sc.who;
  const img = $("dlgImg");
  const src = `/api/avatar/${sc.id}?v=3&pin=${encodeURIComponent(localStorage.getItem(PIN_KEY) || "")}`;
  if (img.dataset.src !== src) {
    img.dataset.src = src;
    img.dataset.retried = "";
    img.classList.remove("ok");
    img.onload = () => img.classList.add("ok");
    img.onerror = () => {
      img.classList.remove("ok");
      // one delayed retry: generation can take ~10s on the very first view
      if (!img.dataset.retried) {
        img.dataset.retried = "1";
        setTimeout(() => { if (img.dataset.src === src) img.src = src + "&r=" + Date.now(); }, 8000);
      }
    };
    img.src = src;
  }
}
/* rerender hook for listenFor: count misses, auto-advance on a hit */
function dlgAfterListen() {
  if (DG && DG.stage === "scene" && DG.verdict && !DG.counted) {
    DG.counted = true;
    if (DG.verdict === "ok") {
      SFX.coin();
      const d = DG.d, i = DG.i;
      setTimeout(() => {
        if (DG && DG.stage === "scene" && DG.d === d && DG.i === i) dlgNext();
      }, 1100);
    } else {
      DG.tries++;
    }
  }
  renderDialog();
}
function dlgListen() {
  const step = DG.d.steps[DG.i];
  if (!step || DG.listening) return;
  DG.counted = false;
  listenFor([step.ans].concat(step.accept || []), DG, dlgAfterListen);
}
function dlgNext() {
  stopAudio(); speechSynthesis.cancel();
  DG.i++; DG.tries = 0; DG.revealed = false; DG.showTr = false;
  DG.verdict = null; DG.heard = null; DG.err = null; DG.counted = true;
  if (DG.i >= DG.d.steps.length) {
    DG.stage = "done";
    addXp(DLG_XP);
    addCoins(10);
    SFX.fanfare();
    confettiBurst();
    renderDialog();
    if (DG.d.end) speak(DG.d.end, false);
  } else {
    renderDialog();
    dlgPlayLine();
  }
}
function renderDialog() {
  const L = t();
  $("dlgStage").classList.toggle("hidden", !(DG && DG.stage === "scene"));
  if (!DG) return;
  if (DG.stage === "pick") {
    const list = dialogAvailable();
    $("dlgBody").innerHTML = `<div class="list">` +
      list.map((d) => {
        const sc = SCENARIOS.find((s) => s.id === d.scenario);
        return `<button class="item" data-dlg="${d.id}">
          <b>${sc.avatar ? esc(sc.avatar) + " " : ""}${esc(d.de)}</b>
          <small>${esc(d[S.lang] || d.en)} · ${esc(sc.who)}</small></button>`;
      }).join("") + `</div>`;
    $("dlgBody").querySelectorAll("[data-dlg]").forEach((b) =>
      b.onclick = () => openDialog(b.dataset.dlg));
    return;
  }
  if (DG.stage === "done") {
    const d = DG.d;
    $("dlgBody").innerHTML =
      (d.end ? `<div class="dlg-bubble">${esc(d.end)}<div class="sub">${esc((d.endXl || {})[S.lang] || (d.endXl || {}).en || "")}</div></div>` : "") +
      `<div style="text-align:center;margin-top:18px">
         <div class="marzi" style="width:104px;height:104px">${dlgMarzi()}</div>
         <div class="said" style="font-family:var(--font-sans);font-size:19px;font-weight:700;margin-top:10px">🎉 ${esc(L.goalHit)}</div>
         <div style="margin-top:10px"><span class="chip">+${DLG_XP} XP</span> <span class="chip coin">+10 ${IC.coin(ICON.xxs)}</span></div>
       </div>`;
    return;
  }
  const step = DG.d.steps[DG.i];
  dlgPortrait(DG.sc);
  const stuck = DG.tries >= 2;
  $("dlgBody").innerHTML =
    `<div class="dlg-prog">
       <span class="drill-prog">${DG.i + 1} / ${DG.d.steps.length}</span>
       <div class="dlg-marzi" title="Marzi">${dlgMarzi()}</div>
     </div>
     <div class="dlg-bubble">${esc(step.say)}
       <div style="margin-top:6px">
         <button class="mini" data-dg="play">&#9834; ${esc(L.repeat)}</button>
         <button class="mini" data-dg="tr">${esc(L.show)}</button>
       </div>
       ${DG.showTr ? `<div class="sub">${esc(step.sayXl[S.lang] || step.sayXl.en)}</div>` : ""}
     </div>
     <div class="v-card" style="margin-top:12px;cursor:default;min-height:120px;padding:20px 16px">
       <div class="v-flip">${esc(L.howSay)}</div>
       <div class="v-de" style="font-size:21px">${esc(step.ansXl[S.lang] || step.ansXl.en)}</div>
       ${DG.revealed ? `<div class="v-tr">${esc(step.ans)}</div>` : ""}
     </div>
     ${stuck && !DG.revealed ? `<div class="hint"><div class="label">${esc(TARGET.hintLabel)}</div>${esc(step.hint)}</div>` : ""}
     ${verdictHTML(DG, L)}
     <div class="row">
       ${stuck && !DG.revealed ? `<button class="ghost" data-dg="reveal">${esc(L.reveal)}</button>` : ""}
       <button class="ghost" data-dg="say" ${DG.listening ? "disabled" : ""}>${IC.mic(ICON.sm)} ${DG.listening ? esc(L.listening) : esc(L.sayWord)}</button>
     </div>
     ${DG.revealed ? `<div class="row"><button class="ghost" data-dg="next">${esc(L.next)} &rsaquo;</button></div>` : ""}`;
  $("dlgBody").querySelectorAll("[data-dg]").forEach((b) => b.onclick = () => {
    switch (b.dataset.dg) {
      case "play": speak(step.say, true); break;
      case "tr": DG.showTr = !DG.showTr; renderDialog(); break;
      case "say": dlgListen(); break;
      case "reveal":
        DG.revealed = true; renderDialog();
        // show it, say it, then the mic opens so the learner repeats it
        speak(step.ans, true, () => {
          if (DG && DG.stage === "scene" && DG.d.steps[DG.i] === step && DG.revealed && !DG.listening) dlgListen();
        });
        break;
      case "next": dlgNext(); break;
    }
  });
}

/* ---------- wiring ---------- */
function startConversation(retry) {
  const REAL = SCENARIOS.filter((x) => x.goals);
  // W2: "Call again" retries the SAME situation with the SAME goal — the
  // learner is closing a loop, not spinning the wheel again.
  const keepGoal = retry && S.active && S.currentGoal ? S.currentGoal : null;
  if (retry && S.active) {
    // keep S.active exactly as it was (matters for random/custom retries)
  } else if (S.scenario.id === "custom") {
    const topic = ($("customTopic").value || "").trim();
    if (!topic) { $("customTopic").focus(); return; }
    S.customTopic = topic; saveSettings();
    S.active = { id:"custom", avatar:"🎭", who:S.scenario.who, tag:S.scenario.tag,
      role:"the person who would naturally answer the phone for the situation the learner describes",
      place:"the appropriate business, office or organisation",
      goals:[topic] };
  } else if (S.scenario.id === "random") {
    S.active = REAL[Math.floor(Math.random() * REAL.length)];
  } else {
    S.active = S.scenario;
  }
  S.turns = []; S.hint = null; S.helpStage = 0; S.seconds = 0; S.handsFree = true; S.speaker = 1;
  S.callId = newRewardId(); // each call claims its reward under a fresh id
  const g = S.active.goals;
  S.currentGoal = keepGoal && g.includes(keepGoal) ? keepGoal : g[Math.floor(Math.random() * g.length)];
  // the session's transcript is the canonical prompt history for this call
  S.session = createConversationSession({
    scenario: S.active, level: S.level, lang: S.lang,
    goal: S.currentGoal, providers: ENGINE,
  }).start();
  show("call"); alertMsg(null); renderCall();
  renderCallCompanion();
  if (S.active.kind !== "face") SFX.ringStart();
  acquireWakeLock();
  clearInterval(S.timerId);
  S.timerId = setInterval(() => { S.seconds++; $("timer").textContent = timerText(); }, 1000);
  ask();
}
/* At A0 the call button routes through preparation first - beginners want
   words in their head before the phone rings. Once prepared (or after
   choosing to leave the warm-up), the gate opens for that scenario. */
const PREPPED = new Set();
function canPrep() {

/* ---------- daily "phone plan": 30 free call minutes, like a real tariff ----------
   Coins can extend today's plan with minute packages bought in the Store
   (spec §14 usage packages, converted from MB to minutes - our metered unit). */
const PLAN_SECONDS = 30 * 60;
function planUsedToday() {
  const st = loadStats();
  return ((st.secDays || {})[new Date().toISOString().slice(0, 10)]) || 0;
}
function planLimitToday() {
  const st = loadStats();
  return PLAN_SECONDS + (((st.extraSecs || {})[new Date().toISOString().slice(0, 10)]) || 0);
}
/* ---------- MARZI-014: internet is a VIEW of the minutes allowance ----------
   Board 02_call.png prices 100 MB as ~10 min of calls, so 10 MB = 1 minute.
   MB is never stored, never consumed and never purchased separately: both
   readouts derive from the same seconds value that already drives the plan. */
const MB_PER_MINUTE = 10;
function mbFromSeconds(sec) { return Math.max(0, Math.round((Number(sec) || 0) / 60 * MB_PER_MINUTE)); }
/* one canonical snapshot used by every plan/internet readout */
function planSnapshot() {
  const limitSec = planLimitToday();
  const usedSec = Math.min(planUsedToday(), limitSec);
  const leftSec = Math.max(0, limitSec - usedSec);
  return {
    limitSec, usedSec, leftSec,
    limitMin: Math.round(limitSec / 60), usedMin: Math.round(usedSec / 60), leftMin: Math.ceil(leftSec / 60),
    limitMb: mbFromSeconds(limitSec), usedMb: mbFromSeconds(usedSec), leftMb: mbFromSeconds(leftSec),
    exhausted: leftSec <= 0,
  };
}

function isOffline() {

/* MARZI-018-R2: shared overlay focus + dismissal behaviour. Each overlay
   keeps its own open/close functions; these only add the dialog semantics,
   move focus in, restore it on close, and wire Escape. */
let OVERLAY_RETURN_FOCUS = null;
function overlayOpened(hostId, labelId, accessibleName) {
  const el = $(hostId);
  if (!el) return null;
  // R2-APP-03: an asserted modal must carry a name AND behave as a modal
  if (accessibleName) el.setAttribute("aria-label", accessibleName);
  // Only a real element OUTSIDE this dialog may become the return target.
  // Proven by regression test: re-opening an already-open overlay (double
  // activation) otherwise captures a control INSIDE it, which is hidden on
  // close - focus is then lost. The blurred-target case is defensive.
  try {
    const active = document.activeElement;
    const usable = active && active !== document.body && typeof active.focus === "function"
      && !el.contains(active);
    if (usable) OVERLAY_RETURN_FOCUS = active;
  } catch (e) { /* keep whatever we already had */ }
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-modal", "true");
  if (labelId) el.setAttribute("aria-labelledby", labelId);
  // focus the first control inside, so the keyboard and screen reader enter
  // the overlay instead of staying behind it
  let first = null;
  try { first = el.querySelector("button, [href], input, select, textarea, [tabindex]:not([tabindex='-1'])"); } catch (e) {}
  try { if (first && first.focus) first.focus(); } catch (e) {}
  OVERLAY_MODAL = el;
  setBackgroundInert(el, true);
  return first;
}
/* Everything outside the open dialog is removed from the keyboard and the
   accessibility tree. Walking the ancestor chain and inerting each SIBLING is
   what correctly isolates a dialog that lives inside <main> - inerting an
   ancestor would inert the dialog itself. `inert` where supported, with an
   aria-hidden fallback. */
const INERT_MARK = "data-marzi-inert";
function setBackgroundInert(dialog, on) {
  if (!on) {
    try {
      document.querySelectorAll("[" + INERT_MARK + "]").forEach((el) => {
        el.removeAttribute("inert"); el.removeAttribute("aria-hidden"); el.removeAttribute(INERT_MARK);
      });
    } catch (e) {}
    return true;
  }
  if (!dialog) return false;
  try {
    let node = dialog;
    while (node && node.parentElement && node !== document.body) {
      const parent = node.parentElement;
      for (const sib of Array.prototype.slice.call(parent.children)) {
        if (sib === node || sib.hasAttribute(INERT_MARK)) continue;
        if (sib.tagName === "SCRIPT" || sib.tagName === "STYLE") continue;
        sib.setAttribute("inert", "");
        sib.setAttribute("aria-hidden", "true");
        sib.setAttribute(INERT_MARK, "");
      }
      node = parent;
    }
  } catch (e) { return false; }
  return true;
}
let OVERLAY_MODAL = null;
/* Wrap-around containment: Tab off the last control returns to the first and
   Shift+Tab off the first goes to the last, so focus never leaves the dialog. */
function overlayTrapKeydown(e) {
  if (!OVERLAY_MODAL || e.key !== "Tab") return false;
  let items = [];
  try {
    items = [...OVERLAY_MODAL.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter((el) => el.getClientRects().length > 0 || el === document.activeElement);
  } catch (err) { return false; }
  if (!items.length) return false;
  const first = items[0], last = items[items.length - 1];
  if (!OVERLAY_MODAL.contains(document.activeElement)) { try { first.focus(); } catch (err) {} e.preventDefault(); return true; }
  if (e.shiftKey && document.activeElement === first) { try { last.focus(); } catch (err) {} e.preventDefault(); return true; }
  if (!e.shiftKey && document.activeElement === last) { try { first.focus(); } catch (err) {} e.preventDefault(); return true; }
  return false;
}
function overlayClosed() {
  setBackgroundInert(OVERLAY_MODAL, false);
  OVERLAY_MODAL = null;
  const back = OVERLAY_RETURN_FOCUS;
  OVERLAY_RETURN_FOCUS = null;
  try { if (back && back.focus && document.contains && document.contains(back)) back.focus(); } catch (e) {}
  return back;
}

function goCall() {
  // MARZI-018 G: two different refusals, two different screens. No internet is
  // a connectivity problem with a retry; an exhausted allowance is a product
  // limit with a reset time. They must never be confused for one another.
  if (isOffline()) { renderNetBanner(); showOffline(); return; }
  if (planUsedToday() >= planLimitToday()) { showLimit(); return; }
  if (S.level === "A0" && canPrep() && !PREPPED.has(S.scenario.id)) startPrep();
  else startConversation();
}
$("callBtn").onclick = goCall;
function endCall() {
  S.helpStage = 0; // the in-call help panel must not outlive the call
  S.handsFree = false;
  if (S.session) S.session.end(); // any pending AI reply is dropped by the engine
  SFX.ringStop();
  clearInterval(S.timerId);
  S.timerId = null;
  releaseWakeLock();
  speechSynthesis.cancel();
  stopAudio();
  try { S.rec && S.rec.abort(); } catch (e) {}
  const L = t();
  $("doneTitle").textContent = (S.active || S.scenario).kind === "face" ? L.endedTalk : L.ended;
  $("againBtn").textContent = L.callAgain;
  const fixes = S.turns.filter((x) => x.me && x.fix);
  // W2: close the loop — drill exactly what went wrong on THIS call
  const drillable = fixes.filter((x) => x.corrected);
  $("retryMistakesBtn").innerHTML = IC.target(ICON.sm) + " " + esc(L.retryMistakes);
  $("retryMistakesBtn").classList.toggle("hidden", !drillable.length);
  $("retryMistakesBtn").onclick = () => {
    stopAudio(); speechSynthesis.cancel();
    startDrill(drillable.map((x) => x.text));
  };
  $("review").innerHTML = `<div class="label" style="margin:0">${esc(L.review)} · ${mmss()}</div>` +
    (fixes.length ? fixes.map((x, i) => `<div style="margin-top:14px"><div class="said">${esc(x.text)}</div><div class="fix">${esc(x.fix)}</div>${x.corrected ? `<div style="margin-top:4px"><button class="mini" data-sayr="${i}">&#9654; ${L.sayIt}</button></div>` : ""}</div>`).join("")
                  : '<p class="note">—</p>');
  $("review").querySelectorAll("[data-sayr]").forEach((b) =>
    b.onclick = () => speak(fixes[+b.dataset.sayr].corrected, true));
  $("replayBtn").textContent = "▶ " + L.replayAll;
  $("replayBtn").classList.toggle("hidden", !S.turns.length);
  // 1. persist first - the ledger and stats commit before anything animates
  const before = loadStats();
  const xpBefore = before.xp || 0, coinsBefore = before.coins || 0;
  const abandoned = !!S.busy;
  const gained = recordCall();
  // 2. build the canonical summary from committed state only
  const summary = buildRewardSummary({
    xpBefore, coinsBefore, gained, claim: LAST_CLAIM,
    turns: S.turns.filter((x) => x.me).length, mistakes: fixes.length,
    seconds: S.seconds, abandoned,
  });
  S.lastReward = summary;
  renderRewardSummary(summary);
  updateTopbar();
  show("done");
  // 3. animate from the summary (never mutates), then celebrate a new stage
  animateReward(summary);
  evaluateCall();
}

/* W4: ONE share implementation for every moment — native share sheet first,
   clipboard as the fallback, moment-specific localized text always. */
async function shareMoment(text) {
  const url = location.origin;
  if (navigator.share) {
    try { await navigator.share({ title: "Marzi", text, url }); return true; } catch (e) { return false; }
  }
  if (navigator.clipboard) {
    try { await navigator.clipboard.writeText(text + " " + url); alert(t().copied); return true; } catch (e) {}
  }
  return false;
}

  shareMoment(text);

};

  show("onboard");
}
function obStep() { return OB ? OB_STEPS[OB.step] : null; }
function obCanAdvance() {
  if (!OB) return false;
  const k = obStep();
  if (k === "lang") return !!T[OB.lang];
  if (k === "target") return !!TARGETS[OB.target];
  if (k === "goal") return LEARN_GOALS.includes(OB.goal);
  return DAILY_MINUTES.includes(OB.dailyMin);
}
function obBack() {
  if (!OB || OB.step <= 0) return false;
  OB.step -= 1; OB.error = null; renderOnboard();
  return true;
}
function obNext() {
  if (!OB || !obCanAdvance()) return false;
  if (OB.step < OB_STEPS.length - 1) { OB.step += 1; OB.error = null; renderOnboard(); return true; }
  return obFinish();
}
function obFinish() {
  // decide "brand new" BEFORE the commit writes the settings record
  const goal = OB.goal;
  const fresh = !hasMeaningfulUserData();
  const res = commitOnboarding({ lang: OB.lang, targetLang: OB.target, goal: OB.goal, dailyMin: OB.dailyMin });
  if (!res.ok) { OB.error = t().obSaveFailed; renderOnboard(); return false; }
  applyLangDirection();
  if (res.targetChanged) { location.reload(); return true; }
  OB = null;
  // W4: a brand-new learner lands ready to SPEAK — their goal preselects the
  // matching situation and Talk puts the call one tap away. A returning user
  // editing their language pair keeps their scenario and lands on Learn.
  if (fresh) {
    const sc = SCENARIOS.find((x) => x.id === GOAL_SCENARIO[goal] && x.goals);
    if (sc) { S.scenario = sc; saveSettings(); }
    renderSetup(); renderProfile();
    showTab("talk");
    return true;
  }
  renderSetup(); renderProfile();
  showTab("learn");
  return true;
}
function renderOnboard() {
  const L = t();
  const k = obStep();
  const n = OB.step + 1;
  $("obBrand").innerHTML = UI.brandLockup({ label: L.appName });
  $("obSteps").setAttribute("aria-valuenow", String(n));
  $("obSteps").setAttribute("aria-label", `${n} / ${OB_STEPS.length}`);
  $("obSteps").innerHTML = OB_STEPS.map((_, i) =>
    `<span class="ob-dot${i === OB.step ? " on" : ""}${i < OB.step ? " past" : ""}"></span>`).join("");
  $("obQuestion").textContent = { lang: L.obQLang, target: L.obQTarget, goal: L.obQGoal, daily: L.obQDaily }[k];

  const pick = (id, on, label, inner, extra) =>
    `<button class="ob-opt${on ? " on" : ""}" type="button" data-ob="${esc(id)}" role="radio"` +
    ` aria-checked="${on}" aria-label="${esc(label)}">${inner}` +
    `<span class="ob-tick" aria-hidden="true">${on ? IC.check(ICON.sm) : ""}</span>${extra || ""}</button>`;

  if (k === "lang") {
    // the stored value is always the language code; the flag is decoration
    $("obBody").innerHTML = `<div class="ob-grid" role="radiogroup" aria-labelledby="obQuestion">` +
      LANG_CHIPS.map(([code, name]) => pick(code, OB.lang === code, name,
        `<span class="ob-flag" aria-hidden="true">${OB_FLAG[code] || ""}</span><span class="ob-nm">${esc(name)}</span>`)).join("") + `</div>`;
  } else if (k === "target") {
    $("obBody").innerHTML = `<div class="ob-grid" role="radiogroup" aria-labelledby="obQuestion">` +
      LEARN_TARGETS.map(([code, name]) => {
        const open = !!TARGETS[code];
        const on = open && OB.target === code;
        return pick(code, on, open ? name : `${name} — ${L.obSoon}`,
          `<span class="ob-flag" aria-hidden="true">${OB_FLAG[code] || ""}</span><span class="ob-nm">${esc(name)}</span>`,
          open ? "" : `<span class="soon-badge">${esc(L.obSoon)}</span>`);
      }).join("") + `</div>`;
  } else if (k === "goal") {
    $("obBody").innerHTML = `<div class="ob-grid one" role="radiogroup" aria-labelledby="obQuestion">` +
      LEARN_GOALS.map((g) => {
        const name = L.goalNames[LEARN_GOALS.indexOf(g)] || g;
        return pick(g, OB.goal === g, name,
          `<span class="ob-ic" aria-hidden="true">${IC[OB_GOAL_ICON[g]](ICON.lg)}</span><span class="ob-nm">${esc(name)}</span>`);
      }).join("") + `</div>`;
  } else {
    $("obBody").innerHTML = `<div class="ob-grid" role="radiogroup" aria-labelledby="obQuestion">` +
      DAILY_MINUTES.map((m) => pick(String(m), OB.dailyMin === m, `${m} ${L.minutes}`,
        `<span class="ob-min">${esc(fmtNum(m))}</span><span class="ob-nm">${esc(L.minutes)}</span>`)).join("") + `</div>`;
  }
  $("obBody").querySelectorAll("[data-ob]").forEach((b) => b.onclick = () => obPick(b.dataset.ob));

  $("obWishNote").textContent = L.obWish;
  $("obWishNote").classList.toggle("hidden", !(k === "target" && OB.wish));
  $("obBackBtn").textContent = L.back;
  $("obBackBtn").classList.toggle("hidden", OB.step === 0);
  $("obBackBtn").onclick = () => obBack();
  const last = OB.step === OB_STEPS.length - 1;
  $("obNextBtn").innerHTML = last ? IC.phone(ICON.md) + " " + esc(L.obStart) : esc(L.obNext);
  $("obNextBtn").disabled = !obCanAdvance();
  $("obNextBtn").onclick = () => obNext();
  $("obError").textContent = OB.error || "";
  $("obError").classList.toggle("hidden", !OB.error);
}
/* selection is a state transition, kept out of the render function */
function obPick(value) {
  const k = obStep();
  if (k === "lang") {
    if (!T[value]) return;
    OB.lang = value; S.lang = value; applyLangDirection();   // preview only; persisted at the end
  } else if (k === "target") {
    if (TARGETS[value]) { OB.target = value; OB.wish = false; }
    else { try { localStorage.setItem(WISH_KEY, value); } catch (e) {} OB.wish = true; }
  } else if (k === "goal") {
    if (LEARN_GOALS.includes(value)) OB.goal = value;
  } else if (DAILY_MINUTES.includes(Number(value))) {
    OB.dailyMin = Number(value);
  }
  OB.error = null;
  renderOnboard();
}

/* bottom navigation + top-bar resources */
$("bottomnav").querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => showTab(b.dataset.tab));
$("tbCoins").onclick = () => showTab("store");
$("tbMins").onclick = () => openPlanScreen();
$("tbGear").innerHTML = IC.gear(ICON.btn);
$("tbGear").onclick = () => showTab("profile");
window.addEventListener("hashchange", () => {
  const tab = tabFromHash(location.hash);
  if (tab && tab !== CURRENT_TAB) showTab(tab, true);
});

/* MARZI-062: publish the staging marker's measured height so the fixed call
   layer starts underneath it instead of covering it. One observer on one
   element, disconnected with the page; nothing else reads or writes it. */
(function trackStagingBar() {
  const bar = $("stagingBar");
  if (!bar) return;
  const publish = () =>
    document.documentElement.style.setProperty("--staging-bar", bar.offsetHeight + "px");
  publish();
  if (typeof ResizeObserver === "function") {
    const ro = new ResizeObserver(publish);
    ro.observe(bar);
    window.addEventListener("pagehide", () => ro.disconnect(), { once: true });
  } else {
    window.addEventListener("resize", publish);
  }
})();

applyLangDirection();
applyReduceMotion();
renderNetBanner();
window.addEventListener("online", renderNetBanner);
window.addEventListener("offline", renderNetBanner);
renderSetup();
/* MARZI-017: onboarding is for genuinely new installations only. Any existing
   learner data counts as completed, so an upgrade never re-onboards and never
   resets anything. */
if (!onboardingComplete()) showOnboarding();
else showTab(tabFromHash(location.hash) || "learn");
renderInstallRec();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
