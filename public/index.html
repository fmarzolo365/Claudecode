<style>
  :root {
    --yellow: #f0c000;
    --ink: #15130f;
    --paper: #efeadd;
    --red: #b33a2b;
    --green: #2c6b4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--yellow);
    color: var(--ink);
    font-family: Archivo, Helvetica, sans-serif;
    padding: 26px 16px 48px;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 560px; }
  .plate {
    border: 3px solid var(--ink);
    padding: 10px 16px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .plate span {
    font-family: Oswald, sans-serif;
    font-size: 22px;
    letter-spacing: .22em;
    font-weight: 600;
  }
  .tagline { font-size: 15px; line-height: 1.5; margin: 18px 0 26px; max-width: 440px; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: .2em; opacity: .7;
    margin: 26px 0 8px; text-transform: uppercase;
  }
  .label:first-of-type { margin-top: 0; }
  .list { border: 2px solid var(--ink); background: var(--paper); }
  .item {
    display: block; width: 100%; text-align: left; padding: 14px;
    border: none; border-top: 1px solid rgba(21,19,15,.13);
    background: transparent; color: var(--ink); cursor: pointer; font: inherit;
  }
  .item:first-child { border-top: none; }
  .item.on { background: var(--ink); color: var(--paper); }
  .item b { font-family: Oswald, sans-serif; font-size: 17px; font-weight: 500; display: block; }
  .item small { font-size: 12.5px; opacity: .75; }
  .seg { display: flex; border: 2px solid var(--ink); }
  .seg button {
    flex: 1; padding: 10px 6px; border: none; border-left: 2px solid var(--ink);
    background: transparent; color: var(--ink); cursor: pointer;
    font: 600 13px Archivo, sans-serif; letter-spacing: .06em;
  }
  .seg button:first-child { border-left: none; }
  .seg button.on { background: var(--ink); color: var(--yellow); }
  .seg.wrap { flex-wrap: wrap; }
  .seg.wrap button { flex: 1 1 32%; border-top: 1px solid rgba(21,19,15,.25); }
  .seg.wrap button:nth-child(-n+3) { border-top: none; }
  .seg.wrap button:nth-child(3n+1) { border-left: none; }
  .note { font-size: 12.5px; margin: 8px 0 0; opacity: .8; }
  .big {
    font-family: Oswald, sans-serif; width: 100%; padding: 18px; margin-top: 30px;
    background: var(--ink); color: var(--yellow); border: none; font-size: 22px;
    letter-spacing: .2em; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 12px;
  }
  .big[disabled] { opacity: .5; cursor: not-allowed; }
  .big.live { background: var(--red); color: #fff; animation: ring 1.4s infinite; }
  @keyframes ring { 0%,100% { box-shadow: 0 0 0 0 rgba(179,58,43,.55); } 50% { box-shadow: 0 0 0 12px rgba(179,58,43,0); } }
  .bar {
    background: var(--ink); color: var(--yellow); padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .bar .who { font-family: Oswald, sans-serif; font-size: 17px; }
  .bar .meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .18em; opacity: .7; }
  .hang { background: var(--red); color: #fff; border: none; padding: 9px 12px; font: 600 12px Archivo, sans-serif; letter-spacing: .08em; cursor: pointer; }
  .log {
    background: var(--paper); border: 2px solid var(--ink); border-top: none;
    min-height: 260px; max-height: 46vh; overflow-y: auto; padding-bottom: 8px;
  }
  .turn { padding: 10px 14px; border-bottom: 1px solid rgba(21,19,15,.09); display: flex; gap: 10px; }
  .tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .14em;
    width: 84px; flex: 0 0 84px; padding-top: 3px; opacity: .85;
  }
  .tag.me { color: var(--green); }
  .said { font-size: 15.5px; line-height: 1.45; }
  .sub { font-size: 13px; opacity: .75; margin-top: 4px; }
  .fix { font-size: 12.5px; color: var(--red); margin-top: 4px; }
  .mini { background: none; border: none; padding: 0; font: 12px Archivo, sans-serif; color: var(--ink); opacity: .7; text-decoration: underline; cursor: pointer; margin-right: 12px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .ghost { flex: 1; padding: 11px 10px; background: transparent; border: 2px solid var(--ink); color: var(--ink); font: 600 13px Archivo, sans-serif; cursor: pointer; }
  .ghost[disabled] { opacity: .4; cursor: not-allowed; }
  .toggle { width: 100%; margin-top: 10px; padding: 10px; border: 2px solid var(--ink); background: transparent; color: var(--ink); font: 600 12.5px Archivo, sans-serif; letter-spacing: .08em; cursor: pointer; }
  .toggle.on { background: var(--ink); color: var(--yellow); }
  .hint { margin-top: 10px; border: 2px dashed var(--ink); padding: 10px 12px; font-size: 15px; }
  .hint .label { margin: 0 0 4px; }
  .alert { margin-top: 10px; border: 2px solid var(--red); color: var(--red); padding: 10px 12px; font: 600 12.5px Archivo, sans-serif; line-height: 1.45; }
  input[type=text] { flex: 1; padding: 12px; border: 2px solid var(--ink); background: var(--paper); font: 15px Archivo, sans-serif; color: var(--ink); }
  .hidden { display: none; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <!-- SETUP -->
  <section id="setup">
    <div class="plate"><svg width="22" height="22" viewBox="0 0 24 24" fill="#15130f"><path d="M6.6 10.8c1.6 3.1 4.1 5.6 7.2 7.2l2.4-2.4c.3-.3.7-.4 1.1-.3 1.2.4 2.5.6 3.8.6.6 0 1 .4 1 1V21c0 .6-.4 1-1 1C11.6 22 2 12.4 2 1c0-.6.4-1 1-1h3.9c.6 0 1 .4 1 1 0 1.3.2 2.6.6 3.8.1.4 0 .8-.3 1.1L6.6 10.8z"/></svg><span>TELEFONTRAINER</span></div>
    <p class="tagline" id="tagline"></p>
    <p class="note hidden" id="stats" style="margin:-14px 0 20px"></p>

    <div class="label" id="lblPick"></div>
    <div class="list" id="scenarios"></div>
    <div class="row hidden" id="customRow">
      <input type="text" id="customTopic" />
    </div>

    <div class="label" id="lblLevel"></div>
    <div class="seg" id="levels"></div>
    <p class="note" id="levelNote"></p>

    <div class="label" id="lblSpeed"></div>
    <div class="seg" id="speeds"></div>

    <div class="label" id="lblLang"></div>
    <div class="seg wrap" id="langs"></div>

    <button class="big" id="callBtn"></button>
    <button class="toggle" id="mistakesBtn" style="margin-top:14px"></button>
  </section>

  <!-- CALL -->
  <section id="call" class="hidden">
    <div class="bar">
      <div><div class="meta" id="timer">VERBUNDEN · 00:00</div><div class="who" id="who"></div></div>
      <button class="hang" id="hangBtn"></button>
    </div>
    <div class="log" id="log"></div>
    <div class="row">
      <button class="ghost" id="repeatBtn"></button>
      <button class="ghost" id="hintBtn"></button>
    </div>
    <div id="hintBox" class="hint hidden"><div class="label">VORSCHLAG</div><div id="hintText"></div></div>
    <button class="toggle on" id="freeBtn"></button>
    <div id="alert" class="alert hidden"></div>
    <button class="big" id="micBtn"></button>
    <button class="mini" id="typeBtn" style="margin-top:10px"></button>
    <div class="row hidden" id="typeRow">
      <input type="text" id="draft" placeholder="Guten Tag, ich möchte…" />
      <button class="ghost" id="sendBtn" style="flex:0 0 auto"></button>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="hidden">
    <div class="plate"><span id="doneTitle"></span></div>
    <div class="list" style="margin-top:22px;padding:16px 14px" id="review"></div>
    <div class="list" style="margin-top:14px;padding:16px 14px" id="evalBox"></div>
    <button class="big" id="againBtn"></button>
  </section>

  <!-- MISTAKES HISTORY -->
  <section id="mistakes" class="hidden">
    <div class="plate"><span id="mistakesTitle"></span></div>
    <div class="list" style="margin-top:22px;padding:16px 14px" id="mistakesList"></div>
    <div class="row">
      <button class="ghost" id="ankiBtn"></button>
      <button class="ghost" id="clearBtn"></button>
    </div>
    <button class="big" id="backBtn"></button>
  </section>
</main>

function recordCall() {
  if (!S.turns.some((x) => x.me)) return;
  const st = loadStats();
  const d = new Date().toISOString().slice(0, 10);
  st.days[d] = (st.days[d] || 0) + 1;
  st.calls = (st.calls || 0) + 1;
  st.seconds = (st.seconds || 0) + S.seconds;

}
function currentStreak(st) {
  let n = 0;
  const day = new Date();
  const key = () => day.toISOString().slice(0, 10);
  if (!st.days[key()]) day.setDate(day.getDate() - 1); // streak may end yesterday
  while (st.days[key()]) { n++; day.setDate(day.getDate() - 1); }
  return n;
}

/* ---------- API calls (with optional PIN when hosted) ---------- */
const PIN_KEY = "telefontrainer.pin";
async function chatFetch(payload) {
  const doFetch = () => fetch("/api/chat", {
    method: "POST",
    headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
    body: JSON.stringify(payload),
  });
  let res = await doFetch();
  if (res.status === 401) {
    const pin = prompt(t().pinAsk);
    if (pin != null && pin.trim()) {
      localStorage.setItem(PIN_KEY, pin.trim());
      res = await doFetch();
    }
    if (res.status === 401) localStorage.removeItem(PIN_KEY);
  }
  return res;
}

/* Neural voice via /api/tts when the server has a TTS key; device voice otherwise.
   The 501 probe result is remembered for the session so unconfigured servers
   cost one extra request per page load, not one per line. */
let neuralOK = true;
const ttsCache = new Map(); // text -> object URL (mp3)
let currentAudio = null;

function stopAudio() {
  if (currentAudio) {
    try { currentAudio.onended = null; currentAudio.pause(); } catch (e) {}
    currentAudio = null;
  }
}

async function neuralSpeak(text, rate, done) {
  let url = ttsCache.get(text);
  if (!url) {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
      body: JSON.stringify({ text }),
    });
    if (res.status === 501) { neuralOK = false; throw new Error("unconfigured"); }
    if (!res.ok) throw new Error("tts " + res.status);
    url = URL.createObjectURL(await res.blob());
    ttsCache.set(text, url);
    if (ttsCache.size > 40) {
      const k = ttsCache.keys().next().value;
      URL.revokeObjectURL(ttsCache.get(k));
      ttsCache.delete(k);
    }
  }
  const a = new Audio(url);
  a.playbackRate = rate;
  if ("preservesPitch" in a) a.preservesPitch = true;
  currentAudio = a;
  a.onended = () => { if (currentAudio === a) currentAudio = null; done && setTimeout(done, 350); };
  await a.play();
}

function deviceSpeak(text, rate, done) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  if (S.voice) u.voice = S.voice;
  u.rate = rate;
  u.onend = () => done && setTimeout(done, 350);
  u.onerror = () => done && setTimeout(done, 350);
  speechSynthesis.speak(u);
}

function speak(text, slow, done) {
  if (!text) { if (done) done(); return; }
  speechSynthesis.cancel();
  stopAudio();
  const rate = slow ? 0.6 : LEVELS[S.level].rate * (SPEEDS[S.speed] || 1);
  if (neuralOK) {
    neuralSpeak(text, rate, done).catch(() => deviceSpeak(text, rate, done));
    return;
  }
  deviceSpeak(text, rate, done);
}

function exportAnki() {
  const fixes = loadFixes();
  if (!fixes.length) return;
  // Anki: File > Import, fields separated by Tab. Front = your sentence, Back = correction.
  const tsv = fixes.map((f) => `${f.text.replace(/[\t\n]/g, " ")}\t${f.fix.replace(/[\t\n]/g, " ")}`).join("\n");
  const blob = new Blob(["﻿" + tsv], { type: "text/tab-separated-values;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "telefontrainer-anki.txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- call ---------- */
function systemPrompt() {
  const L = LEVELS[S.level], help = HELP_LANG[S.lang] || "English", s = S.active || S.scenario;
  const custom = s.id === "custom"
    ? `\nThe learner described the situation in their own words (possibly not in German): interpret it, decide what kind of business or office would be called, and play that role realistically.\n`
    : "";
  const recent = loadFixes().slice(-8);
  const weakSpots = recent.length
    ? `\nThe learner's recent recurring mistakes (from earlier calls):\n${recent.map((f) => `- said "${f.text}" -> better: ${f.fix}`).join("\n")}\nWhen natural, steer the conversation so the learner gets a chance to practise these patterns again. Never mention that you are doing this.\n`
    : "";
  return `You are running a German-language telephone role-play for a learner at CEFR level ${S.level}.
Your role: ${s.role} at ${s.place}. The learner is calling to ${S.currentGoal}.
${custom}${weakSpots}
Rules:
- The "reply" field is ONLY German. Stay in character for the whole call. Never mention that this is practice.
- Level guidance: ${L.guide}
- At most ${L.words} words per reply, at most one question per turn.
- Answer the phone first with a realistic German greeting for this kind of business.
- Drive the call to a real conclusion: offer concrete dates and times, confirm the learner's name, then say goodbye.
- If the learner speaks English or Spanish, still answer in German, and make "suggestion" easier.

Return ONLY a JSON object. No markdown, no code fences. Keys:
"reply": your German line.
"translation": that same line in ${help}.
"feedback": at most 25 words in ${help} about the learner's last German line - what was wrong and the natural way to say it. Empty string if the learner has not spoken yet or the line was fine.
"suggestion": one natural German sentence the learner could say next, at level ${S.level}.
"done": true only after you have said goodbye.`;
}

function history() {
  return [{ role:"user", content:"[Das Telefon klingelt. Nimm ab.]" }]
    .concat(S.turns.map((x) => ({ role: x.me ? "user" : "assistant", content: x.text })));
}

async function ask() {
  S.busy = true; renderCall();
  try {
    const res = await chatFetch({ system: systemPrompt(), messages: history() });
    const data = await res.json();
    const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = raw.replace(/```json|```/g, "").trim();
    const p = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    if (p.feedback) {
      for (let i = S.turns.length - 1; i >= 0; i--) {
        if (S.turns[i].me) { S.turns[i].fix = p.feedback; saveFix(S.turns[i].text, p.feedback); break; }
      }
    }
    S.turns.push({ me:false, text:p.reply, tr:p.translation });
    S.hint = p.suggestion || null;
    S.busy = false; renderCall();
    speak(p.reply, false, () => { if (S.handsFree && !p.done) listen(); });
  } catch (e) {
    S.busy = false; alertMsg(t().err); renderCall();
  }
}

function send(text) {
  const clean = (text || "").trim();
  if (!clean || S.busy) return;
  S.turns.push({ me:true, text:clean });
  S.hint = null;
  $("draft").value = "";
  ask();
}

function alertMsg(msg) {
  const el = $("alert");
  if (!msg) { el.classList.add("hidden"); return; }
  el.textContent = msg; el.classList.remove("hidden");
}

async function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alertMsg(t().noMic); $("typeRow").classList.remove("hidden"); return; }
  if (S.listening) { try { S.rec.stop(); } catch (e) {} return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    stream.getTracks().forEach((tr) => tr.stop());
  } catch (e) { alertMsg(t().micBlocked); $("typeRow").classList.remove("hidden"); return; }

  speechSynthesis.cancel();
  stopAudio();
  alertMsg(null);
  const r = new SR();
  r.lang = "de-DE"; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = (e) => send(e.results[0][0].transcript);
  r.onerror = (e) => {
    S.listening = false;
    const c = e && e.error;
    if (c === "not-allowed" || c === "service-not-allowed") alertMsg(t().micBlocked);
    else if (c === "no-speech") alertMsg(t().noSpeech);
    else if (c === "audio-capture") alertMsg(t().noDevice);
    else if (c !== "aborted") alertMsg(t().micErr + ": " + c);
    renderCall();
  };
  r.onend = () => { S.listening = false; renderCall(); };
  S.rec = r;
  try { r.start(); S.listening = true; renderCall(); }
  catch (e) { S.listening = false; alertMsg(t().micErr + ": " + e.message); renderCall(); }
}

function mmss() {
  const m = String(Math.floor(S.seconds / 60)).padStart(2, "0");
  const s = String(S.seconds % 60).padStart(2, "0");
  return m + ":" + s;
}

function renderCall() {
  const L = t();
  const A = S.active || S.scenario;
  $("who").textContent = A.who;
  $("timer").textContent = "VERBUNDEN · " + mmss();
  $("hangBtn").textContent = L.hangUp;
  $("repeatBtn").textContent = L.repeat;
  $("hintBtn").textContent = L.hint;
  $("typeBtn").textContent = L.type;
  $("sendBtn").textContent = L.send;
  $("freeBtn").textContent = (S.handsFree ? "\u25CF " : "\u25CB ") + L.handsFree;
  $("freeBtn").className = "toggle" + (S.handsFree ? " on" : "");
  $("micBtn").textContent = S.listening ? L.listening : L.speak;
  $("micBtn").className = "big" + (S.listening ? " live" : "");
  $("micBtn").disabled = S.busy;
  $("hintBtn").disabled = !S.hint;
  $("repeatBtn").disabled = !S.turns.some((x) => !x.me);

  if (S.hint && S.hintOpen) { $("hintText").textContent = S.hint; $("hintBox").classList.remove("hidden"); }
  else $("hintBox").classList.add("hidden");

  $("log").innerHTML = S.turns.map((x, i) => `
    <div class="turn">
      <div class="tag ${x.me ? "me" : ""}">${x.me ? L.you : esc(A.tag)}</div>
      <div style="flex:1">
        <div class="said">${esc(x.text)}</div>
        ${x.me ? "" : `<div style="margin-top:5px">
            <button class="mini" data-play="${i}">&#9834;</button>
            <button class="mini" data-tr="${i}">${L.show}</button></div>`}
        ${!x.me && x.open ? `<div class="sub">${esc(x.tr)}</div>` : ""}
        ${x.me && x.fix ? `<div class="fix">${esc(x.fix)}</div>` : ""}
      </div>
    </div>`).join("") + (S.busy ? '<div class="turn" style="opacity:.5">· · ·</div>' : "");

  $("log").querySelectorAll("[data-play]").forEach((b) =>
    b.onclick = () => speak(S.turns[+b.dataset.play].text, true));
  $("log").querySelectorAll("[data-tr]").forEach((b) =>
    b.onclick = () => { const x = S.turns[+b.dataset.tr]; x.open = !x.open; renderCall(); });
  $("log").scrollTop = $("log").scrollHeight;
}

function show(which) {
  ["setup","call","done","mistakes"].forEach((id) => $(id).classList.toggle("hidden", id !== which));
}

/* ---------- end-of-call evaluation ---------- */
async function evaluateCall() {
  const spoke = S.turns.some((x) => x.me);
  const L = t();
  if (!spoke) { $("evalBox").innerHTML = ""; return; }
  $("evalBox").innerHTML = `<div class="label" style="margin:0">${esc(L.evalTitle)}</div><p class="note">${esc(L.evalLoading)}</p>`;
  const help = HELP_LANG[S.lang] || "English";
  const transcript = S.turns.map((x) => `${x.me ? "LEARNER" : "OTHER"}: ${x.text}`).join("\n");
  try {
    const res = await chatFetch({
      system: `You evaluate a German phone-call role-play by a learner at CEFR level ${S.level}. The learner's goal was: ${S.currentGoal}. Return ONLY a JSON object, no markdown, with keys: "achieved" (true/false/"partial" - did the learner reach the goal), "comment" (2 sentences in ${help}: what went well and overall impression), "tips" (array of at most 3 short concrete tips in ${help} to improve, most important first).`,
      messages: [{ role: "user", content: `Transcript of the call:\n${transcript}` }],
    });
    const data = await res.json();
    const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = raw.replace(/```json|```/g, "").trim();
    const p = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    const badge = p.achieved === true ? "✅" : p.achieved === "partial" ? "🟡" : "❌";
    $("evalBox").innerHTML =
      `<div class="label" style="margin:0">${esc(L.evalTitle)} ${badge}</div>` +
      `<p style="font-size:14.5px;line-height:1.5;margin:10px 0 6px">${esc(p.comment)}</p>` +
      (Array.isArray(p.tips) && p.tips.length
        ? `<ul style="margin:6px 0 0;padding-left:20px">${p.tips.map((tip) => `<li style="font-size:13.5px;line-height:1.5;margin-top:4px">${esc(tip)}</li>`).join("")}</ul>`
        : "");
  } catch (e) {
    $("evalBox").innerHTML = `<div class="label" style="margin:0">${esc(L.evalTitle)}</div><p class="note">${esc(L.evalFail)}</p>`;
  }
}

/* ---------- wiring ---------- */
$("callBtn").onclick = () => {
  const REAL = SCENARIOS.filter((x) => x.goals);
  if (S.scenario.id === "custom") {
    const topic = ($("customTopic").value || "").trim();
    if (!topic) { $("customTopic").focus(); return; }
    S.customTopic = topic; saveSettings();
    S.active = { id:"custom", who:"Freies Gespräch", tag:"FREI",
      role:"the person who would naturally answer the phone for the situation the learner describes",
      place:"the appropriate business, office or organisation",
      goals:[topic] };
  } else if (S.scenario.id === "random") {
    S.active = REAL[Math.floor(Math.random() * REAL.length)];
  } else {
    S.active = S.scenario;
  }
  S.turns = []; S.hint = null; S.hintOpen = false; S.seconds = 0; S.handsFree = true;
  const g = S.active.goals;
  S.currentGoal = g[Math.floor(Math.random() * g.length)];
  show("call"); alertMsg(null); renderCall();
  acquireWakeLock();
  clearInterval(S.timerId);
  S.timerId = setInterval(() => { S.seconds++; $("timer").textContent = "VERBUNDEN · " + mmss(); }, 1000);
  ask();
};
$("hangBtn").onclick = () => {
  S.handsFree = false;
  clearInterval(S.timerId);
  S.timerId = null;
  releaseWakeLock();
  speechSynthesis.cancel();
  stopAudio();
  try { S.rec && S.rec.abort(); } catch (e) {}
  const L = t();
  $("doneTitle").textContent = L.ended;
  $("againBtn").textContent = L.again;
  const fixes = S.turns.filter((x) => x.me && x.fix);
  $("review").innerHTML = `<div class="label" style="margin:0">${esc(L.review)} · ${mmss()}</div>` +
    (fixes.length ? fixes.map((x) => `<div style="margin-top:14px"><div class="said">${esc(x.text)}</div><div class="fix">${esc(x.fix)}</div></div>`).join("")
                  : '<p class="note">—</p>');
  recordCall();
  show("done");
  evaluateCall();
};
$("againBtn").onclick = () => { show("setup"); renderSetup(); };
$("mistakesBtn").onclick = () => { renderMistakes(); show("mistakes"); };
$("backBtn").onclick = () => { show("setup"); renderSetup(); };
$("ankiBtn").onclick = () => exportAnki();
$("clearBtn").onclick = () => {
  if (confirm(t().clearConfirm)) { localStorage.removeItem(FIX_KEY); renderMistakes(); }
};
$("micBtn").onclick = () => listen();
$("freeBtn").onclick = () => { S.handsFree = !S.handsFree; renderCall(); };
$("repeatBtn").onclick = () => {
  for (let i = S.turns.length - 1; i >= 0; i--) if (!S.turns[i].me) { speak(S.turns[i].text, true); break; }
};
$("hintBtn").onclick = () => { S.hintOpen = !S.hintOpen; renderCall(); };
$("typeBtn").onclick = () => $("typeRow").classList.toggle("hidden");
$("sendBtn").onclick = () => send($("draft").value);
$("customTopic").oninput = (e) => { S.customTopic = e.target.value; };
$("draft").onkeydown = (e) => { if (e.key === "Enter") send($("draft").value); };

renderSetup();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
