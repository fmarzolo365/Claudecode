    font: 800 var(--text-f16) var(--font-sans);
  }
  .limit-full .limit-plan-top small { font: 700 var(--text-f10-5) 'JetBrains Mono', monospace; opacity: .8; }
  .limit-full .limit-plan .xpbar { background: rgba(255,255,255,.18); height: 12px; }
  .limit-full .limit-plan .xpbar > div { background: var(--coin); }
  .limit-full #limitStore, .limit-full #limitOk { width: min(320px, 92%); }
  .limit-full #limitStore { background: rgba(255,255,255,.16); color: var(--white); border-color: rgba(255,255,255,.28); }
  /* ---------- MARZI-008: reward summary + celebration ---------- */
  .rw-card {
    border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow);
    background: linear-gradient(145deg, var(--paper-3), var(--leaf-soft));
    padding: var(--space-3) var(--space-4) var(--space-4); margin-top: var(--space-3);
  }
  .rw-top { display: flex; gap: var(--space-3); align-items: center; }
  .rw-gains { flex: 1; min-width: 0; }
  .rw-gain {
    display: inline-flex; align-items: center; gap: 5px; margin: 0 6px 4px 0;
    background: var(--card); border: 1px solid var(--tint-leaf-35); border-radius: 999px;
    padding: 5px var(--space-3); font: 800 var(--text-f14) var(--font-sans); color: var(--marzi-dark);
  }
  .rw-gain.coin { border-color: var(--tint-primary-35); color: var(--coin-ink); }
  .rw-fly { position: fixed; z-index: 90; margin: 0; pointer-events: none;
    transition: transform var(--dur-slow) var(--ease), opacity var(--dur-slow) var(--ease); }
  .rw-msg { margin: 4px 0 0; font: 600 var(--text-f12-5) var(--font-sans); color: var(--muted); line-height: 1.4; }
  .rw-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-3); }
  .rw-stats > div { text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: var(--space-2) 4px; }
  .rw-stats strong { display: block; font: 800 var(--text-f16) var(--font-sans); }
  .rw-stats span { display: block; font: 600 var(--text-f10-5) var(--font-sans); color: var(--muted); }
  .rw-stage { margin-top: var(--space-3); font: 700 var(--text-f12) var(--font-sans); color: var(--marzi-dark); text-align: center; }
  .rw-card[data-state="save-failed"] { background: var(--danger-soft); border-color: var(--tint-danger-35); }
  .rw-card[data-state="high"] { box-shadow: 0 0 0 2px var(--tint-primary-35), var(--shadow); }
  .evo-cel { text-align: center; }
  .evo-cel-row { display: flex; align-items: center; justify-content: center; gap: var(--space-2); margin: var(--space-2) 0; }
  .evo-cel-row .ui-marzi-art { width: 72px; height: 72px; }
  .evo-cel-row .evo-arrow { color: var(--primary); }
  .evo-cel-row .was { opacity: .45; filter: grayscale(.5); }
  .evo-cel-name { font: 800 var(--text-lg) var(--font-sans); color: var(--marzi-dark); }
  .evo-cel-desc { font: 600 var(--text-f12-5) var(--font-sans); color: var(--muted); margin-top: 4px; line-height: 1.4; }
  /* ---------- MARZI-007: canonical store (board 04_progress panel) ---------- */
  .store-head {
    display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2);
  }
  .store-head .store-coins { font: 800 var(--text-f18) var(--font-sans); display: inline-flex; align-items: center; gap: 6px; }
  .store-head .store-coins .ic { color: var(--coin); }
  .store-head .store-x { margin-inline-start: auto; width: var(--touch-min); height: var(--touch-min); border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .cat-tabs {
    display: flex; gap: var(--space-1); padding: 4px; margin-bottom: var(--space-3);
    background: var(--surface-soft); border: 1px solid var(--line); border-radius: 999px; overflow-x: auto; scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex: 1 0 auto; min-height: var(--touch-min); min-width: var(--touch-min);
    display: grid; place-items: center; gap: 1px; padding: 0 var(--space-2);
    border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer;
    font: 700 var(--text-f8) var(--font-sans);
  }
  .cat-tab[aria-selected="true"] { background: var(--primary); color: var(--white); }
  .cat-tab[data-empty="1"] { opacity: .55; }
  .cat-tab .cat-lb { max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .outfit-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  /* W3: the catalog reads as Marzi's journey — one labelled band per
     evolution stage, with a check once that stage has been reached */
  .store-stage-lbl { display: flex; align-items: center; gap: 6px; margin: 16px 2px 8px; }
  .store-stage-lbl[data-reached="true"] { color: var(--primary-active); }
  /* W3 try-on: Marzi at her earned stage beside the garment she would wear */
  .store-tryon {
    display: flex; align-items: flex-end; justify-content: center; gap: var(--space-2);
    margin: 4px 0 10px;
  }
  .store-tryon .tryon-marzi { display: block; width: 96px; height: 96px; }
  .store-tryon .tryon-marzi svg, .store-tryon .tryon-marzi img { width: 100%; height: 100%; display: block; }
  .store-tryon .tryon-item { display: block; width: 64px; height: 64px; }
  .store-tryon .tryon-item svg { width: 100%; height: 100%; display: block; }
  /* W3: the equipped outfit, visible on the hero as a labelled chip */
  .hero-fit {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 6px;
    padding: 3px 10px 3px 4px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-sm);
    font: 700 var(--text-f11) var(--font-sans); color: var(--ink);
  }
  .hero-fit .fit-glyph { display: inline-flex; width: 22px; height: 22px; }
  .hero-fit .fit-glyph svg { width: 100%; height: 100%; }
  .outfit-card {
    display: flex; flex-direction: column; overflow: hidden; cursor: pointer; text-align: center;
    border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--card);
    box-shadow: var(--shadow-sm); padding: 0 0 var(--space-2); font: inherit; color: var(--ink);
    min-height: var(--touch-min);
  }
  .outfit-card .outfit-preview {
    display: grid; place-items: center; aspect-ratio: 1 / 1; width: 100%;
    background: linear-gradient(150deg, var(--stage-from), var(--stage-to)); color: var(--marzi-dark);
  }
  .outfit-card .outfit-preview svg { width: 54%; height: 54%; opacity: .55; }
  .outfit-card .outfit-copy { display: block; padding: var(--space-2) 4px 0; }
  .outfit-card .outfit-copy strong { display: block; font: 800 var(--text-f11-5) var(--font-sans); line-height: 1.2; }
  .outfit-card .outfit-foot {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 3px; margin-top: 3px;
    max-width: 100%; font: 700 var(--text-f10-5) var(--font-sans); color: var(--coin-ink);
  }
  /* MARZI-017: softened, not broken - the card keeps full contrast on its
     name, price and stage badge; only the placeholder preview is muted. */
  .outfit-card[data-state="locked"] .outfit-preview { filter: grayscale(.35); }
  .outfit-card[data-state="locked"] .outfit-foot { color: var(--muted); }
  .outfit-card[data-state="insufficient"] .outfit-foot { color: var(--muted); }
  .outfit-card[data-state="owned"] .outfit-foot { color: var(--marzi-dark); }
  .outfit-card[data-state="equipped"] { border-color: var(--primary); box-shadow: 0 0 0 2px var(--tint-primary-35), var(--shadow-sm); }
  .outfit-card[data-state="equipped"] .outfit-foot { color: var(--marzi-dark); }
  /* MARZI-017: stage-locked cards stay inviting - softened, not disabled */
  .outfit-card[data-state="locked"] { position: relative; }
  .outfit-card[data-state="locked"] .outfit-preview { opacity: .55; }
  .outfit-lock {
    position: absolute; inset-inline-end: 6px; inset-block-start: 6px;
    display: inline-flex; padding: 3px; border-radius: 50%;
    background: var(--card); border: 1px solid var(--line); color: var(--muted);
  }
  .outfit-stage {
    display: block; margin: 4px auto 0; padding: 2px 8px; border-radius: 999px;
    background: var(--surface-strong); color: var(--muted);
    font: 700 var(--text-f10-5) var(--font-sans);
    max-width: 100%; overflow-wrap: anywhere; text-align: center;
  }
  .outfit-price { color: var(--coin); font-weight: 800; }
  .store-modal-art { width: 116px; height: 116px; margin: 0 auto; display: grid; place-items: center;
    border-radius: var(--radius); background: linear-gradient(150deg, var(--stage-from), var(--stage-to)); color: var(--marzi-dark); }
  .store-modal-art svg { width: 58%; height: 58%; opacity: .6; }
  .store-note { text-align: center; font: 700 var(--text-f11-5) var(--font-sans); color: var(--marzi-dark); margin-top: var(--space-3); }
  /* ---------- MARZI-006: immersive call layer (board 02_call.png) ----------
     Fixed, dynamic-viewport sized, safe-area aware. The portrait is the
     dominant visual; every overlay is absolutely positioned so nothing can
     collide, and the page can never scroll. */
  .callscreen {
    /* MARZI-062: the call layer starts below the staging marker so the marker
       is never covered and never covers the call. --staging-bar is 0 when the
       marker is absent, so this is identical to `inset: 0` without it. */
    position: fixed; inset: var(--staging-bar, 0px) 0 0 0; z-index: 70; overflow: hidden;
    /* REDESIGN: the call used to be a near-black room with a full-bleed photo.
       Every other screen in the app is cream, so the call read as a different
       product — a phone dialler bolted onto a learning game. It now uses the
       same warm surface, which is also what lets Marzi sit IN the scene
       instead of being a cut-out pasted onto a dark photo. */
    background:
      radial-gradient(120% 60% at 50% 0%, var(--paper) 0%, transparent 62%),
      var(--bg);
    color: var(--ink);
    height: calc(100dvh - var(--staging-bar, 0px)); min-height: 0;
    display: flex; flex-direction: column;
    /* sole owner of both call insets - see R2-APP-04 */
    padding: calc(var(--safe-top) + var(--space-2)) 0
             calc(var(--safe-bottom) + var(--space-2));
  }
  /* MARZI-062: the middle band reserves an independent region per critical
     element instead of stacking them as free-floating overlays. Absolutely
     positioned siblings could not know about each other, so at 200% text the
     character line, Marzi, the identity and the status chip grew into one
     another. Grid areas cannot overlap by construction, so the geometry holds
     at every viewport and text scale. The portrait, scrim and floor stay
     absolute: they are the backdrop, not critical boxes. */
  .call-mid {
    position: relative; flex: 1 1 auto; min-height: 0;
    display: grid;
    /* the suggestion keeps a usable floor so Marzi's column can never squeeze
       it into a one-word-per-line strip; below that floor Marzi yields */
    grid-template-columns: minmax(0, auto) minmax(min(52%, 230px), 1fr);
    /* MARZI-062: the companion's row keeps a floor so a long alert or a long
       character line cannot collapse him to nothing; past that floor the band
       scrolls rather than dropping him. */
    /* REDESIGN: five bands instead of four. The stage card is now a band of
       its own, so the character occupies a bounded region rather than being
       the backdrop everything else floats on. Reading order top to bottom is
       who you are talking to, how the call is doing, the dialogue,
       Marzi and her suggestion — then the controls in the fixed stack below. */
    /* ART DIRECTION: the dialogue row is the FLEXIBLE one (1fr) and scrolls
       internally, while Marzi's row keeps a hard floor — a growing
       conversation can never push the companion below the fold, which is the
       failure the earlier fixed-cap feed produced at 390x844. */
    grid-template-rows: auto auto auto minmax(max(var(--touch-min), 3lh), 1fr) minmax(min(192px, 24dvh), auto);
    grid-template-areas:
      "stage  stage"
      "status status"
      "alert  alert"
      "char   char"
      "marzi  hint";
    gap: var(--space-2);
    padding: 0 var(--space-4) var(--space-2);
    /* MARZI-062: at 320x568 with 200% text the identity block alone can be
       218px tall and the control stack 206px, so the middle band is genuinely
       out of room. It owns that overflow itself rather than pushing the
       character's line past the controls or off the screen: the page still
       does not scroll, and the controls, timer and identity stay put. */
    overflow-y: auto; overscroll-behavior: contain;
  }
  /* REDESIGN: the character now lives in a card with a defined height and a
     rounded frame. Bounding the portrait is what removes its dominance and,
     because every other band sits outside the card, it is also what stops a
     speech bubble ever covering the character's face. */
  .call-stage-card {
    grid-area: stage; position: relative; overflow: hidden;
    height: clamp(132px, 18dvh, 184px);
    border-radius: var(--radius-lg);
    background: linear-gradient(160deg, var(--stage-from), var(--stage-to));
    /* a registered final scenario background (inline background-image from
       the asset slot) paints the card edge to edge */
    background-size: cover; background-position: center;
    border: 1.5px solid var(--stage-line);
    box-shadow: var(--shadow);
    display: grid; place-items: center;
  }
  .callscreen.speaking .call-stage-card {
    border-color: var(--primary); box-shadow: 0 0 0 3px var(--tint-primary-35), var(--shadow);
  }
  .call-portrait {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 22%; display: none;
  }
  .call-portrait.ok { display: block; }
  /* MARZI-018 M-01: the emoji is the portrait's FALLBACK, not an overlay on
     top of it. A loaded portrait already represents the character, so the
     emoji is removed from the scene entirely (board 05, decision 7). */
  .call-emoji {
    position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%);
    font-size: var(--text-f64); opacity: .9;
  }
  .callscreen:has(.call-portrait.ok) .call-emoji { display: none; }
  /* MARZI-018 M-10: a floor under Marzi so the lower band reads as ground he
     is standing on rather than empty space below a crop.
     REDESIGN: on the cream surface this is a warm ground band with a soft top
     edge instead of a dark gradient over a photo — the change that makes Marzi
     look seated in the scene rather than pasted over it. */
  .call-mid::after {
    content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 34%;
    z-index: 0; pointer-events: none; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    background: linear-gradient(180deg, rgba(232,223,201,0) 0%, var(--surface-soft) 46%, var(--surface-strong) 100%);
  }
  /* REDESIGN: the scrim used to darken the WHOLE screen so white text stayed
     legible over the photo. With the portrait inside a card and the text
     outside it, only the card's lower edge needs veiling. */
  .call-scrim {
    position: absolute; inset: auto 0 0 0; height: 34%;
    background: linear-gradient(180deg, rgba(16,12,8,0) 0%, rgba(16,12,8,.34) 100%);
  }
  .callscreen.speaking .call-scrim { box-shadow: inset 0 0 0 3px var(--tint-primary-35); }
  .call-top {
    position: relative; z-index: 4; flex: 0 0 auto;
    /* MARZI-062: the trailing connection indicator measures ~13px, so a fixed
       48px track spent 35px of the identity's width on the narrowest screen.
       It now takes only what it needs and the identity keeps the rest, which
       is what lets a long name wrap instead of breaking mid-word at 200%. */
    display: grid; grid-template-columns: var(--touch-min) minmax(0, 1fr) auto;
    align-items: start; gap: var(--space-2); padding: 0 var(--space-2);
  }
  .call-x {
    width: var(--touch-min); height: var(--touch-min); border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
    display: grid; place-items: center; box-shadow: var(--shadow-sm);
  }
  .call-id {
    min-width: 0; text-align: center; display: grid;
    /* MARZI-062: at 200% text the three identity lines measured 218px of a
       568px screen and starved the rest of the composition. The block keeps a
       generous share and owns its own overflow, so the name stays readable
       without the character's line, Marzi and the controls losing their room.
       Below that ceiling this rule changes nothing. */
    max-height: 22dvh; overflow-y: auto; overscroll-behavior: contain;
  }
  /* MARZI-062: identity text wraps, and breaks a long compound name if it has
     to. Without this the name overflowed its box sideways at 200% text and was
     cut off at the edge instead of wrapping. */
  .call-id-kicker, .call-id-name, .call-id-place { min-width: 0; overflow-wrap: break-word; }
  /* REDESIGN: three lines that used to be near-equal now read as a hierarchy —
     a quiet kicker, the name as the anchor, the role beneath it. */
  .call-id-kicker {
    font: 700 var(--text-f10) var(--font-sans); color: var(--muted);
    letter-spacing: .08em; text-transform: uppercase;
  }
  .call-id-name { font: 800 var(--text-lg) var(--font-sans); line-height: 1.18; color: var(--ink); letter-spacing: -.01em; }
  .call-id-place { font: 600 var(--text-f12-5) var(--font-sans); color: var(--muted); line-height: 1.35; margin-top: 1px; }
  .call-conn {
    justify-self: end; display: inline-flex; align-items: center; gap: 4px; min-height: var(--touch-min);
    font: 700 var(--text-f10) 'JetBrains Mono', monospace; color: var(--muted);
  }
  /* dialogue bubbles */
  /* MARZI-018-R2: both bubbles are buttons (tap to replay / to use the
     suggestion), so they are interactive targets and must meet the floor. */
  .call-bubble {
    position: relative; z-index: 3; max-width: 100%; text-align: start;
    min-height: var(--touch-min); min-width: 0; box-sizing: border-box;
    /* MARZI-062: a long compound noun (Krankschreibung) is a single unbreakable
       token, so at 200% text it pushed past the bubble and was clipped. The
       bubble now breaks such a word and scrolls its own overflow instead.
       `break-word`, not `anywhere`: `anywhere` also shrinks the element's
       intrinsic max-content width, which collapsed the suggestion into a
       one-word-per-line strip beside Marzi. */
    overflow-wrap: break-word; overflow-y: auto; overscroll-behavior: contain;
    display: flex; align-items: center;
    background: var(--card); color: var(--ink);
    border: 1.5px solid var(--stage-line); border-radius: var(--radius);
    padding: var(--space-2) var(--space-3); box-shadow: var(--shadow-sm);
    font: 600 var(--text-f14) var(--font-sans); line-height: 1.45;
  }
  /* ART DIRECTION: the conversation band now carries the WHOLE dialogue as
     true speech bubbles — the transcript sheet is gone. The band keeps a
     reading floor so the grid can never crush it, and scrolls its own
     overflow so it can never push Marzi or the controls off the screen. */
  .call-lines {
    grid-area: char; display: flex; flex-direction: column; gap: var(--space-1);
    min-width: 0; min-height: 0; justify-content: flex-end;
  }
  .call-lines .call-dialogue {
    min-height: max(var(--touch-min), 3lh); flex: 0 1 auto;
    overflow-y: auto; overscroll-behavior: contain;
    /* offset parent for the reading-first scroll anchor in renderTranscript */
    position: relative;
    display: flex; flex-direction: column;
    /* older turns fade out at the top instead of cutting mid-letter; the
       padding keeps the fade zone off the first turn when nothing scrolls */
    padding-top: 14px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, var(--ink) 14px);
    mask-image: linear-gradient(180deg, transparent 0, var(--ink) 14px);
  }
  /* bottom-anchored like a messenger: margin-top:auto (not justify-content,
     which breaks scroll-to-top in overflowing flex columns) */
  .call-dialogue > :first-child { margin-top: auto; }
  .call-lines .note { margin: 0; font-size: var(--text-f11); text-align: center; }
  /* Text off = listening-only mode. VISUAL-DIRECTOR F5: instead of leaving a
     dead cream band where the text was, the dialogue row collapses and Marzi
     grows into the reclaimed space — listening practice gets a bigger
     companion, not an empty screen. Marzi's hint bubble is help, not live
     text — it stays. */
  .callscreen.text-off #callLines { display: none; }
  .callscreen.text-off .call-mid {
    grid-template-rows: auto auto auto 0 minmax(min(192px, 24dvh), 1fr);
  }
  .call-bubble.marzi {
    grid-area: hint; justify-self: stretch; width: 100%; align-self: end;
    max-height: 26dvh; cursor: pointer; border-end-start-radius: 6px;
    background: var(--primary-soft); border-color: var(--tint-leaf-35);
    /* dashed = proposal, the same vocabulary as the help panel's VORSCHLAG
       box — a learner's own (solid) turn can never be mistaken for it (R4) */
    border-style: dashed;
    color: var(--marzi-dark); box-shadow: var(--shadow-sm);
  }
  /* the tail points back at Marzi, so bubble and companion read as one unit */
  .call-bubble.marzi::after {
    content: ""; position: absolute; inset-inline-start: -7px; bottom: 12px;
    width: 12px; height: 12px; transform: rotate(45deg);
    background: var(--primary-soft); border-inline-start: 1.5px solid var(--tint-leaf-35);
    border-block-end: 1.5px solid var(--tint-leaf-35); border-end-start-radius: 3px;
  }
  /* Marzi in-scene, lower-left, board position */
  /* MARZI-018 M-02: Marzi is an in-scene companion. The art scales with the
     dynamic viewport so he holds >=30% of width and ~25% of height on both
     reference phones, and is clamped so he never overruns the stage. */
  .call-marzi {
    /* MARZI-062: the companion sits at the bottom of his row and is capped by
       it, so he keeps his established size wherever there is room and shrinks
       only where there is not. The cap is on the CONTAINER; the artwork keeps
       a plain clamp and shrinks through flex, because sizing the artwork with
       `min(clamp(...), 100%)` against an auto-height parent silently cost it
       ~3% of its presence at 390x844. */
    grid-area: marzi; position: relative; align-self: end; justify-self: start;
    justify-content: flex-end; max-height: 100%; min-height: 0;
    /* MARZI-062: the artwork is deliberately wider than the container cap
       (208px of art inside a 179px footprint at 390x844), so centring it spilled
       ~2.3px past the inline-start edge of the viewport. Packing to the start
       keeps the same artwork size and moves that overhang inward, where there
       is room. The caption stays centred under him. */
    z-index: 2; display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
    pointer-events: none; max-width: min(46vw, 220px);
  }
  .call-marzi .vc-marzi-cap { align-self: center; }
  .call-marzi .vc-marzi-art {
    /* the ARTWORK, not just its container, carries the presence contract.
       MARZI-062: bounded by the row as well as by the viewport, so he holds
       his established presence where there is room and yields where there is
       not, rather than overrunning the stage. */
    height: clamp(112px, 25.5dvh, 208px); max-height: 100%; min-height: 0; flex: 0 1 auto;
    width: auto; aspect-ratio: 1 / 1;
    filter: drop-shadow(0 6px 14px rgba(16,12,8,.55));
  }
  .call-marzi .vc-marzi-art svg, .call-marzi .vc-marzi-img { width: 100%; height: 100%; display: block; }
  /* MARZI-018-R3 (R2-APP-01): the circular badge/chip treatment is gone.
     Board 05 is explicit that Marzi is never reduced to a badge, and the
     badge's border+padding meant the ARTWORK measured ~21% height while the
     box looked larger. Early stages now size exactly like 4-6; a soft glow
     replaces the chip so an egg still reads against a dark portrait. */
  .call-marzi[data-stage="1"] .vc-marzi-art,
  .call-marzi[data-stage="2"] .vc-marzi-art,
  .call-marzi[data-stage="3"] .vc-marzi-art {
    /* #vcMarzi carries BOTH .call-marzi and .vc-marzi, so the Learn badge rule
       (46px, bordered chip) also matched here. Unset the chrome AND restore the
       scaled size, so early stages match 4-6 inside the call (R2-APP-01). */
    height: clamp(112px, 25.5dvh, 208px); max-height: 100%; min-height: 0; flex: 0 1 auto;
    width: auto; aspect-ratio: 1 / 1;
    border: 0; border-radius: 0; padding: 0; background: none; box-shadow: none;
    filter: drop-shadow(0 0 10px rgba(255,255,255,.34)) drop-shadow(0 6px 14px rgba(16,12,8,.55));
  }
  /* VISUAL-DIRECTOR F5: in listening-only mode Marzi grows into the space
     the dialogue gave back (rule sits below the base art rules it overrides) */
  .callscreen.text-off .call-marzi .vc-marzi-art {
    height: clamp(140px, 34dvh, 300px);
  }
  /* REDESIGN: a monospace pill reading "Marzi · Studious frog · 5/6" looked
     like a debug label stuck to the artwork. It is now a quiet caption in the
     product's own typeface, with no chrome competing with Marzi herself. */
  .call-marzi .vc-marzi-cap {
    font: 700 var(--text-f10) var(--font-sans); letter-spacing: .01em;
    color: var(--muted); background: none; border: 0;
    border-radius: 0; padding: 0; max-width: 132px; text-align: center; line-height: 1.25;
  }
  /* bottom stack: tools row, controls, meta */
  /* REDESIGN: the bottom of the screen used to be three stacked rows — tools,
     controls, timer — six controls in 164px, with the red hang-up as the
     largest thing on screen. It is now one quiet secondary row over one
     obvious primary action, on a raised surface that separates "doing the
     call" from "looking at the call". */
  .call-stack {
    position: relative; z-index: 4; flex: 0 0 auto;
    display: grid; justify-items: center; gap: var(--space-2);
    padding: var(--space-3) var(--space-4) var(--space-1);
    background: var(--card); border-top: 1px solid var(--line);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -6px 20px rgba(34, 27, 15, .06);
  }
  /* W2: one quiet row, always. Five labelled pills can outgrow a narrow or
     text-scaled screen; the row then scrolls sideways instead of wrapping
     into a tower that starves the conversation above it. The auto margins
     centre the row while it fits and start-align it once it overflows. */
  /* VISUAL-DIRECTOR F1: four equal columns instead of a hidden horizontal
     scroller — every localized label fits at 390 (and 320) by wrapping inside
     its own cell, so no control is ever clipped off-screen. */
  .call-tools {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-2); width: 100%;
  }
  /* WORLD-CLASS W2: the inline help panel sits in the fixed stack, above the
     tool pills. It is bounded and scrolls its own overflow so it can never
     push the controls or the timer off the screen. */
  /* while help is open the scene above steps back, so the panel reads as
     the focused layer instead of content crushed behind it (R3) */
  .callscreen.help-open .call-mid { opacity: .35; }
  .call-help {
    width: 100%; box-sizing: border-box;
    max-height: min(46dvh, 340px); overflow-y: auto; overscroll-behavior: contain;
    background: var(--surface-soft); border: 1.5px solid var(--stage-line);
    border-radius: var(--radius); padding: var(--space-2) var(--space-3) var(--space-3);
    display: grid; gap: var(--space-2);
  }
  .call-help .help-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  /* Target-language content stays LTR inside an RTL UI, or its punctuation
     jumps to the wrong side ("?Wie bitte"). Isolation keeps the surrounding
     layout direction untouched. */
  #hintText, #sosRow button, #draft, #vcBubble {
    direction: ltr; unicode-bidi: isolate;
  }
  .call-help .help-head b { font: 800 var(--text-f14) var(--font-sans); color: var(--ink); }
  .call-help .row { margin: 0; }
  .call-help .help-more { width: 100%; }
  .call-help .hint { margin: 0; }
  .call-pill {
    min-height: var(--touch-min); min-width: var(--touch-min); justify-content: center;
    display: inline-flex; align-items: center; gap: 4px;
    /* labels wrap inside the cell rather than clipping (F1) */
    padding: 2px var(--space-1); border-radius: var(--radius); cursor: pointer;
    white-space: normal; text-align: center; line-height: 1.15; overflow-wrap: break-word;
    background: var(--surface-soft); color: var(--ink); border: 1px solid var(--line);
    font: 700 var(--text-f10-5) var(--font-sans);
  }
  .call-pill svg { flex: 0 0 auto; }
  /* an engaged toggle is tinted, not solid: solid MARZI green belongs to the
     primary action alone, or the row competes with it for attention */
  .call-pill[aria-pressed="true"] {
    background: var(--primary-soft); border-color: var(--primary); color: var(--marzi-dark);
  }
  .call-pill[disabled] { opacity: .45; cursor: not-allowed; }
  .call-controls { display: flex; align-items: center; justify-content: center; gap: var(--space-5); }
  .call-ctrl {
    /* VISUAL-DIRECTOR F4: circles grow with the text tokens so labels stay
       whole at 200% text instead of clipping against a fixed diameter */
    width: clamp(66px, calc(var(--text-f11) * 6), 104px);
    height: clamp(66px, calc(var(--text-f11) * 6), 104px);
    border-radius: 50%; border: 1px solid var(--line); cursor: pointer;
    padding: 0 5px; box-sizing: border-box;
    display: grid; place-items: center; gap: 2px; color: var(--ink);
    background: var(--surface-soft); transition: background var(--dur-fast) var(--ease);
  }
  .call-ctrl .call-ctrl-lb {
    /* REDESIGN: the label used to be capped at 62px and ellipsised, so the
       primary action read "Tap and sp…". It now wraps inside a real width. */
    font: 700 var(--text-f9) var(--font-sans); letter-spacing: .01em;
    max-width: 100%; white-space: normal; line-height: 1.12; text-align: center;
    overflow-wrap: break-word;
  }
  /* THE primary action: the microphone is the biggest, greenest thing on the
     screen. Previously it was the same size as replay and smaller than the red
     hang-up, so the destructive action was the most prominent one. */
  #micBtn.call-ctrl {
    width: clamp(92px, calc(var(--text-f11) * 8.4), 140px);
    height: clamp(92px, calc(var(--text-f11) * 8.4), 140px);
    gap: 3px;
    background: var(--primary); color: var(--on-primary); border-color: var(--primary-active);
    box-shadow: 0 8px 20px rgba(84, 124, 44, .28);
  }
  #micBtn.call-ctrl .call-ctrl-lb { font-size: var(--text-f11); max-width: 100%; }
  #micBtn.call-ctrl[disabled] { box-shadow: none; }
  /* hang-up stays red and stays reachable, but stops out-shouting the mic */
  .call-ctrl.danger {
    width: clamp(66px, calc(var(--text-f11) * 6), 104px);
    height: clamp(66px, calc(var(--text-f11) * 6), 104px);
    background: var(--red); color: var(--white); border-color: var(--red);
  }
  .call-ctrl.danger:hover { filter: brightness(1.08); }
  .call-ctrl[disabled] { opacity: .45; cursor: not-allowed; }
  #micBtn.call-ctrl[data-status="listening"] { background: var(--primary-active); animation: listeningPulse var(--loop-pulse) var(--ease) infinite; }
  .call-ctrl[data-status="listening"] { background: var(--primary); color: var(--on-primary); }
  .call-ctrl[data-status="processing"] { background: var(--disabled-fill); color: var(--ink); }
  /* MARZI-018 M-05: only .danger (hang-up) is red. A failed microphone is a
     warning state - never a second danger signal competing with hang-up. */
  .call-ctrl[data-status="failed"] { background: var(--warn-soft); color: var(--warn-ink); }
  /* MARZI-018 M-07: the timer is the primary reading; connection state and
     remaining allowance are quieter context beside it. */
  .call-meta {
    display: flex; align-items: baseline; justify-content: center; gap: var(--space-2);
    min-height: 20px; font: 700 var(--text-f11) 'JetBrains Mono', monospace;
    color: var(--muted);
  }
  .call-meta #timer { font-size: var(--text-md); color: var(--ink); letter-spacing: .04em; }
  .call-meta .call-meta-ctx { color: var(--muted); }
  .call-meta .low { color: var(--coin); }
  /* REDESIGN: on a short phone there is not enough height for a generous
     portrait card AND the companion band. The card yields first - it is the
     least information-dense band - so Marzi and her suggestion stay in the
     first view instead of being pushed below the fold. */
  @media (max-height: 680px) {
    .call-stage-card { height: clamp(88px, 15dvh, 140px); }
    .call-mid {
      grid-template-rows: auto auto auto minmax(max(var(--touch-min), 2lh), 1fr) minmax(min(120px, 20dvh), auto);
      padding-inline: var(--space-3); gap: var(--space-1);
    }
    .call-lines .call-dialogue { min-height: max(var(--touch-min), 2lh); }
    .call-stack { padding: var(--space-2) var(--space-3) 0; gap: var(--space-1); }
    .call-controls { gap: var(--space-4); }
    #micBtn.call-ctrl {
      width: clamp(80px, calc(var(--text-f11) * 7.3), 124px);
      height: clamp(80px, calc(var(--text-f11) * 7.3), 124px);
    }
    .call-ctrl, .call-ctrl.danger {
      width: clamp(58px, calc(var(--text-f11) * 5.3), 96px);
      height: clamp(58px, calc(var(--text-f11) * 5.3), 96px);
    }
    .call-marzi .vc-marzi-cap { display: none; }
    /* on a short phone Marzi yields some height so the newest line stays
       readable at rest — she remains a real character (~18% of the screen),
       never a badge */
    .call-marzi .vc-marzi-art,
    .call-marzi[data-stage="1"] .vc-marzi-art,
    .call-marzi[data-stage="2"] .vc-marzi-art,
    .call-marzi[data-stage="3"] .vc-marzi-art { height: clamp(96px, 18dvh, 145px); }
  }

  /* status + alerts stay visible until resolved */
  /* ART DIRECTION: the chip rides the stage card's bottom edge — status reads
     as part of the character scene (integrated state, band 7 of the target
     composition) and its row returns ~40px to the dialogue, which needed it.
     The negative margin shrinks the chip's margin box, so the grid row
     collapses while the chip overlaps the card above it. */
  .call-status-chip {
    grid-area: status; position: relative; justify-self: center; z-index: 5;
    margin-top: calc(-1 * (var(--space-2) + 30px));
    max-width: 100%; overflow-wrap: break-word;
    display: inline-flex; align-items: center; gap: 6px; white-space: normal;
    background: var(--card); border: 1.5px solid var(--stage-line);
    color: var(--marzi-dark); border-radius: 999px; padding: 6px var(--space-3);
    font: 700 var(--text-f11-5) var(--font-sans); box-shadow: var(--shadow-sm);
  }
  /* VISUAL-DIRECTOR F2: in `ready` the chip repeated the primary button's own
     icon and label in the most button-like styling on screen — a decoy mic.
     It is hidden entirely while ready (the chip overlays the card, so nothing
     reflows; the sr-only live region still announces state) and returns only
     when it carries information the mic button does not. */
  .call-status-chip[data-state="ready"] { visibility: hidden; }
  .call-status-chip[data-state="listening"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .call-status-chip[data-state="speaking"] { background: var(--info-soft); border-color: var(--tint-info-28); color: var(--info-ink); }
  .call-status-chip[data-state="processing"] { background: var(--surface-strong); border-color: var(--line); color: var(--ink); }
  .call-status-chip[data-state="error"], .call-status-chip[data-state="disconnected"] {
    background: var(--danger-soft); color: var(--danger-ink); border-color: var(--tint-danger-35);
  }
  .call-alert {
    /* MARZI-062: a transient warning is bounded so it cannot take the whole
       band — at 200% text it measured 158px of a 108px band and left nothing
       for the conversation. It is NOT given its own scroll: a scrollable box
       has an automatic minimum size of zero, and the grid then squeezed the
       warning down to 18px, which is worse than a bounded one. */
    grid-area: alert; position: relative; z-index: 6;
    max-height: 26dvh;
    background: var(--danger-soft); color: var(--danger-ink);
    border: 1px solid var(--tint-danger-35); border-radius: var(--radius);
    padding: var(--space-2) var(--space-3); font: 700 var(--text-f12) var(--font-sans);
    display: flex; align-items: center; gap: var(--space-2); box-shadow: var(--shadow);
  }
  .call-alert button { margin-left: auto; min-height: var(--touch-min); }
  /* MARZI-010: compact chrome keeps its board size but gains a full 48px
     hit area, so the touch floor is met without changing the visuals.
     The box is centred on the control (physical left/translate, so it is
     symmetric in both directions): anchoring it to the inline start made it
     grow outwards only, and the last top-bar chip then pushed its hit area
     past the viewport and gave the page a few pixels of horizontal scroll. */
  .chip-res, .menu-btn, .drawer-close, .store-head .store-x { position: relative; }
  .chip-res::after, .menu-btn::after, .drawer-close::after, .store-head .store-x::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 100%; height: var(--touch-min); min-width: var(--touch-min);
  }
  /* segmented controls and legal links meet the floor directly */
  .seg button { min-height: var(--touch-min); min-width: var(--touch-min); }
  .legal a { display: inline-flex; align-items: center; min-height: var(--touch-min); }
  /* visible keyboard focus everywhere */
  :focus-visible { outline: 3px solid var(--marzi-dark); outline-offset: 2px; border-radius: 8px; }
  /* reduced motion: keep every state legible, drop the movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .big[data-status="listening"] { animation: none; box-shadow: 0 0 0 3px rgba(95,150,45,.5); }
    .vc-stage.speaking::after { animation: none; box-shadow: inset 0 0 0 3px rgba(95,150,45,.75); }
  }
  /* MARZI-015: the same result from the in-app control. It can only ADD
     reduction - the OS preference above is never overridden downwards. */
  body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important;
  }
  body.reduce-motion .big[data-status="listening"] { animation: none; box-shadow: 0 0 0 3px rgba(95,150,45,.5); }
  body.reduce-motion .vc-stage.speaking::after { animation: none; box-shadow: inset 0 0 0 3px rgba(95,150,45,.75); }
  /* ---------- MARZI-015: profile identity, achievements ---------- */
  .prof-id { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-1); }
  .prof-id-stage { font: 800 var(--text-lg) var(--font-sans); color: var(--marzi-dark); }
  .prof-id-desc { margin: 0; max-width: 30ch; font: 500 var(--text-sm) var(--font-sans); color: var(--muted); }
  .prof-id-rank {
    font: 700 var(--text-xs) var(--font-sans); color: var(--muted);
    background: var(--surface-strong); border-radius: 999px; padding: 4px var(--space-3);
  }
  .label.prof-achv-lbl { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
  .prof-achv-n { color: var(--muted); }
  .achv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
  .achv {
    display: flex; align-items: center; gap: var(--space-2);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--space-2) var(--space-3); min-height: var(--touch-min);
  }
  /* the text column must be allowed to shrink and wrap, or a long localized
     name pushes the card past the viewport on a 360px phone */
  .achv-txt { min-width: 0; overflow-wrap: anywhere; }
  .achv b { display: block; font: 800 var(--text-xs) var(--font-sans); color: var(--ink); }
  .achv small { display: block; font: 700 var(--text-f11-5) var(--font-sans); color: var(--muted); }
  .achv-ic { display: inline-flex; flex: 0 0 auto; color: var(--muted); }
  .achv[data-state="earned"] { border-color: var(--primary); background: var(--tint-primary-04); }
  /* ---------- MARZI-017: onboarding ---------- */
  .ob-head { display: flex; justify-content: center; margin-top: var(--space-4); }
  .ob-steps { display: flex; justify-content: center; gap: 6px; margin: var(--space-4) 0 var(--space-3); }
  .ob-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--track); }
  .ob-dot.past { background: var(--tint-primary-35); }
  .ob-dot.on { width: 22px; border-radius: 999px; background: var(--primary); }
  .ob-q {
    margin: 0 0 var(--space-4); text-align: center;
    font: 800 var(--text-lg) var(--font-sans); color: var(--ink);
  }
  .ob-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
  .ob-grid.one { grid-template-columns: minmax(0, 1fr); }
  .ob-opt {
    position: relative; display: flex; align-items: center; gap: var(--space-2);
    min-height: var(--touch-lg); padding: var(--space-3); cursor: pointer; text-align: start;
    background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); font: 700 var(--text-sm) var(--font-sans); color: var(--ink);
  }
  /* selected state carries a tick as well as the colour change */
  .ob-opt.on { border-color: var(--primary); background: var(--tint-primary-04); }
  .ob-tick { margin-inline-start: auto; display: inline-flex; color: var(--primary); }
  .ob-flag { font-size: var(--text-lg); flex: 0 0 auto; }
  .ob-ic { display: inline-flex; flex: 0 0 auto; color: var(--primary); }
  .ob-nm { min-width: 0; overflow-wrap: anywhere; }
  .ob-min { font: 800 var(--text-lg) var(--font-sans); color: var(--marzi-dark); }
  .ob-nav { display: flex; gap: var(--space-2); align-items: center; margin-top: var(--space-5); }
  .ob-nav .toggle { flex: 0 0 auto; min-height: var(--touch-min); }
  .ob-nav .cta { flex: 1 1 auto; margin-top: 0; }
  .ob-nav .cta[disabled] { opacity: .5; cursor: not-allowed; }
  /* ---------- MARZI-017: profile stat cards + activity summary ---------- */
  .stat-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
  .stat-card {
    display: flex; align-items: center; gap: var(--space-2); min-height: var(--touch-lg);
    padding: var(--space-2) var(--space-3); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm);
  }
  .stat-ic { display: inline-flex; flex: 0 0 auto; color: var(--primary); }
  .stat-body { min-width: 0; }
  .stat-val { display: block; font: 800 var(--text-lg) var(--font-sans); color: var(--ink); line-height: 1.15; }
  .stat-lb { display: block; font: 700 var(--text-f11-5) var(--font-sans); color: var(--muted); overflow-wrap: anywhere; }
  .stat-dt { display: block; font: 600 var(--text-f10-5) var(--font-sans); color: var(--muted); }
  .stat-card[data-state="empty"] .stat-val { color: var(--muted); }
  .act-sum { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-3); box-shadow: var(--shadow-sm); }
  .act-sum-hd { font: 700 var(--text-f11-5) var(--font-sans); color: var(--muted); margin-bottom: var(--space-2); }
  .act-bars { display: flex; align-items: flex-end; gap: var(--space-2); height: 84px; }
  .act-bar { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
  .act-bar-fill { width: 100%; border-radius: 5px; background: var(--track); }
  .act-bar-fill[data-on="true"] { background: var(--xp-fill); }
  .act-bar small { font: 700 var(--text-f10-5) var(--font-sans); color: var(--muted); }
  /* ---------- MARZI-018: no-internet state ---------- */
  .off-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-2); margin: var(--space-4) 0; }
  .off-marzi { width: clamp(120px, 26dvh, 200px); height: clamp(120px, 26dvh, 200px); }
  .off-marzi svg, .off-marzi img { width: 100%; height: 100%; display: block; }
  .off-title { font: 800 var(--text-xl) var(--font-sans); color: var(--red); }
  /* ---------- MARZI-017: install recommendation (browser only) ---------- */
  .install-rec {
    display: flex; align-items: center; gap: var(--space-2);
    margin: var(--space-3) 0 0; padding: var(--space-3);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  .install-rec .install-tx { flex: 1 1 auto; min-width: 0; font: 700 var(--text-sm) var(--font-sans); color: var(--ink); overflow-wrap: anywhere; }
  .install-rec button { flex: 0 0 auto; min-width: var(--touch-min); min-height: var(--touch-min); border: none; background: none; cursor: pointer; color: var(--muted); }
  /* ---------- MARZI-016: learning journey ----------
     A path over the existing scenarios. `future` is dimmer, never disabled -
     every node opens exactly as it does in the picker. */
  /* MARZI-017: Talk hub extras */
  .act.reco {
    display: flex; align-items: center; gap: var(--space-3); width: 100%;
    min-height: var(--touch-lg); padding: var(--space-3); text-align: start;
  }
  .reco-face { flex: 0 0 auto; font-size: var(--text-f27); }
  .reco-tx { min-width: 0; }
  .reco-tx b { display: block; font: 800 var(--text-sm) var(--font-sans); overflow-wrap: anywhere; }
  .reco-tx small { display: block; font: 600 var(--text-f11-5) var(--font-sans); color: var(--muted); overflow-wrap: anywhere; }
  .item.static { cursor: default; }
  .jr-path { list-style: none; margin: 0; padding: 0 0 0 var(--space-5); position: relative; }
  .jr-path.compact { padding-inline-start: var(--space-5); }
  .jr-path::before {
    content: ""; position: absolute; inset-block: 12px; inset-inline-start: 9px;
    width: 2px; background: var(--track); border-radius: 2px;
  }
  .jr-group {
    font-family: 'JetBrains Mono', monospace; font-size: var(--text-f10-5);
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px;
  }
  .jr-li { position: relative; margin-bottom: var(--space-2); }
  .jr-node {
    display: flex; align-items: center; gap: var(--space-2); width: 100%;
    min-height: var(--touch-min); padding: var(--space-2) var(--space-3);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); cursor: pointer; text-align: start;
  }
  .jr-node::before {
    content: ""; position: absolute; inset-inline-start: calc(-1 * var(--space-5) + 4px); top: 50%;
    width: 12px; height: 12px; margin-top: -6px; border-radius: 50%;
    background: var(--track); border: 2px solid var(--card);
  }
  .jr-face { flex: 0 0 auto; font-size: var(--text-lg); }
  .jr-nm { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; font: 700 var(--text-sm) var(--font-sans); color: var(--ink); }
  .jr-st { flex: 0 0 auto; display: inline-flex; color: var(--primary); }
  .jr-node[data-state="done"]::before { background: var(--primary); }
  .jr-node[data-state="here"] { border-color: var(--primary); box-shadow: 0 0 0 2px var(--tint-primary-35), var(--shadow-sm); }
  .jr-node[data-state="here"]::before { background: var(--primary); }
  .jr-node[data-state="future"] { opacity: .62; }
  .jr-list .item[data-state="here"] { border-color: var(--primary); }
  .jr-list .item[data-state="future"] { opacity: .62; }
  .achv[data-state="earned"] .achv-ic { color: var(--primary); }
  /* screen-reader-only live region (review §12) */
  .sr-only {
    position: absolute !important; width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important; overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
  }
  .store-item { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); }
  .store-item:first-child { border-top: none; }
  .store-item .nm { flex: 1; min-width: 0; }
  .store-item .nm b { font: 800 var(--text-md) var(--font-sans); display: block; }
  .store-item .nm small { font-size: var(--text-f12); color: var(--muted); }
  .buy-btn {
    border: none; border-radius: 999px; background: var(--primary); color: var(--white);
    font: 800 var(--text-f12-5) var(--font-sans); padding: 9px 13px; min-height: var(--touch-min); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); white-space: nowrap;
  }
  .buy-btn:hover { background: var(--primary-hover); }
  .buy-btn[disabled] { opacity: .5; cursor: not-allowed; }
  .premium-card {
    border: 1.5px solid rgba(242,187,40,.6); border-radius: var(--radius);
    background: linear-gradient(135deg, var(--paper-4), var(--coin-soft));
    box-shadow: var(--shadow-sm); padding: 12px 14px; margin-top: 10px;
  }
  .allow-row { display: flex; gap: 8px; margin-top: 10px; }
  .allow-chip {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px; font: 700 var(--text-f12-5) var(--font-sans); color: var(--ink);
    box-shadow: var(--shadow-sm); cursor: pointer; min-height: 40px;
  }
  .allow-chip .ic { color: var(--primary); }
  .allow-chip span .ic { color: inherit; } /* wrapped icons keep their own color (coin) */
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 12px; }
  .drawer-title { font-family: var(--font-sans); font-weight: 700; font-size: var(--text-f18); }
  .drawer-close { background: none; border: none; font-size: var(--text-f22); cursor: pointer; color: var(--muted); padding: 4px 8px; }
  .hidden { display: none; }
  button:focus-visible, input:focus-visible { outline: 2.5px solid var(--yellow-deep); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<!-- MARZI-062: staging preview identity. Checked in so the deployed staging
     build is self-identifying without any telemetry; it carries no learner
     state and takes part in no prompt, transcript, reward or persistence. -->
<div class="staging-bar" id="stagingBar" data-marzi-build="MARZI-062-PREVIEW-1"
     role="note" aria-label="MARZI staging preview, package MARZI-062, build MARZI-062-PREVIEW-1">MARZI STAGING PREVIEW · MARZI-062 · BUILD MARZI-062-PREVIEW-1</div>
<header class="topbar" id="topbar">
  <div class="topbar-in">
    <span id="brandLockup"></span>
    <span class="grow"></span>
    <button class="chip-res" id="tbCoins" aria-label="Coins"></button>
    <span class="chip-res streak" id="tbStreak"></span>
    <button class="chip-res mins" id="tbMins" aria-label="Call minutes left today"></button>
    <button class="chip-res gear" id="tbGear" aria-label="Settings"></button>
  </div>
</header>
<div id="netBanner" class="net-banner hidden" role="status"></div>
<main>
  <!-- LEARN home: Marzi companion hero, mission, quick cards (spec §23, review §4) -->
  <section id="learn">
    <div class="learn-hero">
      <div class="hero-greet" id="learnHi"></div>
      <button class="learn-marzi" id="marziBtn" type="button">
        <span id="marzi"></span>
      </button>
      <div class="hero-stage" id="heroStage"></div>
      <div class="hero-stage-name" id="heroStageName"></div>
      <!-- W3: the equipped outfit is visible ON the hero — a labelled chip
           beside Marzi until per-outfit character art lands by filename -->
      <div class="hero-fit hidden" id="heroFit"></div>
      <div class="xpbar"><div id="xpFill" style="width:0%"></div><span class="xp-val" id="heroXp"></span></div>
      <div class="hero-meta"><span id="heroLv"></span><span class="hero-sub" id="heroSub"></span></div>
    </div>
    <button class="big cta" id="practiceBtn" style="margin-top:10px"></button>
    <div class="mission-card">
      <div class="hero-top">
        <div class="hero-streak" id="heroStreak"></div>
        <div class="week" id="heroWeek"></div>
      </div>
      <div class="label" id="missionLbl" style="margin:8px 0 0"></div>
      <div class="routine" id="routine"></div>
    </div>
    <div id="installRec" class="install-rec hidden" role="note"></div>
    <!-- World-class IA: Learn owns the structured path. The full journey map
         lives here now (it is curriculum, not call setup), so the compact
         preview that duplicated it is gone. -->
    <section class="jr" aria-labelledby="jrTitleLbl">
      <div class="label prof-achv-lbl" style="margin-top:18px"><span id="jrTitleLbl"><span id="lblJourney"></span></span><span class="prof-achv-n" id="jrCount"></span></div>
      <div class="seg" id="jrSeg" role="group"></div>
      <div id="jrBody" style="margin-top:10px"></div>
      <button class="big cta hidden" id="jrNext" style="margin-top:12px"></button>
    </section>
  </section>

  <!-- PRACTICE: the first-class learning hub. Preparation and improvement
       modules that used to be buried beneath the call button. -->
  <section id="practice" class="hidden">
    <div class="plate"><span id="practiceTitle"></span></div>
    <p class="note" id="practiceIntro" style="margin-top:6px"></p>
    <div class="label" id="lblTrainCall"></div>
    <div class="grid2">
      <button class="act" id="prepBtn"></button>
      <button class="act" id="dialogBtn"></button>
      <button class="act" id="vocabBtn"></button>
    </div>
    <div class="label" id="lblTrainReview"></div>
    <div class="grid2">
      <button class="act" id="drillBtn"></button>
      <button class="act" id="mistakesBtn"></button>
      <button class="act" id="wordsBtn"></button>
    </div>
  </section>

  <!-- TALK: scenario setup (the original Telefontrainer core) -->
  <section id="setup" class="hidden">
    <div class="label" id="lblTrainNow"></div>
    <div id="recoBody"></div>
    <div class="label lbl-row"><span id="lblPick"></span><button class="see-all" id="seeAllBtn" type="button"></button></div>
    <div class="scn-rail" id="scnRail" role="group"></div>
    <div id="charCard"></div>

    <div class="label" id="lblLevel"></div>
    <div class="seg" id="levels"></div>
    <p class="note one" id="levelNote"></p>
    <div class="label" id="lblSpeed"></div>
    <div class="seg" id="speeds"></div>
    <p class="note one" id="speedNote"></p>

    <button class="big cta" id="callBtn" style="margin-top:14px"></button>
    <div class="allow-row">
      <span class="allow-chip" id="allowMin"></span>
      <button class="allow-chip" id="allowBuy"></button>
    </div>
    <div class="label" id="lblTrainRecent"></div>
    <div id="recentBody"></div>
  </section>

  <!-- FIRST-RUN ONBOARDING: language pair picker -->
  <!-- MARZI-017: four-step first run. One step visible at a time; Android Back
       walks back through the steps before leaving. -->
  <section id="onboard" class="hidden" aria-labelledby="obQuestion">
    <div class="ob-head" id="obBrand"></div>
    <div class="ob-steps" id="obSteps" role="progressbar" aria-valuemin="1" aria-valuemax="4"></div>
    <h2 class="ob-q" id="obQuestion"></h2>
    <p class="note hidden" id="obWishNote"></p>
    <div id="obBody"></div>
    <div class="ob-nav">
      <button class="toggle hidden" id="obBackBtn" type="button"></button>
      <button class="big cta" id="obNextBtn" type="button"></button>
    </div>
    <p class="note hidden" id="obError" role="alert"></p>
  </section>

  <!-- CALL -->
  <!-- CALL: the person you are speaking to sits in a bounded stage card rather
       than filling the screen as a backdrop. Everything else — the dialogue,
       Marzi, the controls — gets its own band underneath, so nothing is ever
       laid over the character's face. The dialogue is fully inline: speech
       bubbles with word tap, replay and inline translation, no sheet. -->
  <section id="call" class="hidden">
    <div class="callscreen" id="vcAv">
      <header class="call-top">
        <button class="call-x" id="callMinBtn" type="button"></button>
        <div class="call-id" id="callId"></div>
        <div class="call-conn" id="callConn"></div>
      </header>

      <div class="call-mid">
        <div class="call-stage-card" id="callStage">
          <img id="vcImg" class="call-portrait" alt="" />
          <span class="call-emoji" id="vcEmoji" aria-hidden="true">🎧</span>
          <div class="call-scrim" aria-hidden="true"></div>
        </div>
        <div class="call-status-chip" id="callStatus" data-state="ready" role="status"></div>
        <div id="alert" class="call-alert hidden" role="alert"></div>
        <!-- ART DIRECTION: the WHOLE dialogue lives inline in the call — true
             speech bubbles with word tap, per-line replay and inline
             translation. There is no transcript sheet any more (binding
             Product Owner decision 1); the Text pill hides this band for
             listening-only practice. -->
        <div class="call-lines" id="callLines">
          <div class="call-dialogue" id="log"></div>
          <p class="note hidden" id="tapHint"></p>
        </div>
        <div class="call-marzi vc-marzi" id="vcMarzi"></div>
        <button class="call-bubble marzi hidden" id="vcBubble" type="button"></button>
      </div>
      <div id="callStatusLive" class="sr-only" aria-live="polite"></div>

      <div class="call-stack">
        <!-- WORLD-CLASS W2: progressive in-call help. Stage 1: quick SOS
             phrases. Stage 2: a suggested phrase. Stage 3: the full answer
             with slow playback and typing. Escalation is always the
             learner's choice — never the full answer first. -->
        <div class="call-help hidden" id="helpPanel" role="group" aria-labelledby="helpTitle">
          <div class="help-head"><b id="helpTitle"></b><button class="mini" id="helpCloseBtn" type="button"></button></div>
          <p class="note one" id="helpTip"></p>
          <div class="row sos" id="sosRow">
            <button class="ghost" data-sos="Wie bitte?">Wie bitte?</button>
            <button class="ghost" data-sos="Langsamer, bitte.">Langsamer, bitte</button>
            <button class="ghost" data-sos="Können Sie das noch einmal sagen?">Noch einmal, bitte</button>
          </div>
          <div id="hintBox" class="hint hidden"><div class="label" id="hintLabel">VORSCHLAG</div><div id="hintText"></div></div>
          <div class="row hidden" id="helpFullRow">
            <button class="ghost" id="helpPlayBtn" type="button"></button>
            <button class="ghost" id="typeBtn" type="button"></button>
          </div>
          <div class="row hidden" id="typeRow">
            <input type="text" id="draft" placeholder="Guten Tag, ich möchte…" />
            <button class="ghost" id="sendBtn" style="flex:0 0 auto"></button>
          </div>
          <button class="ghost help-more" id="helpMoreBtn" type="button"></button>
        </div>
        <!-- Exactly the approved control set: Need help, Text, Slow, Replay.
             Auto is gone from the UI (decision 4) — hands-free stays the
             internal default. The transcript pill is gone with the sheet. -->
        <div class="call-tools">
          <button class="call-pill" id="helpBtn" type="button"></button>
          <button class="call-pill" id="textBtn" type="button"></button>
          <button class="call-pill" id="repeatBtn" type="button"></button>
          <button class="call-pill" id="playBtn" type="button"></button>
        </div>
        <div class="call-controls" id="callControls"></div>
        <div class="call-meta"><span id="timer">00:00</span><span id="vcLeft" class="call-meta-ctx"></span></div>
      </div>
    </div>

  </section>

  <!-- DONE -->
  <!-- WORLD-CLASS W2: the summary leads with what the learner came for — did
       I reach the goal, what should I fix — and only then the rewards. The
       retry loop (practise these mistakes / call again) closes the screen. -->
  <section id="done" class="hidden">
    <div class="plate"><span id="doneTitle"></span></div>
    <div id="rewardLive" class="sr-only" aria-live="polite"></div>
    <div class="list" style="margin-top:14px;padding:16px 14px" id="evalBox"></div>
    <div class="list" style="margin-top:14px;padding:16px 14px" id="review"></div>
    <div id="rewardBox"></div>
    <button class="ghost hidden" id="replayBtn" style="width:100%;margin-top:16px"></button>
    <button class="ghost hidden" id="retryMistakesBtn" style="width:100%;margin-top:14px"></button>
    <button class="big" id="againBtn"></button>
    <div class="ui-modal-back hidden" id="evoCelBack"></div>
    <div id="evoCelBox" class="hidden"></div>
  </section>

  <!-- MISTAKES HISTORY -->
  <section id="mistakes" class="hidden">
    <div class="plate"><span id="mistakesTitle"></span></div>
    <div class="list" style="margin-top:22px;padding:16px 14px" id="mistakesList"></div>
    <div class="row">
      <button class="ghost" id="ankiBtn"></button>
      <button class="ghost" id="clearBtn"></button>
    </div>
    <button class="big" id="backBtn"></button>
  </section>

  <!-- PROGRESS: speaking test + improvement chart -->
  <section id="test" class="hidden">
    <div class="plate"><span id="testTitle"></span></div>
    <div id="testBody" style="margin-top:16px"></div>
    <button class="big" id="testBack"></button>
  </section>

  <!-- PRE-CALL PREPARATION (level zero warm-up) -->
  <section id="prep" class="hidden">
    <div class="plate"><span id="prepTitle"></span></div>
    <p class="note" id="prepSub" style="margin-top:8px"></p>
    <div id="prepBody" style="margin-top:14px"></div>
    <button class="big" id="prepBack"></button>
  </section>

  <!-- SCENARIO VOCABULARY -->
  <section id="vocab" class="hidden">
    <div class="plate"><span id="vocabTitle"></span></div>
    <p class="note" id="vocabSub" style="margin-top:8px"></p>
    <div id="vocabBody" style="margin-top:14px"></div>
    <button class="big" id="vocabBack"></button>
  </section>

  <!-- MISTAKE DRILL -->
  <section id="drill" class="hidden">
    <div class="plate"><span id="drillTitle"></span></div>
    <div class="list" style="margin-top:22px;padding:18px 16px" id="drillCard"></div>
    <button class="big" id="drillBack"></button>
  </section>

  <!-- GUIDED DIALOGUE (scripted exchanges with a character) -->
  <section id="dialog" class="hidden">
    <div class="plate"><span id="dlgTitle"></span></div>
    <p class="note" id="dlgSub" style="margin-top:8px"></p>
    <div id="dlgStage" class="hidden" style="margin-top:14px">
      <div class="vc-stage dlg-stage" id="dlgAv">
        <span class="vc-emoji" id="dlgEmoji">🎧</span>
        <img id="dlgImg" alt="" />

      </div>
    </div>
    <div id="dlgBody" style="margin-top:14px"></div>
    <button class="big" id="dlgBack"></button>
  </section>

  <!-- STORE: coins, minute packages, outfit catalog (data-only, ADR-10) -->
  <section id="store" class="hidden">
    <div class="plate"><span id="storeTitle"></span></div>
    <div id="storeLive" class="sr-only" aria-live="polite"></div>
    <div id="storeBody" style="margin-top:10px"></div>
    <div class="ui-modal-back hidden" id="storeBack"></div>
    <div id="storeModal" class="hidden"></div>
  </section>

  <!-- PROFILE: identity + activity summary + grouped settings + premium + legal (review §6) -->
  <section id="profile" class="hidden">
    <div class="plate"><span id="profTitle"></span></div>
    <div id="profBody" style="margin-top:10px"></div>
    <div class="label" style="margin-top:18px" id="profSettingsLbl"></div>
    <div class="setting-list">
      <button class="setting-row" id="progressBtn" type="button"></button>
      <button class="setting-row" id="obGoalBtn" type="button"></button>
      <button class="setting-row" id="pairBtn" type="button"></button>
      <button class="setting-row" id="exportBtn" type="button"></button>
      <button class="setting-row" id="importBtn" type="button"></button>
      <button class="setting-row" id="shareBtn" type="button"></button>
    </div>
    <div class="label" style="margin-top:18px" id="profA11yLbl"></div>
    <div class="setting-list">
      <button class="setting-row" id="soundBtn" type="button"></button>

    </div>
    <input type="file" id="importFile" accept="application/json" class="hidden" />
    <div class="premium-card" id="premiumCard"></div>
    <p class="note legal" style="text-align:center;margin-top:12px">
      <a href="/impressum.html" style="color:inherit">Impressum</a> ·
      <a href="/datenschutz.html" style="color:inherit">Datenschutz</a>
    </p>
  </section>
</main>

<script>
/* ---------- brand migration (review §9): Telefontrainer → Marzi ----------
   One-time copy of legacy localStorage keys to the new marzi.*.v1 names.
   Legacy keys stay in place untouched (rollback safety); all reads/writes
   below go through the new names. Must run before anything reads settings. */
const STORAGE_MIGRATIONS = [

const DEFAULT_STATS = Object.freeze({

  legacyUnknownItemIds: [], scenariosDone: {},

  const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});

/* Wardrobe normalization + migration (MARZI-007).
   - legacy ids that map onto a canonical item are migrated;
   - ids we do not recognise are NEVER deleted - they move to

   - at most ONE outfit can be equipped, and only if it is owned. */
function normalizeWardrobe(owned, equipped, unknownSoFar) {
  const known = new Set(OUTFITS.map((o) => o.id));
  const out = [], unknown = (unknownSoFar || []).slice();
  for (const raw of owned) {
    const id = known.has(raw) ? raw : (LEGACY_OUTFIT_IDS[raw] || null);
    if (id && known.has(id)) { if (!out.includes(id)) out.push(id); }
    else if (!unknown.includes(raw)) unknown.push(raw);
  }
  const eq = [];
  for (const raw of equipped) {
    const id = known.has(raw) ? raw : (LEGACY_OUTFIT_IDS[raw] || null);
    if (id && out.includes(id) && eq.length === 0) eq.push(id);
    else if (!id && !unknown.includes(raw)) unknown.push(raw);

/* ---------- idempotent reward ledger (review §1.3, ADR-8) ----------
   Every completion claims its reward exactly once under a unique id, so
   double taps, re-rendered listeners or browser restoration can never pay
   twice. Coin values follow spec §14: call 20, vocabulary set 10,
   preparation batch 10, corrected drill item 2, guided dialogue 10. */
const REWARD_LEDGER_KEY = "marzi.reward-ledger.v1";
function newRewardId() {
  try { if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}
function loadRewardLedger() {
  try {
    const parsed = JSON.parse(localStorage.getItem(REWARD_LEDGER_KEY));
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (e) { return {}; }
}
/* Result of the most recent claim, so the reward summary can tell a
   duplicate apart from a persistence failure without changing signatures. */
let LAST_CLAIM = { claimed: false, saved: true, duplicate: false };
function claimReward(rewardId, reward) {
  const ledger = loadRewardLedger();
  if (ledger[rewardId]) {
    LAST_CLAIM = { claimed: false, saved: true, duplicate: true };
    return { claimed: false, reward: ledger[rewardId], saved: true };
  }
  // snapshot of the last committed state, restored if either write fails
  const prevStats = localStorage.getItem(STAT_KEY);
  const prevLedger = localStorage.getItem(REWARD_LEDGER_KEY);
  const st = loadStats();
  const xp = Math.max(0, Number(reward && reward.xp) || 0);
  const coins = Math.max(0, Number(reward && reward.coins) || 0);
  st.xp += xp;
  st.coins += coins;
  ledger[rewardId] = { xp, coins, claimedAt: new Date().toISOString() };
  const ids = Object.keys(ledger); // bounded: drop the oldest entries
  if (ids.length > 600) {
    ids.sort((a, b) => String(ledger[a].claimedAt).localeCompare(String(ledger[b].claimedAt)));
    for (const drop of ids.slice(0, ids.length - 500)) delete ledger[drop];
  }
  try {
    localStorage.setItem(STAT_KEY, JSON.stringify(st));
    localStorage.setItem(REWARD_LEDGER_KEY, JSON.stringify(ledger));
  } catch (e) {
    // roll back to the snapshot: stats and ledger move together or not at all
    try { prevStats === null ? localStorage.removeItem(STAT_KEY) : localStorage.setItem(STAT_KEY, prevStats); } catch (e2) {}
    try { prevLedger === null ? localStorage.removeItem(REWARD_LEDGER_KEY) : localStorage.setItem(REWARD_LEDGER_KEY, prevLedger); } catch (e2) {}
    LAST_CLAIM = { claimed: false, saved: false, duplicate: false };
    return { claimed: false, reward: null, saved: false };
  }
  if (coins) SFX.coin();
  updateTopbar();
  LAST_CLAIM = { claimed: true, saved: true, duplicate: false };
  return { claimed: true, reward: ledger[rewardId], saved: true };
}

/* ---------- MARZI-007: one canonical wallet/wardrobe transaction ----------
   Every coin deduction and ownership change goes through commitStats: it
   writes ONE object in ONE localStorage call. If that write fails, nothing
   changed - the caller's copy is discarded and storage still holds the old
   balance and the old wardrobe. */
function commitStats(next) {

  catch (e) { return false; }
}
/* ---------- MARZI-017: first-run onboarding state ----------

function normalizeOnboarding(value) {

/* Existing installations must never be sent back through onboarding, and must

function hasMeaningfulUserData() {

  if (Object.keys(st.days || {}).length || Object.keys(st.secDays || {}).length) return true;
  if (Object.keys(st.scenariosDone || {}).length) return true;
  if ((st.ownedItemIds || []).length || (st.equippedItemIds || []).length) return true;
  const nonEmpty = (k) => { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v.length > 0 : !!v; } catch (e) { return false; } };

/* Atomic commit: language, target, goal and daily target land together or not

function commitOnboarding({ lang, targetLang, goal, dailyMin }) {
  const prevSettings = (() => { try { return localStorage.getItem(SET_KEY); } catch (e) { return null; } })();
  const prevOnboard = (() => { try { return localStorage.getItem(ONBOARD_KEY); } catch (e) { return null; } })();
  const prevLang = S.lang, prevTarget = S.targetLang;
  const restore = () => {
    S.lang = prevLang; S.targetLang = prevTarget;
    try {
      if (prevSettings === null) localStorage.removeItem(SET_KEY); else localStorage.setItem(SET_KEY, prevSettings);
      if (prevOnboard === null) localStorage.removeItem(ONBOARD_KEY); else localStorage.setItem(ONBOARD_KEY, prevOnboard);

/* state of one catalog item for the current learner */
function outfitState(id, st) {

  const item = outfitById(id);
  if (!item) return "unknown";
  if ((s.equippedItemIds || [])[0] === id) return "equipped";
  if ((s.ownedItemIds || []).includes(id)) return "owned";
  if (marziStageForXp(s.xp) < item.stage) return "locked";
  return (s.coins || 0) < item.price ? "insufficient" : "available";
}
/* Idempotent purchase: an already-owned item never deducts again, and the
   deduction + ownership land together or not at all. Buying does NOT equip. */
function purchaseOutfit(id) {
  const item = outfitById(id);
  if (!item) return { ok: false, code: "unknown" };
  const st = loadStats();
  if ((st.ownedItemIds || []).includes(id)) return { ok: false, code: "already" };
  if (marziStageForXp(st.xp) < item.stage) return { ok: false, code: "locked" };
  if ((st.coins || 0) < item.price) return { ok: false, code: "insufficient" };
  const next = { ...st, coins: st.coins - item.price, ownedItemIds: (st.ownedItemIds || []).concat(id) };
  if (!commitStats(next)) return { ok: false, code: "save-failed" };
  return { ok: true, code: "bought" };

  if (!(st.ownedItemIds || []).includes(id)) return { ok: false, code: "not-owned" };
  const next = { ...st, equippedItemIds: [id] };
  return commitStats(next) ? { ok: true, code: "equipped" } : { ok: false, code: "save-failed" };

/* ---------- MARZI-008: canonical reward summary ----------
   Built AFTER persistence, from committed state only. Frozen: animation code
   reads it and never mutates XP, coins or the ledger.

   High-performance rule (transparent, no hidden scoring):
     learner turns >= 4
     AND the call was not abandoned (no AI request was still pending at hang-up)
     AND corrections <= floor(learner turns / 4)   (at most one per four turns)
*/
const CELEBRATED_KEY = "marzi.celebrated-stage.v1";
function isHighPerformance({ turns, mistakes, abandoned }) {
  return turns >= 4 && !abandoned && mistakes <= Math.floor(turns / 4);
}
function buildRewardSummary({ xpBefore, coinsBefore, gained, claim, turns, mistakes, seconds, abandoned }) {
  const after = loadStats();
  const saved = claim.saved !== false;
  // never report a gain that is not in committed storage
  const xpAfter = saved ? (after.xp || 0) : xpBefore;
  const coinsAfter = saved ? (after.coins || 0) : coinsBefore;
  const xp = saved ? Math.max(0, xpAfter - xpBefore) : 0;
  const coins = saved ? Math.max(0, coinsAfter - coinsBefore) : 0;
  const stageBefore = marziStageForXp(xpBefore);
  const stageAfter = marziStageForXp(xpAfter);
  const base = MARZI_STAGE_XP[stageAfter - 1] || 0;
  const nextAt = MARZI_STAGE_XP[stageAfter] || null;
  const state = !saved ? "save-failed"
    : claim.duplicate ? "duplicate"
    : gained <= 0 ? "none"
    : stageAfter > stageBefore ? "evolved"
    : isHighPerformance({ turns, mistakes, abandoned }) ? "high"
    : "normal";

    xp, coins, seconds, turns, mistakes,
    xpBefore, xpAfter, coinsAfter,
    stageBefore, stageAfter, evolved: stageAfter > stageBefore,
    stagePct: nextAt ? Math.min(100, Math.round(100 * (xpAfter - base) / (nextAt - base))) : 100,
    stagePctBefore: nextAt ? Math.min(100, Math.round(100 * (Math.max(base, xpBefore) - base) / (nextAt - base))) : 100,
    state, saved,
  });

function recordCall() {
  if (!S.turns.some((x) => x.me)) return 0;
  const gained = 15 + Math.min(20, S.turns.filter((x) => x.me).length * 2);
  const claim = claimReward("call:" + (S.callId || (S.callId = newRewardId())), { xp: gained, coins: 20 });
  if (!claim.claimed) return 0; // this call was already counted
  const st = loadStats();
  const d = new Date().toISOString().slice(0, 10);
  st.days[d] = (st.days[d] || 0) + 1;
  st.calls += 1;
  st.seconds += S.seconds;
  st.secDays[d] = (st.secDays[d] || 0) + S.seconds;
  // MARZI-016: which scenario this call completed, so the learning map can
  // show real progress. Ad-hoc topics have no node and are not recorded.
  const sid = (S.active || S.scenario || {}).id;
  if (sid && sid !== "custom" && sid !== "random") {
    st.scenariosDone = st.scenariosDone || {};
    st.scenariosDone[sid] = (st.scenariosDone[sid] || 0) + 1;
  }
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
  return gained;
}

/* MARZI-017: rank titles are INTERFACE copy, not learning content, so they

   as the canonical id order; rankNames() supplies the localized display. */
function rankNames() {
  const L = t();
  return (L && L.rankTitles && L.rankTitles.length === RANKS.length) ? L.rankTitles : T.en.rankTitles;
}
function rankFor(xp) {
  let i = RANKS.length - 1;
  while (i > 0 && xp < RANKS[i][0]) i--;
  return { n: i + 1, title: rankNames()[i] || RANKS[i][1], base: RANKS[i][0], next: RANKS[i + 1] ? RANKS[i + 1][0] : null };
}
function currentStreak(st) {
  let n = 0;
  const day = new Date();
  const key = () => day.toISOString().slice(0, 10);
  if (!st.days[key()]) day.setDate(day.getDate() - 1); // streak may end yesterday
  while (st.days[key()]) { n++; day.setDate(day.getDate() - 1); }
  return n;
}
