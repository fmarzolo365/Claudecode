async function loadDeck() {
  const sc = S.scenario;
  const topic = sc.id === "custom" ? (S.customTopic || "").trim() : "";
  const key = VOCAB_NS + "v2." + sc.id + "." + (topic ? encodeURIComponent(topic).slice(0, 60) + "." : "") + S.lang + "." + S.level;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(c) && c.length) return c;
  } catch (e) {}
  const help = HELP_LANG[S.lang] || "English";
  const what = topic ? `a phone call about: ${topic}`
    : sc.kind === "face" ? `${sc.de} - an in-person conversation at ${sc.place}`
    : `${sc.de} - calling ${sc.place}`;
  const res = await chatFetch({
    system: `You create a vocabulary deck for a ${TARGET.name} learner at CEFR level ${S.level} preparing for ${what}.
Return ONLY a JSON array, no markdown, of exactly 12 items:
[{"de":"...","tr":"...","ex":"...","xt":"..."}]
"de": the ${TARGET.name} word with its article (for nouns) or a short key phrase. "tr": its translation in ${help}. "ex": one short natural ${TARGET.name} sentence using it, something the learner could actually say or hear in this phone call, at level ${S.level}. "xt": the translation of "ex" in ${help}.
Pick what is genuinely most useful for THIS call: core nouns, key verbs, and 2-3 fixed telephone phrases.`,
    messages: [{ role: "user", content: "Create the deck." }],
  });
  const data = await res.json();
  const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const clean = raw.replace(/```json|```/g, "").trim();
  const deck = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]") + 1))
    .filter((x) => x && x.de && x.tr).slice(0, 12)
    .map((x) => ({ de: x.de, tr: x.tr, ex: x.ex || "", exTr: x.xt || "" }));
  if (!deck.length) throw new Error("empty deck");
  try { localStorage.setItem(key, JSON.stringify(deck)); } catch (e) {}
  return deck;
}

function startVocab() {
  const L = t();
  V = { stage: "pick" };
  $("vocabTitle").textContent = L.vocab.toUpperCase();
  $("vocabSub").textContent = "";
  $("vocabBack").textContent = L.back;
  show("vocab");
  renderVocab();
}

async function openDeck(kind) {
  V = { stage: "deck", deck: null, i: 0, flipped: false, heard: null, verdict: null, listening: false, failed: false };
  if (kind === "call") {
    const sc = S.scenario;
    V.clipChar = sc.id !== "custom" && sc.id !== "random" ? sc.id : "";
    V.clipVoice = sc.voice || "";
    $("vocabSub").textContent = sc.id === "custom" ? S.customTopic : `${sc.de} · ${sc.who}`;
    renderVocab();
    try { V.deck = await loadDeck(); } catch (e) { V.failed = true; }
    renderVocab();
  } else if (kind === "mywords") {
    const L = t();
    V.mywords = true;
    V.clipChar = TARGET.deckChar; V.clipVoice = TARGET.deckVoice;
    $("vocabSub").innerHTML = `${IC.star(ICON.sm)} ${esc(L.myWords)}`;
    V.deck = loadWords().slice().reverse().slice(0, 20).map((w) => ({ de: w.de, tr: w.tr, ex: w.ex || "", exTr: w.exTr || "" }));
    renderVocab();
  } else {
    const d = BASIC_DECKS.find((x) => x.id === kind);
    V.clipChar = TARGET.deckChar; V.clipVoice = TARGET.deckVoice;
    $("vocabSub").innerHTML = `${deckIc(d.icon, 13)} ${esc(d.de)} · ${esc(d[S.lang] || d.en)}`;
    V.deck = d.items.map((it) => ({ de: it.de, tr: it[S.lang] || it.en, ex: it.ex || "", exTr: (it.xl || {})[S.lang] || (it.xl || {}).en || "" }));
    renderVocab();
  }
}

function renderVocab() {
  const L = t();
  if (V.stage === "pick") {
    const scOK = !(S.scenario.id === "random" || (S.scenario.id === "custom" && !(S.customTopic || "").trim()));
    const nw = loadWords().length;
    $("vocabBody").innerHTML = `<div class="list">
      <button class="item" data-vd="call" ${scOK ? "" : "disabled"}>
        <b>${IC.phone(ICON.chip)} ${esc(L.forCall)}</b><small>${esc(S.scenario.id === "custom" ? (S.customTopic || "—") : S.scenario.de)}</small></button>
      <button class="item" data-vd="mywords" ${nw ? "" : "disabled"}>
        <b>${IC.star(ICON.chip)} ${esc(L.myWords)}</b><small>${nw ? `${nw} ${esc(L.saved)}` : esc(L.tapWordHint)}</small></button>
      ${BASIC_DECKS.map((d) => `<button class="item" data-vd="${d.id}">
        <b>${deckIc(d.icon, 14)} ${esc(d.de)}</b><small>${esc(d[S.lang] || d.en)}</small></button>`).join("")}
    </div>`;
    $("vocabBody").querySelectorAll("[data-vd]").forEach((b) =>
      b.onclick = () => { if (!b.disabled) openDeck(b.dataset.vd); });
    return;
  }
  if (V.failed) {
    $("vocabBody").innerHTML =
      `<p class="note">${esc(L.vocabFail)}</p>
       <button class="ghost" style="width:100%;margin-top:12px" data-va="reload">${esc(L.retry)}</button>`;
  } else if (!V.deck) {
    $("vocabBody").innerHTML = `<p class="note">${esc(L.vocabLoading)}</p>`;
  } else if (V.i >= V.deck.length) {
    if (!V.deck.length) { $("vocabBody").innerHTML = `<p class="note">—</p>`; return; }
    // transition guard (same convention as P.awarded in prep): pay for
    // completing the set exactly once, never per render (HARDENING-02)
    if (!V.rewarded) {
      V.rewarded = true;
      addXp(12);
      addCoins(10);
      markDay("vocabDays");
      confettiBurst();
    }
    $("vocabBody").innerHTML =
      `<div class="said" style="font-family:var(--font-sans);font-size:19px;font-weight:700">🎉 ${esc(L.vocabDone)}</div>
       <div style="margin-top:10px"><span class="chip">+12 XP</span> <span class="chip coin">+10 ${IC.coin(ICON.xxs)}</span></div>`;
  } else {
    const c = V.deck[V.i];
    $("vocabBody").innerHTML =
      `<div class="drill-prog">${V.i + 1} / ${V.deck.length}</div>
       <div class="v-card" data-va="flip" style="margin-top:10px">
         <div class="v-de">${esc(c.de)}</div>
         ${V.flipped
           ? `<div class="v-tr">${esc(c.tr)}</div>${c.ex ? `<div class="v-ex">„${esc(c.ex)}“${c.exTr ? `<br><span style="font-style:italic;opacity:.85">${esc(c.exTr)}</span>` : ""}</div>` : ""}${V.mywords ? `<div><button class="mini" data-va="del">✕</button></div>` : ""}`
           : `<div class="v-flip">${esc(L.vocabFlip)}</div>`}
       </div>
       ${V.flipped && clipsOK && V.clipChar ? `<div class="row"><button class="ghost" data-va="watch">▶ ${esc(L.watchIt)}</button></div>` : ""}
       ${clipHTML(V, L)}
       ${verdictHTML(V, L)}
       <div class="row">
         <button class="ghost" data-va="hear">&#9834; ${esc(L.sayIt)}</button>
         <button class="ghost ${V.listening ? "" : ""}" data-va="say" ${V.listening ? "disabled" : ""}>${V.listening ? esc(L.listening) : esc(L.sayWord)}</button>
       </div>
       <div class="row">
         <button class="ghost" data-va="next">${esc(L.next)} &rsaquo;</button>
       </div>`;
  }
  $("vocabBody").querySelectorAll("[data-va]").forEach((b) => b.onclick = (ev) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    const c = V.deck && V.deck[V.i];
    switch (b.dataset.va) {
      case "reload": openDeck("call"); break;
      case "del":
        if (c) {
          saveWordsList(loadWords().filter((w) => w.de !== c.de));
          V.deck.splice(V.i, 1);
          V.flipped = false; V.heard = null; V.verdict = null; V.err = null; V.clip = null; V.clipUrl = null;
          renderVocab();
        }
        break;
      case "flip":
        V.flipped = !V.flipped; renderVocab();
        if (V.flipped && c && c.ex) speak(c.ex, true);
        break;
      case "hear":
        // listen -> repeat: after the word plays, the mic opens by itself
        if (c) speak(c.de, true, () => { if (V && V.deck && V.deck[V.i] === c && !V.listening) vocabListen(c.de); });
        break;
      case "say": if (c) vocabListen(c.de); break;
      case "watch": if (c) loadClip(V, c.de, V.clipChar, V.clipVoice, renderVocab); break;
      case "next":
        stopAudio(); speechSynthesis.cancel();
        V.i++; V.flipped = false; V.heard = null; V.verdict = null; V.err = null; V.clip = null; V.clipUrl = null;
        renderVocab();
        break;
    }
  });
}

/* shared pronunciation listener: writes listening/verdict/heard/err into st.
   `target` may be a string or an array of accepted variants (first = model
   answer, spoken back on a miss - used by the guided dialogues). */
async function listenFor(target, st, rerender) {
  const L = t();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { st.err = L.noMic; rerender(); return; }
  if (st.listening) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((tr) => tr.stop());
  } catch (e) { st.err = L.micBlocked; rerender(); return; }
  speechSynthesis.cancel(); stopAudio();
  st.err = null; st.verdict = null; st.heard = null;
  const r = new SR();
  r.lang = TARGET.locale; r.interimResults = false; r.maxAlternatives = 5;
  r.onresult = (e) => {
    const alts = Array.from(e.results[0]).map((a) => a.transcript);
    const targets = Array.isArray(target) ? target : [target];
    const ok = alts.some((a) => targets.some((tg) => saidWord(a, tg)));
    st.heard = alts[0]; st.verdict = ok ? "ok" : "bad";
    rerender();
    if (!ok) speak(targets[0], true);
  };
  r.onerror = (e) => {
    st.listening = false;
    const c = e && e.error;
    if (c === "no-speech") st.err = L.noSpeech;
    else if (c === "not-allowed" || c === "service-not-allowed") st.err = L.micBlocked;
    else if (c === "audio-capture") st.err = L.noDevice;
    else if (c !== "aborted") st.err = L.micErr + ": " + c;
    rerender();
  };
  r.onend = () => { st.listening = false; rerender(); };
  try { r.start(); st.listening = true; rerender(); }
  catch (e) { st.listening = false; st.err = L.micErr; rerender(); }
}
function vocabListen(target) { return listenFor(target, V, renderVocab); }

/* pre-rendered talking clips (lip-synced videos) for fixed sentences.
   Off until the server has a Replicate token; a 501 hides the feature. */
let clipsOK = true;
const clipCache = new Map(); // hash key -> object URL
async function loadClip(st, text, char, voice, rerender) {
  const key = char + "|" + voice + "|" + text;
  st.clip = text;
  st.clipUrl = clipCache.get(key) || null;
  rerender();
  if (st.clipUrl) return;
  try {
    const res = await fetch(`/api/clip?char=${encodeURIComponent(char)}&voice=${encodeURIComponent(voice)}&text=${encodeURIComponent(text)}&lang=${TARGET.code}&pin=${encodeURIComponent(localStorage.getItem(PIN_KEY) || "")}`);
    if (res.status === 501) { clipsOK = false; st.clip = null; rerender(); return; }
    if (!res.ok) throw new Error("clip " + res.status);
    const url = URL.createObjectURL(await res.blob());
    clipCache.set(key, url);
    if (st.clip === text) { st.clipUrl = url; rerender(); }
  } catch (e) {
    if (st.clip === text) { st.clip = null; rerender(); }
  }
}
function clipHTML(st, L) {
  if (!st.clip) return "";
  return st.clipUrl
    ? `<video src="${st.clipUrl}" autoplay playsinline controls style="width:100%;border-radius:12px;margin-top:10px"></video>`
    : `<p class="note" style="margin-top:10px">${esc(L.clipLoading)}</p>`;
}
/* small verdict box shared by vocab cards and the mistake drill */
function verdictHTML(st, L) {
  return (st.err ? `<div class="v-verdict bad">${esc(st.err)}</div>` : "") +
    (st.verdict ? `<div class="v-verdict ${st.verdict}">${st.verdict === "ok" ? "✓ " + esc(L.wellSaid) : "↻ " + esc(L.almost)}${st.heard ? `<br><span style="font-weight:400">${esc(L.heardYou)} „${esc(st.heard)}“</span>` : ""}</div>` : "");
}

/* ---------- celebration ---------- */
function confettiBurst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("div");
  c.className = "confetti";
  const cols = ["#6f9d43", "#eab54e", "#2e7d5b", "#16130d", "#ff6f59"];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = 1.4 + Math.random() * 1.4 + "s";
    p.style.animationDelay = Math.random() * 0.4 + "s";
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 3400);
}

/* ---------- call ---------- */
function systemPrompt() {
  const L = LEVELS[S.level], help = HELP_LANG[S.lang] || "English", s = S.active || S.scenario;
  const face = s.kind === "face";
  const custom = s.id === "custom"
    ? `\nThe learner described the situation in their own words (possibly not in ${TARGET.name}): interpret it, decide what kind of business or office would be called, and play that role realistically.\n`
    : "";
  const recent = loadFixes().slice(-8);
  const weakSpots = recent.length
    ? `\nThe learner's recent recurring mistakes (from earlier calls):\n${recent.map((f) => `- said "${f.text}" -> better: ${f.fix}`).join("\n")}\nWhen natural, steer the conversation so the learner gets a chance to practise these patterns again. Never mention that you are doing this.\n`
    : "";
  return `You are running a ${TARGET.name}-language ${face ? "face-to-face" : "telephone"} role-play for a learner at CEFR level ${S.level}.
Your role: ${s.role} at ${s.place}. The learner ${face ? "approaches you in person" : "is calling"} to ${S.currentGoal}.
${custom}${weakSpots}
Rules:
- The "reply" field is ONLY ${TARGET.name}. Stay in character for the whole ${face ? "conversation" : "call"}. Never mention that this is practice.
- Level guidance: ${L.guide}
- At most ${L.words} words per reply, at most one question per turn.
${face
  ? `- Open the conversation as this person naturally would in this place (a simple ${TARGET.faceEx}), never with telephone formulas.
- This is spoken in person: casual register where natural, react to the situation around you (queue, weather, noise), small human touches.`
  : `- Answer the phone first with a realistic ${TARGET.name} greeting for this kind of business.`}
- Drive the ${face ? "conversation" : "call"} to a real conclusion: ${face ? "resolve the learner's concern concretely, then part naturally" : "offer concrete dates and times, confirm the learner's name, then say goodbye"}.
- You are a warm real person who notices the learner is not a native speaker. When they make a clear mistake, OCCASIONALLY (at most every third turn, not always) react the way a kind ${TARGET.name} would: show you understood, then naturally model the correct phrase inside your ${TARGET.name} reply - e.g. ${TARGET.fixEx}. Keep it brief and encouraging, never lecture, then continue the conversation.
- Sometimes, when natural (especially at B1 and above, or when the learner's request needs it), hand the learner over to a SECOND person - the doctor, a supervisor, a colleague, a spouse. That person introduces themselves and continues the conversation in their own manner. From that reply on set "speaker":"second"; if the first person takes the call back, set "speaker":"main" again.
- If the learner speaks ${TARGET.slipLangs}, still answer in ${TARGET.name}, and make "suggestion" easier.

Return ONLY a JSON object. No markdown, no code fences. Keys:
"reply": your ${TARGET.name} line.
"translation": that same line in ${help}.
"feedback": at most 25 words in ${help} about the learner's last ${TARGET.name} line - what was wrong and the natural way to say it. Empty string if the learner has not spoken yet or the line was fine.
"corrected": the learner's last line rewritten as one natural, correct ${TARGET.name} sentence. Empty string if the learner has not spoken yet or the line was fine.
"suggestion": one natural ${TARGET.name} sentence the learner could say next, at level ${S.level}.
"speaker": "main" while the usual contact person is speaking, "second" while a different person (doctor, supervisor, colleague, spouse) has the conversation.
"done": true only after you have said goodbye.`;
}

/* Pre-MARZI-004 prompt history (rollback path). No longer called: the
   session transcript in ConversationSession is the single canonical source
   for prompt history now. Delete once the migration has soaked. */
function history() {
  return [{ role:"user", content:TARGET.seed }]
    .concat(S.turns.map((x) => ({ role: x.me ? "user" : "assistant", content: x.text })));
}

/* ================= MARZI-003 · Conversation Engine (architecture) =================
   Provider-agnostic core for role-play conversations. Nothing in this block
   touches the network, audio APIs, rewards or UI - concrete AI/speech/voice
   providers are injected through the registry below. The live call flow
   (ask/listen/speak above) migrates onto this engine in a later task. */

/* ---- interface contracts (duck-typed, enforced at registration) ----
   ai:     async complete({system, messages}) -> {text}         (chat model)
   speech: start({lang, onResult, onError}) / stop()            (STT)
   voice:  async speak({text, voice, speed}) / stopAll()        (TTS) */
const ENGINE_CONTRACTS = {
  ai: ["complete"],
  speech: ["start", "stop"],
  voice: ["speak", "stopAll"],
};
function validateProvider(kind, impl) {
  const contract = ENGINE_CONTRACTS[kind];
  if (!contract) throw new Error("unknown provider kind: " + kind);
  const missing = contract.filter((m) => typeof (impl && impl[m]) !== "function");
  if (missing.length) throw new Error(`provider "${kind}" is missing: ${missing.join(", ")}`);
  return impl;
}

/* ---- dependency injection ---- */
function createProviderRegistry() {
  const reg = {};
  return {
    register(kind, impl) { reg[kind] = validateProvider(kind, impl); return impl; },
    get(kind) {
      if (!reg[kind]) throw new Error("no provider registered for: " + kind);
      return reg[kind];
    },
    has(kind) { return Boolean(reg[kind]); },
  };
}

/* ---- registries: read-only views over the canonical scenario data ---- */
const ScenarioRegistry = {
  ids() { return SCENARIOS.filter((s) => s.goals).map((s) => s.id); },
  get(id) {
    const s = SCENARIOS.find((x) => x.id === id && x.goals);
    if (!s) throw new Error("unknown scenario: " + id);
    return s;
  },
};
const CharacterRegistry = {
  get(scenarioId, speaker) {
    const s = ScenarioRegistry.get(scenarioId);
    const second = speaker === 2;
    return Object.freeze({
      id: scenarioId + (second ? "2" : ""), scenarioId, speaker: second ? 2 : 1,
      name: s.who, avatar: s.avatar, kind: s.kind || "phone",
      voice: second ? (s.voice2 || s.voice) : s.voice,
    });
  },
};

/* ---- transcript model ---- */
function createTranscript() {
  const turns = [];
  return {
    add(turn) {
      if (!turn || typeof turn.text !== "string" || !turn.text.trim()) throw new Error("turn needs text");
      if (turn.speaker !== "learner" && turn.speaker !== "character") throw new Error("turn speaker must be learner|character");
      const prev = turns[turns.length - 1];
      if (prev && prev.speaker === turn.speaker && prev.text === turn.text) throw new Error("duplicate turn rejected");
      turns.push(Object.freeze({ ...turn, index: turns.length }));
      return turns.length;
    },
    list() { return turns.slice(); },
    last() { return turns[turns.length - 1] || null; },
    /* provider message shape; optional seed opens the exchange */
    forPrompt(seed) {
      const msgs = turns.map((t) => ({ role: t.speaker === "learner" ? "user" : "assistant", content: t.text }));
      return seed ? [{ role: "user", content: seed }].concat(msgs) : msgs;
    },
  };
}

/* ---- prompt builder ----
   Delegates to systemPrompt(), which is byte-frozen for German by the test
   suite - the engine must not fork the prompt text. S is snapshotted and
   restored, so building a prompt never leaks state into the live app. */
const PromptBuilder = {
  rolePlay(cfg) {
    const prev = { scenario: S.scenario, level: S.level, lang: S.lang,
                   active: S.active, currentGoal: S.currentGoal };
    try {
      S.active = cfg.scenario; S.scenario = cfg.scenario;
      if (cfg.level) S.level = cfg.level;
      if (cfg.lang) S.lang = cfg.lang;
      S.currentGoal = cfg.goal;
      return systemPrompt();
    } finally { Object.assign(S, prev); }
  },
};

/* ---- conversation session + lifecycle: created -> active -> ended ----
   MARZI-004: the transcript here is the SINGLE canonical source for prompt
   history; S.turns stays a render-only mirror. ask() carries the safety
   guards: no concurrent AI requests, replies landing after end() are
   dropped, and provider errors never corrupt the session state.
   Accepts an ad-hoc scenario object (custom-topic calls) or a registry id. */
function createConversationSession({ scenario, scenarioId, level, lang, goal, providers }) {
  const sc = scenario || ScenarioRegistry.get(scenarioId);
  const transcript = createTranscript();
  let state = "created", askInFlight = false;
  const session = {
    get state() { return state; },
    get busy() { return askInFlight; },
    scenario: sc, transcript,
    character(n) {
      if (scenarioId) return CharacterRegistry.get(scenarioId, n || 1);
      const second = n === 2;
      return Object.freeze({
        id: (sc.id || "custom") + (second ? "2" : ""), scenarioId: sc.id, speaker: second ? 2 : 1,
        name: sc.who, avatar: sc.avatar, kind: sc.kind || "phone",
        voice: second ? (sc.voice2 || sc.voice) : sc.voice,
      });
    },
    start() {
      if (state !== "created") throw new Error("cannot start from state: " + state);
      state = "active";
      return session;
    },
    /* character's next line for the transcript as it stands (a call opens
       with the character, so this must not require a learner turn) */
    async ask() {
      if (state !== "active") throw new Error("session is " + state + ", not active");
      if (askInFlight) throw new Error("duplicate ai request rejected");
      askInFlight = true;
      try {
        const reply = await providers.get("ai").complete({
          system: PromptBuilder.rolePlay({ scenario: sc, level, lang, goal }),
          messages: transcript.forPrompt(TARGET.seed),
        });
        if (state !== "active") return null; // ended while waiting: drop the late reply
        if (!reply || typeof reply.text !== "string") throw new Error("ai provider must return {text}");
        transcript.add({ speaker: "character", text: reply.text, meta: reply.raw });
        return reply;
      } catch (e) {
        // a call that ended while its request was in flight must be inert:
        // late FAILURES are dropped exactly like late replies, so a stale
        // rejection can never surface an error into a newer call's UI
        if (state !== "active") return null;
        throw e;
      } finally { askInFlight = false; }
    },
    async send(learnerText) {
      if (state !== "active") throw new Error("session is " + state + ", not active");
      if (askInFlight) throw new Error("duplicate ai request rejected");
      transcript.add({ speaker: "learner", text: learnerText });
      return session.ask();
    },
    end() { state = "ended"; return session; },
  };
  return session;
}

/* ---- MARZI-004: the live app behind the engine contracts ----
   Adapters wrap the EXISTING flows unchanged - chatFetch (429/PIN handling
   included), the Web Speech API recognizer, and the neural-with-device-
   fallback speak() chain - so the engine stays provider-agnostic while the
   user experience is byte-identical. */
const liveAIProvider = {
  async complete({ system, messages }) {
    const res = await chatFetch({ system, messages });
    const data = await res.json();
    const rawTxt = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = rawTxt.replace(/```json|```/g, "").trim();
    const p = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    return { text: p.reply, raw: p }; // the strict-JSON payload rides along for the UI
  },
};
const liveSpeechProvider = {
  start({ lang, onResult, onError, onEnd }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR();
    r.lang = lang; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = (e) => onResult(e.results[0][0].transcript);
    r.onerror = (e) => onError && onError(e && e.error);
    r.onend = () => onEnd && onEnd();
    r.start();
    return r;
  },
  stop() { try { S.rec && S.rec.stop(); } catch (e) {} },
};
const liveVoiceProvider = {
  async speak({ text, slow, speaker, done }) { speak(text, slow, done, speaker); },
  stopAll() { speechSynthesis.cancel(); stopAudio(); },
};
const ENGINE = createProviderRegistry();
ENGINE.register("ai", liveAIProvider);
ENGINE.register("speech", liveSpeechProvider);
ENGINE.register("voice", liveVoiceProvider);
/* =============== end MARZI-003 Conversation Engine =============== */

/* UI layer over ConversationSession.ask(): the session owns prompt history
   and the safety guards; this function owns rendering, feedback attachment,
   speaker switching and voice output - unchanged user experience. */
async function ask() {
  const ses = S.session;
  if (!ses || ses.state !== "active" || ses.busy) return;
  S.busy = true; renderCall();
  try {
    const reply = await ses.ask();
    // session identity guard: once a different call owns S.session, this
    // continuation belongs to a dead call and must not touch shared UI state
    if (S.session !== ses) return;
    if (!reply) { S.busy = false; return; } // call ended while waiting: drop silently
    const p = reply.raw || {};
    if (p.feedback) {
      for (let i = S.turns.length - 1; i >= 0; i--) {
        if (S.turns[i].me) {
          S.turns[i].fix = p.feedback;
          if (p.corrected) S.turns[i].corrected = p.corrected;
          saveFix(S.turns[i].text, p.feedback, p.corrected || "");
          break;
        }
      }
    }
    S.speaker = p.speaker === "second" ? 2 : 1;
    // the character has said goodbye: the stage may show the success frame
    // once the goodbye finishes (art-only - the state machine is untouched)
    if (p.done) S.callDone = true;
    S.turns.push({ me:false, text:reply.text, tr:p.translation, sp:S.speaker });
    S.hint = p.suggestion || null;
    // optional: a provider MAY translate the suggestion; the help Translate
    // control only appears when it does. A new suggestion collapses it.
    S.hintTr = typeof p.suggestionTranslation === "string" ? p.suggestionTranslation : null;
    S.helpTrOpen = false;
    S.busy = false; renderCall();
    ENGINE.get("voice").speak({ text: reply.text, slow: false, speaker: S.speaker,
      // the goodbye->listen chain is only valid while THIS call is still live
      done: () => { if (S.session === ses && ses.state === "active" && S.handsFree && !p.done) listen(); } });
  } catch (e) {
    if (S.session !== ses) return; // stale failure: a newer call owns the UI
    S.busy = false;
    alertMsg(isOffline() ? t().offlineMsg : t().err);
    renderCall();
  }
}

function send(text) {
  const clean = (text || "").trim();
  if (!clean || S.busy) return;
  const ses = S.session;
  if (!ses || ses.state !== "active" || ses.busy) return;
  // canonical transcript first: a double submit is rejected there and never
  // reaches the render model or the provider
  try { ses.transcript.add({ speaker: "learner", text: clean }); }
  catch (e) { return; }
  // a new turn clears a stale error (e.g. an earlier mic warning) so the
  // status chip shows what is happening NOW, not what failed before
  if (S.callError) alertMsg(null);
  S.turns.push({ me:true, text:clean });
  S.hint = null; S.hintTr = null; S.helpTrOpen = false;
  $("draft").value = "";
  ask();
}

function alertMsg(msg) {
  const el = $("alert");
  S.callError = !!msg;
  if (!msg) { el.classList.add("hidden"); try { renderCallStatus(); } catch (e) {} return; }
  el.textContent = msg; el.classList.remove("hidden");
  try { renderCallStatus(); } catch (e) {}
}

async function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alertMsg(t().noMic); $("typeRow").classList.remove("hidden"); return; }
  if (S.listening) { try { S.rec.stop(); } catch (e) {} return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    stream.getTracks().forEach((tr) => tr.stop());
  } catch (e) { alertMsg(t().micBlocked); $("typeRow").classList.remove("hidden"); return; }

  ENGINE.get("voice").stopAll();
  alertMsg(null);
  // recognition events carry the identity of the call that started them: a
  // late result/end/error from a hung-up call must never inject text into or
  // clear the listening state of a newer call (session identity, MARZI-004)
  const ses = S.session;
  const stale = () => S.session !== ses || !ses || ses.state !== "active";
  try {
    S.rec = ENGINE.get("speech").start({
      lang: TARGET.locale,
      onResult: (text) => { if (!stale()) send(text); },
      onError: (c) => {
        if (stale()) return;
        S.listening = false;
        if (c === "not-allowed" || c === "service-not-allowed") alertMsg(t().micBlocked);
        else if (c === "no-speech") alertMsg(t().noSpeech);
        else if (c === "audio-capture") alertMsg(t().noDevice);
        else if (c !== "aborted") alertMsg(t().micErr + ": " + c);
        renderCall();
      },
      onEnd: () => { if (stale()) return; S.listening = false; renderCall(); },
    });
    S.listening = true; renderCall();
  } catch (e) { S.listening = false; alertMsg(t().micErr + ": " + e.message); renderCall(); }
}

/* tap a word in the other person's line -> look it up and save it */
async function saveWordTap(ti, raw) {
  const turn = S.turns[ti];
  if (!turn || (turn.wsave && turn.wsave.pending)) return;
  const clean = normDe(raw);
  if (!clean) return;
  const existing = loadWords().find((w) => normDe(w.raw) === clean || normDe(w.de).split(" ").includes(clean));
  if (existing) { turn.wsave = { de: existing.de, tr: existing.tr }; renderCall(); return; }
  turn.wsave = { pending: true };
  renderCall();
  try {
    const help = HELP_LANG[S.lang] || "English";
    const res = await chatFetch({
      system: `Return ONLY a JSON object, no markdown: {"de":"...","tr":"..."}. "de": the dictionary form of the tapped ${TARGET.name} word (nouns capitalized with their article, verbs in the infinitive). "tr": a short translation in ${help} that fits this context.`,
      messages: [{ role: "user", content: `Tapped word: "${raw}"\nSentence: "${turn.text}"` }],
    });
    const data = await res.json();
    const rawTxt = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const cleanTxt = rawTxt.replace(/```json|```/g, "").trim();
    const p = JSON.parse(cleanTxt.slice(cleanTxt.indexOf("{"), cleanTxt.lastIndexOf("}") + 1));
    if (!p.de || !p.tr) throw new Error("bad lookup");
    const words = loadWords();
    words.push({ de: p.de, tr: p.tr, raw, ex: turn.text, exTr: turn.tr || "", lang: S.lang, date: new Date().toISOString().slice(0, 10) });
    saveWordsList(words);
    turn.wsave = { de: p.de, tr: p.tr };
  } catch (e) {
    turn.wsave = null;
  }
  renderCall();
}

function tappable(text, ti) {
  return String(text).split(/(\s+)/).map((tok) => {
    const clean = tok.replace(/[^A-Za-zÄÖÜäöüß-]/g, "");
    return clean.length > 1
      ? `<span class="w" data-w="${esc(clean)}" data-ti="${ti}">${esc(tok)}</span>`
      : esc(tok);
  }).join("");
}

function mmss() {
  const m = String(Math.floor(S.seconds / 60)).padStart(2, "0");
  const s = String(S.seconds % 60).padStart(2, "0");
  return m + ":" + s;
}
function timerText() {
  const A = S.active || S.scenario;
  const L = t();
  // one language per footer: the connection word follows the UI language,
  // like the "min left" part next to it (PO: no mixed-language footer)
  return (A.kind === "face" ? L.inTalk : L.connected) + " · " + mmss();
}

/* Mic button state (review §7): visual + announced. busy wins over listening. */
function micStatusFor(state) {
  return state.busy ? "processing" : state.listening ? "listening" : "ready";
}
/* MARZI-005 call state: one source for the status chip, the mic button and
   the live region. Every state is icon + text + colour, never colour alone. */
function callStateFor(state) {
  if (state.session && state.session.state === "ended") return "disconnected";
  if (state.callError) return "error";
  if (state.speaking) return "speaking";
  if (state.busy) return "processing";
  if (state.listening) return "listening";
  return "ready";
}
function callStateLabel(st) {
  const L = t();
  return { ready: L.speak, listening: L.listening, processing: L.stProcessing,
           speaking: L.stSpeaking, disconnected: L.stEnded, error: L.stError }[st] || L.speak;
}
function callStateIcon(st) {
  return { ready: IC.mic(ICON.sm), listening: IC.wave(ICON.sm), processing: IC.clock(ICON.sm),
           speaking: IC.speaker(ICON.sm), disconnected: IC.phone(ICON.sm), error: IC.warn(ICON.sm) }[st] || IC.mic(ICON.sm);
}
/* light update: status chip + live region + mic button, no full re-render.
   Disconnected and error stay visible until the state itself resolves. */
function renderCallStatus() {
  const st = callStateFor(S);
  const label = callStateLabel(st);
  const chip = $("callStatus");
  chip.dataset.state = st;
  chip.innerHTML = callStateIcon(st) + `<span>${esc(label)}</span>`;
  chip.setAttribute("role", "status");
  // the stage chip is informational only — with no active status it hides,
  // so it can never read as a second speaking CTA
  chip.classList.toggle("hidden", st === "ready");
  $("callStatusLive").textContent = label;
  const mic = $("micBtn");
  if (mic) {
    mic.dataset.status = st === "error" ? "failed" : micStatusFor(S);
    mic.disabled = S.busy;
  }
  const scr = $("vcAv");
  if (scr && scr.classList) scr.classList.toggle("speaking", st === "speaking");
  // the stage follows every state change too - setSpeaking and the mic
  // toggles come through here, not through the full renderCall
  try { renderCallStageArt(); } catch (e) {}
  // Marzi's presentation state follows the same single source
  const comp = $("vcMarzi");
  if (comp && comp.dataset && comp.dataset.stage) {
    const mood = marziStateForCall(st);
    if (comp.dataset.state !== mood) renderCallCompanion();
  }
}
/* remaining call time from the existing plan math (read-only) */
function callSecondsLeft() {
  return Math.max(0, planLimitToday() - planUsedToday() - (S.seconds || 0));
}
/* ---------- DR. WAGNER STATE PACK V1: production call art (asset-manifest.json) ----------
   Registered ahead of the generated /api/avatar portraits, which stay the
   fallback chain (production -> generated portrait -> emoji). The five
   approved per-state files share one 1600x1800 transparent canvas, so every
   state renders through the same geometry (.call-stage.prod rules). The
   mapping mirrors asset-manifest.json stateMapping exactly. */
const CALL_ART = {
  arzt: {
    background: "/assets/call/backgrounds/clinic.webp",
    dir: "/assets/call/characters/arzt/",
    states: { ready: "idle", listening: "listening", processing: "thinking",
              speaking: "speaking", success: "success",
              error: "idle", disconnected: "idle" },
    ext: ".webp",
  },
  apotheke: {
    background: "/assets/call/backgrounds/pharmacy.webp",
    dir: "/assets/call/characters/apotheke/",
    states: { ready: "idle", listening: "listening", processing: "thinking",
              speaking: "speaking", success: "success",
              error: "idle", disconnected: "idle" },
    ext: ".webp",
  },
  werkstatt: {
    background: "/assets/call/backgrounds/workshop.webp",
    dir: "/assets/call/characters/werkstatt/",
    states: { ready: "idle", listening: "listening", processing: "thinking",
              speaking: "speaking", success: "success",
              error: "idle", disconnected: "idle" },
    ext: ".webp",
  },
};
const CALL_ART_FAILED = new Set(); // a missing production file falls back once, silently
function callArt(id, st) {
  const a = CALL_ART[id];
  if (!a) return null;
  const src = a.dir + (a.states[st] || a.states.ready) + a.ext;
  return CALL_ART_FAILED.has(src) ? null : { background: a.background, src };
}
/* stage-art state: the shell state machine (callStateFor) untouched, plus one
   art-only overlay - after the character has said goodbye (the role-play
   "done" flag) a quiet stage shows the approved success frame. The status
   chip, mic button and live region never see this state. */
function callArtStateFor(state) {
  const st = callStateFor(state);
  return st === "ready" && state.callDone ? "success" : st;
}
/* decode-warm cache: each production asset is fetched and decoded once, and
   the Image is kept referenced so a later state swap never waits or blanks */
const CALL_ART_WARM = new Map();
function warmArtSrc(src) {
  if (!src || typeof Image === "undefined") return Promise.resolve();
  let w = CALL_ART_WARM.get(src);
  if (!w) {
    const img = new Image();
    img.src = src;
    const ready = img.decode ? img.decode() : Promise.resolve();
    w = { img, ready: ready.catch(() => { CALL_ART_WARM.delete(src); throw 0; }) };
    CALL_ART_WARM.set(src, w);
  }
  return w.ready;
}
/* asset-manifest.json transition contract: current approved frame stays
   visible -> next production state decodes -> 150ms crossfade. Reduced
   motion swaps instantly after decode. On a decode failure the stage simply
   stays on the current approved frame - never a blank or a fallback. */
const CALL_XFADE_MS = 150;
let CALL_XFADE_RAF = 0;
let CALL_XFADE_TIMER = 0;
function crossfadeStageArt(img, src) {
  warmArtSrc(src).then(() => {
    if (img.dataset.src !== src) return; // state moved on while decoding
    const ov = $("vcImgX");
    const stage = $("callStage");
    // preferred fade layer: the resident warm copy of the incoming state.
    // It has been mounted (at 0.1% opacity), decoded and rastered since call
    // start, so raising its opacity shows real pixels from the first frame -
    // no fetch, no decode, no raster on the transition's critical path.
    let lay = stage ? stage.querySelector(`.call-art-warm[src="${src}"]`) : null;
    if (lay && !(lay.complete && lay.naturalWidth > 0)) lay = null;
    const resetWarm = () => {
      if (stage) stage.querySelectorAll(".call-art-warm").forEach((w) => { w.style.opacity = ".001"; });
    };
    // commit: move the settled frame onto the base layer, and only drop the
    // (fully opaque) fade layer once the base has it too - no back-flash
    const apply = () => {
      if (img.dataset.src !== src) return;
      const done = () => {
        if (img.dataset.src !== src) return;
        resetWarm();
        if (ov) { ov.classList.remove("show"); ov.style.opacity = ""; ov.removeAttribute("src"); }
      };
      img.addEventListener("load", done, { once: true });
      img.src = src;
      // decode() resolves as soon as the warm frame is ready on the base
      // layer - the load event and the timeout stay as safety nets
      if (img.decode) img.decode().then(done, () => {});
      if (img.complete && img.naturalWidth > 0) done();
      setTimeout(done, CALL_XFADE_MS); // safety net only
    };
    if (prefersReducedMotion() || (!lay && !ov)) { apply(); return; }
    const fadeEl = lay || ov;
    if (!lay) {
      // fallback (residency not ready yet): the classic overlay crossfade
      ov.style.transform = img.style.transform || ""; // layer parity: identical geometry
      ov.src = src;
      ov.style.opacity = "0";
      ov.classList.add("show");
    } else if (stage) {
      // a superseded half-done fade must not linger above the new one
      stage.querySelectorAll(".call-art-warm").forEach((w) => { if (w !== lay) w.style.opacity = ".001"; });
    }
    // wall-clock fade: opacity tracks elapsed time, so the transition always
    // completes 150ms after the state request even when the compositor drops
    // frames - a CSS transition can start tens of ms late under load
    cancelAnimationFrame(CALL_XFADE_RAF);
    clearTimeout(CALL_XFADE_TIMER);
    const start = performance.now();
    let applied = false;
    const finish = () => {
      if (applied || img.dataset.src !== src) return;
      applied = true;
      fadeEl.style.opacity = "1";
      apply();
    };
    const tick = () => {
      if (applied || img.dataset.src !== src) return; // superseded by a newer state
      const p = Math.min(1, (performance.now() - start) / CALL_XFADE_MS);
      fadeEl.style.opacity = String(Math.max(0.001, p * (2 - p))); // ease-out
      if (p >= 1) { finish(); return; }
      CALL_XFADE_RAF = requestAnimationFrame(tick);
    };
    CALL_XFADE_RAF = requestAnimationFrame(tick);
    // wall-clock guarantee: rAF only paints the ramp - even when frames
    // stall under load the transition still commits on the 150ms clock
    CALL_XFADE_TIMER = setTimeout(finish, CALL_XFADE_MS + 10);
  }).catch(() => {}); // keep the current approved frame
}
/* light per-state art update (called from renderCallStatus): only swaps
   between two already-valid production frames, via the crossfade. The cold
   path - first reveal, fallback chain, veil - stays owned by renderCall. */
function renderCallStageArt() {
  const A = S.active || S.scenario;
  if (!A || !A.id) return;
  const prod = callArt(A.id, callArtStateFor(S));
  if (!prod) return;
  const img = $("vcImg"), stageEl = $("callStage");
  if (!img || !stageEl) return;
  const a = CALL_ART[A.id];
  const warmSwap = img.classList.contains("ok") && stageEl.classList.contains("art-ok") &&
    typeof img.dataset.src === "string" && img.dataset.src.indexOf(a.dir) === 0;
  if (!warmSwap || img.dataset.src === prod.src) return;
  img.dataset.src = prod.src;
  crossfadeStageArt(img, prod.src);
}
function renderCall() {
  const L = t();
  const A = S.active || S.scenario;
  const showText = S.showText === true; // Text pill: inline dialogue, OFF by default
  // identity: kicker + name + place, centred, never truncated (board 02)
  $("callId").innerHTML = UI.callIdentity({
    kicker: L.talkingWith, name: A.who, place: A[S.lang] || A.en || A.de || "",
  });
  $("vcEmoji").textContent = A.avatar || "🎧";
  const img = $("vcImg");
  const prod = callArt(A.id, callArtStateFor(S)); // production assets resolve first
  const stageEl = $("callStage");
  stageEl.classList.toggle("prod", !!prod);
  stageEl.style.backgroundImage = prod ? `url("${prod.background}")` : "";
  const apiSrc = A.id && A.id !== "custom" && A.id !== "random"
    ? `/api/avatar/${A.id}${S.speaker === 2 ? "2" : ""}?v=3&pin=${encodeURIComponent(localStorage.getItem(PIN_KEY) || "")}`
    : "";
  const src = prod ? prod.src : apiSrc;
  const warmSwap = prod && img.classList.contains("ok") && stageEl.classList.contains("art-ok") &&
    typeof img.dataset.src === "string" && img.dataset.src.indexOf(CALL_ART[A.id].dir) === 0;
  if (warmSwap && img.dataset.src !== src) {
    // between two valid production states: crossfade, never the pending veil
    img.dataset.src = src;
    crossfadeStageArt(img, src);
  } else if (img.dataset.src !== src) {
    img.dataset.src = src;
    img.dataset.retried = "";
    img.classList.remove("ok");
    stageEl.classList.remove("art-ok"); // pending, not failed: neutral treatment
    if (src) {
      img.onload = () => { img.classList.add("ok"); $("callStage").classList.add("art-ok"); };
      img.onerror = () => {
        img.classList.remove("ok");
        $("callStage").classList.remove("art-ok");
        // a REAL load failure of the production file: only now does the
        // generated-portrait fallback chain take over
        if (prod && img.dataset.src === prod.src) { CALL_ART_FAILED.add(prod.src); renderCall(); return; }
        // one delayed retry: generation can take ~10s on the very first view
        if (!img.dataset.retried) {
          img.dataset.retried = "1";
          setTimeout(() => { if (img.dataset.src === src) img.src = src + "&r=" + Date.now(); }, 8000);
        }
      };
      img.src = src;
      if (img.complete && img.naturalWidth > 0) { img.classList.add("ok"); stageEl.classList.add("art-ok"); }
    } else img.removeAttribute("src");

  $("timer").textContent = timerText();
  const left = callSecondsLeft();
  $("vcLeft").innerHTML = `· <span class="${left <= 300 ? "low" : ""}">${Math.ceil(left / 60)} min ${esc(L.timeLeft)}</span>`;
  $("callConn").innerHTML = IC.wave(ICON.sm) + `<span class="sr-only">${esc(callStateLabel(callStateFor(S)))}</span>`;
  // the top-left X is the single visible end-call control; the legacy

  $("callMinBtn").setAttribute("aria-label", endLbl);

  wireCallControls();

  $("speedBtn").setAttribute("aria-expanded", String(!!S.speedOpen));
  $("speedBtn").title = L.speed;

  $("playBtn").setAttribute("aria-label", L.playLast);

    ? `<img class="call-say-av" src="${esc(chipArt.src)}" alt="" />`

        (x.tr && x.open ? `<span class="call-say-tr">${esc(x.tr)}</span>` : "") +

  $("callTurns").classList.toggle("hidden", !showText);
  $("vcAv").classList.toggle("text-off", !showText);
  $("vcAv").classList.toggle("coach-flow", !showText && !step);
  $("callTurns").querySelectorAll("[data-ctr]").forEach((b) => b.onclick = () => {

    while (turnsEl.children.length > 1 && convo.scrollHeight > convo.clientHeight + 2) {
      turnsEl.removeChild(turnsEl.firstElementChild);

  convo.scrollTop = convo.scrollHeight;

  // coaching appears ONLY when the learner turns Help on: Marzi stays a quiet

  // progressive inline help: 1 = suggested phrase, 2 = + SOS phrases,
  // 3 = + typing. The suggestion carries its own inline Translate toggle.
  $("helpPanel").classList.toggle("hidden", step < 1);
  const trOpen = !!(S.helpTrOpen && S.hintTr);
  $("helpSug").innerHTML = `<b>${esc(L.hint)}</b><bdi dir="ltr">${esc(S.hint || "…")}</bdi>` +
    (trOpen ? `<span class="call-say-tr">${esc(S.hintTr)}</span>` : "");
  $("helpTrBtn").textContent = trOpen ? L.hideTr : L.show;

  $("helpTrBtn").classList.toggle("hidden", !S.hintTr);

  $("typeRow").classList.toggle("hidden", step < 3);

}
/* Speed popover: the existing SPEEDS profiles, anchored above the pills */
function renderSpeedPop() {
  const L = t();

    ["conversation", L.rCall, (st.callDays || {})[today], () => goToScenario(rec.scenarioId || (playable[0] && playable[0].id))],
    ["errors", L.rDrill, drilledToday, () => { showTab("practice"); if (drillable) startDrill(); else { renderMistakes(); show("mistakes"); } }],

function renderRewardSummary(sum) {
  const L = t();
  const name = marziNames()[sum.stageAfter - 1];
  const message = { none: L.rwZero, high: L.rwHigh,
                    evolved: marziDescs()[sum.stageAfter - 1] || L.rwNormal,
                    "save-failed": L.saveFailed, duplicate: L.rwNormal }[sum.state] || L.rwNormal;
  const mood = marziStateForReward(sum.state);
  $("rewardBox").innerHTML = UI.rewardSummary({
    state: sum.state, stage: sum.stageAfter, mood, message,
    xpLabel: sum.xp ? `+${sum.xp} XP` : "",
    coinLabel: sum.coins ? `+${sum.coins}` : "",
    stats: [
      { value: mmss(), label: L.rwTime },
      { value: String(sum.turns), label: L.rwTurns },
      { value: String(sum.mistakes), label: L.rwMistakes },
    ],
    stageLine: `${L.stageWord} ${sum.stageAfter} · ${name}`,

  if (prefersReducedMotion() || !sum.xp) {
    fill.style.width = sum.stagePct + "%";
    if (val && sum.xp) val.textContent = `+${sum.xp} XP`;
    if (sum.evolved) celebrateEvolution(sum);
    return;
  }
  requestAnimationFrame(() => { fill.style.width = sum.stagePct + "%"; });
  const t0 = (window.performance && performance.now) ? performance.now() : 0;
  const dur = 900;
  const step = (now) => {
    const p = Math.min(1, ((now || t0) - t0) / dur);
    if (val) val.textContent = `+${Math.round(sum.xp * p)} XP`;
    if (p < 1) requestAnimationFrame(step);
    else {
      if (val) val.textContent = `+${sum.xp} XP`;
      flyCoins(sum);
      if (sum.evolved) celebrateEvolution(sum);
    }
  };
  requestAnimationFrame(step);
}
/* the coin chip flies to the wallet chip that is actually on screen */
function flyCoins(sum) {
  if (!sum.coins || prefersReducedMotion()) return;
  const from = $("rwCoinGain");
  const visible = (el) => el && el.getBoundingClientRect && el.getBoundingClientRect().width > 0;
  const target = visible($("tbCoins")) ? $("tbCoins") : from; // never an off-screen target
  if (!visible(from) || !target || target === from) return;
  const a = from.getBoundingClientRect(), b = target.getBoundingClientRect();
  const ghost = from.cloneNode(true);
  ghost.classList.add("rw-fly");
  ghost.classList.remove("rw-gain");
  ghost.setAttribute("aria-hidden", "true");
  ghost.style.left = a.left + "px";
  ghost.style.top = a.top + "px";
  document.body.appendChild(ghost);
  requestAnimationFrame(() => {
    ghost.style.transform = `translate(${Math.round(b.left - a.left)}px, ${Math.round(b.top - a.top)}px) scale(.6)`;
    ghost.style.opacity = "0";
  });
  setTimeout(() => { try { ghost.remove(); } catch (e) {} }, 900);
}

const TEST_KEY = "telefontrainer.tests";

/* score history + dashed projection as a small self-contained SVG */
function chartSVG(tests) {
  const W = 340, H = 180, PL = 26, PR = 34, PT = 12, PB = 20;
  const pts = tests.slice(-8);
  const bands = [[20, "A1"], [40, "A2"], [55, "B1"], [70, "B2"], [85, "C1"]];
  const y = (s) => PT + (100 - s) / 100 * (H - PT - PB);
  // projection: average improvement of the recent gaps, 3 weekly points ahead
  let proj = [];
  if (pts.length >= 2) {
    const recent = pts.slice(-4);
    const delta = (recent[recent.length - 1].score - recent[0].score) / (recent.length - 1);
    let last = pts[pts.length - 1].score;
    for (let k = 1; k <= 3; k++) proj.push(Math.max(5, Math.min(98, last + delta * k)));
  }
  const total = pts.length + proj.length;
  const x = (i) => total > 1 ? PL + i / (total - 1) * (W - PL - PR) : W / 2;
  let svg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">`;
  for (const [s, name] of bands) {
    svg += `<line x1="${PL}" y1="${y(s)}" x2="${W - PR}" y2="${y(s)}" stroke="rgba(22,19,13,.1)" stroke-width="1"/>` +
           `<text x="${W - PR + 5}" y="${y(s) + 3.5}" font-size="9" fill="#6f6858" font-family="monospace">${name}</text>`;
  }
  if (pts.length > 1) {
    svg += `<polyline fill="none" stroke="#16130d" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p, i) => `${x(i)},${y(p.score)}`).join(" ")}"/>`;
  }
  if (proj.length) {
    const start = `${x(pts.length - 1)},${y(pts[pts.length - 1].score)}`;
    svg += `<polyline fill="none" stroke="#2e7d5b" stroke-width="2" stroke-dasharray="5 5" points="${start} ${proj.map((s, k) => `${x(pts.length + k)},${y(s)}`).join(" ")}"/>`;
    proj.forEach((s, k) => svg += `<circle cx="${x(pts.length + k)}" cy="${y(s)}" r="4" fill="#f7f3e6" stroke="#2e7d5b" stroke-width="2"/>`);
    svg += `<text x="${x(total - 1)}" y="${y(proj[proj.length - 1]) - 10}" font-size="10" font-weight="700" fill="#2e7d5b" text-anchor="end" font-family="sans-serif">${Math.round(proj[proj.length - 1])}</text>`;
  }
  pts.forEach((p, i) => {
    svg += `<circle cx="${x(i)}" cy="${y(p.score)}" r="4.5" fill="#6f9d43" stroke="#16130d" stroke-width="2"/>`;
    svg += `<text x="${x(i)}" y="${y(p.score) - 10}" font-size="10" font-weight="700" fill="#16130d" text-anchor="middle" font-family="sans-serif">${p.score}</text>`;
  });
  return svg + "</svg>";
}

/* extra rolling batches: reaction phrases the learner will actually need */
async function loadPrepBatch(batchNo) {
  const sc = S.scenario;
  const topic = sc.id === "custom" ? (S.customTopic || "").trim() : "";
  const key = VOCAB_NS + "prepx." + sc.id + "." + (topic ? encodeURIComponent(topic).slice(0, 60) + "." : "") + S.lang + "." + S.level + "." + batchNo;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(c) && c.length) return c;
  } catch (e) {}
  const help = HELP_LANG[S.lang] || "English";
  const what = topic ? `a conversation about: ${topic}`
    : sc.kind === "face" ? `${sc.de} - an in-person conversation at ${sc.place}`
    : `${sc.de} - calling ${sc.place}`;
  const res = await chatFetch({
    system: `You create extra preparation batch ${batchNo} for a ${TARGET.name} learner at CEFR level ${S.level} preparing for ${what}.
Return ONLY a JSON array, no markdown, of exactly 10 items: [{"de":"...","tr":"..."}]
"de": a short useful ${TARGET.name} word or a very short sentence (3-7 words). "tr": its translation in ${help}.
Focus on REACTING inside this conversation: saying a day or time does not work ("An dem Tag kann ich nicht."), proposing or asking for alternatives, confirming and declining politely, numbers, dates and times, thanking and closing. Order from easiest to hardest.
Do not repeat any of these already-learned items: ${P.learned.slice(-40).join(" | ")}`,
    messages: [{ role: "user", content: "Create the batch." }],
  });
  const data = await res.json();
  const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const clean = raw.replace(/```json|```/g, "").trim();
  const items = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]") + 1))
    .filter((x) => x && x.de && x.tr).slice(0, 10);
  if (!items.length) throw new Error("empty batch");
  try { localStorage.setItem(key, JSON.stringify(items)); } catch (e) {}
  return items;
}
async function morePrep() {
  if (P.loadingMore || P.batch >= PREP_MAX_BATCH) return;
  P.loadingMore = true;
  renderPrep();
  try {
    const items = await loadPrepBatch(P.batch + 1);
    P.batch++;
    P.steps = items.map((x) => ({ de: x.de, tr: x.tr }));
    P.learned = P.learned.concat(P.steps.map((x) => x.de));
    P.i = 0; P.revealed = false; P.verdict = null; P.heard = null; P.err = null;
  } catch (e) {}
  P.loadingMore = false;
  renderPrep();
}
function renderPrep() {
  const L = t();
  if (P.failed) {
    $("prepBody").innerHTML =
      `<p class="note">${esc(L.vocabFail)}</p>

  } else if (!P.steps) {
    $("prepBody").innerHTML = `<p class="note">${esc(L.vocabLoading)}</p>`;
  } else if (P.i >= P.steps.length) {
    if (!P.awarded[P.batch]) {
      P.awarded[P.batch] = true;
      PREPPED.add(S.scenario.id);
      addXp(10);
      addCoins(10);
      if (P.batch === 1) markDay("vocabDays");
      confettiBurst();
    }
    $("prepBody").innerHTML =
      `<div class="said" style="font-family:var(--font-sans);font-size:19px;font-weight:700">🎉 ${esc(L.ready)}</div>
       <div style="margin-top:10px"><span class="chip">+${P.batch * 10} XP</span> <span class="chip coin">+${P.batch * 10} ${IC.coin(ICON.xxs)}</span> <span class="drill-prog" style="margin-left:8px">${P.learned.length} ✓</span></div>
       ${P.loadingMore
         ? `<p class="note" style="margin-top:14px">${esc(L.vocabLoading)}</p>`
         : P.batch < PREP_MAX_BATCH
           ? `<p class="note" style="margin-top:14px">${esc(L.wantMore)}</p>
              <button class="ghost" data-pa="more" style="width:100%;margin-top:8px">${esc(L.moreWords)}</button>`
           : ""}
       <button class="big cta" data-pa="go" style="margin-top:20px">${S.scenario.kind === "face" ? IC.chat(ICON.md) + " " + esc(L.startNow) : IC.phone(ICON.md) + " " + esc(L.startNow)}</button>`;
  } else {
    const st = P.steps[P.i];
    $("prepBody").innerHTML =
      `<div class="drill-prog">${P.i + 1} / ${P.steps.length}</div>
       <div class="v-card" data-pa="card" style="margin-top:10px">
         ${P.revealed
           ? `<div class="v-de">${esc(st.de)}</div><div class="v-tr">${esc(st.tr)}</div><div class="v-flip">&#9834;</div>`
           : `<div class="v-flip">${esc(L.howSay)}</div><div class="v-de">${esc(st.tr)}</div><div class="v-flip">${esc(L.dontKnow)} &darr;</div>`}
       </div>
       ${P.revealed && clipsOK && S.scenario.id !== "custom" && S.scenario.id !== "random" ? `<div class="row"><button class="ghost" data-pa="watch">▶ ${esc(L.watchIt)}</button></div>` : ""}
       ${clipHTML(P, L)}
       ${verdictHTML(P, L)}
       <div class="row">
         ${P.revealed
           ? `<button class="ghost" data-pa="hear">&#9834; ${esc(L.sayIt)}</button>`
           : `<button class="ghost" data-pa="reveal">${esc(L.dontKnow)}</button>`}
         <button class="ghost" data-pa="say" ${P.listening ? "disabled" : ""}>${P.listening ? esc(L.listening) : esc(L.sayWord)}</button>
       </div>
       <div class="row"><button class="ghost" data-pa="next">${esc(L.next)} &rsaquo;</button></div>`;
  }
  $("prepBody").querySelectorAll("[data-pa]").forEach((b) => b.onclick = () => {
    const st = P.steps && P.steps[P.i];
    switch (b.dataset.pa) {
      case "reload": startPrep(); break;
      case "more": morePrep(); break;
      case "go": stopAudio(); speechSynthesis.cancel(); startConversation(); break;
      case "hear": if (st) speak(st.de, true); break;
      case "watch": if (st) loadClip(P, st.de, S.scenario.id, S.scenario.voice || "", renderPrep); break;
      case "say": if (st) listenFor(st.de, P, renderPrep); break;
      case "card":
        if (!st) break;
        if (P.revealed) { speak(st.de, true); break; }
        // falls through to reveal behaviour below
      case "reveal":
        if (!st) break;
        P.revealed = true; renderPrep();
        // show it, say it, then the mic opens so the learner repeats it
        speak(st.de, true, () => { if (P && P.steps && P.steps[P.i] === st && P.revealed && !P.listening) listenFor(st.de, P, renderPrep); });
        break;
      case "next":
        stopAudio(); speechSynthesis.cancel();
        P.i++; P.revealed = false; P.verdict = null; P.heard = null; P.err = null; P.clip = null; P.clipUrl = null;
        renderPrep();
        break;
    }
  });
}

/* ---------- guided dialogue (Dialog üben) ----------

const DLG_XP = 15;
let DG = null;

/* rerender hook for listenFor: count misses, auto-advance on a hit */
function dlgAfterListen() {
  if (DG && DG.stage === "scene" && DG.verdict && !DG.counted) {
    DG.counted = true;

      SFX.coin();

  DG.verdict = null; DG.heard = null; DG.err = null; DG.counted = true;

      `<div style="text-align:center;margin-top:18px">

       </div>

     </div>

       <div class="v-flip">${esc(L.howSay)}</div>

/* ---------- wiring ---------- */
function startConversation() {
  const REAL = SCENARIOS.filter((x) => x.goals);
  if (S.scenario.id === "custom") {
    const topic = ($("customTopic").value || "").trim();
    if (!topic) { $("customTopic").focus(); return; }
    S.customTopic = topic; saveSettings();
    S.active = { id:"custom", avatar:"🎭", who:S.scenario.who, tag:S.scenario.tag,
      role:"the person who would naturally answer the phone for the situation the learner describes",
      place:"the appropriate business, office or organisation",
      goals:[topic] };
  } else if (S.scenario.id === "random") {
    S.active = REAL[Math.floor(Math.random() * REAL.length)];
  } else {
    S.active = S.scenario;
  }
  S.turns = []; S.hint = null; S.hintTr = null; S.seconds = 0; S.handsFree = true; S.speaker = 1;
  S.callDone = false; // fresh call: the success frame belongs to the last goodbye only
  // clean default call: the conversation looks like a real call until the
  // learner explicitly asks for Text or Help
  S.showText = false; S.helpStep = 0; S.helpTrOpen = false; S.speedOpen = false;
  warmCallArt(S.active.id); // idle + listening decode before the stage paints
  S.callId = newRewardId(); // each call claims its reward under a fresh id
  const g = S.active.goals;
  S.currentGoal = g[Math.floor(Math.random() * g.length)];
  // the session's transcript is the canonical prompt history for this call
  S.session = createConversationSession({
    scenario: S.active, level: S.level, lang: S.lang,
    goal: S.currentGoal, providers: ENGINE,
  }).start();
  show("call"); alertMsg(null); renderCall();
  warmCallStates(S.active.id); // thinking/speaking/success decode while ringing
  renderCallCompanion();
  if (S.active.kind !== "face") SFX.ringStart();
  acquireWakeLock();
  clearInterval(S.timerId);
  S.timerId = setInterval(() => { S.seconds++; $("timer").textContent = timerText(); }, 1000);
  ask();
}
/* At A0 the call button routes through preparation first - beginners want
   words in their head before the phone rings. Once prepared (or after
   choosing to leave the warm-up), the gate opens for that scenario. */
const PREPPED = new Set();
function canPrep() {
  return S.scenario.id !== "random" && !(S.scenario.id === "custom" && !(S.customTopic || "").trim());
}
/* ---------- daily "phone plan": 30 free call minutes, like a real tariff ----------
   Coins can extend today's plan with minute packages bought in the Store
   (spec §14 usage packages, converted from MB to minutes - our metered unit). */
const PLAN_SECONDS = 30 * 60;
function planUsedToday() {
  const st = loadStats();
  return ((st.secDays || {})[new Date().toISOString().slice(0, 10)]) || 0;
}
function planLimitToday() {
  const st = loadStats();
  return PLAN_SECONDS + (((st.extraSecs || {})[new Date().toISOString().slice(0, 10)]) || 0);
}
/* ---------- MARZI-014: internet is a VIEW of the minutes allowance ----------
   Board 02_call.png prices 100 MB as ~10 min of calls, so 10 MB = 1 minute.
   MB is never stored, never consumed and never purchased separately: both
   readouts derive from the same seconds value that already drives the plan. */
const MB_PER_MINUTE = 10;
function mbFromSeconds(sec) { return Math.max(0, Math.round((Number(sec) || 0) / 60 * MB_PER_MINUTE)); }
/* one canonical snapshot used by every plan/internet readout */
function planSnapshot() {
  const limitSec = planLimitToday();
  const usedSec = Math.min(planUsedToday(), limitSec);
  const leftSec = Math.max(0, limitSec - usedSec);
  return {
    limitSec, usedSec, leftSec,
    limitMin: Math.round(limitSec / 60), usedMin: Math.round(usedSec / 60), leftMin: Math.ceil(leftSec / 60),
    limitMb: mbFromSeconds(limitSec), usedMb: mbFromSeconds(usedSec), leftMb: mbFromSeconds(leftSec),
    exhausted: leftSec <= 0,
  };
}
/* Premium is PRESENTATION ONLY (approved): no entitlement, no unlock, no
   user-facing activation. The test hook below exists purely to render the
   subscribed visual state for verification. */
let PREMIUM_PREVIEW = false;
function isPremium() { return false; }              // never true in the product
function premiumPreviewState() { return PREMIUM_PREVIEW ? "premium" : "free"; }
function __setPremiumPreview(v) { PREMIUM_PREVIEW = !!v; }  // test-only hook

const COIN_PACKS = [
  { id:"min10", minutes:10, price:200 },
  { id:"min25", minutes:25, price:450 },
  { id:"min50", minutes:50, price:800 },
  { id:"min100", minutes:100, price:1500 },

/* outfit catalog: identifiers, prices and stage gates only - visuals wait for

/* ---------- MARZI-011: offline + storage resilience ----------
   Failure states are honest: the learner is told what happened and what to do
   next, instead of a generic error or a silent no-op. */
function isOffline() {
  try { return typeof navigator !== "undefined" && navigator.onLine === false; }
  catch (e) { return false; }
}
function renderNetBanner() {
  const L = t();
  const el = $("netBanner");
  const off = isOffline();
  el.innerHTML = off ? `${IC.warn(ICON.sm)} <b>${esc(L.offlineTitle)}</b> <span>${esc(L.offlineMsg)}</span>` : "";
  el.classList.toggle("hidden", !off);
  return off;
}
/* a storage write that fails must never be silent */
function notifyStorageFailure() {
  const L = t();
  const el = $("netBanner");
  el.innerHTML = `${IC.warn(ICON.sm)} <b>${esc(L.saveFailed)}</b>`;
  el.classList.remove("hidden");
}

/* warm the approved production assets so the first visible character frame
   is already the gold artwork - never a temporary stand-in.
   asset-manifest.json preload contract: idle + listening decode before the
   first stage reveal; thinking/speaking/success warm right after call start. */
function warmCallArt(id) {
  const a = callArt(id, "ready");
  if (!a || typeof Image === "undefined") return;
  try {
    warmArtSrc(a.src).catch(() => {});
    warmArtSrc(a.background).catch(() => {});
    const lst = callArt(id, "listening");
    if (lst) warmArtSrc(lst.src).catch(() => {});
  } catch (e) {}
}
let CALL_ART_RASTER_DONE = false;
function warmCallStates(id) {
  if (typeof document === "undefined" || !document.createElement) return;
  const stage = $("callStage");
  if (!stage || !stage.querySelectorAll) return;
  const a = CALL_ART[id];
  if (!a) { // non-production character: no resident layers may linger
    stage.querySelectorAll(".call-art-warm").forEach((el) => el.remove());
    delete stage.dataset.warmId;
    return;
  }
  if (stage.dataset.warmId === id) return; // this cast's layers already resident
  stage.querySelectorAll(".call-art-warm").forEach((el) => el.remove());
  stage.dataset.warmId = id;
  CALL_ART_RASTER_DONE = false;
  // every state frame stays mounted at 0.1% opacity for the whole call: the
  // decoded rasters remain hot in the compositor, so no state change can
  // ever stall a frame on a cold decode mid-crossfade
  const files = [...new Set(Object.values(a.states))].map((f) => a.dir + f + a.ext);
  let left = files.length;
  files.forEach((src) => {
    warmArtSrc(src).then(() => {
      const w = document.createElement("img");
      w.className = "call-portrait ok call-art-warm";
      w.style.cssText = "opacity:.001;pointer-events:none";
      w.alt = ""; w.src = src;
      stage.insertBefore(w, $("vcEmoji"));
      const done = () => { if (--left === 0) CALL_ART_RASTER_DONE = true; };
      (w.decode ? w.decode().catch(() => {}) : Promise.resolve()).then(done, done);
    }).catch(() => { if (--left === 0) CALL_ART_RASTER_DONE = true; });
  });
}

function goCall() {
  // offline: refuse with a clear recovery path instead of a generic failure.
  // The banner is the channel - #alert lives inside the call screen and would
  // be invisible here.
  if (isOffline()) {
    renderNetBanner();
    try { $("netBanner").scrollIntoView({ block: "nearest" }); } catch (e) {}
    return;
  }
  if (planUsedToday() >= planLimitToday()) { showLimit(); return; }
  if (S.level === "A0" && canPrep() && !PREPPED.has(S.scenario.id)) startPrep();
  else startConversation();
}
$("callBtn").onclick = goCall;
function endCall() {
  if (sheetOpen()) closeCallSheet();
  // Help, translations and Speed reset fully when the call ends
  S.helpStep = 0; S.helpTrOpen = false; S.speedOpen = false;
  HELP_HISTORY = false; SPEED_HISTORY = false;
  S.handsFree = false;
  if (S.session) S.session.end(); // any pending AI reply is dropped by the engine
  SFX.ringStop();
  clearInterval(S.timerId);
  S.timerId = null;
  releaseWakeLock();
  speechSynthesis.cancel();
  stopAudio();
  try { S.rec && S.rec.abort(); } catch (e) {}
  const L = t();
  $("doneTitle").textContent = (S.active || S.scenario).kind === "face" ? L.endedTalk : L.ended;
  $("againBtn").textContent = L.again;
  const fixes = S.turns.filter((x) => x.me && x.fix);
  $("review").innerHTML = `<div class="label" style="margin:0">${esc(L.review)} · ${mmss()}</div>` +
    (fixes.length ? fixes.map((x, i) => `<div style="margin-top:14px"><div class="said">${esc(x.text)}</div><div class="fix">${esc(x.fix)}</div>${x.corrected ? `<div style="margin-top:4px"><button class="mini" data-sayr="${i}">&#9654; ${L.sayIt}</button></div>` : ""}</div>`).join("")
                  : '<p class="note">—</p>');
  $("review").querySelectorAll("[data-sayr]").forEach((b) =>
    b.onclick = () => speak(fixes[+b.dataset.sayr].corrected, true));
  $("replayBtn").textContent = "▶ " + L.replayAll;
  $("replayBtn").classList.toggle("hidden", !S.turns.length);
  // 1. persist first - the ledger and stats commit before anything animates
  const before = loadStats();
  const xpBefore = before.xp || 0, coinsBefore = before.coins || 0;
  const abandoned = !!S.busy;
  const gained = recordCall();
  // 2. build the canonical summary from committed state only
  const summary = buildRewardSummary({
    xpBefore, coinsBefore, gained, claim: LAST_CLAIM,
    turns: S.turns.filter((x) => x.me).length, mistakes: fixes.length,
    seconds: S.seconds, abandoned,
  });
  S.lastReward = summary;
  renderRewardSummary(summary);
  updateTopbar();
  show("done");
  // 3. animate from the summary (never mutates), then celebrate a new stage
  animateReward(summary);
  evaluateCall();
}

/* ---------- MARZI-006: transcript & tools sheet ----------
   Dismissible four ways: close button, swipe down, Escape, Android back.
   Back is handled with a pushState entry so it never navigates the tab. */
let SHEET_HISTORY = false;
let SHEET_SHOWN = false;
function sheetOpen() { return SHEET_SHOWN; }

  renderTranscript();
  SHEET_SHOWN = true;
  $("callSheet").classList.remove("hidden");
  $("sheetBack").classList.remove("hidden");
  try { $("sheetClose").focus(); } catch (e) {}
  if (!SHEET_HISTORY) {
    try { window.history.pushState({ marziSheet: true }, ""); SHEET_HISTORY = true; } catch (e) {}
  }
}
function closeCallSheet(fromPop) {
  SHEET_SHOWN = false;
  $("callSheet").classList.add("hidden");
  $("sheetBack").classList.add("hidden");
  if (SHEET_HISTORY && !fromPop) { SHEET_HISTORY = false; try { window.history.back(); } catch (e) {} }
  else SHEET_HISTORY = false;
  try { $("sheetBtn").focus(); } catch (e) {}
}
/* Help panel and Speed popover: true toggles that also close on Escape and
   Android back (history integration mirrors the sheet's), and always close
   BEFORE anything can end the call. */
let HELP_HISTORY = false, SPEED_HISTORY = false;
let POP_SWALLOW = 0; // pops we caused ourselves (already closed) - never re-handle
function setHelp(step) {
  const opening = step > 0 && !S.helpStep;
  const closing = step === 0 && S.helpStep > 0;
  S.helpStep = step;
  if (opening) { try { window.history.pushState({ marziHelp: true }, ""); HELP_HISTORY = true; } catch (e) {} }
  if (closing && HELP_HISTORY) { HELP_HISTORY = false; POP_SWALLOW++; try { window.history.back(); } catch (e) { POP_SWALLOW--; } }
  renderCall();
}
function setSpeedOpen(open) {
  const opening = open && !S.speedOpen;
  const closing = !open && S.speedOpen;
  S.speedOpen = !!open;
  if (opening) { try { window.history.pushState({ marziSpeed: true }, ""); SPEED_HISTORY = true; } catch (e) {} }
  if (closing && SPEED_HISTORY) { SPEED_HISTORY = false; POP_SWALLOW++; try { window.history.back(); } catch (e) { POP_SWALLOW--; } }
  renderCall();
}
window.addEventListener("popstate", () => {
  if (POP_SWALLOW > 0) { POP_SWALLOW--; return; }
  if (S.speedOpen) { S.speedOpen = false; SPEED_HISTORY = false; renderCall(); return; }
  if (S.helpStep) { S.helpStep = 0; HELP_HISTORY = false; renderCall(); return; }
  if (sheetOpen()) closeCallSheet(true);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (S.speedOpen) setSpeedOpen(false);
  else if (S.helpStep) setHelp(0);
  else if (sheetOpen()) closeCallSheet();
  else if (premiumScreenOpen()) closePremiumScreen();
  else if (planScreenOpen()) closePlanScreen();
  else if (limitOpen()) closeLimit();
  else if (evolutionCelebrationOpen()) closeEvolutionCelebration();
  else if (STORE_PREVIEW) closeOutfitPreview();
});

/* ---------- MARZI backup: one authoritative snapshot / apply pair ----------
   HARDENING-01: user data lives under BOTH prefixes - the legacy
   "telefontrainer." family (fixes, words, tests, pin, wish, vocab caches)
   and the "marzi." family (settings, stats incl. XP/coins/wardrobe, reward
   ledger, celebrated stage, stage). The previous export filtered only the
   legacy prefix, so a backup silently omitted all progress and settings and
   a restore could not bring them back. Restore now validates the COMPLETE
   candidate before touching storage (an invalid backup leaves existing state
   byte-identical) and rolls back every written key if storage fails midway.
   Old backup files (legacy prefix only) stay restorable unchanged. */
const BACKUP_PREFIXES = ["telefontrainer.", "marzi."];
function backupKeyAllowed(k) {
  return typeof k === "string" && BACKUP_PREFIXES.some((p) => k.indexOf(p) === 0);
}
function backupSnapshot() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (backupKeyAllowed(k)) data[k] = localStorage.getItem(k);
  }
  return data;
}
function applyBackup(candidate) {
  if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return { ok: false, code: "invalid" };
  const entries = Object.entries(candidate).filter(([k]) => backupKeyAllowed(k));
  if (!entries.length) return { ok: false, code: "empty" };
  // all-or-nothing: one corrupt value rejects the whole candidate up front
  if (entries.some(([, v]) => typeof v !== "string")) return { ok: false, code: "invalid" };
  const prev = entries.map(([k]) => [k, localStorage.getItem(k)]);
  try {
    for (const [k, v] of entries) localStorage.setItem(k, v);
  } catch (e) {
    // a mid-apply storage failure restores the snapshot: partial restore
    // states cannot exist (same move-together rule as claimReward)
    for (const [k, v] of prev) {
      try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e2) {}
    }
    return { ok: false, code: "save-failed" };
  }
  return { ok: true, code: "restored", keys: entries.length };
}
/* the authoritative backup path; Profile V1 rows delegate here */
function exportBackup() {
  const blob = new Blob([JSON.stringify(backupSnapshot())], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "telefontrainer-backup.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

      if (!res.ok) { alert("✗"); return; }
      alert(t().importedOk);

    } catch (err) { alert("✗"); }
  };
  r.readAsText(f);
};
