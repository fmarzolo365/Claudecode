<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#16130d" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Telefon" />
<title>Telefontrainer</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f3ea;
    --card: #ffffff;
    --ink: #16130d;
    --muted: #6f6858;
    --line: rgba(22, 19, 13, .12);
    --yellow: #f5c531;
    --yellow-deep: #d9a90f;
    --red: #c24634;
    --green: #2e7d5b;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(22,19,13,.05), 0 10px 30px rgba(22,19,13,.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Archivo, Helvetica, sans-serif;
    padding: 28px 18px 56px;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 560px; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .brand .mark {
    width: 42px; height: 42px; flex: 0 0 42px;
    background: var(--yellow); border-radius: 13px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
  }
  .brand .word {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px; font-weight: 700; letter-spacing: -.01em;
  }
  .plate { display: inline-flex; align-items: center; gap: 10px; }
  .plate span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px; font-weight: 700; letter-spacing: -.01em;
  }
  .tagline { font-size: 15px; line-height: 1.55; color: var(--muted); margin: 10px 0 26px; max-width: 460px; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: .18em; color: var(--muted);
    margin: 26px 0 10px; text-transform: uppercase;
  }
  .label:first-of-type { margin-top: 0; }
  .list {
    border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .item {
    display: block; width: 100%; text-align: left; padding: 14px 16px;
    border: none; border-top: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; font: inherit;
    transition: background .15s ease;
  }
  .item:first-child, .list .label + .item { border-top: none; }
  .item:hover { background: rgba(245,197,49,.08); }
  .item.on { background: var(--ink); color: #fdfbf5; }
  .item b { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; display: block; letter-spacing: 0; }
  .item small { font-size: 12.5px; color: var(--muted); }
  .item.on small { color: rgba(253,251,245,.65); }
  .item[disabled] { opacity: .4; cursor: not-allowed; }
  .list .label { margin: 14px 16px 6px; }
  .seg {
    display: flex; gap: 4px; padding: 4px;
    background: #ece5d4; border-radius: 999px;
  }
  .seg button {
    flex: 1; padding: 9px 6px; border: none; border-radius: 999px;
    background: transparent; color: var(--ink); cursor: pointer;
    font: 600 13px Archivo, sans-serif; letter-spacing: .02em;
    transition: background .15s ease, color .15s ease;
  }
  .seg button.on { background: var(--ink); color: var(--yellow); }
  .seg.wrap { flex-wrap: wrap; }
  .seg.wrap button { flex: 1 1 31%; }
  .note { font-size: 12.5px; margin: 10px 2px 0; color: var(--muted); }
  .big {
    font-family: 'Space Grotesk', sans-serif; width: 100%; padding: 17px; margin-top: 30px;
    background: var(--ink); color: var(--yellow); border: none; font-size: 17px; font-weight: 700;
    letter-spacing: .06em; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 10px; border-radius: 999px;
    box-shadow: var(--shadow); transition: transform .1s ease, filter .15s ease;
  }
  .big:hover { filter: brightness(1.08); }
  .big:active { transform: scale(.985); }
  .big[disabled] { opacity: .5; cursor: not-allowed; }
  .big.live { background: var(--red); color: #fff; animation: ring 1.4s infinite; }
  @keyframes ring { 0%,100% { box-shadow: 0 0 0 0 rgba(194,70,52,.45); } 50% { box-shadow: 0 0 0 14px rgba(194,70,52,0); } }
  .bar {
    background: var(--ink); color: #fdfbf5; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .bar .who { font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 600; }
  .bar .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: var(--yellow); opacity: .9; }
  .hang {
    background: var(--red); color: #fff; border: none; padding: 10px 16px;
    font: 700 12px Archivo, sans-serif; letter-spacing: .06em; cursor: pointer;
    border-radius: 999px; transition: filter .15s ease;
  }
  .hang:hover { filter: brightness(1.1); }
  .log {
    background: var(--card); border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow);
    min-height: 260px; max-height: 46vh; overflow-y: auto; padding-bottom: 8px;
  }
  .turn { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .turn:last-child { border-bottom: none; }
  .tag {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .12em;
    width: 84px; flex: 0 0 84px; padding-top: 4px; color: var(--muted);
  }
  .tag.me { color: var(--green); }
  .said { font-size: 15.5px; line-height: 1.5; }
  .w { cursor: pointer; border-radius: 4px; }
  .w:active { background: rgba(245,197,49,.4); }
  .wsave { margin-top: 6px; font: 600 12.5px Archivo, sans-serif; color: var(--green); }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .fix { font-size: 12.5px; color: var(--red); margin-top: 4px; }
  .mini {
    background: none; border: none; padding: 0; font: 12px Archivo, sans-serif;
    color: var(--muted); text-decoration: underline; cursor: pointer; margin-right: 12px;
  }
  .mini:hover { color: var(--ink); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .row.sos { gap: 6px; margin-top: 10px; }
  .row.sos .ghost { font-size: 11.5px; padding: 9px 4px; }
  .ghost {
    flex: 1; padding: 12px 10px; background: var(--card); border: 1px solid var(--line);
    color: var(--ink); font: 600 13px Archivo, sans-serif; cursor: pointer;
    border-radius: 999px; box-shadow: 0 1px 2px rgba(22,19,13,.04);
    transition: background .15s ease;
  }
  .ghost:hover { background: rgba(245,197,49,.1); }
  .ghost[disabled] { opacity: .4; cursor: not-allowed; }
  .toggle {
    width: 100%; margin-top: 10px; padding: 11px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: 600 12.5px Archivo, sans-serif;
    letter-spacing: .04em; cursor: pointer; border-radius: 999px;
    box-shadow: 0 1px 2px rgba(22,19,13,.04); transition: background .15s ease;
  }
  .toggle.on { background: var(--yellow); border-color: transparent; color: var(--ink); }
  .toggle[disabled] { opacity: .4; cursor: not-allowed; }
  .hero {
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; margin: -6px 0 24px;
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hero-streak { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; }
  .hero-streak small { font-size: 12px; color: var(--muted); font-family: Archivo, sans-serif; font-weight: 500; }
  .week { display: flex; gap: 5px; }
  .week .d { width: 21px; text-align: center; font: 500 9px 'JetBrains Mono', monospace; color: var(--muted); }
  .week .dot { width: 9px; height: 9px; margin: 3px auto 0; border-radius: 50%; background: #e7dfcc; }
  .week .dot.on { background: var(--yellow-deep); }
  .week .today .dot { box-shadow: 0 0 0 2px rgba(22,19,13,.3); }
  .hero-lv { display: flex; justify-content: space-between; align-items: baseline; margin-top: 13px; }
  .hero-lv .ttl { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; }
  .hero-lv .hero-xp { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .08em; color: var(--muted); }
  .xpbar { height: 7px; background: #ece5d4; border-radius: 99px; margin-top: 7px; overflow: hidden; }
  .xpbar div { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--yellow-deep)); border-radius: 99px; transition: width .6s ease; }
  .hero-sub { margin-top: 9px; font-size: 11.5px; color: var(--muted); }
  .routine { display: flex; gap: 6px; margin-top: 10px; }
  .routine button {
    flex: 1; text-align: center; font: 600 11px Archivo, sans-serif; border: none; cursor: pointer;
    padding: 7px 4px; border-radius: 99px; background: #ece5d4; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: filter .15s ease;
  }
  .routine button:hover { filter: brightness(.96); }
  .routine button.done { background: rgba(46,125,91,.15); color: var(--green); }
  .chip {
    font: 700 11px 'JetBrains Mono', monospace; background: var(--yellow); color: var(--ink);
    border-radius: 99px; padding: 4px 10px; letter-spacing: .06em; white-space: nowrap;
  }
  .goal-hit {
    display: flex; align-items: center; gap: 10px; background: rgba(46,125,91,.12);
    color: var(--green); font: 700 13px Archivo, sans-serif; padding: 10px 12px;
    border-radius: 12px; margin: 0 0 12px;
  }
  .drill-prog { font: 500 10px 'JetBrains Mono', monospace; letter-spacing: .15em; color: var(--muted); }
  .v-card {
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 18px; text-align: center; cursor: pointer;
    min-height: 180px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
  }
  .v-de { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.25; }
  .v-tr { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; color: var(--green); line-height: 1.3; }
  .v-ex { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .v-flip { font-size: 11.5px; color: var(--muted); }
  .v-verdict { margin-top: 12px; padding: 11px 14px; border-radius: 12px; font: 600 13.5px Archivo, sans-serif; line-height: 1.5; }
  .v-verdict.ok { background: rgba(46,125,91,.12); color: var(--green); }
  .v-verdict.bad { background: rgba(194,70,52,.1); color: var(--red); }
  .drill-ok { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: var(--green); margin-top: 12px; line-height: 1.4; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
  .confetti i { position: absolute; top: -14px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
  .hint {
    margin-top: 12px; border: 1.5px dashed var(--yellow-deep); background: #fffdf4;
    padding: 12px 14px; font-size: 15px; border-radius: 12px;
  }
  .hint .label { margin: 0 0 4px; }
  .alert {
    margin-top: 12px; border: 1px solid rgba(194,70,52,.4); background: #fdf1ef;
    color: var(--red); padding: 12px 14px; font: 600 12.5px Archivo, sans-serif;
    line-height: 1.5; border-radius: 12px;
  }
  input[type=text] {
    flex: 1; padding: 12px 14px; border: 1px solid var(--line); background: var(--card);
    font: 15px Archivo, sans-serif; color: var(--ink); border-radius: 12px;
  }
  input[type=text]::placeholder { color: var(--muted); opacity: .8; }
  .picked {
    width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 44px 14px 16px;
    cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 2px; position: relative;
    transition: background .15s ease;
  }
  .picked:hover { background: rgba(245,197,49,.08); }
  .picked b { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; }
  .picked small { font-size: 12.5px; color: var(--muted); }
  .picked .chev { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 24px; color: var(--muted); }
  .menu-btn {
    width: 42px; height: 42px; flex: 0 0 42px; border: 1px solid var(--line);
    background: var(--card); border-radius: 13px; cursor: pointer;
    display: inline-flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(22,19,13,.04);
  }
  .menu-btn span { width: 16px; height: 2px; background: var(--ink); border-radius: 2px; display: block; }
  .drawer-back { position: fixed; inset: 0; background: rgba(22,19,13,.45); z-index: 40; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(330px, 86vw);
    background: var(--bg); z-index: 50; transform: translateX(-105%);
    transition: transform .25s ease; overflow-y: auto; padding: 14px;
    box-shadow: 0 0 60px rgba(22,19,13,.3);
  }
  .drawer.open { transform: none; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 12px; }
  .drawer-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
  .drawer-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); padding: 4px 8px; }
  .hidden { display: none; }
  button:focus-visible, input:focus-visible { outline: 2.5px solid var(--yellow-deep); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <!-- SETUP -->
  <section id="setup">
    <header class="brand"><button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button><span class="mark"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M19.5 2.5h-15A2.5 2.5 0 0 0 2 5v9a2.5 2.5 0 0 0 2.5 2.5H7v3.7c0 .9 1.1 1.4 1.7.7l4-4.4h6.8A2.5 2.5 0 0 0 22 14V5a2.5 2.5 0 0 0-2.5-2.5z" fill="#16130d"/><circle cx="8.6" cy="11.4" r="2.1" fill="#f5c531"/><circle cx="15.4" cy="7.1" r="2.1" fill="#f5c531"/><path d="M7.8 10.2 14.6 5.9 15.9 8 9.1 12.3z" fill="#f5c531"/></svg></span><span class="word">Telefontrainer</span></header>
    <p class="tagline" id="tagline"></p>
    <div class="hero hidden" id="hero">
      <div class="hero-top">
        <div class="hero-streak" id="heroStreak"></div>
        <div class="week" id="heroWeek"></div>
      </div>
      <div class="hero-lv"><span class="ttl" id="heroLv"></span><span class="hero-xp" id="heroXp"></span></div>
      <div class="xpbar"><div id="xpFill" style="width:0%"></div></div>
      <div class="hero-sub" id="heroSub"></div>
      <div class="routine" id="routine"></div>
    </div>

    <div class="label" id="lblPick"></div>
    <button class="picked" id="pickedCard">
      <b id="pickedTitle"></b><small id="pickedSub"></small><span class="chev">&rsaquo;</span>
    </button>

    <div class="label" id="lblLevel"></div>
    <div class="seg" id="levels"></div>
    <p class="note" id="levelNote"></p>

    <div class="label" id="lblSpeed"></div>
    <div class="seg" id="speeds"></div>

    <div class="label" id="lblLang"></div>
    <div class="seg wrap" id="langs"></div>

    <button class="big" id="callBtn"></button>
    <button class="toggle" id="prepBtn" style="margin-top:14px"></button>
    <button class="toggle" id="vocabBtn"></button>
    <button class="toggle" id="drillBtn"></button>
    <button class="toggle" id="mistakesBtn"></button>
  </section>

  <!-- CALL -->
  <section id="call" class="hidden">
    <div class="bar">
      <div><div class="meta" id="timer">VERBUNDEN · 00:00</div><div class="who" id="who"></div></div>
      <button class="hang" id="hangBtn"></button>
    </div>
    <div class="log" id="log"></div>
    <p class="note hidden" id="tapHint" style="margin:8px 2px 0"></p>
    <div class="row">
      <button class="ghost" id="repeatBtn"></button>
      <button class="ghost" id="hintBtn"></button>
    </div>
    <div id="hintBox" class="hint hidden"><div class="label">VORSCHLAG</div><div id="hintText"></div></div>
    <div class="row sos">
      <button class="ghost" data-sos="Wie bitte?">🆘 Wie bitte?</button>
      <button class="ghost" data-sos="Langsamer, bitte.">🐢 Langsamer, bitte</button>
      <button class="ghost" data-sos="Können Sie das noch einmal sagen?">🔁 Noch einmal, bitte</button>
    </div>
    <button class="toggle on" id="freeBtn"></button>
    <div id="alert" class="alert hidden"></div>
    <button class="big" id="micBtn"></button>
    <button class="mini" id="typeBtn" style="margin-top:10px"></button>
    <div class="row hidden" id="typeRow">
      <input type="text" id="draft" placeholder="Guten Tag, ich möchte…" />
      <button class="ghost" id="sendBtn" style="flex:0 0 auto"></button>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="hidden">
    <div class="plate"><span id="doneTitle"></span><span class="chip hidden" id="xpChip"></span></div>
    <button class="ghost hidden" id="replayBtn" style="width:100%;margin-top:16px"></button>
    <div class="list" style="margin-top:14px;padding:16px 14px" id="review"></div>
    <div class="list" style="margin-top:14px;padding:16px 14px" id="evalBox"></div>
    <button class="big" id="againBtn"></button>
  </section>

  <!-- MISTAKES HISTORY -->
  <section id="mistakes" class="hidden">
    <div class="plate"><span id="mistakesTitle"></span></div>
    <div class="list" style="margin-top:22px;padding:16px 14px" id="mistakesList"></div>
    <div class="row">
      <button class="ghost" id="ankiBtn"></button>
      <button class="ghost" id="clearBtn"></button>
    </div>
    <button class="big" id="backBtn"></button>
  </section>

  <!-- PRE-CALL PREPARATION (level zero warm-up) -->
  <section id="prep" class="hidden">
    <div class="plate"><span id="prepTitle"></span></div>
    <p class="note" id="prepSub" style="margin-top:8px"></p>
    <div id="prepBody" style="margin-top:14px"></div>
    <button class="big" id="prepBack"></button>
  </section>

  <!-- SCENARIO VOCABULARY -->
  <section id="vocab" class="hidden">
    <div class="plate"><span id="vocabTitle"></span></div>
    <p class="note" id="vocabSub" style="margin-top:8px"></p>
    <div id="vocabBody" style="margin-top:14px"></div>
    <button class="big" id="vocabBack"></button>
  </section>

  <!-- MISTAKE DRILL -->
  <section id="drill" class="hidden">
    <div class="plate"><span id="drillTitle"></span></div>
    <div class="list" style="margin-top:22px;padding:18px 16px" id="drillCard"></div>
    <button class="big" id="drillBack"></button>
  </section>
</main>

<div id="drawerBack" class="drawer-back hidden"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-head">
    <span class="drawer-title" id="drawerTitle"></span>
    <button class="drawer-close" id="drawerClose" aria-label="Close">&#10005;</button>
  </div>
  <div class="list" id="scenarios"></div>
  <div class="row hidden" id="customRow" style="margin-top:12px">
    <input type="text" id="customTopic" />
  </div>
</aside>

<script>
const SCENARIOS = [
  { id:"arzt", de:"Beim Hausarzt anrufen", es:"Pedir cita en el médico de cabecera", en:"Book a doctor's appointment",
    who:"Praxis Dr. Wagner", tag:"PRAXIS", role:"a receptionist at a family doctor's practice",
    place:"Hausarztpraxis Dr. Wagner in Odenthal",
    goals:["book an appointment because of a persistent cough",
           "book an appointment because of strong back pain",
           "ask for a repeat prescription and whether you need to come in",
           "reschedule an existing appointment because something came up"] },
  { id:"amt", de:"Termin beim Bürgeramt", es:"Cita en la oficina municipal", en:"Appointment at the citizens' office",
    who:"Bürgeramt", tag:"AMT", role:"a clerk at the municipal citizens' office",
    place:"Bürgeramt Bergisch Gladbach",
    goals:["get an appointment to re-register an address",
           "ask what documents are needed to renew an ID card and book a slot",
           "ask about registering a car and where to go"] },
  { id:"werkstatt", de:"Auto zur Inspektion", es:"Llevar el coche al taller", en:"Take the car in for a service",
    who:"KFZ-Werkstatt Reuter", tag:"WERKSTATT", role:"a service adviser at a car workshop",
    place:"KFZ-Werkstatt Reuter",
    goals:["book the car in for its service and ask what it costs",
           "describe a strange noise when braking and get an appointment",
           "ask if they can check the battery today because the car barely starts"] },
  { id:"friseur", de:"Beim Friseur", es:"Reservar en la peluquería", en:"Book at the hairdresser",

/* ---------- settings persistence ---------- */
const SET_KEY = "telefontrainer.settings";
function saveSettings() {
  try {
    localStorage.setItem(SET_KEY, JSON.stringify({ scenario:S.scenario.id, level:S.level, lang:S.lang, speed:S.speed, customTopic:S.customTopic }));
  } catch (e) {}
}
(function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem(SET_KEY)) || {};
    const sc = SCENARIOS.find((x) => x.id === s.scenario);
    if (sc) S.scenario = sc;
    if (LEVELS[s.level]) S.level = s.level;
    if (T[s.lang]) S.lang = s.lang;
    if (SPEEDS[s.speed]) S.speed = s.speed;
    if (typeof s.customTopic === "string") S.customTopic = s.customTopic;
  } catch (e) {}
})();

/* ---------- practice stats (streak, totals) ---------- */
const STAT_KEY = "telefontrainer.stats";
function loadStats() {
  try { return JSON.parse(localStorage.getItem(STAT_KEY)) || { days:{}, calls:0, seconds:0 }; }
  catch (e) { return { days:{}, calls:0, seconds:0 }; }
}
function recordCall() {
  if (!S.turns.some((x) => x.me)) return 0;
  const st = loadStats();
  const d = new Date().toISOString().slice(0, 10);
  st.days[d] = (st.days[d] || 0) + 1;
  st.calls = (st.calls || 0) + 1;
  st.seconds = (st.seconds || 0) + S.seconds;
  const gained = 15 + Math.min(20, S.turns.filter((x) => x.me).length * 2);
  st.xp = (st.xp || 0) + gained;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
  return gained;
}
function addXp(n) {
  const st = loadStats();
  st.xp = (st.xp || 0) + n;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
}
function markDay(kind) { // "vocabDays" | "drillDays" - calls already live in st.days
  const st = loadStats();
  st[kind] = st[kind] || {};
  st[kind][new Date().toISOString().slice(0, 10)] = true;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
}
/* caller ranks by lifetime XP; titles stay German on purpose */
const RANKS = [[0,"Neuling"],[80,"Anrufer"],[200,"Vieltelefonierer"],[400,"Telefonprofi"],[700,"Bürodrache"],[1100,"Anrufheld"],[1700,"Telefonlegende"]];
function rankFor(xp) {
  let i = RANKS.length - 1;
  while (i > 0 && xp < RANKS[i][0]) i--;
  return { n: i + 1, title: RANKS[i][1], base: RANKS[i][0], next: RANKS[i + 1] ? RANKS[i + 1][0] : null };
}
function currentStreak(st) {
  let n = 0;
  const day = new Date();
  const key = () => day.toISOString().slice(0, 10);
  if (!st.days[key()]) day.setDate(day.getDate() - 1); // streak may end yesterday
  while (st.days[key()]) { n++; day.setDate(day.getDate() - 1); }
  return n;
}

/* ---------- API calls (with optional PIN when hosted) ---------- */
const PIN_KEY = "telefontrainer.pin";
async function chatFetch(payload) {
  const doFetch = () => fetch("/api/chat", {
    method: "POST",
    headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
    body: JSON.stringify(payload),
  });
  let res = await doFetch();
  if (res.status === 401) {
    const pin = prompt(t().pinAsk);
    if (pin != null && pin.trim()) {
      localStorage.setItem(PIN_KEY, pin.trim());
      res = await doFetch();
    }
    if (res.status === 401) localStorage.removeItem(PIN_KEY);
  }
  return res;
}

/* ---------- keep the screen on during a call ---------- */
async function acquireWakeLock() {
  try { if ("wakeLock" in navigator) S.wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
}
function releaseWakeLock() {
  try { S.wakeLock && S.wakeLock.release(); } catch (e) {}
  S.wakeLock = null;
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.timerId && !S.wakeLock) acquireWakeLock();
});

/* Neural voice via /api/tts when the server has a TTS key; device voice otherwise.
   The 501 probe result is remembered for the session so unconfigured servers
   cost one extra request per page load, not one per line. */
let neuralOK = true;
const ttsCache = new Map(); // text -> object URL (mp3)
let currentAudio = null;

function stopAudio() {
  if (currentAudio) {
    try { currentAudio.onended = null; currentAudio.pause(); } catch (e) {}
    currentAudio = null;
  }
}

async function neuralSpeak(text, rate, done) {
  let url = ttsCache.get(text);
  if (!url) {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
      body: JSON.stringify({ text }),
    });
    if (res.status === 501) { neuralOK = false; throw new Error("unconfigured"); }
    if (!res.ok) throw new Error("tts " + res.status);
    url = URL.createObjectURL(await res.blob());
    ttsCache.set(text, url);
    if (ttsCache.size > 40) {
      const k = ttsCache.keys().next().value;
      URL.revokeObjectURL(ttsCache.get(k));
      ttsCache.delete(k);
    }
  }
  const a = new Audio(url);
  a.playbackRate = rate;
  if ("preservesPitch" in a) a.preservesPitch = true;
  currentAudio = a;
  a.onended = () => { if (currentAudio === a) currentAudio = null; done && setTimeout(done, 350); };
  await a.play();
}

function deviceSpeak(text, rate, done) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  if (S.voice) u.voice = S.voice;
  u.rate = rate;
  u.onend = () => done && setTimeout(done, 350);
  u.onerror = () => done && setTimeout(done, 350);
  speechSynthesis.speak(u);
}

function speak(text, slow, done) {
  if (!text) { if (done) done(); return; }
  speechSynthesis.cancel();
  stopAudio();
  const rate = slow ? 0.6 : LEVELS[S.level].rate * (SPEEDS[S.speed] || 1);
  if (neuralOK) {
    neuralSpeak(text, rate, done).catch(() => deviceSpeak(text, rate, done));
    return;
  }
  deviceSpeak(text, rate, done);
}

function renderMistakes() {
  const L = t();
  $("mistakesTitle").textContent = L.mistakesTitle;
  $("ankiBtn").textContent = L.exportAnki;
  $("clearBtn").textContent = L.clearHistory;
  $("backBtn").textContent = L.back;
  const fixes = loadFixes().slice().reverse();
  $("ankiBtn").disabled = !fixes.length;
  $("mistakesList").innerHTML = fixes.length
    ? fixes.map((f, i) => `<div style="margin-bottom:14px">
        <div class="said">${esc(f.text)}</div>
        <div class="fix">${esc(f.fix)}</div>
        ${f.corrected ? `<div style="margin-top:4px"><button class="mini" data-sayh="${i}">&#9654; ${esc(L.sayIt)}</button></div>` : ""}
        <div class="sub" style="font-size:11px">${esc(f.date)} · ${esc(f.scenario)} · ${esc(f.level)}</div>
      </div>`).join("")
    : `<p class="note">${esc(L.noMistakes)}</p>`;
  $("mistakesList").querySelectorAll("[data-sayh]").forEach((b) =>
    b.onclick = () => speak(fixes[+b.dataset.sayh].corrected, true));
}

function exportAnki() {
  const fixes = loadFixes();
  if (!fixes.length) return;
  // Anki: File > Import, fields separated by Tab. Front = your sentence, Back = correction.
  const tsv = fixes.map((f) => `${f.text.replace(/[\t\n]/g, " ")}\t${f.fix.replace(/[\t\n]/g, " ")}`).join("\n");
  const blob = new Blob(["﻿" + tsv], { type: "text/tab-separated-values;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "telefontrainer-anki.txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* ---------- mistake drill (spaced-repetition-lite over saved corrections) ---------- */
let D = null;
function startDrill() {
  const all = loadFixes();
  const items = all.map((f, i) => ({ f, i })).filter((x) => x.f.corrected);
  if (!items.length) return;
  // least-practised first, then least-recently practised
  items.sort((a, b) => ((a.f.box || 0) - (b.f.box || 0)) || ((a.f.drilled || "") < (b.f.drilled || "") ? -1 : 1));
  D = { q: items.slice(0, 8), i: 0, open: false, total: Math.min(8, items.length) };
  show("drill");
  renderDrill();
}
function renderDrill() {
  const L = t();
  $("drillTitle").textContent = L.drillTitle;
  $("drillBack").textContent = L.back;
  if (D.i >= D.q.length) {
    const xp = D.total * 3;
    addXp(xp);
    markDay("drillDays");
    confettiBurst();
    $("drillCard").innerHTML =
      `<div class="said" style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700">🎉 ${esc(L.drillDone)}</div>
       <div style="margin-top:10px"><span class="chip">+${xp} XP</span></div>`;
    return;
  }
  const item = D.q[D.i], f = item.f;
  $("drillCard").innerHTML =
    `<div class="drill-prog">${D.i + 1} / ${D.q.length}</div>
     <div class="said" style="margin-top:10px;font-size:17px">„${esc(f.text)}“</div>
     <p class="note" style="margin-top:8px">${esc(L.drillQ)}</p>` +
    (!D.open
      ? `<button class="ghost" style="width:100%;margin-top:14px" data-da="reveal">${esc(L.reveal)}</button>`
      : `<div class="drill-ok">${esc(f.corrected)}</div>
         ${f.fix ? `<div class="fix">${esc(f.fix)}</div>` : ""}
         ${verdictHTML(D, L)}
         <div class="row">
           <button class="ghost" data-da="play">&#9654; ${esc(L.sayIt)}</button>
           <button class="ghost" data-da="say" ${D.listening ? "disabled" : ""}>${D.listening ? esc(L.listening) : esc(L.sayWord)}</button>
         </div>
         <div class="row">
           <button class="ghost" data-da="knew">${esc(L.knew)}</button>
           <button class="ghost" data-da="retry">${esc(L.retry)}</button>
         </div>`);
  $("drillCard").querySelectorAll("[data-da]").forEach((b) => b.onclick = () => {
    const act = b.dataset.da;
    if (act === "play") { speak(f.corrected, true); return; }
    if (act === "say") { listenFor(f.corrected, D, renderDrill); return; }
    if (act === "reveal") {
      D.open = true; renderDrill();
      // listen -> repeat: after the corrected sentence plays, the mic opens
      speak(f.corrected, true, () => { if (D && D.open && D.q[D.i] === item && !D.listening) listenFor(f.corrected, D, renderDrill); });
      return;
    }
    const all = loadFixes(), rec = all[item.i];
    if (rec) {
      rec.box = act === "knew" ? (rec.box || 0) + 1 : 0;
      rec.drilled = new Date().toISOString().slice(0, 10);
      saveFixes(all);
    }
    if (act === "retry") D.q.push(item);
    D.i++; D.open = false; D.verdict = null; D.heard = null; D.err = null;
    renderDrill();
  });
}

/* ---------- scenario vocabulary (speaking-first flashcards) ---------- */
let V = null;
const VOCAB_NS = "telefontrainer.vocab.";

function normDe(s) {
  return String(s || "").toLowerCase().replace(/[^a-zäöüß ]/g, " ").replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
/* the learner said the word if every content word of the target appears
   (fuzzily) in what the recognizer heard - articles don't count */
function saidWord(heard, target) {
  const SKIP = ["der","die","das","den","dem","des","ein","eine","einen","einem","einer"];
  const H = normDe(heard).split(" ").filter(Boolean);
  const Hjoin = H.join("");
  const all = normDe(target).split(" ").filter((w) => w && !SKIP.includes(w));
  // prefer content words, but fall back to short ones ("wo", "was") for one-word cards
  let Tw = all.filter((w) => w.length > 2);
  if (!Tw.length) Tw = all;
  if (!Tw.length) return false;
  // forgiving on purpose: this is encouragement, not an exam. The recognizer
  // itself mangles learner speech, so allow 2 edits on short words, accept the
  // word inside the joined transcript (recognizers split compounds), and for
  // phrases require 60% of the content words instead of all of them.
  const hit = (tw) => {
    const tol = tw.length <= 2 ? 0 : tw.length <= 7 ? 2 : 3;
    return H.some((h) => lev(h, tw) <= tol) || (tw.length >= 5 && Hjoin.includes(tw));
  };
  const need = Math.max(1, Math.ceil(Tw.length * 0.6));
  return Tw.filter(hit).length >= need;
}

  const sc = S.scenario;
  const topic = sc.id === "custom" ? (S.customTopic || "").trim() : "";
  const key = VOCAB_NS + "v2." + sc.id + "." + (topic ? encodeURIComponent(topic).slice(0, 60) + "." : "") + S.lang + "." + S.level;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(c) && c.length) return c;
  } catch (e) {}
  const help = HELP_LANG[S.lang] || "English";
  const what = topic ? `a phone call about: ${topic}`
    : sc.kind === "face" ? `${sc.de} - an in-person conversation at ${sc.place}`
    : `${sc.de} - calling ${sc.place}`;
  const res = await chatFetch({
    system: `You create a vocabulary deck for a German learner at CEFR level ${S.level} preparing for ${what}.
Return ONLY a JSON array, no markdown, of exactly 12 items:
[{"de":"...","tr":"...","ex":"...","xt":"..."}]
"de": the German word with its article (for nouns) or a short key phrase. "tr": its translation in ${help}. "ex": one short natural German sentence using it, something the learner could actually say or hear in this phone call, at level ${S.level}. "xt": the translation of "ex" in ${help}.
Pick what is genuinely most useful for THIS call: core nouns, key verbs, and 2-3 fixed telephone phrases.`,
    messages: [{ role: "user", content: "Create the deck." }],
  });
  const data = await res.json();
  const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const clean = raw.replace(/```json|```/g, "").trim();
  const deck = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]") + 1))
    .filter((x) => x && x.de && x.tr).slice(0, 12)
    .map((x) => ({ de: x.de, tr: x.tr, ex: x.ex || "", exTr: x.xt || "" }));
  if (!deck.length) throw new Error("empty deck");
  try { localStorage.setItem(key, JSON.stringify(deck)); } catch (e) {}
  return deck;
}

function startVocab() {
  const L = t();
  V = { stage: "pick" };
  $("vocabTitle").textContent = L.vocab.toUpperCase();
  $("vocabSub").textContent = "";
  $("vocabBack").textContent = L.back;
  show("vocab");
  renderVocab();
}

async function openDeck(kind) {
  V = { stage: "deck", deck: null, i: 0, flipped: false, heard: null, verdict: null, listening: false, failed: false };
  if (kind === "call") {
    const sc = S.scenario;
    $("vocabSub").textContent = sc.id === "custom" ? S.customTopic : `${sc.de} · ${sc.who}`;
    renderVocab();
    try { V.deck = await loadDeck(); } catch (e) { V.failed = true; }
    renderVocab();
  } else if (kind === "mywords") {
    const L = t();
    V.mywords = true;
    $("vocabSub").textContent = `⭐ ${L.myWords}`;
    V.deck = loadWords().slice().reverse().slice(0, 20).map((w) => ({ de: w.de, tr: w.tr, ex: w.ex || "", exTr: w.exTr || "" }));
    renderVocab();
  } else {
    const d = BASIC_DECKS.find((x) => x.id === kind);
    $("vocabSub").textContent = `${d.icon} ${d.de} · ${d[S.lang] || d.en}`;
    V.deck = d.items.map((it) => ({ de: it.de, tr: it[S.lang] || it.en, ex: it.ex || "", exTr: (it.xl || {})[S.lang] || (it.xl || {}).en || "" }));
    renderVocab();
  }
}

function renderVocab() {
  const L = t();
  if (V.stage === "pick") {
    const scOK = !(S.scenario.id === "random" || (S.scenario.id === "custom" && !(S.customTopic || "").trim()));
    const nw = loadWords().length;
    $("vocabBody").innerHTML = `<div class="list">
      <button class="item" data-vd="call" ${scOK ? "" : "disabled"}>
        <b>📞 ${esc(L.forCall)}</b><small>${esc(S.scenario.id === "custom" ? (S.customTopic || "—") : S.scenario.de)}</small></button>
      <button class="item" data-vd="mywords" ${nw ? "" : "disabled"}>
        <b>⭐ ${esc(L.myWords)}</b><small>${nw ? `${nw} ${esc(L.saved)}` : esc(L.tapWordHint)}</small></button>
      ${BASIC_DECKS.map((d) => `<button class="item" data-vd="${d.id}">
        <b>${d.icon} ${esc(d.de)}</b><small>${esc(d[S.lang] || d.en)}</small></button>`).join("")}
    </div>`;
    $("vocabBody").querySelectorAll("[data-vd]").forEach((b) =>
      b.onclick = () => { if (!b.disabled) openDeck(b.dataset.vd); });
    return;
  }
  if (V.failed) {
    $("vocabBody").innerHTML =
      `<p class="note">${esc(L.vocabFail)}</p>
       <button class="ghost" style="width:100%;margin-top:12px" data-va="reload">${esc(L.retry)}</button>`;
  } else if (!V.deck) {
    $("vocabBody").innerHTML = `<p class="note">${esc(L.vocabLoading)}</p>`;
  } else if (V.i >= V.deck.length) {
    if (!V.deck.length) { $("vocabBody").innerHTML = `<p class="note">—</p>`; return; }
    addXp(12);
    markDay("vocabDays");
    confettiBurst();
    $("vocabBody").innerHTML =
      `<div class="said" style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700">🎉 ${esc(L.vocabDone)}</div>
       <div style="margin-top:10px"><span class="chip">+12 XP</span></div>`;
  } else {
    const c = V.deck[V.i];
    $("vocabBody").innerHTML =
      `<div class="drill-prog">${V.i + 1} / ${V.deck.length}</div>
       <div class="v-card" data-va="flip" style="margin-top:10px">
         <div class="v-de">${esc(c.de)}</div>
         ${V.flipped
           ? `<div class="v-tr">${esc(c.tr)}</div>${c.ex ? `<div class="v-ex">„${esc(c.ex)}“${c.exTr ? `<br><span style="font-style:italic;opacity:.85">${esc(c.exTr)}</span>` : ""}</div>` : ""}${V.mywords ? `<div><button class="mini" data-va="del">🗑</button></div>` : ""}`
           : `<div class="v-flip">${esc(L.vocabFlip)}</div>`}
       </div>
       ${verdictHTML(V, L)}
       <div class="row">
         <button class="ghost" data-va="hear">&#9834; ${esc(L.sayIt)}</button>
         <button class="ghost ${V.listening ? "" : ""}" data-va="say" ${V.listening ? "disabled" : ""}>${V.listening ? esc(L.listening) : esc(L.sayWord)}</button>
       </div>
       <div class="row">
         <button class="ghost" data-va="next">${esc(L.next)} &rsaquo;</button>
       </div>`;
  }
  $("vocabBody").querySelectorAll("[data-va]").forEach((b) => b.onclick = (ev) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    const c = V.deck && V.deck[V.i];
    switch (b.dataset.va) {
      case "reload": openDeck("call"); break;
      case "del":
        if (c) {
          saveWordsList(loadWords().filter((w) => w.de !== c.de));
          V.deck.splice(V.i, 1);
          V.flipped = false; V.heard = null; V.verdict = null; V.err = null;
          renderVocab();
        }
        break;
      case "flip":
        V.flipped = !V.flipped; renderVocab();
        if (V.flipped && c && c.ex) speak(c.ex, true);
        break;
      case "hear":
        // listen -> repeat: after the word plays, the mic opens by itself
        if (c) speak(c.de, true, () => { if (V && V.deck && V.deck[V.i] === c && !V.listening) vocabListen(c.de); });
        break;
      case "say": if (c) vocabListen(c.de); break;
      case "next":
        stopAudio(); speechSynthesis.cancel();
        V.i++; V.flipped = false; V.heard = null; V.verdict = null; V.err = null;
        renderVocab();
        break;
    }
  });
}

/* shared pronunciation listener: writes listening/verdict/heard/err into st */
async function listenFor(target, st, rerender) {
  const L = t();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { st.err = L.noMic; rerender(); return; }
  if (st.listening) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((tr) => tr.stop());
  } catch (e) { st.err = L.micBlocked; rerender(); return; }
  speechSynthesis.cancel(); stopAudio();
  st.err = null; st.verdict = null; st.heard = null;
  const r = new SR();
  r.lang = "de-DE"; r.interimResults = false; r.maxAlternatives = 5;
  r.onresult = (e) => {
    const alts = Array.from(e.results[0]).map((a) => a.transcript);
    const ok = alts.some((a) => saidWord(a, target));
    st.heard = alts[0]; st.verdict = ok ? "ok" : "bad";
    rerender();
    if (!ok) speak(target, true);
  };
  r.onerror = (e) => {
    st.listening = false;
    const c = e && e.error;
    if (c === "no-speech") st.err = L.noSpeech;
    else if (c === "not-allowed" || c === "service-not-allowed") st.err = L.micBlocked;
    else if (c === "audio-capture") st.err = L.noDevice;
    else if (c !== "aborted") st.err = L.micErr + ": " + c;
    rerender();
  };
  r.onend = () => { st.listening = false; rerender(); };
  try { r.start(); st.listening = true; rerender(); }
  catch (e) { st.listening = false; st.err = L.micErr; rerender(); }
}
function vocabListen(target) { return listenFor(target, V, renderVocab); }
/* small verdict box shared by vocab cards and the mistake drill */
function verdictHTML(st, L) {
  return (st.err ? `<div class="v-verdict bad">${esc(st.err)}</div>` : "") +
    (st.verdict ? `<div class="v-verdict ${st.verdict}">${st.verdict === "ok" ? "✅ " + esc(L.wellSaid) : "🔁 " + esc(L.almost)}${st.heard ? `<br><span style="font-weight:400">${esc(L.heardYou)} „${esc(st.heard)}“</span>` : ""}</div>` : "");
}

/* ---------- celebration ---------- */
function confettiBurst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("div");
  c.className = "confetti";
  const cols = ["#f5c531", "#c24634", "#2e7d5b", "#16130d", "#d9a90f"];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = 1.4 + Math.random() * 1.4 + "s";
    p.style.animationDelay = Math.random() * 0.4 + "s";
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 3400);
}

/* ---------- call ---------- */
function systemPrompt() {
  const L = LEVELS[S.level], help = HELP_LANG[S.lang] || "English", s = S.active || S.scenario;
  const face = s.kind === "face";
  const custom = s.id === "custom"
    ? `\nThe learner described the situation in their own words (possibly not in German): interpret it, decide what kind of business or office would be called, and play that role realistically.\n`
    : "";
  const recent = loadFixes().slice(-8);
  const weakSpots = recent.length
    ? `\nThe learner's recent recurring mistakes (from earlier calls):\n${recent.map((f) => `- said "${f.text}" -> better: ${f.fix}`).join("\n")}\nWhen natural, steer the conversation so the learner gets a chance to practise these patterns again. Never mention that you are doing this.\n`
    : "";
  return `You are running a German-language ${face ? "face-to-face" : "telephone"} role-play for a learner at CEFR level ${S.level}.
Your role: ${s.role} at ${s.place}. The learner ${face ? "approaches you in person" : "is calling"} to ${S.currentGoal}.
${custom}${weakSpots}
Rules:
- The "reply" field is ONLY German. Stay in character for the whole ${face ? "conversation" : "call"}. Never mention that this is practice.
- Level guidance: ${L.guide}
- At most ${L.words} words per reply, at most one question per turn.
${face
  ? `- Open the conversation as this person naturally would in this place (a simple "Guten Tag" / "Hallo" / "Was darf's sein?"), never with telephone formulas.
- This is spoken in person: casual register where natural, react to the situation around you (queue, weather, noise), small human touches.`
  : `- Answer the phone first with a realistic German greeting for this kind of business.`}
- Drive the ${face ? "conversation" : "call"} to a real conclusion: ${face ? "resolve the learner's concern concretely, then part naturally" : "offer concrete dates and times, confirm the learner's name, then say goodbye"}.
- If the learner speaks English or Spanish, still answer in German, and make "suggestion" easier.

Return ONLY a JSON object. No markdown, no code fences. Keys:
"reply": your German line.
"translation": that same line in ${help}.
"feedback": at most 25 words in ${help} about the learner's last German line - what was wrong and the natural way to say it. Empty string if the learner has not spoken yet or the line was fine.
"corrected": the learner's last line rewritten as one natural, correct German sentence. Empty string if the learner has not spoken yet or the line was fine.
"suggestion": one natural German sentence the learner could say next, at level ${S.level}.
"done": true only after you have said goodbye.`;
}

function history() {
  return [{ role:"user", content:"[Das Telefon klingelt. Nimm ab.]" }]
    .concat(S.turns.map((x) => ({ role: x.me ? "user" : "assistant", content: x.text })));
}

async function ask() {
  S.busy = true; renderCall();
  try {
    const res = await chatFetch({ system: systemPrompt(), messages: history() });
    const data = await res.json();
    const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = raw.replace(/```json|```/g, "").trim();
    const p = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    if (p.feedback) {
      for (let i = S.turns.length - 1; i >= 0; i--) {
        if (S.turns[i].me) {
          S.turns[i].fix = p.feedback;
          if (p.corrected) S.turns[i].corrected = p.corrected;
          saveFix(S.turns[i].text, p.feedback, p.corrected || "");
          break;
        }
      }
    }
    S.turns.push({ me:false, text:p.reply, tr:p.translation });
    S.hint = p.suggestion || null;
    S.busy = false; renderCall();
    speak(p.reply, false, () => { if (S.handsFree && !p.done) listen(); });
  } catch (e) {
    S.busy = false; alertMsg(t().err); renderCall();
  }
}

function send(text) {
  const clean = (text || "").trim();
  if (!clean || S.busy) return;
  S.turns.push({ me:true, text:clean });
  S.hint = null;
  $("draft").value = "";
  ask();
}

function alertMsg(msg) {
  const el = $("alert");
  if (!msg) { el.classList.add("hidden"); return; }
  el.textContent = msg; el.classList.remove("hidden");
}

async function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alertMsg(t().noMic); $("typeRow").classList.remove("hidden"); return; }
  if (S.listening) { try { S.rec.stop(); } catch (e) {} return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    stream.getTracks().forEach((tr) => tr.stop());
  } catch (e) { alertMsg(t().micBlocked); $("typeRow").classList.remove("hidden"); return; }

  speechSynthesis.cancel();
  stopAudio();
  alertMsg(null);
  const r = new SR();
  r.lang = "de-DE"; r.interimResults = false; r.maxAlternatives = 1;
  r.onresult = (e) => send(e.results[0][0].transcript);
  r.onerror = (e) => {
    S.listening = false;
    const c = e && e.error;
    if (c === "not-allowed" || c === "service-not-allowed") alertMsg(t().micBlocked);
    else if (c === "no-speech") alertMsg(t().noSpeech);
    else if (c === "audio-capture") alertMsg(t().noDevice);
    else if (c !== "aborted") alertMsg(t().micErr + ": " + c);
    renderCall();
  };
  r.onend = () => { S.listening = false; renderCall(); };
  S.rec = r;
  try { r.start(); S.listening = true; renderCall(); }
  catch (e) { S.listening = false; alertMsg(t().micErr + ": " + e.message); renderCall(); }
}

/* tap a word in the other person's line -> look it up and save it */
async function saveWordTap(ti, raw) {
  const turn = S.turns[ti];
  if (!turn || (turn.wsave && turn.wsave.pending)) return;
  const clean = normDe(raw);
  if (!clean) return;
  const existing = loadWords().find((w) => normDe(w.raw) === clean || normDe(w.de).split(" ").includes(clean));
  if (existing) { turn.wsave = { de: existing.de, tr: existing.tr }; renderCall(); return; }
  turn.wsave = { pending: true };
  renderCall();
  try {
    const help = HELP_LANG[S.lang] || "English";
    const res = await chatFetch({
      system: `Return ONLY a JSON object, no markdown: {"de":"...","tr":"..."}. "de": the dictionary form of the tapped German word (nouns capitalized with their article, verbs in the infinitive). "tr": a short translation in ${help} that fits this context.`,
      messages: [{ role: "user", content: `Tapped word: "${raw}"\nSentence: "${turn.text}"` }],
    });
    const data = await res.json();
    const rawTxt = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const cleanTxt = rawTxt.replace(/```json|```/g, "").trim();
    const p = JSON.parse(cleanTxt.slice(cleanTxt.indexOf("{"), cleanTxt.lastIndexOf("}") + 1));
    if (!p.de || !p.tr) throw new Error("bad lookup");
    const words = loadWords();
    words.push({ de: p.de, tr: p.tr, raw, ex: turn.text, exTr: turn.tr || "", lang: S.lang, date: new Date().toISOString().slice(0, 10) });
    saveWordsList(words);
    turn.wsave = { de: p.de, tr: p.tr };
  } catch (e) {
    turn.wsave = null;
  }
  renderCall();
}

function tappable(text, ti) {
  return String(text).split(/(\s+)/).map((tok) => {
    const clean = tok.replace(/[^A-Za-zÄÖÜäöüß-]/g, "");
    return clean.length > 1
      ? `<span class="w" data-w="${esc(clean)}" data-ti="${ti}">${esc(tok)}</span>`
      : esc(tok);
  }).join("");
}

function mmss() {
  const m = String(Math.floor(S.seconds / 60)).padStart(2, "0");
  const s = String(S.seconds % 60).padStart(2, "0");
  return m + ":" + s;
}
function timerText() {
  const A = S.active || S.scenario;
  return (A.kind === "face" ? "IM GESPRÄCH · " : "VERBUNDEN · ") + mmss();
}

function renderCall() {
  const L = t();
  const A = S.active || S.scenario;
  $("who").textContent = A.who;
  $("timer").textContent = timerText();
  $("hangBtn").textContent = A.kind === "face" ? L.endTalk : L.hangUp;
  $("repeatBtn").textContent = L.repeat;
  $("hintBtn").textContent = L.hint;
  $("typeBtn").textContent = L.type;
  $("sendBtn").textContent = L.send;
  $("freeBtn").textContent = (S.handsFree ? "\u25CF " : "\u25CB ") + L.handsFree;
  $("freeBtn").className = "toggle" + (S.handsFree ? " on" : "");
  $("micBtn").textContent = S.listening ? L.listening : L.speak;
  $("micBtn").className = "big" + (S.listening ? " live" : "");
  $("micBtn").disabled = S.busy;
  $("hintBtn").disabled = !S.hint;
  $("repeatBtn").disabled = !S.turns.some((x) => !x.me);

  if (S.hint && S.hintOpen) { $("hintText").textContent = S.hint; $("hintBox").classList.remove("hidden"); }
  else $("hintBox").classList.add("hidden");

  $("log").innerHTML = S.turns.map((x, i) => `
    <div class="turn">
      <div class="tag ${x.me ? "me" : ""}">${x.me ? L.you : esc(A.tag)}</div>
      <div style="flex:1">
        <div class="said">${x.me ? esc(x.text) : tappable(x.text, i)}</div>
        ${!x.me && x.wsave ? `<div class="wsave">${x.wsave.pending ? "…" : `⭐ ${esc(x.wsave.de)} — ${esc(x.wsave.tr)}`}</div>` : ""}
        ${x.me ? "" : `<div style="margin-top:5px">
            <button class="mini" data-play="${i}">&#9834;</button>
            <button class="mini" data-tr="${i}">${L.show}</button></div>`}
        ${!x.me && x.open ? `<div class="sub">${esc(x.tr)}</div>` : ""}
        ${x.me && x.fix ? `<div class="fix">${esc(x.fix)}</div>${x.corrected ? `<div style="margin-top:4px"><button class="mini" data-say="${i}">&#9654; ${L.sayIt}</button></div>` : ""}` : ""}
      </div>
    </div>`).join("") + (S.busy ? '<div class="turn" style="opacity:.5">· · ·</div>' : "");

  const showTapHint = S.turns.some((x) => !x.me) && loadWords().length < 5;
  $("tapHint").textContent = L.tapWordHint;
  $("tapHint").classList.toggle("hidden", !showTapHint);

  $("log").querySelectorAll("[data-w]").forEach((b) =>
    b.onclick = () => saveWordTap(+b.dataset.ti, b.dataset.w));
  $("log").querySelectorAll("[data-play]").forEach((b) =>
    b.onclick = () => speak(S.turns[+b.dataset.play].text, true));
  $("log").querySelectorAll("[data-say]").forEach((b) =>
    b.onclick = () => speak(S.turns[+b.dataset.say].corrected, true));
  $("log").querySelectorAll("[data-tr]").forEach((b) =>
    b.onclick = () => { const x = S.turns[+b.dataset.tr]; x.open = !x.open; renderCall(); });
  $("log").scrollTop = $("log").scrollHeight;
}

function show(which) {
  ["setup","call","done","mistakes","drill","vocab","prep"].forEach((id) => $(id).classList.toggle("hidden", id !== which));
}

/* ---------- end-of-call evaluation ---------- */
async function evaluateCall() {
  const spoke = S.turns.some((x) => x.me);
  const L = t();
  if (!spoke) { $("evalBox").innerHTML = ""; return; }
  $("evalBox").innerHTML = `<div class="label" style="margin:0">${esc(L.evalTitle)}</div><p class="note">${esc(L.evalLoading)}</p>`;
  const help = HELP_LANG[S.lang] || "English";
  const transcript = S.turns.map((x) => `${x.me ? "LEARNER" : "OTHER"}: ${x.text}`).join("\n");
  try {
    const res = await chatFetch({
      system: `You evaluate a German ${(S.active || S.scenario).kind === "face" ? "face-to-face" : "phone-call"} role-play by a learner at CEFR level ${S.level}. The learner's goal was: ${S.currentGoal}. Return ONLY a JSON object, no markdown, with keys: "achieved" (true/false/"partial" - did the learner reach the goal), "comment" (2 sentences in ${help}: what went well and overall impression), "tips" (array of at most 3 short concrete tips in ${help} to improve, most important first).`,
      messages: [{ role: "user", content: `Transcript of the call:\n${transcript}` }],
    });
    const data = await res.json();
    const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = raw.replace(/```json|```/g, "").trim();
    const p = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    const badge = p.achieved === true ? "✅" : p.achieved === "partial" ? "🟡" : "❌";
    if (p.achieved === true) { addXp(25); confettiBurst(); }
    $("evalBox").innerHTML =
      (p.achieved === true ? `<div class="goal-hit">🏆 ${esc(L.goalHit)} <span class="chip">+25 XP</span></div>` : "") +
      `<div class="label" style="margin:0">${esc(L.evalTitle)} ${badge}</div>` +
      `<p style="font-size:14.5px;line-height:1.5;margin:10px 0 6px">${esc(p.comment)}</p>` +
      (Array.isArray(p.tips) && p.tips.length
        ? `<ul style="margin:6px 0 0;padding-left:20px">${p.tips.map((tip) => `<li style="font-size:13.5px;line-height:1.5;margin-top:4px">${esc(tip)}</li>`).join("")}</ul>`
        : "");
  } catch (e) {
    $("evalBox").innerHTML = `<div class="label" style="margin:0">${esc(L.evalTitle)}</div><p class="note">${esc(L.evalFail)}</p>`;
  }
}

/* ---------- pre-call preparation: produce German from your own language ---------- */
let P = null;
async function startPrep() {
  const L = t();
  P = { steps: null, i: 0, revealed: false, failed: false, done: false,
        listening: false, verdict: null, heard: null, err: null };
  $("prepTitle").textContent = L.prepTitle;
  $("prepSub").textContent = S.scenario.id === "custom" ? S.customTopic : `${S.scenario.de} · ${S.scenario.who}`;
  $("prepBack").textContent = L.back;
  show("prep");
  renderPrep();
  try {
    const deck = await loadDeck();
    // smallest words first, then a few mini sentences - the level-zero ladder
    const words = deck.slice().sort((a, b) => normDe(a.de).length - normDe(b.de).length)
      .slice(0, 6).map((x) => ({ de: x.de, tr: x.tr }));
    const sents = deck.filter((x) => x.ex).slice(0, 3).map((x) => ({ de: x.ex, tr: x.exTr || "" }));
    P.steps = words.concat(sents);
  } catch (e) { P.failed = true; }
  renderPrep();
}
function renderPrep() {
  const L = t();
  if (P.failed) {
    $("prepBody").innerHTML =
      `<p class="note">${esc(L.vocabFail)}</p>
       <button class="ghost" style="width:100%;margin-top:12px" data-pa="reload">${esc(L.retry)}</button>`;
  } else if (!P.steps) {
    $("prepBody").innerHTML = `<p class="note">${esc(L.vocabLoading)}</p>`;
  } else if (P.i >= P.steps.length) {
    if (!P.done) { P.done = true; PREPPED.add(S.scenario.id); addXp(10); markDay("vocabDays"); confettiBurst(); }
    $("prepBody").innerHTML =
      `<div class="said" style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700">🎉 ${esc(L.ready)}</div>
       <div style="margin-top:10px"><span class="chip">+10 XP</span></div>
       <button class="big" data-pa="go" style="margin-top:20px">${S.scenario.kind === "face" ? "💬 " + esc(L.startNow) : "📞 " + esc(L.startNow)}</button>`;
  } else {
    const st = P.steps[P.i];
    $("prepBody").innerHTML =
      `<div class="drill-prog">${P.i + 1} / ${P.steps.length}</div>
       <div class="v-card" data-pa="card" style="margin-top:10px">
         ${P.revealed
           ? `<div class="v-de">${esc(st.de)}</div><div class="v-tr">${esc(st.tr)}</div><div class="v-flip">&#9834;</div>`
           : `<div class="v-flip">${esc(L.howSay)}</div><div class="v-de">${esc(st.tr)}</div><div class="v-flip">${esc(L.dontKnow)} &darr;</div>`}
       </div>
       ${verdictHTML(P, L)}
       <div class="row">
         ${P.revealed
           ? `<button class="ghost" data-pa="hear">&#9834; ${esc(L.sayIt)}</button>`
           : `<button class="ghost" data-pa="reveal">${esc(L.dontKnow)}</button>`}
         <button class="ghost" data-pa="say" ${P.listening ? "disabled" : ""}>${P.listening ? esc(L.listening) : esc(L.sayWord)}</button>
       </div>
       <div class="row"><button class="ghost" data-pa="next">${esc(L.next)} &rsaquo;</button></div>`;
  }
  $("prepBody").querySelectorAll("[data-pa]").forEach((b) => b.onclick = () => {
    const st = P.steps && P.steps[P.i];
    switch (b.dataset.pa) {
      case "reload": startPrep(); break;
      case "go": stopAudio(); speechSynthesis.cancel(); startConversation(); break;
      case "hear": if (st) speak(st.de, true); break;
      case "say": if (st) listenFor(st.de, P, renderPrep); break;
      case "card":
        if (!st) break;
        if (P.revealed) { speak(st.de, true); break; }
        // falls through to reveal behaviour below
      case "reveal":
        if (!st) break;
        P.revealed = true; renderPrep();
        // show it, say it, then the mic opens so the learner repeats it
        speak(st.de, true, () => { if (P && P.steps && P.steps[P.i] === st && P.revealed && !P.listening) listenFor(st.de, P, renderPrep); });
        break;
      case "next":
        stopAudio(); speechSynthesis.cancel();
        P.i++; P.revealed = false; P.verdict = null; P.heard = null; P.err = null;
        renderPrep();
        break;
    }
  });
}

/* ---------- wiring ---------- */
function startConversation() {
  const REAL = SCENARIOS.filter((x) => x.goals);
  if (S.scenario.id === "custom") {
    const topic = ($("customTopic").value || "").trim();
    if (!topic) { $("customTopic").focus(); return; }
    S.customTopic = topic; saveSettings();
    S.active = { id:"custom", who:"Freies Gespräch", tag:"FREI",
      role:"the person who would naturally answer the phone for the situation the learner describes",
      place:"the appropriate business, office or organisation",
      goals:[topic] };
  } else if (S.scenario.id === "random") {
    S.active = REAL[Math.floor(Math.random() * REAL.length)];
  } else {
    S.active = S.scenario;
  }
  S.turns = []; S.hint = null; S.hintOpen = false; S.seconds = 0; S.handsFree = true;
  const g = S.active.goals;
  S.currentGoal = g[Math.floor(Math.random() * g.length)];
  show("call"); alertMsg(null); renderCall();
  acquireWakeLock();
  clearInterval(S.timerId);
  S.timerId = setInterval(() => { S.seconds++; $("timer").textContent = timerText(); }, 1000);
  ask();
}
/* At A0 the call button routes through preparation first - beginners want
   words in their head before the phone rings. Once prepared (or after
   choosing to leave the warm-up), the gate opens for that scenario. */
const PREPPED = new Set();
function canPrep() {
  return S.scenario.id !== "random" && !(S.scenario.id === "custom" && !(S.customTopic || "").trim());
}
function goCall() {
  if (S.level === "A0" && canPrep() && !PREPPED.has(S.scenario.id)) startPrep();
  else startConversation();
}
$("callBtn").onclick = goCall;
$("hangBtn").onclick = () => {
  S.handsFree = false;
  clearInterval(S.timerId);
  S.timerId = null;
  releaseWakeLock();
  speechSynthesis.cancel();
  stopAudio();
  try { S.rec && S.rec.abort(); } catch (e) {}
  const L = t();
  $("doneTitle").textContent = (S.active || S.scenario).kind === "face" ? L.endedTalk : L.ended;
  $("againBtn").textContent = L.again;
  const fixes = S.turns.filter((x) => x.me && x.fix);
  $("review").innerHTML = `<div class="label" style="margin:0">${esc(L.review)} · ${mmss()}</div>` +
    (fixes.length ? fixes.map((x, i) => `<div style="margin-top:14px"><div class="said">${esc(x.text)}</div><div class="fix">${esc(x.fix)}</div>${x.corrected ? `<div style="margin-top:4px"><button class="mini" data-sayr="${i}">&#9654; ${L.sayIt}</button></div>` : ""}</div>`).join("")
                  : '<p class="note">—</p>');
  $("review").querySelectorAll("[data-sayr]").forEach((b) =>
    b.onclick = () => speak(fixes[+b.dataset.sayr].corrected, true));
  $("replayBtn").textContent = "▶ " + L.replayAll;
  $("replayBtn").classList.toggle("hidden", !S.turns.length);
  const gained = recordCall();
  $("xpChip").textContent = "+" + gained + " XP";
  $("xpChip").classList.toggle("hidden", !gained);
  show("done");
  evaluateCall();
};
$("againBtn").onclick = () => { stopAudio(); speechSynthesis.cancel(); show("setup"); renderSetup(); };
function openDrawer() { $("drawer").classList.add("open"); $("drawerBack").classList.remove("hidden"); }
function closeDrawer() { $("drawer").classList.remove("open"); $("drawerBack").classList.add("hidden"); }
$("menuBtn").onclick = openDrawer;
$("pickedCard").onclick = openDrawer;
$("drawerBack").onclick = closeDrawer;
$("drawerClose").onclick = closeDrawer;
$("replayBtn").onclick = () => {
  stopAudio(); speechSynthesis.cancel();
  let i = 0;
  const next = () => {
    if (i >= S.turns.length) return;
    const turn = S.turns[i++];
    speak(turn.me ? (turn.corrected || turn.text) : turn.text, false, next);
  };
  next();
};
$("mistakesBtn").onclick = () => { renderMistakes(); show("mistakes"); };
$("drillBtn").onclick = () => startDrill();
$("drillBack").onclick = () => { stopAudio(); speechSynthesis.cancel(); show("setup"); renderSetup(); };
$("vocabBtn").onclick = () => startVocab();
$("prepBtn").onclick = () => startPrep();
$("prepBack").onclick = () => {
  stopAudio(); speechSynthesis.cancel();
  PREPPED.add(S.scenario.id); // leaving the warm-up counts as "seen it" - don't gate again
  show("setup"); renderSetup();
};
$("vocabBack").onclick = () => {
  stopAudio(); speechSynthesis.cancel();
  if (V && V.stage === "deck") startVocab();     // back to the deck chooser first
  else { show("setup"); renderSetup(); }
};
$("backBtn").onclick = () => { show("setup"); renderSetup(); };
$("ankiBtn").onclick = () => exportAnki();
$("clearBtn").onclick = () => {
  if (confirm(t().clearConfirm)) { localStorage.removeItem(FIX_KEY); renderMistakes(); }
};
$("micBtn").onclick = () => listen();
document.querySelectorAll("[data-sos]").forEach((b) =>
  b.onclick = () => { if (!S.busy) send(b.dataset.sos); });
$("freeBtn").onclick = () => { S.handsFree = !S.handsFree; renderCall(); };
$("repeatBtn").onclick = () => {
  for (let i = S.turns.length - 1; i >= 0; i--) if (!S.turns[i].me) { speak(S.turns[i].text, true); break; }
};
$("hintBtn").onclick = () => { S.hintOpen = !S.hintOpen; renderCall(); };
$("typeBtn").onclick = () => $("typeRow").classList.toggle("hidden");
$("sendBtn").onclick = () => send($("draft").value);
$("customTopic").oninput = (e) => { S.customTopic = e.target.value; };
$("draft").onkeydown = (e) => { if (e.key === "Enter") send($("draft").value); };

renderSetup();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
