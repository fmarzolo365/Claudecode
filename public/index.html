<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f1e5" />
<meta name="application-name" content="Marzi" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Marzi" />
<title>Marzi — Learn German by speaking</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Marzi design tokens (master spec §6/§17), grafted natively per ADR-9.
     Legacy variable names stay as aliases so every existing rule keeps working. */
  :root {
    --bg: #fcf8f0;
    --card: #fffdf8;
    --surface-soft: #f1ead9;
    --surface-strong: #e8dfc9;
    --ink: #17140f;
    --muted: #6e685f;
    --line: rgba(23, 20, 15, .14);
    --primary: #547c2c;
    --primary-hover: #496b26;
    --primary-active: #3e5a20;
    --primary-soft: #e8f1dc;
    --marzi-dark: #2f5f1c;
    --coin: #f2b72f;
    --yellow: var(--primary);             /* legacy alias */
    --yellow-deep: var(--primary-active); /* legacy alias */
    --red: #c94638;
    --green: #4f8a32;
    --font-sans: "Nunito Sans", Inter, system-ui, -apple-system, sans-serif;
    --radius-sm: 12px;
    --radius: 18px;
    --radius-lg: 26px;
    --radius-xl: 34px;
    --shadow-sm: 0 2px 8px rgba(34, 27, 15, .08);
    --shadow: 0 8px 24px rgba(34, 27, 15, .12);
    --shadow-lg: 0 18px 50px rgba(34, 27, 15, .18);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    /* MARZI-002 shell scales: spacing + type. New chrome and every future
       screen use these instead of ad-hoc pixel values. */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
    --text-xs: 11px; --text-sm: 13px; --text-md: 15px; --text-lg: 19px; --text-xl: 26px;
    /* Design-system tokens (docs/DESIGN_SYSTEM.md). Components below read
       ONLY from these - no ad-hoc durations, icon sizes or hit areas. */
    --dur-fast: .15s; --dur: .25s; --dur-slow: .6s;
    --ease: cubic-bezier(.4, 0, .2, 1); --ease-pop: cubic-bezier(.3, 1.7, .4, 1);
    --icon-xxs: 11px; --icon-xs: 12px; --icon-sm: 13px; --icon-chip: 14px;
    --icon-btn: 15px; --icon-md: 16px; --icon-lg: 18px; --icon-xl: 20px;
    --icon-hero: 22px; --icon-jumbo: 34px;
    --touch-min: 48px; --touch-lg: 56px;
    --call-bg: #100c08;
    --call-stack: 92px;
    --avatar-sm: 48px; --avatar-md: 56px; --avatar-lg: 92px; --avatar-xl: 112px;
    /* Wave 1B premium shell palette (contracts/design-tokens.json). Raw
       values live ONLY here; the shell remaps the legacy tokens to these
       outside the call, so the frozen Gold Call keeps its exact pixels. */
    --pm-bg: #fff7e8; --pm-surface: #fffdf8; --pm-soft: #e8f5e9;
    --pm-primary: #2e7d32; --pm-deep: #1b5e20; --pm-gold: #f5b84c;
    --pm-coral: #f28a65; --pm-ink: #20211f; --pm-muted: #6e6f68;
    --pm-border: rgba(46, 125, 50, .14);
    --shadow-nav: 0 -8px 28px rgba(57, 51, 39, .08);
    --shadow-pm: 0 8px 24px rgba(57, 51, 39, .08);
    /* MARZI UI PRODUCTION V2 tokens (contracts/DESIGN_TOKENS.json). All raw
       values live here; pm2 rules below consume only these. */
    --pm2-cream: #fefaf2; --pm2-surface: #fffdf8; --pm2-surface-alt: #f6f7ee;
    --pm2-soft-green: #e8f3e6; --pm2-green: #2e7d32; --pm2-green-deep: #1f5e24;
    --pm2-green-pressed: #225f27; --pm2-gold: #f5b84c; --pm2-coral: #ff8a65;
    --pm2-lavender: #a78bfa; --pm2-ink: #1a1a1a; --pm2-muted: #6b7280;
    --pm2-line: rgba(31, 94, 36, .12); --pm2-danger: #c64e43; --pm2-danger-bg: #fff1ee;
    --pm2-white: #fff; --pm2-track: #e9e9df; --pm2-green-grad: #69a848;
    --pm2-talk-on: #dff2dd; --pm2-hero-tint: #f3f8ed;
    --pm2-r-sm: 12px; --pm2-r-md: 18px; --pm2-r-lg: 24px; --pm2-r-pill: 999px;
    --pm2-shadow-card: 0 8px 24px rgba(53, 48, 37, .08);
    --pm2-shadow-nav: 0 -8px 26px rgba(53, 48, 37, .07);
    --pm2-shadow-chip: 0 4px 12px rgba(53, 48, 37, .05);
    --pm2-shadow-row: 0 5px 16px rgba(53, 48, 37, .05);
    --pm2-ease: cubic-bezier(.2, .7, .2, 1); --pm2-micro: 160ms; --pm2-screen: 220ms;
    --pm2-fs-page: 28px; --pm2-lh-page: 34px;
    --pm2-fs-sub: 14px; --pm2-lh-sub: 20px;
    --pm2-fs-section: 12px; --pm2-lh-section: 16px;
    --pm2-fs-card: 17px; --pm2-lh-card: 22px;
    --pm2-fs-row: 15px; --pm2-lh-row: 20px;
    --pm2-fs-meta: 12px; --pm2-lh-meta: 17px;
    --pm2-fs-brand: 21px; --pm2-fs-tab: 11px; --pm2-lh-tab: 14px;
    --pm2-fs-tab-sm: 10px; --pm2-fs-tab-ic: 19px;
    --pm2-topbar-h: 58px; --pm2-nav-h: 72px;
    --pm2-home-tint: #f2f8ec;

    /* Extended palette (design-system reconciliation, findings 1-4).
       Every value below is the exact colour already shipping - these give
       the shared surfaces a name; they do not change any pixel. */
    --white: #fff;
    --on-primary: #fff;
    --ink-hover: #2a251c;
    --stage-line: #d9e0bd;
    --stage-from: #f7f2df;
    --stage-to: #e7edd2;
    --track: #e0dcc4;
    --xp-fill: #709820;
    --danger-ink: #a8391f;
    --danger-soft: #fdecea;
    --danger-soft-2: #fdf0ee;
    --info-ink: #2f4a8a;
    --info-soft: #eef3ff;
    --warn-ink: #8a6412;
    --warn-soft: #fdf4e3;
    --paper: #fdfbf5;
    --paper-2: #fdfbf2;
    --paper-3: #fffdf6;
    --paper-4: #fffdf4;
    --leaf-soft: #edf4df;
    --leaf-soft-2: #edf5e3;
    --leaf-soft-3: #eaf2df;
    --leaf-soft-4: #f4f8ea;
    --leaf-soft-5: #edf2d9;
    --leaf-soft-6: #f1f3de;
    --leaf-line: #dde3c6;
    --leaf-mid: #bdd28f;
    --sand: #f8f3e8;
    --sand-2: #f9f7ec;
    --sand-3: #e6dfc8;
    --disabled-fill: #d9d2c2;
    --coin-ink: #a8761f;
    --coin-deep: #4a3208;
    --coin-soft: #fdf3d3;
    /* alpha overlays used in more than one place */
    --tint-primary-04: rgba(95,150,45,.10);
    --tint-primary-12: rgba(95,150,45,.12);
    --tint-primary-35: rgba(95,150,45,.35);
    --tint-leaf-35: rgba(85,122,50,.35);
    --tint-danger-35: rgba(168,57,31,.35);
    --tint-info-28: rgba(47,74,138,.28);
    --tint-ink-30: rgba(22,19,13,.3);
    --tint-ink-04: rgba(22,19,13,.04);
    --tint-teal-12: rgba(46,125,91,.12);
    /* Animation scale - exact shipped timings */
    --dur-xfast: .1s; --dur-snap: .2s; --dur-med: .35s; --dur-slower: 1s;
    --loop-glow: 1.3s; --loop-pulse: 1.4s; --loop-bob: 3.4s; --loop-drift: 5.2s;
    /* Fine type ramp: the exact sizes shipping today. Consolidating these
       into the semantic scale changes pixels and needs board sign-off. */
    --text-f8: 8px; --text-f8-5: 8.5px; --text-f9: 9px; --text-f10: 10px;
    --text-f10-5: 10.5px; --text-f11-5: 11.5px; --text-f12: 12px; --text-f12-5: 12.5px;
    --text-f13-5: 13.5px; --text-f14: 14px; --text-f16: 16px; --text-f17: 17px;
    --text-f18: 18px; --text-f20: 20px; --text-f24: 24px; --text-f27: 27px;
    --text-f7-5: 7.5px; --text-f14-5: 14.5px; --text-f15-5: 15.5px; --text-f21: 21px;
    --text-f22: 22px; --text-f23: 23px; --text-f64: 64px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at top, rgba(255, 255, 255, .72), transparent 34%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 560px; margin: 0 auto;
    padding: 14px 16px calc(90px + var(--safe-bottom));
  }
  /* the call screen hides the bottom nav, so it doesn't need to clear it */
  body.in-call main { padding-bottom: calc(10px + var(--safe-bottom)); }
  /* MARZI-005: the call fills exactly one screen - the transcript is the
     flexible middle, so alerts or the type row never push the page taller */
  body.in-call main {
    height: calc(100dvh - 64px); display: flex; flex-direction: column; overflow: hidden;
  }
  body.in-call #call { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  body.in-call #call .log { flex: 1 1 auto; min-height: 104px; max-height: none; }
  /* ---------- app shell: sticky top bar + fixed bottom navigation ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid var(--line);
    background: rgba(247, 241, 229, .92);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .topbar-in {
    width: 100%; max-width: 560px; height: 64px; margin: 0 auto; padding: 0 var(--space-2);
    display: flex; align-items: center; gap: 6px;
  }
  .wordmark {
    font-family: var(--font-sans); font-size: var(--text-xl); font-weight: 800;
    letter-spacing: -.04em; color: var(--marzi-dark); flex: 0 0 auto; white-space: nowrap;
  }
  .topbar .grow { flex: 1 1 auto; min-width: 0; }
  .chip-res {
    display: inline-flex; align-items: center; gap: 5px;
    font: 800 var(--text-sm) var(--font-sans); color: var(--ink); white-space: nowrap;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 8px; box-shadow: var(--shadow-sm); cursor: pointer; min-height: 34px;
  }
  .chip-res .ic { color: var(--coin); }
  .chip-res.streak .ic { color: var(--primary); }
  .chip-res.mins .ic { color: var(--marzi-dark); }
  .chip-res.gear { padding: 7px 9px; }
  .chip-res.gear .ic { color: var(--muted); }
  /* Small phones (360px class) cannot fit the four resource chips at full
     spacing once the coin balance reaches four digits, and the row then gave
     the whole page horizontal scroll. Tighten only below the width where it
     stops fitting, so 390px and up render unchanged. The gear keeps its
     padding: it is the last chip, and its centred hit area needs the width. */
  @media (max-width: 380px) {
    .topbar-in { gap: 4px; }
    .chip-res { padding: 7px 6px; }
    .chip-res.gear { padding: 7px 9px; }
  }
  /* ---- MARZI-002 reusable shell primitives ----
     .card and .btn are the base components every future screen composes;
     existing page classes keep their look and migrate onto these over time. */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-sm);
    padding: var(--space-3) var(--space-4);
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    border: none; cursor: pointer; border-radius: 999px; min-height: var(--touch-min);
    padding: 0 var(--space-4); font: 700 var(--text-sm) var(--font-sans);
    background: var(--surface-strong); color: var(--ink);
  }
  .btn.primary { background: var(--primary); color: var(--white); }
  .btn.primary:hover { background: var(--primary-hover); }
  .btn.primary:active { background: var(--primary-active); }
  /* ================= MARZI UI PRODUCTION V2 — SHELL CSS =================
     Adapted from reference-code/css/premium-shell-v2.css. Token-only: every
     raw value lives in :root. Kept out of body.in-call (frozen Gold Call). */
  body:not(.in-call).pm2 { background: var(--pm2-cream); color: var(--pm2-ink); }
  .pm2-bottomnav {
    position: fixed; z-index: 40; inset-inline: 0; inset-block-end: 0;
    padding: 7px 8px calc(7px + var(--safe-bottom));
    background: var(--pm2-surface);
    box-shadow: var(--pm2-shadow-nav); border-block-start: 1px solid var(--pm2-line);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .pm2-bottomnav-inner {
    inline-size: min(100%, 560px); margin-inline: auto;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;
  }
  .pm2-tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; min-inline-size: 0; min-block-size: 58px; padding: 5px 2px;
    border: 0; border-radius: 17px; background: transparent; cursor: pointer;
    color: var(--pm2-muted);
    font: 800 var(--pm2-fs-tab) / var(--pm2-lh-tab) var(--font-sans);
  }
  .pm2-tab-ic {
    display: grid; place-items: center; inline-size: 30px; block-size: 30px;
    border-radius: var(--pm2-r-sm);
    transition: background var(--pm2-micro) var(--pm2-ease), transform var(--pm2-micro) var(--pm2-ease);
  }
  .pm2-tab[aria-current="page"] { color: var(--pm2-green-deep); }
  .pm2-tab[aria-current="page"] .pm2-tab-ic { background: var(--pm2-soft-green); transform: translateY(-1px); }
  .pm2-tab[data-tab="talk"] .pm2-tab-ic { border: 1px solid var(--pm2-line); }
  .pm2-tab[data-tab="talk"][aria-current="page"] .pm2-tab-ic { background: var(--pm2-talk-on); }
  /* component primitives (phase 0: available; roots adopt them per phase) */
  .pm2-screen { inline-size: min(100%, 560px); margin-inline: auto; }
  .pm2-page-title { margin: 0; font: 900 var(--pm2-fs-page) / var(--pm2-lh-page) var(--font-sans); letter-spacing: -.025em; }
  .pm2-page-sub { margin: 4px 0 0; color: var(--pm2-muted); font: 600 var(--pm2-fs-sub) / var(--pm2-lh-sub) var(--font-sans); }
  .pm2-section { margin-block-start: 20px; }
  .pm2-section-title {
    margin: 0 0 9px; color: var(--pm2-green-deep); text-transform: uppercase;
    font: 900 var(--pm2-fs-section) / var(--pm2-lh-section) var(--font-sans); letter-spacing: .09em;
  }
  .pm2-card { border: 1px solid var(--pm2-line); border-radius: var(--pm2-r-md); background: var(--pm2-surface); box-shadow: var(--pm2-shadow-card); }
  .pm2-card--hero { border-radius: 22px; overflow: hidden; }
  .pm2-card-pad { padding: 16px; }
  .pm2-card-title { font: 900 var(--pm2-fs-card) / var(--pm2-lh-card) var(--font-sans); }
  .pm2-card-meta { margin-block-start: 2px; color: var(--pm2-muted); font: 650 var(--pm2-fs-meta) / var(--pm2-lh-meta) var(--font-sans); }
  .pm2-row {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    inline-size: 100%; min-block-size: 64px; padding: 10px 12px; cursor: pointer;
    border: 1px solid var(--pm2-line); border-radius: 16px; background: var(--pm2-surface);
    box-shadow: var(--pm2-shadow-row); color: var(--pm2-ink); text-align: start;
  }
  .pm2-row + .pm2-row { margin-block-start: 9px; }
  .pm2-row-icon { display: grid; place-items: center; inline-size: 42px; block-size: 42px; border-radius: var(--pm2-r-sm); background: var(--pm2-soft-green); color: var(--pm2-green-deep); }
  .pm2-row-copy { min-inline-size: 0; display: grid; }
  .pm2-row-title { font: 850 var(--pm2-fs-row) / var(--pm2-lh-row) var(--font-sans); }
  .pm2-row-meta { color: var(--pm2-muted); font: 600 var(--pm2-fs-meta) / var(--pm2-lh-meta) var(--font-sans); }
  .pm2-row-end { color: var(--pm2-muted); font-weight: 900; }
  .pm2-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-block-size: var(--touch-min); padding: 0 18px; border-radius: var(--pm2-r-pill);
    border: 1px solid transparent; cursor: pointer; text-decoration: none;
    font: 900 var(--pm2-fs-sub) / var(--pm2-lh-sub) var(--font-sans);
    transition: transform var(--pm2-micro) var(--pm2-ease), background var(--pm2-micro) var(--pm2-ease);
  }
  .pm2-btn:active { transform: translateY(1px); }
  .pm2-btn--primary { background: var(--pm2-green); color: var(--pm2-white); }
  .pm2-btn--primary:active { background: var(--pm2-green-pressed); }
  .pm2-btn--secondary { background: var(--pm2-surface); color: var(--pm2-green-deep); border-color: var(--pm2-line); }
  .pm2-progress { overflow: hidden; block-size: 8px; border-radius: var(--pm2-r-pill); background: var(--pm2-track); }
  .pm2-progress > span { display: block; block-size: 100%; inline-size: var(--pm2-progress, 0%); border-radius: inherit; background: linear-gradient(90deg, var(--pm2-green), var(--pm2-green-grad)); }
  .pm2-portrait { inline-size: 54px; block-size: 54px; border-radius: 16px; object-fit: cover; background: var(--pm2-surface-alt); }
  .pm2-portrait--round { border-radius: 50%; }
  .pm2-people { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px 6px; }
  .pm2-people::-webkit-scrollbar { display: none; }
  .pm2-person { flex: 0 0 74px; text-align: center; border: 0; background: none; cursor: pointer; color: var(--pm2-ink); font: 800 var(--pm2-fs-tab) / var(--pm2-lh-tab) var(--font-sans); }
  .pm2-person img { inline-size: 60px; block-size: 60px; border-radius: var(--pm2-r-md); object-fit: cover; border: 1px solid var(--pm2-line); background: var(--pm2-surface); }
  .pm2-settings-group { overflow: hidden; border: 1px solid var(--pm2-line); border-radius: var(--pm2-r-md); background: var(--pm2-surface); box-shadow: var(--pm2-shadow-card); }
  .pm2-settings-group .pm2-row { border: 0; border-radius: 0; box-shadow: none; }
  .pm2-settings-group .pm2-row + .pm2-row { margin: 0; border-block-start: 1px solid var(--pm2-line); }
  .pm2-empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 28px 18px; border: 1px dashed var(--pm2-line); border-radius: var(--pm2-r-md); background: var(--pm2-surface); color: var(--pm2-muted); }
  @media (max-width: 370px) { .pm2-tab { font-size: var(--pm2-fs-tab-sm); } }
  [dir="rtl"] .pm2-row-end { transform: scaleX(-1); }
  [dir="rtl"] .pm2-people { direction: rtl; }
  body.in-call .pm2-bottomnav { display: none; }
  /* ============== MARZI HOME V1 (reference-code/css/home-v1.css) ============== */
  .pm-home-legacy { display: none; }
  .pm-home { padding-block-start: 4px; }
  .pm-home-hero {
    display: grid; grid-template-columns: minmax(0, 1fr) 124px;
    min-block-size: 148px; align-items: end; padding: 16px 14px 0 16px;
    background:
      radial-gradient(circle at 82% 22%, rgba(245, 184, 76, .16), transparent 80px),
      linear-gradient(135deg, var(--pm2-surface), var(--pm2-home-tint));
  }
  .pm-home-hero-copy { align-self: center; padding-block-end: 18px; min-inline-size: 0; }
  .pm-home-marzi { align-self: end; display: grid; place-items: end center; min-block-size: 132px; }
  .pm-home-marzi img { display: block; max-inline-size: 122px; max-block-size: 140px; object-fit: contain; }
  .pm-home-rec {
    display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px;
    align-items: center; overflow: hidden; padding: 16px 12px 16px 16px;
  }
  .pm-home-rec-copy { min-inline-size: 0; }
  .pm-home-rec-kicker {
    color: var(--pm2-muted); text-transform: uppercase; letter-spacing: .07em;
    font: 800 var(--pm2-fs-tab) / var(--pm2-lh-tab) var(--font-sans);
  }
  .pm-home-rec-copy .pm2-btn { margin-block-start: 12px; min-inline-size: 112px; }
  .pm-home-rec-reason { margin-block-start: 6px; color: var(--pm2-green-deep); font: 800 var(--pm2-fs-meta) / var(--pm2-lh-meta) var(--font-sans); }
  .pm-home-rec-art {
    inline-size: 96px; block-size: 108px; object-fit: cover; object-position: 50% 24%;
    border-radius: 16px; background: var(--pm2-surface-alt);
  }
  .pm-home-rec-art.is-hidden { display: none; }
  .pm-home-journey-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-block-end: 10px; }
  .pm-home-journey[role="button"] { cursor: pointer; }
  .pm-home-journey[role="button"]:focus-visible { outline: 3px solid var(--pm2-green); outline-offset: 3px; }
  .pm-home-error { margin-block-start: 10px; }
  /* legacy journey detail stays out of the initial Home viewport; the premium
     journey summary is its only gateway */
  .pm-home-jr-collapsed { display: none; }
  /* ============== MARZI PRACTICE V1 (reference-code/css/practice-v1.css) ============== */
  .pm-practice .pm-practice-continue {
    display: grid; gap: 10px;
    background: linear-gradient(135deg, var(--pm2-surface), var(--pm2-home-tint));
  }
  .pm-practice .pm-practice-continue .pm2-btn { justify-self: start; }
  .pm-practice .pm2-section + .pm2-section { margin-block-start: 22px; }
  /* ============== MARZI TALK ROOT V1 ============== */
  .pm-talk-root .pm-talk-continue {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: 12px;
  }
  .pm-talk-continue .pm2-portrait { inline-size: 64px; block-size: 64px; }
  /* gold portraits are 1600x1800 bottom-anchored frames: crop toward the face */
  .pm-talk-root .pm2-person img, .pm-talk-continue .pm2-portrait { object-position: 50% 18%; }
  .pm-talk-continue .char-face { inline-size: 64px; block-size: 64px; border-radius: 16px; overflow: hidden; }
  .pm-talk-root .pm2-person[aria-pressed="true"] { background: var(--pm2-soft-green); border-radius: var(--pm2-r-md); }
  .pm-talk-root .pm2-person[aria-pressed="true"] img { border: 2px solid var(--pm2-green); }
  .pm-talk-root .pm2-person[aria-pressed="true"] span { color: var(--pm2-green-deep); font-weight: 900; }
  .pm-talk-root .pm2-person { padding: 6px 4px; min-block-size: var(--touch-min); }
  .pm2-person-more .pm2-more-ic {
    display: grid; place-items: center; inline-size: 60px; block-size: 60px;
    border-radius: var(--pm2-r-md); border: 1px dashed var(--pm2-line);
    background: var(--pm2-surface-alt); color: var(--pm2-green-deep);
  }
  .pm-practice .pm2-row-end.pm-count {
    display: grid; place-items: center; min-inline-size: 26px; block-size: 26px;
    padding: 0 6px; border-radius: var(--pm2-r-pill);
    background: var(--pm2-soft-green); color: var(--pm2-green-deep);
    font: 800 var(--pm2-fs-meta) / var(--pm2-lh-meta) var(--font-sans);
  }
  @media (max-width: 370px) {
    .pm-home-hero { grid-template-columns: minmax(0, 1fr) 104px; }
    .pm-home-marzi img { max-inline-size: 104px; }
    .pm-home-rec { grid-template-columns: minmax(0, 1fr) 82px; }
    .pm-home-rec-art { inline-size: 82px; block-size: 94px; }
  }
  @media (min-width: 520px) {
    .pm-home-hero { grid-template-columns: minmax(0, 1fr) 170px; }
    .pm-home-marzi img { max-inline-size: 160px; max-block-size: 155px; }
  }
  /* ============== MARZI STORE V1 (reference-code/css/store-v1.css) ============== */
  .pm-store .pm2-page-title { margin-block-end: 12px; }
  .pm-store-hero {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(116px, 38%);
    align-items: end; min-block-size: 168px; padding: 16px 10px 0 16px;
    background:
      radial-gradient(circle at 80% 20%, rgba(245, 184, 76, .14), transparent 90px),
      linear-gradient(135deg, var(--pm2-surface), var(--pm2-home-tint));
  }
  .pm-store-hero-copy { align-self: center; padding-block-end: 16px; min-inline-size: 0; }
  .pm-store-hero img { display: block; justify-self: center; max-inline-size: 126px; max-block-size: 148px; object-fit: contain; }
  .pm-store-coins {
    display: inline-flex; align-items: center; gap: 6px; margin-block-start: 10px;
    padding: 5px 13px; border: 1px solid var(--pm2-line); border-radius: var(--pm2-r-pill);
    background: var(--pm2-surface); color: var(--pm2-ink);
    font: 900 var(--pm2-fs-card) / var(--pm2-lh-card) var(--font-sans);
  }
  .pm-store .cat-tabs { margin-block: 16px 2px; }
  .pm-store .outfit-card {
    border: 1px solid var(--pm2-line); border-radius: var(--pm2-r-md);
    background: var(--pm2-surface); box-shadow: var(--pm2-shadow-card);
    padding-block-end: 10px; min-block-size: var(--touch-min);
  }
  /* deliberate missing-art state: a state badge on a neutral slot - it must
     read as "artwork pending", never as final outfit art */
  .pm-store-artless {
    display: grid; place-items: center; block-size: 72px; margin: 8px 8px 0;
    border: 1px dashed var(--pm2-line); border-radius: var(--pm2-r-sm);
    background: var(--pm2-surface-alt); color: var(--pm2-muted);
  }
  .pm-store .outfit-card[data-state="owned"] .pm-store-artless,
  .pm-store .outfit-card[data-state="equipped"] .pm-store-artless {
    border-style: solid; background: var(--pm2-soft-green); color: var(--pm2-green-deep);
  }
  .pm-store .outfit-card[data-state="equipped"] { border: 2px solid var(--pm2-green); }
  .pm-store .store-note { color: var(--pm2-muted); font: 600 var(--pm2-fs-meta) / var(--pm2-lh-meta) var(--font-sans); margin: 10px 2px 0; }
  .pm-store .store-item { min-block-size: var(--touch-min); }
  .pm-store .buy-btn { min-block-size: var(--touch-min); }
  /* ============== MARZI PROFILE V1 (reference-code/css/profile-v1.css) ============== */
  .pm-profile .pm2-page-title { margin-block-end: 12px; }
  .pm-profile-summary { display: grid; gap: 10px; background: linear-gradient(135deg, var(--pm2-surface), var(--pm2-home-tint)); }
  .pm-profile-id { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
  .pm-profile-id-copy { display: grid; gap: 2px; min-inline-size: 0; }
  .pm-profile-xp { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-block-start: 4px; }
  .pm-profile-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px; }
  .pm-profile-stat { display: grid; justify-items: center; text-align: center; gap: 1px; }
  .pm-profile-stat b { font: 900 var(--pm2-fs-card) / var(--pm2-lh-card) var(--font-sans); }
  .pm-profile-stat span { color: var(--pm2-muted); font: 650 var(--pm2-fs-meta) / var(--pm2-lh-meta) var(--font-sans); }
  .pm-profile .pm2-section .pm2-row { margin-block-start: 10px; }
  .pm-profile .pm2-settings-group .pm2-row { margin-block-start: 0; }
  .pm-profile-achv-lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 16px 0 9px; }
  .pm-profile-achv-lbl .pm2-section-title { margin: 0; }
  .pm-profile .achv-grid { gap: 8px; }
  .pm-profile .pm2-row-end svg { color: var(--pm2-green-deep); }
  @media (max-width: 370px) { .pm-profile-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* ===== Wave 1B premium shell: token remap outside the frozen call ===== */
  body:not(.in-call) {
    --bg: var(--pm-bg); --card: var(--pm-surface);
    --primary: var(--pm-primary); --primary-hover: var(--pm-deep); --primary-active: var(--pm-deep);
    --primary-soft: var(--pm-soft); --marzi-dark: var(--pm-deep);
    --coin: var(--pm-gold); --ink: var(--pm-ink); --muted: var(--pm-muted);
    --shadow: var(--shadow-pm);
  }
  body:not(.in-call) .bottomnav {
    background: var(--card); border-top: 1px solid var(--pm-border);
    box-shadow: var(--shadow-nav);
  }
  .brand { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
  .brand-marzi { width: 30px; height: 30px; display: inline-flex; }
  .brand-marzi svg { width: 100%; height: 100%; }
  .wordmark { color: var(--primary); }
  /* premium root-screen primitives */
  .pm-head { margin: 6px 2px 12px; }
  .pm-head h1 { margin: 0; font: 800 var(--text-xl) var(--font-sans); letter-spacing: -.01em; }
  .pm-sub { margin: 3px 0 0; color: var(--muted); font: 600 var(--text-sm) var(--font-sans); }
  .pm-sec {
    margin: 18px 2px 8px; color: var(--muted);
    font: 700 var(--text-xs) var(--font-sans); text-transform: uppercase; letter-spacing: .08em;
  }
  .pm-row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: start;
    background: var(--card); border: 1px solid var(--pm-border); border-radius: var(--radius);
    padding: 12px 14px; margin-top: 8px; cursor: pointer; min-height: var(--touch-min);
    box-shadow: var(--shadow-sm); color: var(--ink); font: 600 var(--text-md) var(--font-sans);
  }
  .pm-row-ic {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: var(--radius-sm);
    background: var(--primary-soft); color: var(--primary);
    display: grid; place-items: center;
  }
  .pm-row-tx { flex: 1 1 auto; min-width: 0; display: grid; }
  .pm-row-tx b { font-weight: 700; }
  .pm-row-tx small { color: var(--muted); font: 600 var(--text-sm) var(--font-sans); }
  .pm-row .chev { color: var(--muted); }
  .pm-card {
    background: var(--card); border: 1px solid var(--pm-border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow); padding: 14px; margin-top: 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .pm-card .char-face { border-radius: var(--radius); overflow: hidden; }
  .pm-card-tx { flex: 1 1 auto; min-width: 0; display: grid; gap: 2px; }
  .pm-card-tx small { color: var(--muted); font: 700 var(--text-xs) var(--font-sans); text-transform: uppercase; letter-spacing: .06em; }
  .pm-card-tx b { font: 800 var(--text-lg) var(--font-sans); }
  .pm-card-tx .pm-note { color: var(--muted); font: 600 var(--text-sm) var(--font-sans); text-transform: none; letter-spacing: 0; }
  .pm-go {
    flex: 0 0 auto; border: none; cursor: pointer; min-height: var(--touch-min);
    background: var(--primary); color: var(--on-primary); border-radius: var(--radius-xl);
    padding: 10px 16px; font: 800 var(--text-sm) var(--font-sans);
  }
  .ppl-rail { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .ppl-rail::-webkit-scrollbar { display: none; }
  .ppl {
    flex: 0 0 auto; display: grid; justify-items: center; gap: 5px; min-width: 72px;
    background: none; border: none; cursor: pointer; padding: 8px 4px;
    border-radius: var(--radius); color: var(--muted); font: 700 var(--text-xs) var(--font-sans);
    min-height: var(--touch-min);
  }
  .ppl .char-face { border-radius: 50%; overflow: hidden; box-shadow: var(--shadow-sm); border: 2px solid var(--card); }
  .ppl.on { background: var(--primary-soft); color: var(--primary-active); }
  .ppl.on .char-face { border-color: var(--primary); }
  .brand-card {
    background: linear-gradient(150deg, var(--paper-2), var(--leaf-soft-6));
    border: 1.5px solid var(--leaf-line); border-radius: 22px;
    box-shadow: var(--shadow); padding: 14px 16px 15px; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 54px; height: 54px; flex: 0 0 54px;
    background: var(--leaf-soft-5); border: 2px solid var(--leaf-mid); border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -3px 0 rgba(85,122,50,.10), 0 1px 2px rgba(22,19,13,.06);
  }
  .brand .word {
    font-family: var(--font-sans);
    font-size: var(--text-f23); font-weight: 700; letter-spacing: -.01em;
    color: var(--yellow-deep);
  }
  .plate { display: inline-flex; align-items: center; gap: 10px; }
  .plate span {
    font-family: var(--font-sans);
    font-size: var(--text-f20); font-weight: 800; letter-spacing: -.02em;
  }
  .tagline { font-size: var(--text-f14-5); line-height: 1.55; color: var(--muted); margin: 10px 2px 0; max-width: 460px; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: var(--text-f10-5); letter-spacing: .18em; color: var(--muted);
    margin: 16px 0 8px; text-transform: uppercase;
  }
  .label:first-of-type { margin-top: 0; }
  .list {
    border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .item {
    display: block; width: 100%; text-align: left; padding: 14px 16px;
    border: none; border-top: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; font: inherit;
    transition: background var(--dur-fast) ease;
  }
  .item:first-child, .list .label + .item { border-top: none; }
  .item:hover { background: var(--tint-primary-04); }
  .item.on { background: var(--ink); color: var(--paper); }
  .item b { font-family: var(--font-sans); font-size: var(--text-f16); font-weight: 600; display: block; letter-spacing: 0; }
  .item small { font-size: var(--text-f12-5); color: var(--muted); }
  .item.on small { color: rgba(253,251,245,.65); }
  .item[disabled] { opacity: .4; cursor: not-allowed; }
  .list .label { margin: 14px 16px 6px; }
  .seg {
    display: flex; gap: 4px; padding: 4px;
    background: var(--track); border-radius: 999px;
  }
  .seg button {
    flex: 1; padding: 9px 6px; border: none; border-radius: 999px;
    background: transparent; color: var(--ink); cursor: pointer;
    font: 600 var(--text-sm) var(--font-sans); letter-spacing: .02em;
    transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
  }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .seg.wrap { flex-wrap: wrap; }
  .seg.wrap button { flex: 1 1 31%; }
  /* level + speed side by side: one compact row on the Talk tab */
  .duo { display: flex; gap: 8px; align-items: flex-end; }
  .duo-col { flex: 1; min-width: 0; }
  .duo-col .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .duo .seg { padding: 3px; }
  .duo .seg button { padding: 7px 2px; font-size: var(--text-xs); letter-spacing: 0; }
  .note { font-size: var(--text-f12-5); margin: 10px 2px 0; color: var(--muted); }
  .note.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 8px; }
  /* primary button: green filled, white text (spec §6.4) */
  .big {
    font-family: var(--font-sans); width: 100%; min-height: 52px; padding: 12px 16px; margin-top: 16px;
    background: var(--primary); color: var(--white); border: none; font-size: var(--text-f16); font-weight: 800;
    letter-spacing: .04em; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 10px; border-radius: 999px;
    box-shadow: var(--shadow); transition: transform var(--dur-xfast) ease, background var(--dur-fast) ease;
  }
  .big:hover { background: var(--primary-hover); }
  .big:active { transform: translateY(1px); }
  .big[disabled] { opacity: .52; cursor: not-allowed; }
  .big.cta { background: var(--primary); color: var(--white); }
  .big.cta:hover { background: var(--primary-hover); }
  /* explicit call states on the mic button (review §7): ready = ink,
     listening = green + pulse, processing = neutral. Red stays reserved
     for hang-up and real errors. */
  .big[data-status] { transition: background var(--dur-snap) ease; }
  .big[data-status="ready"] { background: var(--ink); color: var(--white); }
  .big[data-status="ready"]:hover { background: var(--ink-hover); }
  .big[data-status="connecting"],
  .big[data-status="character-speaking"],
  .big[data-status="ended"] { background: var(--ink); color: var(--white); }
  .big[data-status="listening"] { background: var(--primary); color: var(--white); animation: listeningPulse var(--loop-pulse) ease-in-out infinite; }
  .big[data-status="processing"] { background: var(--disabled-fill); color: var(--ink); }
  .big[data-status="failed"] { background: var(--red); color: var(--white); }
  @keyframes listeningPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(95,150,45,.45); } 50% { box-shadow: 0 0 0 14px rgba(95,150,45,0); } }
  .bar {
    background: var(--ink); color: var(--paper); padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .bar .who { font-family: var(--font-sans); font-size: var(--text-f17); font-weight: 600; }
  .bar .meta { font-family: 'JetBrains Mono', monospace; font-size: var(--text-f10); letter-spacing: .16em; color: var(--yellow); opacity: .9; }
  .hang {
    background: var(--red); color: var(--white); border: none; padding: 0 18px;
    min-height: 48px; display: inline-flex; align-items: center; gap: 6px;
    font: 700 var(--text-f12) var(--font-sans); letter-spacing: .06em; cursor: pointer;
    border-radius: 999px; transition: filter var(--dur-fast) ease;
  }
  .vcbar {
    background: var(--card); border: 1px solid var(--line); border-bottom: none;
    padding: 10px; position: relative;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .vc-stage {
    /* landscape card so stage + transcript + SOS + mic all fit one phone screen */
    position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 140px; border-radius: 18px;
    overflow: hidden; background: linear-gradient(160deg, var(--stage-from), var(--stage-to));
    border: 2.5px solid var(--stage-line);
    display: flex; align-items: center; justify-content: center;
  }
  .vc-stage .vc-emoji { font-size: var(--text-f64); }
  .vc-stage img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    display: none; will-change: transform;
  }
  .vc-stage img.ok { display: block; }
  /* speaking glow lives on an overlay so it stays visible over the portrait;
     under prefers-reduced-motion the animation stops but the ring remains */
  .vc-stage::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; border-radius: 15px; }
  .vc-stage.speaking::after {
    box-shadow: inset 0 0 0 3px rgba(95,150,45,.6);
    animation: stageglow var(--loop-glow) ease-in-out infinite;
  }
  @keyframes stageglow {
    0%, 100% { box-shadow: inset 0 0 0 2.5px var(--tint-primary-35); }
    50% { box-shadow: inset 0 0 0 4px rgba(95,150,45,.9); }
  }
  /* chips ride on the portrait; identity moved out (MARZI-005) */
  .vc-chips { position: absolute; top: 8px; left: 10px; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; max-width: 62%; }
  .vc-timer, .vc-left {
    font-family: 'JetBrains Mono', monospace; font-size: var(--text-f10); letter-spacing: .12em;
    color: var(--yellow-deep); background: rgba(253,251,242,.92);
    border: 1px solid rgba(85,122,50,.2); padding: 5px 9px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .vc-left[data-low="1"] { color: var(--danger-ink); border-color: var(--tint-danger-35); }
  /* identity row under the portrait: full width, never truncated, Marzi beside it */
  .vc-id { display: flex; align-items: center; gap: var(--space-2); padding: 7px 4px 1px; }
  .vc-id-txt { min-width: 0; flex: 1; }
  .vc-who {
    font-family: var(--font-sans); font-size: var(--text-md); font-weight: 800;
    color: var(--ink); line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .vc-place {
    font-size: var(--text-xs); color: var(--muted); margin-top: 1px; line-height: 1.3;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* status: icon + text + colour, never colour alone */
  .call-status {
    display: flex; align-items: center; gap: 6px; margin: 4px 4px 0;
    font: 700 var(--text-xs) var(--font-sans); letter-spacing: .02em;
    border-radius: 999px; padding: 6px 10px; border: 1px solid var(--line);
    background: var(--surface-soft); color: var(--muted);
  }
  .call-status[data-state="listening"] { background: var(--primary-soft); color: var(--marzi-dark); border-color: var(--tint-leaf-35); }
  .call-status[data-state="speaking"] { background: var(--info-soft); color: var(--info-ink); border-color: var(--tint-info-28); }
  .call-status[data-state="processing"] { background: var(--surface-strong); color: var(--ink); }
  .call-status[data-state="error"] { background: var(--danger-soft); color: var(--danger-ink); border-color: var(--tint-danger-35); }
  .call-status[data-state="disconnected"] { background: var(--surface-strong); color: var(--muted); }
  .vc-stage .hang { position: absolute; top: 8px; right: 8px; z-index: 2; }
  .hang:hover { filter: brightness(1.1); }
  .log {
    background: var(--card); border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow);
    min-height: 90px; max-height: min(30dvh, 30vh); overflow-y: auto;
    overscroll-behavior: contain; padding-bottom: 8px;
  }
  /* adaptive: a growing transcript earns more guaranteed room (review §7) */
  .log:has(.turn:nth-child(3)) { min-height: 148px; }
  /* MARZI-005: chat bubbles - character left, learner right. The inner DOM
     (word-tap spans, translation/replay buttons) is unchanged. */
  .turn { padding: 8px 12px; display: flex; gap: 8px; }
  .turn.me { justify-content: flex-end; }
  .bub {
    max-width: 84%; min-width: 0; padding: 9px 13px 7px;
    border-radius: 18px; background: var(--surface-soft);
    border: 1px solid var(--line); border-bottom-left-radius: 6px;
  }
  .turn.me .bub {
    background: var(--primary-soft); border-color: rgba(85,122,50,.28);
    border-bottom-left-radius: 18px; border-bottom-right-radius: 6px;
  }
  .tag {
    display: block; font-family: 'JetBrains Mono', monospace; font-size: var(--text-f9);
    letter-spacing: .12em; color: var(--muted); margin-bottom: 3px;
  }
  .tag.me { color: var(--marzi-dark); }
  .said { font-size: var(--text-f15-5); line-height: 1.5; }
  .w { cursor: pointer; border-radius: 4px; }
  .w:active { background: var(--tint-primary-35); }
  .wsave { margin-top: 6px; font: 600 var(--text-f12-5) var(--font-sans); color: var(--green); }
  .sub { font-size: var(--text-sm); color: var(--muted); margin-top: 4px; }
  .fix { font-size: var(--text-f12-5); color: var(--red); margin-top: 4px; }
  /* MARZI-005: inline transcript actions still meet the 48px target */
  .mini {
    background: none; border: none; padding: 0 8px; font: var(--text-f12) var(--font-sans);
    color: var(--muted); text-decoration: underline; cursor: pointer; margin-right: 4px;
    display: inline-flex; align-items: center; min-height: 48px;
  }
  .mini:hover { color: var(--ink); }
  .row { display: flex; gap: 10px; margin-top: 8px; }
  .row.sos { gap: 6px; margin-top: 6px; }
  .row.sos .ghost { font-size: var(--text-f11-5); padding: 7px 4px; min-height: 48px; }
  /* secondary button: cream card (spec §6.4), 44px+ touch target */
  .ghost {
    flex: 1; min-height: 48px; padding: 10px; background: var(--card); border: 1px solid var(--line);
    color: var(--ink); font: 700 var(--text-sm) var(--font-sans); cursor: pointer;
    border-radius: 999px; box-shadow: var(--shadow-sm);
    transition: background var(--dur-fast) ease;
  }
  .ghost:hover { background: var(--tint-primary-12); }
  .ghost[disabled] { opacity: .4; cursor: not-allowed; }
  .toggle {
    width: 100%; min-height: 48px; margin-top: 6px; padding: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: 700 var(--text-f12-5) var(--font-sans);
    letter-spacing: .04em; cursor: pointer; border-radius: 999px;
    box-shadow: var(--shadow-sm); transition: background var(--dur-fast) ease;
  }
  .toggle.on { background: var(--card); border-color: var(--yellow-deep); color: var(--ink); }
  .toggle[disabled] { opacity: .4; cursor: not-allowed; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .act {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px; min-height: 48px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
    color: var(--ink); cursor: pointer; font: 700 var(--text-f12-5) var(--font-sans);
    line-height: 1.3; text-align: left; box-shadow: var(--shadow-sm);
    transition: background var(--dur-fast) ease;
  }
  .act:hover { background: var(--tint-primary-04); }
  .act[disabled] { opacity: .4; cursor: not-allowed; }
  .act .ic { flex: 0 0 auto; color: var(--yellow-deep); }
  .act.due { border-color: var(--yellow-deep); }
  .dot-due { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow-deep); margin-left: auto; flex: 0 0 auto; }
  .act.on { border-color: var(--yellow-deep); box-shadow: inset 0 0 0 1.5px var(--yellow-deep); background: var(--tint-primary-12); }
  .act.soon { opacity: .45; }
  .act.col {
    flex-direction: column; justify-content: center; gap: 4px; text-align: center;
    font-size: var(--text-xs); padding: 8px 6px; min-height: 58px;
  }
  .soon-badge {
    margin-left: auto; flex: 0 0 auto; font: 700 var(--text-f8-5) 'JetBrains Mono', monospace;
    letter-spacing: .08em; text-transform: uppercase; background: var(--track);
    color: var(--muted); border-radius: 99px; padding: 3px 7px; white-space: nowrap;
  }
  .ob-head { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 14px 0 4px; text-align: center; }
  .ob-marzi { width: 104px; height: 104px; }
  .ob-marzi svg { width: 100%; height: 100%; animation: mbob var(--loop-bob) ease-in-out infinite; }
  .ic { vertical-align: -3px; }
  .hero-streak .ic { color: var(--yellow-deep); }
  .b { font-weight: 700; }
  .b-ok { color: var(--green); }
  .b-mid { color: var(--coin-ink); }
  .b-no { color: var(--red); }
  .hero {
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; margin: -6px 0 24px;
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hero-streak { font-family: var(--font-sans); font-weight: 700; font-size: var(--text-f17); }
  .hero-streak small { font-size: var(--text-f12); color: var(--muted); font-family: var(--font-sans); font-weight: 500; }
  .week { display: flex; gap: 5px; }
  .week .d { width: 21px; text-align: center; font: 500 var(--text-f9) 'JetBrains Mono', monospace; color: var(--muted); }
  .week .dot { width: 9px; height: 9px; margin: 3px auto 0; border-radius: 50%; background: var(--sand-3); }
  .week .dot.on { background: var(--yellow-deep); }
  .week .today .dot { box-shadow: 0 0 0 2px var(--tint-ink-30); }
  .marzi-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .marzi { width: 74px; height: 74px; margin: 0 auto; }
  .marzi svg { width: 100%; height: 100%; animation: mbob var(--loop-bob) ease-in-out infinite; }
  @keyframes mbob { 0%, 100% { transform: translateY(0) rotate(-.5deg); } 50% { transform: translateY(-2.5px) rotate(.5deg); } }
  .marzi .mblink { transform-box: fill-box; transform-origin: center; animation: mblink var(--loop-drift) infinite; }
  @keyframes mblink { 0%, 93%, 100% { transform: scaleY(1); } 95.5%, 97.5% { transform: scaleY(.08); } }
  .marzi.evolve svg { animation: mpop var(--dur-slower) cubic-bezier(.3, 1.7, .4, 1); }
  @keyframes mpop { 0% { transform: scale(.4) rotate(-10deg); } 55% { transform: scale(1.18) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
  .marzi-wrap { flex: 0 0 78px; text-align: center; }
  .marzi-cap { font: 700 var(--text-f8-5) 'JetBrains Mono', monospace; letter-spacing: .04em; color: var(--yellow-deep); margin-top: 1px; cursor: pointer; }
  .marzi-col { flex: 1; min-width: 0; }
  .hero-lv { display: flex; justify-content: space-between; align-items: baseline; margin-top: 13px; }
  .marzi-col .hero-lv { margin-top: 0; }
  .hero-lv .ttl { font-family: var(--font-sans); font-size: var(--text-f14); font-weight: 700; }
  .hero-lv .hero-xp { font-family: 'JetBrains Mono', monospace; font-size: var(--text-f10); letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
  /* XP bar, board 01/04: solid green fill with the value in a pill inside */
  .xpbar {
    position: relative; height: 22px; background: var(--track); border-radius: 999px;
    margin-top: var(--space-2); overflow: hidden;
  }
  .xpbar > div { height: 100%; background: var(--xp-fill); border-radius: 999px; transition: width var(--dur-slow) var(--ease); }
  .xpbar .xp-val {
    position: absolute; top: 50%; inset-inline-end: 4px; transform: translateY(-50%);
    background: var(--card); color: var(--ink); border-radius: 999px; padding: 2px var(--space-2);
    font: 700 var(--text-f10) 'JetBrains Mono', monospace; white-space: nowrap;
  }
  .hero-sub { margin-top: 9px; font-size: var(--text-f11-5); color: var(--muted); }
  .routine { display: flex; gap: 6px; margin-top: 10px; }
  .routine button { min-height: var(--touch-min);
    flex: 1; text-align: center; font: 600 var(--text-xs) var(--font-sans); border: none; cursor: pointer;
    padding: 7px 4px; border-radius: 99px; background: var(--track); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: filter var(--dur-fast) ease;
  }
  .routine button:hover { filter: brightness(.96); }
  .routine button.done { background: rgba(46,125,91,.15); color: var(--green); }
  .chip {
    font: 700 var(--text-xs) 'JetBrains Mono', monospace; background: var(--primary-soft); color: var(--marzi-dark);
    border-radius: 99px; padding: 5px 10px; letter-spacing: .06em; white-space: nowrap;
  }
  .chip.coin { background: var(--coin); color: var(--coin-deep); }
  .goal-hit {
    display: flex; align-items: center; gap: 10px; background: var(--tint-teal-12);
    color: var(--green); font: 700 var(--text-sm) var(--font-sans); padding: 10px 12px;
    border-radius: 12px; margin: 0 0 12px;
  }
  .drill-prog { font: 500 var(--text-f10) 'JetBrains Mono', monospace; letter-spacing: .15em; color: var(--muted); }
  .v-card {
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 18px; text-align: center; cursor: pointer;
    min-height: 180px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
  }
  .v-de { font-family: var(--font-sans); font-size: var(--text-xl); font-weight: 700; line-height: 1.25; }
  .v-tr { font-family: var(--font-sans); font-size: var(--text-f20); font-weight: 600; color: var(--green); line-height: 1.3; }
  .v-ex { font-size: var(--text-f14); color: var(--muted); line-height: 1.5; }
  .v-flip { font-size: var(--text-f11-5); color: var(--muted); }
  .v-verdict { margin-top: 12px; padding: 11px 14px; border-radius: 12px; font: 600 var(--text-f13-5) var(--font-sans); line-height: 1.5; }
  .v-verdict.ok { background: var(--tint-teal-12); color: var(--green); }
  .v-verdict.bad { background: rgba(194,70,52,.1); color: var(--red); }
  .drill-ok { font-family: var(--font-sans); font-size: var(--text-f18); font-weight: 600; color: var(--green); margin-top: 12px; line-height: 1.4; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
  .confetti i { position: absolute; top: -14px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
  .hint {
    margin-top: 12px; border: 1.5px dashed var(--yellow-deep); background: var(--sand-2);
    padding: 12px 14px; font-size: var(--text-md); border-radius: 12px;
  }
  .hint .label { margin: 0 0 4px; }
  .alert, .ui-error-inline {
    margin-top: 12px; border: 1px solid rgba(194,70,52,.4); background: var(--danger-soft-2);
    color: var(--red); padding: 12px 14px; font: 600 var(--text-f12-5) var(--font-sans);
    line-height: 1.5; border-radius: 12px;
  }
  input[type=text] {
    flex: 1; padding: 12px 14px; border: 1px solid var(--line); background: var(--card);
    font: var(--text-md) var(--font-sans); color: var(--ink); border-radius: 12px;
  }
  input[type=text]::placeholder { color: var(--muted); opacity: .8; }
  /* MARZI-005: compact opener for the full grouped situation list */
  .picked {
    width: 100%; text-align: start; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); padding-inline: 16px 42px;
    min-height: 48px; cursor: pointer; font: inherit; display: flex; align-items: center;
    gap: 8px; position: relative; margin-top: var(--space-2); transition: background var(--dur-fast) ease;
  }
  .picked:hover { background: var(--tint-primary-04); }
  .picked b { font-family: var(--font-sans); font-size: var(--text-sm); font-weight: 700; letter-spacing: .02em; }
  .picked small {
    font-size: var(--text-f12); color: var(--muted); margin-left: auto;
    max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .picked .chev { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: var(--text-f24); color: var(--muted); }
  .menu-btn {
    width: 42px; height: 42px; flex: 0 0 42px; border: 1px solid var(--line);
    background: var(--card); border-radius: 13px; cursor: pointer;
    display: inline-flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px var(--tint-ink-04);
  }
  .menu-btn span { width: 16px; height: 2px; background: var(--ink); border-radius: 2px; display: block; }
  .drawer-back { position: fixed; inset: 0; background: rgba(22,19,13,.45); z-index: 40; }
  .evo-strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 6px; scrollbar-width: none; }
  .evo-strip::-webkit-scrollbar { display: none; }
  .evo-step { flex: 0 0 84px; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 4px 8px; }
  .evo-step .n { font: 700 var(--text-f10) 'JetBrains Mono', monospace; color: var(--yellow-deep); }
  .evo-step svg { width: 58px; height: 58px; }
  .evo-step .nm { font: 600 var(--text-f10-5) var(--font-sans); line-height: 1.25; color: var(--muted); }
  .evo-step.future svg { filter: grayscale(.55) opacity(.72); }
  .evo-step.now { border-color: var(--yellow-deep); border-width: 2px; background: var(--leaf-soft-4); }
  .evo-step.now .nm { color: var(--ink); font-weight: 700; }
  .evo-here { display: block; font: 700 var(--text-f9) 'JetBrains Mono', monospace; letter-spacing: .08em; color: var(--yellow-deep); margin-top: 2px; }
  .limit, .ui-modal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(320px, 88vw); z-index: 61; background: var(--card);
    border-radius: 20px; box-shadow: 0 20px 70px rgba(22,19,13,.35);
    padding: 24px 20px; text-align: center;
  }
  .limit-marzi { width: 96px; height: 96px; margin: 0 auto; }
  .limit-marzi svg { width: 100%; height: 100%; }
  .limit-title { font-family: var(--font-sans); font-size: var(--text-lg); font-weight: 700; margin-top: 10px; }
  /* MARZI-005: Marzi lives in the identity row, clear of the portrait */
  .vc-marzi {
    flex: 0 0 auto; z-index: 2; max-width: 116px;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    pointer-events: none;
  }
  .vc-marzi-art {
    display: block; width: 48px; height: 48px;
    filter: drop-shadow(0 3px 8px rgba(22,19,13,.22));
  }
  .vc-marzi-art svg { width: 100%; height: 100%; }
  /* stages 1–3 sit in a circular companion badge beside the transcript
     (review §1.1): the egg/tadpole never pretends to stand in the scene,
     but the earned stage stays visible and recognizable via the caption. */
  .vc-marzi[data-stage="1"] .vc-marzi-art,
  .vc-marzi[data-stage="2"] .vc-marzi-art,
  .vc-marzi[data-stage="3"] .vc-marzi-art {
    width: 46px; height: 46px; padding: 4px; box-sizing: border-box;
    border: 2px solid rgba(255, 255, 255, .92); border-radius: 50%;
    background: rgba(255, 253, 248, .94);
    filter: none; box-shadow: 0 3px 10px rgba(22,19,13,.20);
  }
  .vc-marzi-cap {
    font: 700 var(--text-f8) 'JetBrains Mono', monospace; letter-spacing: .03em;
    color: var(--marzi-dark); background: rgba(255,253,248,.92);
    border: 1px solid rgba(85,122,50,.25); border-radius: 999px;
    padding: 2px 7px; max-width: 116px; text-align: center; line-height: 1.2;
    font-size: var(--text-f7-5);
  }
  .vc-bubble {
    position: absolute; right: 12px; bottom: 10px; z-index: 3; max-width: 54%; min-height: 48px;
    background: var(--paper-3); color: var(--ink); border: 1.5px solid var(--stage-line);
    border-radius: 14px 14px 4px 14px; padding: 8px 12px;
    font: 600 var(--text-f12-5) var(--font-sans); line-height: 1.35; text-align: left;
    cursor: pointer; box-shadow: 0 3px 10px rgba(22,19,13,.14);
    transition: opacity var(--dur) ease; animation: bubblein var(--dur-med) cubic-bezier(.3, 1.4, .5, 1);
  }
  .vc-bubble::after {
    content: ""; position: absolute; right: 14px; bottom: -6.5px; width: 11px; height: 11px;
    background: var(--paper-3); border-right: 1.5px solid var(--stage-line); border-bottom: 1.5px solid var(--stage-line);
    transform: rotate(45deg); border-bottom-right-radius: 3px;
  }
  @keyframes bubblein { 0% { transform: translateY(6px) scale(.92); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .vc-stage.speaking .vc-bubble { opacity: 0; pointer-events: none; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(330px, 86vw);
    background: var(--bg); z-index: 50; transform: translateX(-105%);
    transition: transform var(--dur) ease; overflow-y: auto; padding: 14px;
    box-shadow: 0 0 60px var(--tint-ink-30);
  }
  .drawer.open { transform: none; }
  /* guided dialogue: flatter portrait, speech bubble, Marzi by the progress */
  .dlg-stage { aspect-ratio: 16 / 10; }
  .dlg-bubble {
    margin-top: 12px; background: var(--card); border: 1.5px solid var(--stage-line);
    border-radius: 14px 14px 14px 4px; padding: 12px 14px;
    font-size: var(--text-f16); line-height: 1.5; box-shadow: 0 1px 2px var(--tint-ink-04);
  }
  .dlg-prog { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .dlg-marzi { width: 38px; height: 38px; flex: 0 0 38px; margin-inline-start: auto; }
  .dlg-marzi svg { width: 100%; height: 100%; }
  /* ---------- Marzi redesign: Learn home, Store, Profile ---------- */
  /* Learn hero: Marzi is the tappable companion hero (review §4) */
  /* Learn hero, board 01_home hierarchy: Marzi -> stage identity -> XP -> CTA */
  .learn-hero {
    position: relative; overflow: hidden; text-align: center;
    padding: var(--space-3) var(--space-4) var(--space-4);
    border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow);
    background:
      radial-gradient(circle at 85% 16%, var(--white), transparent 40%),
      linear-gradient(145deg, var(--paper-3) 0%, var(--leaf-soft) 100%);
  }
  /* sparkles: pure CSS dots in brand tokens, no image assets */
  .learn-hero::before, .learn-hero::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-repeat: no-repeat;
  }
  .learn-hero::before {
    background-image:
      radial-gradient(circle, var(--coin) 0 2.5px, transparent 2.5px),
      radial-gradient(circle, var(--coin) 0 2px, transparent 2px),
      radial-gradient(circle, var(--primary) 0 2px, transparent 2px);
    /* each layer needs its own box, otherwise background-position moves a
       full-size layer and every dot lands in the middle */
    background-size: 10px 10px, 8px 8px, 8px 8px;
    background-position: 13% 20%, 87% 58%, 20% 70%;
    opacity: .75;
    animation: twinkle var(--loop-drift) var(--ease) infinite;
  }
  .learn-hero::after {
    background-image:
      radial-gradient(circle, var(--primary) 0 2.5px, transparent 2.5px),
      radial-gradient(circle, var(--coin) 0 2px, transparent 2px);
    background-size: 10px 10px, 8px 8px;
    background-position: 80% 16%, 9% 45%;
    opacity: .55;
  }
  @keyframes twinkle { 0%, 100% { opacity: .75; } 50% { opacity: .45; } }
  .hero-greet { font: 700 var(--text-f12) var(--font-sans); color: var(--muted); }
  .learn-marzi {
    border: 0; background: transparent; padding: 0; cursor: pointer; font: inherit;
    display: block; margin: var(--space-1) auto 0;
  }
  .learn-marzi #marzi { display: block; width: 132px; height: 132px; margin: 0 auto; }
  .learn-marzi #marzi svg { width: 100%; height: 100%; animation: mbob var(--loop-bob) var(--ease) infinite; }
  .learn-marzi #marzi.evolve svg { animation: mpop var(--dur-slower) var(--ease-pop); }
  .hero-stage { font: 800 var(--text-f18) var(--font-sans); letter-spacing: -.02em; margin-top: var(--space-1); }
  .hero-stage-name { font: 600 var(--text-f13-5) var(--font-sans); color: var(--muted); margin-top: 1px; }
  .hero-meta {
    display: flex; justify-content: center; gap: var(--space-2); margin-top: 5px;
    font: 700 var(--text-f10-5) var(--font-sans); color: var(--muted);
  }
  .hero-meta .hero-sub { font-weight: 600; }
  .mission-card, .mini-card {
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); padding: 10px 14px; margin-top: 10px;
  }
  /* Store: wallet hero + visual outfit cards (review §5) */
  .wallet-hero {
    display: flex; gap: 12px; align-items: center; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    background: linear-gradient(135deg, var(--card), var(--leaf-soft)); box-shadow: var(--shadow);
  }
  .wallet-marzi { width: 64px; height: 64px; flex: 0 0 64px; }
  .wallet-marzi svg { width: 100%; height: 100%; }
  .wallet-coins { display: flex; align-items: center; gap: 6px; font: 800 var(--text-f24) var(--font-sans); letter-spacing: -.02em; }
  .earn-hint {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
    font: 600 var(--text-xs) var(--font-sans); color: var(--marzi-dark);
    background: var(--primary-soft); border-radius: 99px; padding: 4px 10px;
  }
  .outfit-grid {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(148px, 46%);
    gap: 10px; overflow-x: auto; padding: 2px 2px 6px;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .outfit-grid::-webkit-scrollbar { display: none; }
  .outfit-card {
    scroll-snap-align: start; overflow: hidden; display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 18px; background: var(--card);
    box-shadow: var(--shadow-sm);
  }
  .outfit-preview {
    position: relative; display: grid; place-items: center; aspect-ratio: 5 / 3;
    background: linear-gradient(145deg, var(--sand), var(--leaf-soft-3));
  }
  .asset-placeholder {
    display: grid; place-items: center; width: 56px; height: 56px;
    border: 1.5px dashed var(--line); border-radius: 16px; color: var(--muted);
  }
  .outfit-card[data-state="locked"] .outfit-preview { filter: grayscale(.4); }
  .outfit-lock { position: absolute; top: 7px; inset-inline-end: 8px; font-size: var(--text-f14); }
  .outfit-copy { padding: 7px 10px 2px; }
  .outfit-copy small {
    display: block; font: 700 var(--text-f8) 'JetBrains Mono', monospace; letter-spacing: .06em;
    color: var(--muted); text-transform: uppercase;
  }
  .outfit-copy strong { display: block; font: 800 var(--text-f14) var(--font-sans); margin-top: 2px; }
  .outfit-copy span { display: inline-flex; align-items: center; gap: 4px; font: 700 var(--text-f12) var(--font-sans); color: var(--yellow-deep); margin-top: 2px; }
  .outfit-card button {
    margin: 7px 10px 10px; border: none; border-radius: 999px; min-height: 30px;
    font: 700 var(--text-xs) var(--font-sans); background: var(--surface-strong); color: var(--muted);
  }
  .outfit-card[data-state="available"] button { background: var(--primary); color: var(--white); cursor: pointer; }
  /* Profile: identity card + activity summary + grouped settings (review §6) */
  .profile-identity {
    display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center;
    padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-lg);

  }
  .profile-marzi { width: 92px; height: 92px; }
  .profile-marzi svg { width: 100%; height: 100%; }
  .profile-summary {
    display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 10px; overflow: hidden;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--card);
    box-shadow: var(--shadow-sm);
  }
  .profile-summary > div { min-width: 0; padding: 9px 4px; text-align: center; }
  .profile-summary > div + div { border-left: 1px solid var(--line); }
  .profile-summary strong { display: block; font: 800 var(--text-f18) var(--font-sans); letter-spacing: -.02em; }
  .profile-summary span {
    display: block; margin-top: 1px; color: var(--muted); font-size: var(--text-f10);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .setting-list {
    margin-top: 12px; overflow: hidden; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow-sm);
  }
  .setting-row {
    width: 100%; min-height: 52px; display: grid;
    grid-template-columns: 34px minmax(0, 1fr) 18px; align-items: center; gap: 8px;
    padding: 7px 12px; border: 0; border-top: 1px solid var(--line);
    background: transparent; text-align: start; cursor: pointer; font: inherit; color: var(--ink);
  }
  .setting-row:first-child { border-top: 0; }
  .setting-row:hover { background: rgba(95,150,45,.08); }
  .setting-icon { font-size: var(--text-f17); text-align: center; }
  .setting-main { min-width: 0; }
  .setting-main strong { display: block; font: 700 var(--text-f13-5) var(--font-sans); }
  .setting-main small {
    display: block; margin-top: 1px; color: var(--muted); font-size: var(--text-f11-5);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .setting-chevron { color: var(--muted); font-size: var(--text-f18); text-align: center; }
  /* ---------- MARZI-005: practice scenario + character cards ---------- */
  .scn-rail {
    display: grid; grid-auto-flow: column; grid-auto-columns: 62%;
    gap: var(--space-2); overflow-x: auto; padding: 2px 2px 6px;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .scn-rail::-webkit-scrollbar { display: none; }
  .scn-card {
    scroll-snap-align: start; text-align: left; cursor: pointer;
    display: flex; gap: var(--space-2); align-items: flex-start; min-height: 48px;
    padding: 10px 12px; background: var(--card); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); font: inherit;
  }
  .scn-card .scn-emoji { font-size: var(--text-f21); line-height: 1.1; flex: 0 0 auto; }
  .scn-card .scn-txt { min-width: 0; flex: 1; }
  .scn-card b { display: block; font: 800 var(--text-f13-5) var(--font-sans); line-height: 1.25; }
  .scn-card small {
    display: block; margin-top: 2px; color: var(--muted); font-size: var(--text-xs); line-height: 1.3;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  /* selected state: ring + tint + check icon (never colour alone) */
  .scn-card[aria-pressed="true"] {
    border-color: var(--primary); background: var(--primary-soft);
    box-shadow: 0 0 0 2px rgba(95,150,45,.28), var(--shadow-sm);
  }
  .scn-card .scn-on { display: none; color: var(--marzi-dark); flex: 0 0 auto; }
  .scn-card[aria-pressed="true"] .scn-on { display: block; }
  .char-card {
    display: flex; gap: var(--space-3); align-items: center; margin-top: var(--space-2);
    padding: 10px 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-sm);
  }
  .char-face {
    position: relative; width: 56px; height: 56px; flex: 0 0 56px; border-radius: 16px;
    overflow: hidden; display: grid; place-items: center; font-size: var(--text-f27);
    background: linear-gradient(150deg, var(--stage-from), var(--stage-to)); border: 1.5px solid var(--stage-line);
  }
  .char-face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .char-face img.ok { display: block; }
  .char-txt { min-width: 0; flex: 1; }
  .char-txt .k { font: 700 var(--text-f8-5) 'JetBrains Mono', monospace; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
  .char-txt b { display: block; font: 800 var(--text-md) var(--font-sans); line-height: 1.25; margin-top: 1px; }
  .char-txt small { display: block; color: var(--muted); font-size: var(--text-f11-5); line-height: 1.35; margin-top: 1px; }
  .prep-hint {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 5px;
    font: 700 var(--text-f10-5) var(--font-sans); color: var(--yellow-deep);
    background: var(--surface-soft); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 9px;
  }
  /* ---------- Design system: canonical components (docs/DESIGN_SYSTEM.md) ----------
     Every future screen composes these classes instead of new HTML/CSS. */
  .ui-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font: 700 var(--text-xs) var(--font-sans); border-radius: 999px;
    padding: 5px 10px; border: 1px solid var(--line);
    background: var(--surface-soft); color: var(--muted);
  }
  .ui-badge[data-tone="success"] { background: var(--primary-soft); color: var(--marzi-dark); border-color: var(--tint-leaf-35); }
  .ui-badge[data-tone="warning"] { background: var(--warn-soft); color: var(--warn-ink); border-color: rgba(138,100,18,.3); }
  .ui-badge[data-tone="danger"] { background: var(--danger-soft); color: var(--danger-ink); border-color: var(--tint-danger-35); }
  .ui-badge[data-tone="info"] { background: var(--info-soft); color: var(--info-ink); border-color: var(--tint-info-28); }
  .ui-progress { display: block; }
  .ui-progress .ui-progress-top {
    display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2);
    font: 700 var(--text-sm) var(--font-sans);
  }
  .ui-progress .ui-progress-top small { font: 600 var(--text-xs) var(--font-sans); color: var(--muted); }
  .ui-progress .ui-progress-cap { margin-top: 5px; font-size: var(--text-xs); color: var(--muted); }
  .ui-empty, .ui-error { text-align: center; padding: var(--space-4) var(--space-3); }
  .ui-empty .ui-ico, .ui-error .ui-ico {
    display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto var(--space-2);
    border-radius: 50%; background: var(--surface-soft); color: var(--muted);
  }
  .ui-error .ui-ico { background: var(--danger-soft); color: var(--danger-ink); }
  .ui-empty b, .ui-error b { display: block; font: 800 var(--text-md) var(--font-sans); }
  .ui-empty p, .ui-error p { margin: 5px 0 0; font-size: var(--text-sm); color: var(--muted); line-height: 1.45; }
  .ui-empty .btn, .ui-error .btn { margin-top: var(--space-3); }
  /* reward popup: celebratory, dismissible, announced */
  .ui-reward {
    position: fixed; left: 50%; bottom: calc(96px + var(--safe-bottom)); transform: translateX(-50%);
    z-index: 60; display: flex; align-items: center; gap: var(--space-3);
    background: var(--card); border: 1.5px solid var(--primary);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    padding: var(--space-3) var(--space-4); max-width: min(92vw, 340px);
    animation: rewardPop var(--dur) var(--ease-pop);
  }
  @keyframes rewardPop { from { opacity: 0; transform: translate(-50%, 12px) scale(.94); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
  .ui-reward .ui-reward-art { width: 46px; height: 46px; flex: 0 0 46px; }
  .ui-reward .ui-reward-art svg { width: 100%; height: 100%; }
  .ui-reward b { display: block; font: 800 var(--text-md) var(--font-sans); }
  .ui-reward .ui-reward-gains { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  /* modal: the shipped .limit box is the canonical modal surface */
  .ui-modal-back {
    position: fixed; inset: 0; z-index: 55; background: rgba(23, 20, 15, .42);
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  /* ---------- MARZI-014: plan + premium screens (board 02_call.png) ---------- */
  .sheet-screen {
    position: fixed; inset: 0; z-index: 86; overflow-y: auto;
    background: var(--call-bg); color: var(--white);
    padding: calc(env(safe-area-inset-top, 0px) + var(--space-3)) var(--space-4)
             calc(env(safe-area-inset-bottom, 0px) + var(--space-5));
  }
  .sheet-screen.light { background: var(--bg); color: var(--ink); }
  .sheet-screen .ss-head {
    display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4);
  }
  .sheet-screen .ss-title { font: 800 var(--text-f16) var(--font-sans); flex: 1; text-align: center; }
  .sheet-screen .ss-x {
    width: var(--touch-min); height: var(--touch-min); border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.16); color: inherit; display: grid; place-items: center;
  }
  .sheet-screen.light .ss-x { background: var(--surface-strong); }
  .plan-card {
    background: var(--card); color: var(--ink); border-radius: var(--radius-lg);
    padding: var(--space-4); margin-bottom: var(--space-3); box-shadow: var(--shadow);
  }
  .plan-card .pc-label { font: 700 var(--text-f13-5) var(--font-sans); }
  .plan-card .pc-value { font: 800 var(--text-f27) var(--font-sans); margin-top: 2px; }
  .plan-card .pc-value small { font: 700 var(--text-f14) var(--font-sans); color: var(--muted); }
  .plan-card .pc-value.low { color: var(--red); }
  .plan-card .pc-note { font: 600 var(--text-f11-5) var(--font-sans); color: var(--muted); margin-top: var(--space-2); }
  .plan-row {
    width: 100%; display: flex; align-items: center; gap: var(--space-3); cursor: pointer;
    background: var(--card); color: var(--ink); border: 0; border-radius: var(--radius);
    padding: var(--space-3); margin-top: var(--space-2); min-height: var(--touch-min); text-align: start;
  }
  .plan-row .pr-txt { flex: 1; min-width: 0; }
  .plan-row .pr-txt b { display: block; font: 800 var(--text-f13-5) var(--font-sans); }
  .plan-row .pr-txt small { display: block; color: var(--muted); font: 600 var(--text-f11-5) var(--font-sans); }
  .prem-benefits { list-style: none; margin: var(--space-3) 0 0; padding: 0; }
  .prem-benefits li { display: flex; gap: var(--space-2); align-items: center; margin-top: var(--space-2);
    font: 600 var(--text-f12-5) var(--font-sans); }
  .prem-benefits .ic { color: var(--primary); flex: 0 0 auto; }
  .prem-plans { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-4); }
  .prem-plan {
    position: relative; text-align: center; border: 1.5px solid var(--line); border-radius: var(--radius);
    background: var(--card); color: var(--ink); padding: var(--space-4) var(--space-2) var(--space-3);
  }
  .prem-plan[data-best="1"] { border-color: var(--primary); box-shadow: 0 0 0 2px var(--tint-primary-35); }
  .prem-plan .pp-name { font: 700 var(--text-f12) var(--font-sans); color: var(--muted); }
  .prem-plan .pp-price { font: 800 var(--text-f24) var(--font-sans); margin-top: 2px; }
  .prem-plan .pp-per { font: 600 var(--text-f11-5) var(--font-sans); color: var(--muted); }
  .prem-plan .pp-badge {
    position: absolute; top: -10px; inset-inline-start: 50%; transform: translateX(-50%);
    background: var(--primary); color: var(--white); border-radius: 999px; padding: 3px 9px;
    font: 800 var(--text-f8) var(--font-sans); white-space: nowrap;
  }
  .prem-plan .pp-save {
    display: inline-block; margin-top: var(--space-2); background: var(--primary-soft);
    color: var(--marzi-dark); border-radius: 999px; padding: 3px 9px;
    font: 700 var(--text-f10) var(--font-sans);
  }
  .prem-state {
    display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 10px;
    font: 800 var(--text-f10-5) var(--font-sans); background: rgba(255,255,255,.16);
  }
  .prem-note { margin-top: var(--space-3); text-align: center; font: 600 var(--text-f12) var(--font-sans); opacity: .85; }
  /* ---------- MARZI-013: per-state Marzi motion (reduced-motion safe) ---------- */
  .marzi-art-img { width: 100%; height: 100%; object-fit: contain; }
  [data-state="listening"] > svg, [data-state="listening"] > .marzi-art-img { animation: mLean var(--loop-pulse) var(--ease) infinite; }
  [data-state="thinking"] > svg, [data-state="thinking"] > .marzi-art-img { animation: mThink var(--loop-bob) var(--ease) infinite; }
  [data-state="speaking"] > svg, [data-state="speaking"] > .marzi-art-img { animation: mTalk var(--loop-glow) var(--ease) infinite; }
  [data-state="celebrating"] > svg, [data-state="celebrating"] > .marzi-art-img { animation: mCheer var(--dur-slower) var(--ease-pop); }
  @keyframes mLean { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes mThink { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes mTalk { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes mCheer { 0% { transform: scale(.9) rotate(-4deg); } 60% { transform: scale(1.06) rotate(3deg); } 100% { transform: none; } }
  /* ---------- MARZI-011: offline banner ---------- */
  .net-banner {
    position: sticky; top: 0; z-index: 45; display: flex; align-items: center; gap: var(--space-2);
    background: var(--danger-soft); color: var(--danger-ink);
    border-bottom: 1px solid var(--tint-danger-35);
    padding: var(--space-2) var(--space-3); font: 700 var(--text-f12) var(--font-sans);
  }
  .net-banner b { font-weight: 800; }
  /* ---------- MARZI-009: plan-limit experience (board 02, panel 2) ----------
     The shared modal surface gains a full-screen dark variant used only for
     the daily-limit moment; the evolution showcase keeps the card form. */
  body.modal-lock { overflow: hidden; }
  .limit.limit-full {
    left: 0; top: 0; transform: none; width: 100%; max-width: none;
    height: 100dvh; min-height: 100vh; border-radius: 0;
    background: var(--call-bg); color: var(--white); z-index: 85;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: var(--space-2); overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + var(--space-5)) var(--space-4)
             calc(env(safe-area-inset-bottom, 0px) + var(--space-5));
  }
  .limit-full .limit-marzi { width: 132px; height: 132px; }
  .limit-full .limit-title { font-size: var(--text-xl); color: var(--white); }
  .limit-full .note { color: var(--white); opacity: .82; }
  .limit-full .limit-plan {
    width: min(320px, 92%); background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.22); border-radius: var(--radius);
    padding: var(--space-3); margin-top: var(--space-2);
  }
  .limit-full .limit-plan-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font: 800 var(--text-f16) var(--font-sans);
  }
  .limit-full .limit-plan-top small { font: 700 var(--text-f10-5) 'JetBrains Mono', monospace; opacity: .8; }
  .limit-full .limit-plan .xpbar { background: rgba(255,255,255,.18); height: 12px; }
  .limit-full .limit-plan .xpbar > div { background: var(--coin); }

  .limit-full #limitStore { background: rgba(255,255,255,.16); color: var(--white); border-color: rgba(255,255,255,.28); }
  /* ---------- MARZI-008: reward summary + celebration ---------- */
  .rw-card {
    border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow);
    background: linear-gradient(145deg, var(--paper-3), var(--leaf-soft));
    padding: var(--space-3) var(--space-4) var(--space-4); margin-top: var(--space-3);
  }

  .rw-gains { flex: 1; min-width: 0; }

    display: inline-flex; align-items: center; gap: 5px; margin: 0 6px 4px 0;
    background: var(--card); border: 1px solid var(--tint-leaf-35); border-radius: 999px;
    padding: 5px var(--space-3); font: 800 var(--text-f14) var(--font-sans); color: var(--marzi-dark);

    border-radius: var(--radius-sm); padding: var(--space-2) 4px; }
  .rw-stats strong { display: block; font: 800 var(--text-f16) var(--font-sans); }
  .rw-stats span { display: block; font: 600 var(--text-f10-5) var(--font-sans); color: var(--muted); }
  .rw-stage { margin-top: var(--space-3); font: 700 var(--text-f12) var(--font-sans); color: var(--marzi-dark); text-align: center; }
  .rw-card[data-state="save-failed"] { background: var(--danger-soft); border-color: var(--tint-danger-35); }
  .rw-card[data-state="high"] { box-shadow: 0 0 0 2px var(--tint-primary-35), var(--shadow); }
  .evo-cel { text-align: center; }

  .evo-cel-row .ui-marzi-art { width: 72px; height: 72px; }
