<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f1e5" />
<meta name="application-name" content="Marzi" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Marzi" />
<title>Marzi — Learn German by speaking</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Marzi design tokens (master spec §6/§17), grafted natively per ADR-9.
     Legacy variable names stay as aliases so every existing rule keeps working. */
  :root {
    --bg: #f7f1e5;
    --card: #fffdf8;
    --surface-soft: #f1ead9;
    --surface-strong: #e8dfc9;
    --ink: #17140f;
    --muted: #6e685f;
    --line: rgba(23, 20, 15, .14);
    --primary: #5f962d;
    --primary-hover: #527f28;
    --primary-active: #456c22;
    --primary-soft: #e8f1dc;
    --marzi-dark: #2f5f1c;
    --coin: #f2b72f;
    --yellow: var(--primary);             /* legacy alias */
    --yellow-deep: var(--primary-active); /* legacy alias */
    --red: #c94638;
    --green: #4f8a32;
    --font-sans: "Nunito Sans", Inter, system-ui, -apple-system, sans-serif;
    --radius-sm: 12px;
    --radius: 18px;
    --radius-lg: 26px;
    --radius-xl: 34px;
    --shadow-sm: 0 2px 8px rgba(34, 27, 15, .08);
    --shadow: 0 8px 24px rgba(34, 27, 15, .12);
    --shadow-lg: 0 18px 50px rgba(34, 27, 15, .18);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at top, rgba(255, 255, 255, .72), transparent 34%),
      var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 560px; margin: 0 auto;
    padding: 14px 16px calc(90px + var(--safe-bottom));
  }
  /* the call screen hides the bottom nav, so it doesn't need to clear it */
  body.in-call main { padding-bottom: calc(12px + var(--safe-bottom)); }
  /* ---------- app shell: sticky top bar + fixed bottom navigation ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    border-bottom: 1px solid var(--line);
    background: rgba(247, 241, 229, .92);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .topbar-in {
    width: 100%; max-width: 560px; height: 64px; margin: 0 auto; padding: 0 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .wordmark {
    font-family: var(--font-sans); font-size: 26px; font-weight: 800;
    letter-spacing: -.04em; color: var(--marzi-dark);
  }
  .topbar .grow { flex: 1; }
  .chip-res {
    display: inline-flex; align-items: center; gap: 5px;
    font: 800 13px var(--font-sans); color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 11px; box-shadow: var(--shadow-sm); cursor: pointer; min-height: 34px;
  }
  .chip-res .ic { color: var(--coin); }
  .chip-res.streak .ic { color: var(--primary); }
  .bottomnav {
    position: fixed; right: 0; bottom: 0; left: 0; z-index: 40;
    border-top: 1px solid var(--line);
    background: rgba(255, 253, 248, .96);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding-bottom: var(--safe-bottom);
  }
  .bottomnav-in {
    width: 100%; max-width: 560px; height: 74px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .bottomnav button {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; border: none; background: none; cursor: pointer;
    color: var(--muted); font: 700 11.5px var(--font-sans);
  }
  .bottomnav button .ic { vertical-align: 0; }
  .bottomnav button.on { color: var(--primary); }
  .brand-card {
    background: linear-gradient(150deg, #fdfbf2, #f1f3de);
    border: 1.5px solid #dde3c6; border-radius: 22px;
    box-shadow: var(--shadow); padding: 14px 16px 15px; margin-bottom: 22px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .mark {
    width: 54px; height: 54px; flex: 0 0 54px;
    background: #edf2d9; border: 2px solid #bdd28f; border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: inset 0 -3px 0 rgba(85,122,50,.10), 0 1px 2px rgba(22,19,13,.06);
  }
  .brand .word {
    font-family: var(--font-sans);
    font-size: 23px; font-weight: 700; letter-spacing: -.01em;
    color: var(--yellow-deep);
  }
  .plate { display: inline-flex; align-items: center; gap: 10px; }
  .plate span {
    font-family: var(--font-sans);
    font-size: 20px; font-weight: 800; letter-spacing: -.02em;
  }
  .tagline { font-size: 14.5px; line-height: 1.55; color: var(--muted); margin: 10px 2px 0; max-width: 460px; }
  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; letter-spacing: .18em; color: var(--muted);
    margin: 16px 0 8px; text-transform: uppercase;
  }
  .label:first-of-type { margin-top: 0; }
  .list {
    border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  .item {
    display: block; width: 100%; text-align: left; padding: 14px 16px;
    border: none; border-top: 1px solid var(--line);
    background: transparent; color: var(--ink); cursor: pointer; font: inherit;
    transition: background .15s ease;
  }
  .item:first-child, .list .label + .item { border-top: none; }
  .item:hover { background: rgba(95,150,45,.10); }
  .item.on { background: var(--ink); color: #fdfbf5; }
  .item b { font-family: var(--font-sans); font-size: 16px; font-weight: 600; display: block; letter-spacing: 0; }
  .item small { font-size: 12.5px; color: var(--muted); }
  .item.on small { color: rgba(253,251,245,.65); }
  .item[disabled] { opacity: .4; cursor: not-allowed; }
  .list .label { margin: 14px 16px 6px; }
  .seg {
    display: flex; gap: 4px; padding: 4px;
    background: #eae4cd; border-radius: 999px;
  }
  .seg button {
    flex: 1; padding: 9px 6px; border: none; border-radius: 999px;
    background: transparent; color: var(--ink); cursor: pointer;
    font: 600 13px var(--font-sans); letter-spacing: .02em;
    transition: background .15s ease, color .15s ease;
  }
  .seg button.on { background: var(--ink); color: #fdfbf5; }
  .seg.wrap { flex-wrap: wrap; }
  .seg.wrap button { flex: 1 1 31%; }
  /* level + speed side by side: one compact row on the Talk tab */
  .duo { display: flex; gap: 8px; align-items: flex-end; }
  .duo-col { flex: 1; min-width: 0; }
  .duo-col .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .duo .seg { padding: 3px; }
  .duo .seg button { padding: 7px 2px; font-size: 11px; letter-spacing: 0; }
  .note { font-size: 12.5px; margin: 10px 2px 0; color: var(--muted); }
  .note.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 8px; }
  /* primary button: green filled, white text (spec §6.4) */
  .big {
    font-family: var(--font-sans); width: 100%; min-height: 52px; padding: 12px 16px; margin-top: 16px;
    background: var(--primary); color: #fff; border: none; font-size: 16px; font-weight: 800;
    letter-spacing: .04em; cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 10px; border-radius: 999px;
    box-shadow: var(--shadow); transition: transform .1s ease, background .15s ease;
  }
  .big:hover { background: var(--primary-hover); }
  .big:active { transform: translateY(1px); }
  .big[disabled] { opacity: .52; cursor: not-allowed; }
  .big.cta { background: var(--primary); color: #fff; }
  .big.cta:hover { background: var(--primary-hover); }
  /* explicit call states on the mic button (review §7): ready = ink,
     listening = green + pulse, processing = neutral. Red stays reserved
     for hang-up and real errors. */
  .big[data-status] { transition: background .2s ease; }
  .big[data-status="ready"] { background: var(--ink); color: #fff; }
  .big[data-status="ready"]:hover { background: #2a251c; }
  .big[data-status="connecting"],
  .big[data-status="character-speaking"],
  .big[data-status="ended"] { background: var(--ink); color: #fff; }
  .big[data-status="listening"] { background: var(--primary); color: #fff; animation: listeningPulse 1.4s ease-in-out infinite; }
  .big[data-status="processing"] { background: #d9d2c2; color: var(--ink); }
  .big[data-status="failed"] { background: var(--red); color: #fff; }
  @keyframes listeningPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(95,150,45,.45); } 50% { box-shadow: 0 0 0 14px rgba(95,150,45,0); } }
  .bar {
    background: var(--ink); color: #fdfbf5; padding: 14px 18px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .bar .who { font-family: var(--font-sans); font-size: 17px; font-weight: 600; }
  .bar .meta { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em; color: var(--yellow); opacity: .9; }
  .hang {
    background: var(--red); color: #fff; border: none; padding: 10px 16px;
    font: 700 12px var(--font-sans); letter-spacing: .06em; cursor: pointer;
    border-radius: 999px; transition: filter .15s ease;
  }
  .vcbar {
    background: var(--card); border: 1px solid var(--line); border-bottom: none;
    padding: 10px; position: relative;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .vc-stage {
    /* landscape card so stage + transcript + SOS + mic all fit one phone screen */
    position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 200px; border-radius: 18px;
    overflow: hidden; background: linear-gradient(160deg, #f7f2df, #e7edd2);
    border: 2.5px solid #d9e0bd;
    display: flex; align-items: center; justify-content: center;
  }
  .vc-stage .vc-emoji { font-size: 64px; }
  .vc-stage img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    display: none; will-change: transform;
  }
  .vc-stage img.ok { display: block; }
  /* speaking glow lives on an overlay so it stays visible over the portrait;
     under prefers-reduced-motion the animation stops but the ring remains */
  .vc-stage::after { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; border-radius: 15px; }
  .vc-stage.speaking::after {
    box-shadow: inset 0 0 0 3px rgba(95,150,45,.6);
    animation: stageglow 1.3s ease-in-out infinite;
  }
  @keyframes stageglow {
    0%, 100% { box-shadow: inset 0 0 0 2.5px rgba(95,150,45,.35); }
    50% { box-shadow: inset 0 0 0 4px rgba(95,150,45,.9); }
  }
  .vc-timer {
    position: absolute; top: 10px; left: 12px; z-index: 2;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .16em;
    color: var(--yellow-deep); background: rgba(253,251,242,.9);
    border: 1px solid rgba(85,122,50,.2); padding: 5px 10px; border-radius: 999px;
  }
  .vc-who {
    position: absolute; left: 12px; bottom: 12px; z-index: 2;
    font-family: var(--font-sans); font-size: 15.5px; font-weight: 600;
    color: var(--ink); background: rgba(253,251,242,.92);
    border: 1.5px solid #d9e0bd; padding: 6px 12px; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(22,19,13,.08); max-width: 55%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .vc-stage .hang { position: absolute; top: 10px; right: 10px; z-index: 2; }
  .hang:hover { filter: brightness(1.1); }
  .log {
    background: var(--card); border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 var(--radius) var(--radius); box-shadow: var(--shadow);
    min-height: 90px; max-height: min(30dvh, 30vh); overflow-y: auto;
    overscroll-behavior: contain; padding-bottom: 8px;
  }
  /* adaptive: a growing transcript earns more guaranteed room (review §7) */
  .log:has(.turn:nth-child(3)) { min-height: 148px; }
  .turn { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .turn:last-child { border-bottom: none; }
  .tag {
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .12em;
    width: 84px; flex: 0 0 84px; padding-top: 4px; color: var(--muted);
  }
  .tag.me { color: var(--green); }
  .said { font-size: 15.5px; line-height: 1.5; }
  .w { cursor: pointer; border-radius: 4px; }
  .w:active { background: rgba(95,150,45,.35); }
  .wsave { margin-top: 6px; font: 600 12.5px var(--font-sans); color: var(--green); }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .fix { font-size: 12.5px; color: var(--red); margin-top: 4px; }
  .mini {
    background: none; border: none; padding: 0; font: 12px var(--font-sans);
    color: var(--muted); text-decoration: underline; cursor: pointer; margin-right: 12px;
  }
  .mini:hover { color: var(--ink); }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row.sos { gap: 6px; margin-top: 8px; }
  .row.sos .ghost { font-size: 11.5px; padding: 7px 4px; min-height: 38px; }
  /* secondary button: cream card (spec §6.4), 44px+ touch target */
  .ghost {
    flex: 1; min-height: 44px; padding: 10px; background: var(--card); border: 1px solid var(--line);
    color: var(--ink); font: 700 13px var(--font-sans); cursor: pointer;
    border-radius: 999px; box-shadow: var(--shadow-sm);
    transition: background .15s ease;
  }
  .ghost:hover { background: rgba(95,150,45,.12); }
  .ghost[disabled] { opacity: .4; cursor: not-allowed; }
  .toggle {
    width: 100%; min-height: 44px; margin-top: 8px; padding: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font: 700 12.5px var(--font-sans);
    letter-spacing: .04em; cursor: pointer; border-radius: 999px;
    box-shadow: var(--shadow-sm); transition: background .15s ease;
  }
  .toggle.on { background: var(--card); border-color: var(--yellow-deep); color: var(--ink); }
  .toggle[disabled] { opacity: .4; cursor: not-allowed; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .act {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px; min-height: 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
    color: var(--ink); cursor: pointer; font: 700 12.5px var(--font-sans);
    line-height: 1.3; text-align: left; box-shadow: var(--shadow-sm);
    transition: background .15s ease;
  }
  .act:hover { background: rgba(95,150,45,.10); }
  .act[disabled] { opacity: .4; cursor: not-allowed; }
  .act .ic { flex: 0 0 auto; color: var(--yellow-deep); }
  .act.due { border-color: var(--yellow-deep); }
  .dot-due { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow-deep); margin-left: auto; flex: 0 0 auto; }
  .act.on { border-color: var(--yellow-deep); box-shadow: inset 0 0 0 1.5px var(--yellow-deep); background: rgba(95,150,45,.12); }
  .act.soon { opacity: .45; }
  .act.col {
    flex-direction: column; justify-content: center; gap: 4px; text-align: center;
    font-size: 11px; padding: 8px 6px; min-height: 58px;
  }
  .soon-badge {
    margin-left: auto; flex: 0 0 auto; font: 700 8.5px 'JetBrains Mono', monospace;
    letter-spacing: .08em; text-transform: uppercase; background: #eae4cd;
    color: var(--muted); border-radius: 99px; padding: 3px 7px; white-space: nowrap;
  }
  .ob-head { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 14px 0 4px; text-align: center; }
  .ob-marzi { width: 104px; height: 104px; }
  .ob-marzi svg { width: 100%; height: 100%; animation: mbob 3.4s ease-in-out infinite; }
  .ic { vertical-align: -3px; }
  .hero-streak .ic { color: var(--yellow-deep); }
  .b { font-weight: 700; }
  .b-ok { color: var(--green); }
  .b-mid { color: #a8761f; }
  .b-no { color: var(--red); }
  .hero {
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; margin: -6px 0 24px;
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .hero-streak { font-family: var(--font-sans); font-weight: 700; font-size: 17px; }
  .hero-streak small { font-size: 12px; color: var(--muted); font-family: var(--font-sans); font-weight: 500; }
  .week { display: flex; gap: 5px; }
  .week .d { width: 21px; text-align: center; font: 500 9px 'JetBrains Mono', monospace; color: var(--muted); }
  .week .dot { width: 9px; height: 9px; margin: 3px auto 0; border-radius: 50%; background: #e6dfc8; }
  .week .dot.on { background: var(--yellow-deep); }
  .week .today .dot { box-shadow: 0 0 0 2px rgba(22,19,13,.3); }
  .marzi-row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .marzi { width: 74px; height: 74px; margin: 0 auto; }
  .marzi svg { width: 100%; height: 100%; animation: mbob 3.4s ease-in-out infinite; }
  @keyframes mbob { 0%, 100% { transform: translateY(0) rotate(-.5deg); } 50% { transform: translateY(-2.5px) rotate(.5deg); } }
  .marzi .mblink { transform-box: fill-box; transform-origin: center; animation: mblink 5.2s infinite; }
  @keyframes mblink { 0%, 93%, 100% { transform: scaleY(1); } 95.5%, 97.5% { transform: scaleY(.08); } }
  .marzi.evolve svg { animation: mpop 1s cubic-bezier(.3, 1.7, .4, 1); }
  @keyframes mpop { 0% { transform: scale(.4) rotate(-10deg); } 55% { transform: scale(1.18) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
  .marzi-wrap { flex: 0 0 78px; text-align: center; }
  .marzi-cap { font: 700 8.5px 'JetBrains Mono', monospace; letter-spacing: .04em; color: var(--yellow-deep); margin-top: 1px; cursor: pointer; }
  .marzi-col { flex: 1; min-width: 0; }
  .hero-lv { display: flex; justify-content: space-between; align-items: baseline; margin-top: 13px; }
  .marzi-col .hero-lv { margin-top: 0; }
  .hero-lv .ttl { font-family: var(--font-sans); font-size: 14px; font-weight: 700; }
  .hero-lv .hero-xp { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .08em; color: var(--muted); white-space: nowrap; }
  .xpbar { height: 7px; background: #eae4cd; border-radius: 99px; margin-top: 7px; overflow: hidden; }
  .xpbar div { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--yellow-deep)); border-radius: 99px; transition: width .6s ease; }
  .hero-sub { margin-top: 9px; font-size: 11.5px; color: var(--muted); }
  .routine { display: flex; gap: 6px; margin-top: 10px; }
  .routine button {
    flex: 1; text-align: center; font: 600 11px var(--font-sans); border: none; cursor: pointer;
    padding: 7px 4px; border-radius: 99px; background: #eae4cd; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: filter .15s ease;
  }
  .routine button:hover { filter: brightness(.96); }
  .routine button.done { background: rgba(46,125,91,.15); color: var(--green); }
  .chip {
    font: 700 11px 'JetBrains Mono', monospace; background: var(--primary-soft); color: var(--marzi-dark);
    border-radius: 99px; padding: 5px 10px; letter-spacing: .06em; white-space: nowrap;
  }
  .chip.coin { background: var(--coin); color: #4a3208; }
  .goal-hit {
    display: flex; align-items: center; gap: 10px; background: rgba(46,125,91,.12);
    color: var(--green); font: 700 13px var(--font-sans); padding: 10px 12px;
    border-radius: 12px; margin: 0 0 12px;
  }
  .drill-prog { font: 500 10px 'JetBrains Mono', monospace; letter-spacing: .15em; color: var(--muted); }
  .v-card {
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 28px 18px; text-align: center; cursor: pointer;
    min-height: 180px; display: flex; flex-direction: column; justify-content: center; gap: 10px;
  }
  .v-de { font-family: var(--font-sans); font-size: 26px; font-weight: 700; line-height: 1.25; }
  .v-tr { font-family: var(--font-sans); font-size: 20px; font-weight: 600; color: var(--green); line-height: 1.3; }
  .v-ex { font-size: 14px; color: var(--muted); line-height: 1.5; }
  .v-flip { font-size: 11.5px; color: var(--muted); }
  .v-verdict { margin-top: 12px; padding: 11px 14px; border-radius: 12px; font: 600 13.5px var(--font-sans); line-height: 1.5; }
  .v-verdict.ok { background: rgba(46,125,91,.12); color: var(--green); }
  .v-verdict.bad { background: rgba(194,70,52,.1); color: var(--red); }
  .drill-ok { font-family: var(--font-sans); font-size: 18px; font-weight: 600; color: var(--green); margin-top: 12px; line-height: 1.4; }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
  .confetti i { position: absolute; top: -14px; width: 8px; height: 12px; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .9; } }
  .hint {
    margin-top: 12px; border: 1.5px dashed var(--yellow-deep); background: #f9f7ec;
    padding: 12px 14px; font-size: 15px; border-radius: 12px;
  }
  .hint .label { margin: 0 0 4px; }
  .alert {
    margin-top: 12px; border: 1px solid rgba(194,70,52,.4); background: #fdf0ee;
    color: var(--red); padding: 12px 14px; font: 600 12.5px var(--font-sans);
    line-height: 1.5; border-radius: 12px;
  }
  input[type=text] {
    flex: 1; padding: 12px 14px; border: 1px solid var(--line); background: var(--card);
    font: 15px var(--font-sans); color: var(--ink); border-radius: 12px;
  }
  input[type=text]::placeholder { color: var(--muted); opacity: .8; }
  .picked {
    width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 44px 14px 16px;
    cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 2px; position: relative;
    transition: background .15s ease;
  }
  .picked:hover { background: rgba(95,150,45,.10); }
  .picked b { font-family: var(--font-sans); font-size: 16px; font-weight: 600; }
  .picked small { font-size: 12.5px; color: var(--muted); }
  .picked .chev { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 24px; color: var(--muted); }
  .menu-btn {
    width: 42px; height: 42px; flex: 0 0 42px; border: 1px solid var(--line);
    background: var(--card); border-radius: 13px; cursor: pointer;
    display: inline-flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(22,19,13,.04);
  }
  .menu-btn span { width: 16px; height: 2px; background: var(--ink); border-radius: 2px; display: block; }
  .drawer-back { position: fixed; inset: 0; background: rgba(22,19,13,.45); z-index: 40; }
  .evo-strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 2px 6px; scrollbar-width: none; }
  .evo-strip::-webkit-scrollbar { display: none; }
  .evo-step { flex: 0 0 84px; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 4px 8px; }
  .evo-step .n { font: 700 10px 'JetBrains Mono', monospace; color: var(--yellow-deep); }
  .evo-step svg { width: 58px; height: 58px; }
  .evo-step .nm { font: 600 10.5px var(--font-sans); line-height: 1.25; color: var(--muted); }
  .evo-step.future svg { filter: grayscale(.55) opacity(.72); }
  .evo-step.now { border-color: var(--yellow-deep); border-width: 2px; background: #f4f8ea; }
  .evo-step.now .nm { color: var(--ink); font-weight: 700; }
  .evo-here { display: block; font: 700 9px 'JetBrains Mono', monospace; letter-spacing: .08em; color: var(--yellow-deep); margin-top: 2px; }
  .limit {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(320px, 88vw); z-index: 61; background: var(--card);
    border-radius: 20px; box-shadow: 0 20px 70px rgba(22,19,13,.35);
    padding: 24px 20px; text-align: center;
  }
  .limit-marzi { width: 96px; height: 96px; margin: 0 auto; }
  .limit-marzi svg { width: 100%; height: 100%; }
  .limit-title { font-family: var(--font-sans); font-size: 19px; font-weight: 700; margin-top: 10px; }
  .vc-marzi {
    position: absolute; right: 4px; bottom: 2px; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    pointer-events: none;
  }
  .vc-marzi-art {
    display: block; width: 84px; height: 84px;
    filter: drop-shadow(0 4px 10px rgba(22,19,13,.30));
  }
  .vc-marzi-art svg { width: 100%; height: 100%; }
  /* stages 1–3 sit in a circular companion badge beside the transcript
     (review §1.1): the egg/tadpole never pretends to stand in the scene,
     but the earned stage stays visible and recognizable via the caption. */
  .vc-marzi[data-stage="1"], .vc-marzi[data-stage="2"], .vc-marzi[data-stage="3"] { right: 12px; bottom: 10px; }
  .vc-marzi[data-stage="1"] .vc-marzi-art,
  .vc-marzi[data-stage="2"] .vc-marzi-art,
  .vc-marzi[data-stage="3"] .vc-marzi-art {
    width: 68px; height: 68px; padding: 6px; box-sizing: border-box;
    border: 2px solid rgba(255, 255, 255, .92); border-radius: 50%;
    background: rgba(255, 253, 248, .94);
    filter: none; box-shadow: 0 3px 10px rgba(22,19,13,.20);
  }
  .vc-marzi-cap {
    font: 700 8px 'JetBrains Mono', monospace; letter-spacing: .03em;
    color: var(--marzi-dark); background: rgba(255,253,248,.92);
    border: 1px solid rgba(85,122,50,.25); border-radius: 999px;
    padding: 2px 7px; white-space: nowrap;
  }
  .vc-bubble {
    position: absolute; right: 16px; bottom: 90px; z-index: 3; max-width: 62%;
    background: #fffdf6; color: var(--ink); border: 1.5px solid #d9e0bd;
    border-radius: 14px 14px 4px 14px; padding: 8px 12px;
    font: 600 12.5px var(--font-sans); line-height: 1.35; text-align: left;
    cursor: pointer; box-shadow: 0 3px 10px rgba(22,19,13,.14);
    transition: opacity .25s ease; animation: bubblein .35s cubic-bezier(.3, 1.4, .5, 1);
  }
  .vc-bubble::after {
    content: ""; position: absolute; right: 14px; bottom: -6.5px; width: 11px; height: 11px;
    background: #fffdf6; border-right: 1.5px solid #d9e0bd; border-bottom: 1.5px solid #d9e0bd;
    transform: rotate(45deg); border-bottom-right-radius: 3px;
  }
  @keyframes bubblein { 0% { transform: translateY(6px) scale(.92); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .vc-stage.speaking .vc-bubble { opacity: 0; pointer-events: none; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: min(330px, 86vw);
    background: var(--bg); z-index: 50; transform: translateX(-105%);
    transition: transform .25s ease; overflow-y: auto; padding: 14px;
    box-shadow: 0 0 60px rgba(22,19,13,.3);
  }
  .drawer.open { transform: none; }
  /* guided dialogue: flatter portrait, speech bubble, Marzi by the progress */
  .dlg-stage { aspect-ratio: 16 / 10; }
  .dlg-bubble {
    margin-top: 12px; background: var(--card); border: 1.5px solid #d9e0bd;
    border-radius: 14px 14px 14px 4px; padding: 12px 14px;
    font-size: 16px; line-height: 1.5; box-shadow: 0 1px 2px rgba(22,19,13,.04);
  }
  .dlg-prog { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .dlg-marzi { width: 38px; height: 38px; flex: 0 0 38px; margin-left: auto; }
  .dlg-marzi svg { width: 100%; height: 100%; }
  /* ---------- Marzi redesign: Learn home, Store, Profile ---------- */
  /* Learn hero: Marzi is the tappable companion hero (review §4) */
  .learn-hero {
    position: relative; overflow: hidden; display: grid;
    grid-template-columns: minmax(0, 1fr) 118px; gap: 10px; align-items: center;
    padding: 16px 14px 12px; border: 1px solid var(--line);
    border-radius: var(--radius-lg); box-shadow: var(--shadow);
    background:
      radial-gradient(circle at 85% 16%, rgba(255,255,255,.92), transparent 40%),
      linear-gradient(145deg, #fffdf8 0%, #edf4df 100%);
  }
  .learn-hero h1 { margin: 0 0 10px; font: 800 27px var(--font-sans); letter-spacing: -.04em; }
  .learn-marzi { border: 0; background: transparent; padding: 0; cursor: pointer; text-align: center; font: inherit; }
  .learn-marzi #marzi { display: block; width: 112px; height: 112px; margin: 0 auto; }
  .learn-marzi #marzi svg { width: 100%; height: 100%; animation: mbob 3.4s ease-in-out infinite; }
  .learn-marzi #marzi.evolve svg { animation: mpop 1s cubic-bezier(.3, 1.7, .4, 1); }
  .learn-marzi .marzi-cap { display: block; margin-top: 1px; }
  .mission-card, .mini-card {
    border: 1px solid var(--line); background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); padding: 10px 14px; margin-top: 10px;
  }
  /* Store: wallet hero + visual outfit cards (review §5) */
  .wallet-hero {
    display: flex; gap: 12px; align-items: center; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: var(--radius-lg);
    background: linear-gradient(135deg, #fffdf8, #edf4df); box-shadow: var(--shadow);
  }
  .wallet-marzi { width: 64px; height: 64px; flex: 0 0 64px; }
  .wallet-marzi svg { width: 100%; height: 100%; }
  .wallet-coins { display: flex; align-items: center; gap: 6px; font: 800 24px var(--font-sans); letter-spacing: -.02em; }
  .earn-hint {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 6px;
    font: 600 11px var(--font-sans); color: var(--marzi-dark);
    background: var(--primary-soft); border-radius: 99px; padding: 4px 10px;
  }
  .outfit-grid {
    display: grid; grid-auto-flow: column; grid-auto-columns: minmax(148px, 46%);
    gap: 10px; overflow-x: auto; padding: 2px 2px 6px;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .outfit-grid::-webkit-scrollbar { display: none; }
  .outfit-card {
    scroll-snap-align: start; overflow: hidden; display: flex; flex-direction: column;
    border: 1px solid var(--line); border-radius: 18px; background: var(--card);
    box-shadow: var(--shadow-sm);
  }
  .outfit-preview {
    position: relative; display: grid; place-items: center; aspect-ratio: 5 / 3;
    background: linear-gradient(145deg, #f8f3e8, #eaf2df);
  }
  .asset-placeholder {
    display: grid; place-items: center; width: 56px; height: 56px;
    border: 1.5px dashed var(--line); border-radius: 16px; color: var(--muted);
  }
  .outfit-card[data-state="locked"] .outfit-preview { filter: grayscale(.4); }
  .outfit-lock { position: absolute; top: 7px; right: 8px; font-size: 14px; }
  .outfit-copy { padding: 7px 10px 2px; }
  .outfit-copy small {
    display: block; font: 700 8px 'JetBrains Mono', monospace; letter-spacing: .06em;
    color: var(--muted); text-transform: uppercase;
  }
  .outfit-copy strong { display: block; font: 800 14px var(--font-sans); margin-top: 2px; }
  .outfit-copy span { display: inline-flex; align-items: center; gap: 4px; font: 700 12px var(--font-sans); color: var(--yellow-deep); margin-top: 2px; }
  .outfit-card button {
    margin: 7px 10px 10px; border: none; border-radius: 999px; min-height: 30px;
    font: 700 11px var(--font-sans); background: var(--surface-strong); color: var(--muted);
  }
  .outfit-card[data-state="available"] button { background: var(--primary); color: #fff; cursor: pointer; }
  /* Profile: identity card + activity summary + grouped settings (review §6) */
  .profile-identity {
    display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center;
    padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-lg);
    background: linear-gradient(135deg, #fffdf8, #edf5e3); box-shadow: var(--shadow);
  }
  .profile-marzi { width: 92px; height: 92px; }
  .profile-marzi svg { width: 100%; height: 100%; }
  .profile-summary {
    display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 10px; overflow: hidden;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--card);
    box-shadow: var(--shadow-sm);
  }
  .profile-summary > div { min-width: 0; padding: 9px 4px; text-align: center; }
  .profile-summary > div + div { border-left: 1px solid var(--line); }
  .profile-summary strong { display: block; font: 800 18px var(--font-sans); letter-spacing: -.02em; }
  .profile-summary span {
    display: block; margin-top: 1px; color: var(--muted); font-size: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .setting-list {
    margin-top: 12px; overflow: hidden; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow-sm);
  }
  .setting-row {
    width: 100%; min-height: 52px; display: grid;
    grid-template-columns: 34px minmax(0, 1fr) 18px; align-items: center; gap: 8px;
    padding: 7px 12px; border: 0; border-top: 1px solid var(--line);
    background: transparent; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
  }
  .setting-row:first-child { border-top: 0; }
  .setting-row:hover { background: rgba(95,150,45,.08); }
  .setting-icon { font-size: 17px; text-align: center; }
  .setting-main { min-width: 0; }
  .setting-main strong { display: block; font: 700 13.5px var(--font-sans); }
  .setting-main small {
    display: block; margin-top: 1px; color: var(--muted); font-size: 11.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .setting-chevron { color: var(--muted); font-size: 18px; text-align: center; }
  /* screen-reader-only live region (review §12) */
  .sr-only {
    position: absolute !important; width: 1px !important; height: 1px !important;
    padding: 0 !important; margin: -1px !important; overflow: hidden !important;
    clip: rect(0, 0, 0, 0) !important; white-space: nowrap !important; border: 0 !important;
  }
  .store-item { display: flex; align-items: center; gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); }
  .store-item:first-child { border-top: none; }
  .store-item .nm { flex: 1; min-width: 0; }
  .store-item .nm b { font: 800 15px var(--font-sans); display: block; }
  .store-item .nm small { font-size: 12px; color: var(--muted); }
  .buy-btn {
    border: none; border-radius: 999px; background: var(--primary); color: #fff;
    font: 800 12.5px var(--font-sans); padding: 9px 13px; min-height: 38px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-sm); white-space: nowrap;
  }
  .buy-btn:hover { background: var(--primary-hover); }
  .buy-btn[disabled] { opacity: .5; cursor: not-allowed; }
  .premium-card {
    border: 1.5px solid rgba(242,187,40,.6); border-radius: var(--radius);
    background: linear-gradient(135deg, #fffdf4, #fdf3d3);
    box-shadow: var(--shadow-sm); padding: 12px 14px; margin-top: 10px;
  }
  .allow-row { display: flex; gap: 8px; margin-top: 10px; }
  .allow-chip {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 7px;
    border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    padding: 8px; font: 700 12.5px var(--font-sans); color: var(--ink);
    box-shadow: var(--shadow-sm); cursor: pointer; min-height: 40px;
  }
  .allow-chip .ic { color: var(--primary); }
  .allow-chip span .ic { color: inherit; } /* wrapped icons keep their own color (coin) */
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 2px 12px; }
  .drawer-title { font-family: var(--font-sans); font-weight: 700; font-size: 18px; }
  .drawer-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); padding: 4px 8px; }
  .hidden { display: none; }
  button:focus-visible, input:focus-visible { outline: 2.5px solid var(--yellow-deep); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <div class="topbar-in">
    <button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    <span class="wordmark">Marzi</span>
    <span class="grow"></span>
    <button class="chip-res" id="tbCoins" aria-label="Coins"></button>
    <span class="chip-res streak" id="tbStreak"></span>
  </div>
</header>
<main>
  <!-- LEARN home: Marzi companion hero, mission, quick cards (spec §23, review §4) -->
  <section id="learn">
    <div class="learn-hero">
      <div class="learn-hero-copy" style="min-width:0">
        <h1 id="learnHi"></h1>
        <div class="hero-lv"><span class="ttl" id="heroLv"></span><span class="hero-xp" id="heroXp"></span></div>
        <div class="xpbar"><div id="xpFill" style="width:0%"></div></div>
        <div class="hero-sub" id="heroSub"></div>
      </div>
      <button class="learn-marzi" id="marziBtn" type="button">
        <span id="marzi"></span>
        <small class="marzi-cap" id="marziCap"></small>
      </button>
    </div>
    <button class="big cta" id="practiceBtn" style="margin-top:10px"></button>
    <div class="mission-card">
      <div class="hero-top">
        <div class="hero-streak" id="heroStreak"></div>
        <div class="week" id="heroWeek"></div>
      </div>
      <div class="label" id="missionLbl" style="margin:8px 0 0"></div>
      <div class="routine" id="routine"></div>
    </div>
    <div class="grid3" id="learnActs"></div>
  </section>

  <!-- TALK: scenario setup (the original Telefontrainer core) -->
  <section id="setup" class="hidden">
    <div class="label" id="lblPick"></div>
    <button class="picked" id="pickedCard">
      <b id="pickedTitle"></b><small id="pickedSub"></small><span class="chev">&rsaquo;</span>
    </button>

    <div class="duo">
      <div class="duo-col" style="flex:1.25"><div class="label" id="lblLevel"></div><div class="seg" id="levels"></div></div>
      <div class="duo-col"><div class="label" id="lblSpeed"></div><div class="seg" id="speeds"></div></div>
    </div>
    <p class="note one" id="levelNote"></p>

    <button class="big cta" id="callBtn" style="margin-top:14px"></button>
    <div class="allow-row">
      <span class="allow-chip" id="allowMin"></span>
      <button class="allow-chip" id="allowBuy"></button>
    </div>
    <div class="label" id="lblTrain"></div>
    <div class="grid2">
      <button class="act" id="prepBtn"></button>
      <button class="act" id="dialogBtn"></button>
      <button class="act" id="vocabBtn"></button>
      <button class="act" id="drillBtn"></button>
      <button class="act" id="mistakesBtn"></button>
      <button class="act" id="progressBtn"></button>
      <button class="act" id="shareBtn"></button>
    </div>
  </section>

  <!-- FIRST-RUN ONBOARDING: language pair picker -->
  <section id="onboard" class="hidden">
    <div class="ob-head">
      <div class="ob-marzi" id="obMarzi"></div>
      <span class="word">Marzi</span>
    </div>
    <div class="label" id="obIntroLbl"></div>
    <div class="seg wrap" id="obHelp"></div>
    <div class="label" id="obLearnLbl"></div>
    <div class="grid2" id="obTargets"></div>
    <p class="note hidden" id="obWishNote"></p>
    <div id="obEvo"></div>
    <button class="big cta" id="obStartBtn"></button>
  </section>

  <!-- CALL -->
  <section id="call" class="hidden">
    <div class="vcbar">
      <div class="vc-stage" id="vcAv">
        <span class="vc-emoji" id="vcEmoji">🎧</span>
        <img id="vcImg" alt="" />
        <div class="vc-timer" id="timer">VERBUNDEN · 00:00</div>
        <div class="vc-who" id="who"></div>
        <div class="vc-marzi" id="vcMarzi"></div>
        <button class="vc-bubble hidden" id="vcBubble"></button>
        <button class="hang" id="hangBtn"></button>
      </div>
    </div>
    <div class="log" id="log"></div>
    <p class="note hidden" id="tapHint" style="margin:8px 2px 0"></p>
    <div class="row">
      <button class="ghost" id="repeatBtn"></button>
      <button class="ghost" id="hintBtn"></button>
    </div>
    <div id="hintBox" class="hint hidden"><div class="label">VORSCHLAG</div><div id="hintText"></div></div>
    <div class="row sos" id="sosRow">
      <button class="ghost" data-sos="Wie bitte?">Wie bitte?</button>
      <button class="ghost" data-sos="Langsamer, bitte.">Langsamer, bitte</button>
      <button class="ghost" data-sos="Können Sie das noch einmal sagen?">Noch einmal, bitte</button>
    </div>
    <button class="toggle on" id="freeBtn"></button>
    <div id="alert" class="alert hidden"></div>
    <div id="callStatusLive" class="sr-only" aria-live="polite"></div>
    <button class="big" id="micBtn" data-status="ready"></button>
    <button class="mini" id="typeBtn" style="margin-top:6px"></button>
    <div class="row hidden" id="typeRow">
      <input type="text" id="draft" placeholder="Guten Tag, ich möchte…" />
      <button class="ghost" id="sendBtn" style="flex:0 0 auto"></button>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="hidden">
    <div class="plate"><span id="doneTitle"></span><span class="chip hidden" id="xpChip"></span><span class="chip coin hidden" id="coinChip"></span></div>
    <button class="ghost hidden" id="replayBtn" style="width:100%;margin-top:16px"></button>
    <div class="list" style="margin-top:14px;padding:16px 14px" id="review"></div>
    <div class="list" style="margin-top:14px;padding:16px 14px" id="evalBox"></div>
    <button class="big" id="againBtn"></button>
  </section>

  <!-- MISTAKES HISTORY -->
  <section id="mistakes" class="hidden">
    <div class="plate"><span id="mistakesTitle"></span></div>
    <div class="list" style="margin-top:22px;padding:16px 14px" id="mistakesList"></div>
    <div class="row">
      <button class="ghost" id="ankiBtn"></button>
      <button class="ghost" id="clearBtn"></button>
    </div>
    <button class="big" id="backBtn"></button>
  </section>

  <!-- PROGRESS: speaking test + improvement chart -->
  <section id="test" class="hidden">
    <div class="plate"><span id="testTitle"></span></div>
    <div id="testBody" style="margin-top:16px"></div>
    <button class="big" id="testBack"></button>
  </section>

  <!-- PRE-CALL PREPARATION (level zero warm-up) -->

/* ---------- brand migration (review §9): Telefontrainer → Marzi ----------
   One-time copy of legacy localStorage keys to the new marzi.*.v1 names.
   Legacy keys stay in place untouched (rollback safety); all reads/writes
   below go through the new names. Must run before anything reads settings. */
const STORAGE_MIGRATIONS = [
  ["telefontrainer.settings", "marzi.settings.v1"],
  ["telefontrainer.stats", "marzi.stats.v1"],
  ["telefontrainer.fixes", "marzi.fixes.v1"],
  ["telefontrainer.words", "marzi.words.v1"],
  ["telefontrainer.tests", "marzi.tests.v1"],
  ["telefontrainer.pin", "marzi.pin.v1"],
  ["telefontrainer.marzi", "marzi.stage.v1"],
  ["telefontrainer.wish", "marzi.wish.v1"],
];
function migratedName(k) {
  const hit = STORAGE_MIGRATIONS.find(([legacy]) => legacy === k);
  if (hit) return hit[1];
  if (k.indexOf("telefontrainer.vocab.") === 0) return "marzi.vocab.v1." + k.slice("telefontrainer.vocab.".length);
  return null;
}
function migrateStorageKeys() {
  try {
    const keys = [];
    for (let i = 0; i < (localStorage.length || 0); i++) keys.push(localStorage.key(i));
    for (const k of keys) {
      const next = k && migratedName(k);
      if (next && localStorage.getItem(next) === null) {
        localStorage.setItem(next, localStorage.getItem(k));
      }
    }
  } catch (e) {}
}
migrateStorageKeys();

/* ---------- practice stats (streak, totals) ----------
   loadStats() always returns a normalized shape (review §11): corrupt or
   manually edited localStorage can never break UI or economy logic. */
const STAT_KEY = "marzi.stats.v1";
const DEFAULT_STATS = Object.freeze({
  version: 1, days: {}, calls: 0, seconds: 0, secDays: {}, extraSecs: {},
  vocabDays: {}, drillDays: {}, xp: 0, coins: 0, ownedItemIds: [], equippedItemIds: [],
});
function finiteNonNegative(value, fallback = 0) {
  return Number.isFinite(value) && value >= 0 ? value : fallback;
}
function normalizeStats(value) {
  const s = value && typeof value === "object" ? value : {};
  const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
  const idList = (v) => (Array.isArray(v) ? v.filter((id) => typeof id === "string") : []);
  return {
    version: 1,
    days: obj(s.days), secDays: obj(s.secDays), extraSecs: obj(s.extraSecs),
    vocabDays: obj(s.vocabDays), drillDays: obj(s.drillDays),
    calls: finiteNonNegative(s.calls), seconds: finiteNonNegative(s.seconds),
    xp: finiteNonNegative(s.xp), coins: finiteNonNegative(s.coins),
    ownedItemIds: idList(s.ownedItemIds), equippedItemIds: idList(s.equippedItemIds),
  };
}
function loadStats() {
  try { return normalizeStats(JSON.parse(localStorage.getItem(STAT_KEY))); }
  catch (e) { return normalizeStats(null); }
}

/* ---------- idempotent reward ledger (review §1.3, ADR-8) ----------
   Every completion claims its reward exactly once under a unique id, so
   double taps, re-rendered listeners or browser restoration can never pay
   twice. Coin values follow spec §14: call 20, vocabulary set 10,
   preparation batch 10, corrected drill item 2, guided dialogue 10. */
const REWARD_LEDGER_KEY = "marzi.reward-ledger.v1";
function newRewardId() {
  try { if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}
function loadRewardLedger() {
  try {
    const parsed = JSON.parse(localStorage.getItem(REWARD_LEDGER_KEY));
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (e) { return {}; }
}
function claimReward(rewardId, reward) {
  const ledger = loadRewardLedger();
  if (ledger[rewardId]) return { claimed: false, reward: ledger[rewardId] };
  const st = loadStats();
  const xp = Math.max(0, Number(reward && reward.xp) || 0);
  const coins = Math.max(0, Number(reward && reward.coins) || 0);
  st.xp += xp;
  st.coins += coins;
  ledger[rewardId] = { xp, coins, claimedAt: new Date().toISOString() };
  const ids = Object.keys(ledger); // bounded: drop the oldest entries
  if (ids.length > 600) {
    ids.sort((a, b) => String(ledger[a].claimedAt).localeCompare(String(ledger[b].claimedAt)));
    for (const drop of ids.slice(0, ids.length - 500)) delete ledger[drop];
  }
  try {
    localStorage.setItem(STAT_KEY, JSON.stringify(st));
    localStorage.setItem(REWARD_LEDGER_KEY, JSON.stringify(ledger));
  } catch (e) {}
  if (coins) SFX.coin();
  updateTopbar();
  return { claimed: true, reward: ledger[rewardId] };
}

function recordCall() {
  if (!S.turns.some((x) => x.me)) return 0;
  const gained = 15 + Math.min(20, S.turns.filter((x) => x.me).length * 2);
  const claim = claimReward("call:" + (S.callId || (S.callId = newRewardId())), { xp: gained, coins: 20 });
  if (!claim.claimed) return 0; // this call was already counted
  const st = loadStats();
  const d = new Date().toISOString().slice(0, 10);
  st.days[d] = (st.days[d] || 0) + 1;
  st.calls += 1;
  st.seconds += S.seconds;
  st.secDays[d] = (st.secDays[d] || 0) + S.seconds;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
  return gained;
}
function addXp(n) {
  const st = loadStats();
  st.xp = (st.xp || 0) + n;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
}
/* ledger-bypassing coin primitive - only for flows without a completion id */
function addCoins(n) {
  const st = loadStats();
  st.coins = (st.coins || 0) + n;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
  SFX.coin();
  updateTopbar();
}
function markDay(kind) { // "vocabDays" | "drillDays" - calls already live in st.days
  const st = loadStats();
  st[kind] = st[kind] || {};
  st[kind][new Date().toISOString().slice(0, 10)] = true;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
}
/* caller ranks by lifetime XP; titles stay German on purpose */
const RANKS = [[0,"Neuling"],[80,"Anrufer"],[200,"Vieltelefonierer"],[400,"Telefonprofi"],[700,"Bürodrache"],[1100,"Anrufheld"],[1700,"Telefonlegende"]];
function rankFor(xp) {
  let i = RANKS.length - 1;
  while (i > 0 && xp < RANKS[i][0]) i--;
  return { n: i + 1, title: RANKS[i][1], base: RANKS[i][0], next: RANKS[i + 1] ? RANKS[i + 1][0] : null };
}
function currentStreak(st) {
  let n = 0;
  const day = new Date();
  const key = () => day.toISOString().slice(0, 10);
  if (!st.days[key()]) day.setDate(day.getDate() - 1); // streak may end yesterday
  while (st.days[key()]) { n++; day.setDate(day.getDate() - 1); }
  return n;
}

/* ---------- tiny synth: jingle, coin, fanfare, German ringback ---------- */
const SFX = (() => {
  let ctx = null, ringT = null, jingled = false;
  const on = () => S.sound !== false;
  function ac() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }
  function note(c, f, t, d, type, g) {
    const o = c.createOscillator(), v = c.createGain();
    o.type = type; o.frequency.value = f;
    v.gain.setValueAtTime(0.0001, t);
    v.gain.linearRampToValueAtTime(g, t + 0.015);
    v.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(v); v.connect(c.destination); o.start(t); o.stop(t + d + 0.05);
  }
  function melody(notes, type, g) {
    if (!on()) return; const c = ac(); if (!c) return;
    const t0 = c.currentTime + 0.03;
    notes.forEach(([f, at, d]) => note(c, f, t0 + at, d, type, g));
  }
  return {
    jingle() { if (jingled) return; jingled = true; melody([[523.25, 0, .45], [659.25, .13, .45], [783.99, .26, .45], [1046.5, .39, .85]], "triangle", .05); },
    coin() { melody([[987.77, 0, .1], [1318.5, .09, .22]], "square", .035); },
    fanfare() { melody([[523.25, 0, .16], [659.25, .13, .16], [783.99, .26, .16], [659.25, .42, .4], [783.99, .42, .4], [1046.5, .42, .55]], "triangle", .055); },
    ringStart() {
      this.ringStop(); if (!on()) return; const c = ac(); if (!c) return;
      const beep = () => { if (!on() || !ctx) return; note(ctx, 425, ctx.currentTime, 0.95, "sine", 0.04); };
      beep(); ringT = setInterval(beep, 4500);
    },
    ringStop() { clearInterval(ringT); ringT = null; },
  };
})();
document.addEventListener("pointerdown", () => SFX.jingle(), { once: true });

async function chatFetch(payload) {
  const doFetch = () => fetch("/api/chat", {
    method: "POST",
    headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
    body: JSON.stringify(payload),
  });
  let res = await doFetch();
  if (res.status === 401) {
    const pin = prompt(t().pinAsk);
    if (pin != null && pin.trim()) {
      localStorage.setItem(PIN_KEY, pin.trim());

/* Neural voice via /api/tts when the server has a TTS key; device voice otherwise.
   The 501 probe result is remembered for the session so unconfigured servers
   cost one extra request per page load, not one per line. */
let neuralOK = true;
const ttsCache = new Map(); // text -> object URL (mp3)
let currentAudio = null;

/* while the character speaks: glowing frame + a very subtle slow camera
   drift on the portrait (like a live webcam). No facial animation - a good
   still portrait beats a fake mouth. */
let lifeRAF = null;
function lifeStart() {
  if (lifeRAF) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const img = $("vcImg");
  if (img) img.style.transition = "";
  const tick = () => {
    const el = $("vcImg");
    if (el) {
      const now = performance.now();
      const rot = Math.sin(now / 1600) * 0.4;
      const ty = Math.sin(now / 2100) * 2.2;
      const sc = 1.045 + Math.sin(now / 1200) * 0.006;
      el.style.transform = `scale(${sc.toFixed(3)}) rotate(${rot.toFixed(2)}deg) translateY(${ty.toFixed(1)}px)`;
    }
    lifeRAF = requestAnimationFrame(tick);
  };
  tick();
}
function lifeStop() {
  if (lifeRAF) { cancelAnimationFrame(lifeRAF); lifeRAF = null; }
  const el = $("vcImg");
  if (el) { el.style.transition = "transform .6s ease"; el.style.transform = ""; }
}

function setSpeaking(on) {
  const el = $("vcAv");
  if (el) el.classList.toggle("speaking", !!on);
  const dl = $("dlgAv"); // the guided-dialogue portrait shares the glow
  if (dl) dl.classList.toggle("speaking", !!on);
  if (on) lifeStart(); else lifeStop();
}

function stopAudio() {
  if (currentAudio) {
    try { currentAudio.onended = null; currentAudio.pause(); } catch (e) {}
    currentAudio = null;
  }
  setSpeaking(false);
}

/* voice of speaker 1 (the usual contact) or 2 (doctor/boss/spouse who took over) */
function voiceOf(sp) {
  const A = S.active || S.scenario || {};
  return (sp === 2 ? A.voice2 || A.voice : A.voice) || "";
}

/* character id of the current speaker, for voice acting on the server */
function charOf(sp) {
  const A = S.active || S.scenario || {};
  if (!A.id || A.id === "custom" || A.id === "random") return "";
  return sp === 2 ? A.id + "2" : A.id;
}

async function neuralSpeak(text, rate, done, voice, pace, char) {
  if (voice === undefined) voice = voiceOf(1);
  pace = pace || "normal";
  char = char || "";
  const key = voice + "|" + pace + "|" + char + "|" + text;
  let url = ttsCache.get(key);
  if (!url) {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
      body: JSON.stringify({ text, voice, pace, char, lang: TARGET.code }),
    });
    if (res.status === 501) { neuralOK = false; throw new Error("unconfigured"); }
    if (!res.ok) throw new Error("tts " + res.status);
    url = URL.createObjectURL(await res.blob());
    ttsCache.set(key, url);
    if (ttsCache.size > 40) {
      const k = ttsCache.keys().next().value;
      URL.revokeObjectURL(ttsCache.get(k));
      ttsCache.delete(k);
    }
  }
  const a = new Audio(url);
  // the pace lives in the speech itself now; only fine-tune, never stretch
  a.playbackRate = Math.max(0.9, Math.min(1.1, rate));
  if ("preservesPitch" in a) a.preservesPitch = true;
  currentAudio = a;
  a.onended = () => {
    if (currentAudio === a) currentAudio = null;
    setSpeaking(false);
    done && setTimeout(done, 350);
  };
  await a.play();
  setSpeaking(true);
}

function deviceSpeak(text, rate, done) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = TARGET.locale;
  if (S.voice) u.voice = S.voice;
  u.rate = rate;
  u.onstart = () => setSpeaking(true);
  u.onend = () => { setSpeaking(false); done && setTimeout(done, 350); };
  u.onerror = () => { setSpeaking(false); done && setTimeout(done, 350); };
  speechSynthesis.speak(u);
}

function speak(text, slow, done, sp) {
  if (!text) { if (done) done(); return; }
  SFX.ringStop();
  speechSynthesis.cancel();
  stopAudio();
  const rate = slow ? 0.6 : LEVELS[S.level].rate * (SPEEDS[S.speed] || 1);
  if (neuralOK) {
    const pace = slow || rate < 0.92 ? "slow" : rate > 1.08 ? "fast" : "normal";
    neuralSpeak(text, rate, done, voiceOf(sp || 1), pace, charOf(sp || 1)).catch(() => deviceSpeak(text, rate, done));
    return;
  }
  deviceSpeak(text, rate, done);
}

  const tsv = fixes.map((f) => `${f.text.replace(/[\t\n]/g, " ")}\t${f.fix.replace(/[\t\n]/g, " ")}`).join("\n");

/* ---------- mistake drill (spaced-repetition-lite over saved corrections) ---------- */
let D = null;
function startDrill() {
  const all = loadFixes();
  const items = all.map((f, i) => ({ f, i })).filter((x) => x.f.corrected);
  if (!items.length) return;
  // least-practised first, then least-recently practised
  items.sort((a, b) => ((a.f.box || 0) - (b.f.box || 0)) || ((a.f.drilled || "") < (b.f.drilled || "") ? -1 : 1));
  D = { q: items.slice(0, 8), i: 0, open: false, total: Math.min(8, items.length) };
  show("drill");
  renderDrill();
}
function renderDrill() {
  const L = t();
  $("drillTitle").textContent = L.drillTitle;
  $("drillBack").textContent = L.back;
  if (D.i >= D.q.length) {
    const xp = D.total * 3;
    addXp(xp);
    markDay("drillDays");
    confettiBurst();
    $("drillCard").innerHTML =
      `<div class="said" style="font-family:var(--font-sans);font-size:19px;font-weight:700">🎉 ${esc(L.drillDone)}</div>
       <div style="margin-top:10px"><span class="chip">+${xp} XP</span></div>`;
    return;
  }
  const item = D.q[D.i], f = item.f;
  $("drillCard").innerHTML =
    `<div class="drill-prog">${D.i + 1} / ${D.q.length}</div>
     <div class="said" style="margin-top:10px;font-size:17px">„${esc(f.text)}“</div>
     <p class="note" style="margin-top:8px">${esc(L.drillQ)}</p>` +
    (!D.open
      ? `<button class="ghost" style="width:100%;margin-top:14px" data-da="reveal">${esc(L.reveal)}</button>`
      : `<div class="drill-ok">${esc(f.corrected)}</div>
         ${f.fix ? `<div class="fix">${esc(f.fix)}</div>` : ""}
         ${verdictHTML(D, L)}
         <div class="row">
           <button class="ghost" data-da="play">&#9654; ${esc(L.sayIt)}</button>
           <button class="ghost" data-da="say" ${D.listening ? "disabled" : ""}>${D.listening ? esc(L.listening) : esc(L.sayWord)}</button>
         </div>
         <div class="row">
           <button class="ghost" data-da="knew">${esc(L.knew)}</button>
           <button class="ghost" data-da="retry">${esc(L.retry)}</button>
         </div>`);
  $("drillCard").querySelectorAll("[data-da]").forEach((b) => b.onclick = () => {
    const act = b.dataset.da;
    if (act === "play") { speak(f.corrected, true); return; }
    if (act === "say") { listenFor(f.corrected, D, renderDrill); return; }
    if (act === "reveal") {
      D.open = true; renderDrill();
      // listen -> repeat: after the corrected sentence plays, the mic opens
      speak(f.corrected, true, () => { if (D && D.open && D.q[D.i] === item && !D.listening) listenFor(f.corrected, D, renderDrill); });
      return;
    }
    const all = loadFixes(), rec = all[item.i];
    if (rec) {
      rec.box = act === "knew" ? (rec.box || 0) + 1 : 0;
      rec.drilled = new Date().toISOString().slice(0, 10);
      saveFixes(all);
    }
    if (act === "knew") addCoins(2); // corrected mistake reward (spec §14)
    if (act === "retry") D.q.push(item);
    D.i++; D.open = false; D.verdict = null; D.heard = null; D.err = null;
    renderDrill();
  });
}

/* ---------- scenario vocabulary (speaking-first flashcards) ---------- */
let V = null;
const VOCAB_NS = "telefontrainer.vocab.";

/* normalize to the TARGET language's letters (historical name: was German-only) */
const NORM_RE = new RegExp("[^" + TARGET.charset + " ]", "g");
function normDe(s) {
  return String(s || "").toLowerCase().replace(NORM_RE, " ").replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
/* the learner said the word if every content word of the target appears
   (fuzzily) in what the recognizer heard - articles don't count */
function saidWord(heard, target) {
  const SKIP = TARGET.skip;
  const H = normDe(heard).split(" ").filter(Boolean);
  const Hjoin = H.join("");
  const all = normDe(target).split(" ").filter((w) => w && !SKIP.includes(w));
  // prefer content words, but fall back to short ones ("wo", "was") for one-word cards
  let Tw = all.filter((w) => w.length > 2);
  if (!Tw.length) Tw = all;
  if (!Tw.length) return false;
  // forgiving on purpose: this is encouragement, not an exam. The recognizer
  // itself mangles learner speech, so allow 2 edits on short words, accept the
  // word inside the joined transcript (recognizers split compounds), and for
  // phrases require 60% of the content words instead of all of them.
  const hit = (tw) => {
    const tol = tw.length <= 2 ? 0 : tw.length <= 7 ? 2 : 3;
    return H.some((h) => lev(h, tw) <= tol) || (tw.length >= 5 && Hjoin.includes(tw));
  };
  const need = Math.max(1, Math.ceil(Tw.length * 0.6));
  return Tw.filter(hit).length >= need;
}
