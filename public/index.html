/* ================= Marzi Design System · canonical components =================
   docs/DESIGN_SYSTEM.md is the written spec; this object is its implementation.
   Every builder returns an HTML string and reads sizing/colour ONLY from the
   design tokens in :root. New screens compose these instead of writing HTML.
   Rule: if a screen needs a visual that is not here, add it HERE first. */
const UI = {
  /* --- 1. Marzi avatar: the mascot at an evolution stage (1-6) --- */
  marziAvatar({ stage = 1, mood = "", size = "var(--avatar-md)", caption = "", cls = "" } = {}) {
    const n = Math.min(6, Math.max(1, Number(stage) || 1));
    const label = `Marzi, ${marziNames()[n - 1]}, ${n}/${MARZI_STAGE_COUNT}`;
    return `<span class="ui-marzi ${cls}" data-stage="${n}" role="img" aria-label="${esc(label)}">` +
      `<span class="ui-marzi-art" data-state="${esc(isMarziState(mood) ? mood : "neutral")}" style="display:block;width:${size};height:${size}">${marziArt(n, mood)}</span>` +
      (caption ? `<span class="vc-marzi-cap">${esc(caption)}</span>` : "") + `</span>`;
  },
  /* --- 2. Character avatar: an EXISTING scenario character (ADR-10: never new art) --- */
  characterAvatar({ scenario, speaker = 1, size = "var(--avatar-md)", id = "" } = {}) {
    const s = scenario || {};
    const real = s.id && s.id !== "custom" && s.id !== "random";
    const src = real ? `/api/avatar/${s.id}${speaker === 2 ? "2" : ""}?v=3&pin=${encodeURIComponent(localStorage.getItem(PIN_KEY) || "")}` : "";
    return `<span class="char-face" style="width:${size};height:${size};flex:0 0 ${size}" aria-hidden="true">` +
      `<span>${esc(s.avatar || "🎧")}</span>` +
      (src ? `<img${id ? ` id="${id}"` : ""} alt="" data-src="${esc(src)}" />` : "") + `</span>`;
  },
  /* --- 26. Brand lockup: the Marzi mark to the LEFT of the wordmark ----
     One implementation, reused by the top bar and onboarding. The mark is the
     most advanced approved stage and is a TEMPORARY stand-in: the production
     contract is public/assets/marzi/stage-6/header-neutral.svg (ADR-10 - the
     final mark is family-approved artwork, never CSS-fabricated and never
     cropped from a concept board). */
  brandLockup({ compact = false, stage = MARZI_STAGE_COUNT, label = "Marzi" } = {}) {
    const n = Math.min(MARZI_STAGE_COUNT, Math.max(1, Number(stage) || MARZI_STAGE_COUNT));
    const src = BRAND_MARK_ASSET;
    const mark = hasBrandMarkAsset()
      ? `<img class="brand-mark-img" src="${esc(src)}" alt="" width="40" height="40" />`
      : marziSVG(n, "neutral");
    return `<span class="brand-lockup${compact ? " compact" : ""}" role="img" aria-label="${esc(label)}">` +
      `<span class="brand-mark" data-stage="${n}" aria-hidden="true">${mark}</span>` +
      `<span class="wordmark" aria-hidden="true">Marz<span class="wm-i">i<svg class="wm-sprout" viewBox="0 0 24 14" aria-hidden="true"><path d="M12 13 C11 8 7 4 2 4 C6 2 11 4 12 8 C13 4 18 2 22 4 C17 4 13 8 12 13 Z" fill="var(--primary)"/></svg></span></span></span>`;
  },
  /* --- 27. Stat card: one measured value with its localized label --- */
  statCard({ icon = "", value = "", label = "", detail = "", state = "" } = {}) {
    return `<div class="stat-card"${state ? ` data-state="${esc(state)}"` : ""}>` +
      `<span class="stat-ic" aria-hidden="true">${icon}</span>` +
      `<span class="stat-body"><b class="stat-val">${esc(value)}</b>` +
      `<small class="stat-lb">${esc(label)}</small>` +
      (detail ? `<small class="stat-dt">${esc(detail)}</small>` : "") + `</span></div>`;
  },
  /* --- 28. Activity summary: dated activity the app actually stored ---- */
  activitySummary({ entries = [], period = "" } = {}) {
    const max = entries.reduce((m, e) => Math.max(m, Number(e.value) || 0), 0);
    return `<div class="act-sum">` + (period ? `<div class="act-sum-hd">${esc(period)}</div>` : "") +
      `<div class="act-bars">` + entries.map((e) => {
        const v = Number(e.value) || 0;
        const pct = max > 0 ? Math.round((v / max) * 100) : 0;
        return `<div class="act-bar" role="img" aria-label="${esc(e.label)}">` +
          `<span class="act-bar-fill" data-on="${v > 0}" style="height:${Math.max(v > 0 ? 8 : 3, pct)}%"></span>` +
          `<small>${esc(e.short || e.label)}</small></div>`;
      }).join("") + `</div></div>`;
  },
  /* --- 3. Top bar: brand + resources + settings (the app shell chrome) --- */
  topBar({ coins = 0, streak = 0, minutes = 0 } = {}) {
    return UI.brandLockup({ compact: true }) + `<span class="grow"></span>` +
      UI.coinChip({ id: "tbCoins", value: coins, label: "Coins" }) +
      UI.coinChip({ id: "tbStreak", value: streak, kind: "streak", icon: IC.flame(ICON.sm), label: "Streak", tag: "span" }) +
      UI.coinChip({ id: "tbMins", value: minutes, kind: "mins", icon: IC.clock(ICON.sm), label: "Call minutes left today" }) +
      `<button class="chip-res gear" id="tbGear" aria-label="Settings">${IC.gear(ICON.btn)}</button>`;
  },
  /* --- 4. Coin chip: a compact resource readout (coins, streak, minutes) --- */
  coinChip({ value = 0, icon = null, kind = "", id = "", label = "", tag = "button" } = {}) {
    const attrs = `${id ? ` id="${id}"` : ""}${label ? ` aria-label="${esc(label)}"` : ""}` +
      (tag === "button" ? ` type="button"` : "");
    return `<${tag} class="chip-res${kind ? " " + kind : ""}"${attrs}>${icon || IC.coin(ICON.chip)} ${esc(String(value))}</${tag}>`;
  },
  /* --- 5. XP bar: progress toward the next learner rank --- */
  xpBar({ percent = 0, id = "" } = {}) {
    const pct = Math.min(100, Math.max(0, Number(percent) || 0));
    return `<div class="xpbar" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100">` +
      `<div${id ? ` id="${id}"` : ""} style="width:${pct}%"></div></div>`;
  },
  /* --- 6. Evolution card: one stage in Marzi's six-stage lamina --- */
  evolutionCard({ stage, current = 1, hereLabel = "" } = {}) {
    const n = Number(stage);

      (n === current && hereLabel ? `<span class="evo-here">${esc(hereLabel)}</span>` : "") + `</div>`;
  },
  /* --- 7. Character card: who the learner will speak to --- */
  characterCard({ scenario, kindLabel = "", subtitle = "", note = "", title = "", metaChips = [] } = {}) {

      `</div></div>` +
      (metaChips.length ? `<div class="char-meta">` + metaChips.map((c) =>
        `<span class="char-chip${c.on ? " on" : ""}">${c.icon || ""}${esc(c.text)}</span>`).join("") + `</div>` : "") +
      (title ? `<button class="see-all char-change" id="charChangeBtn" type="button"></button>` : "") +
      `</div>`;
  },
  /* --- 8. Scenario card: a practisable situation, selectable --- */
  scenarioCard({ scenario, selected = false, subtitle = "" } = {}) {
    const s = scenario || {};
    return `<button class="scn-card" type="button" data-scn="${esc(s.id)}" aria-pressed="${selected}">` +
      `<span class="scn-emoji" aria-hidden="true">${esc(s.avatar || "🎧")}</span>` +
      `<span class="scn-txt"><b>${esc(s.de || "")}</b><small>${esc(subtitle)}</small></span>` +
      `<span class="scn-on" aria-hidden="true">${IC.check(ICON.md)}</span></button>`;

  /* --- 9. Conversation bubble: one transcript turn --- */
  bubble({ side = "char", tag = "", body = "", extra = "" } = {}) {
    const me = side === "me";
    return `<div class="turn ${me ? "me" : "char"}"><div class="bub">` +

  },
  /* --- 10. Store item: a purchasable row (minutes packs today) --- */
  storeItem({ icon = "", name = "", sub = "", price = "", action = "", disabled = false } = {}) {
    return `<div class="store-item">${icon}<div class="nm"><b>${esc(name)}</b>` +

  outfitCard({ id = "", name = "", price = 0, state = "locked", stageLabel = "", stateLabel = "", art = "" } = {}) {

      `<span class="outfit-preview" data-outfit-art="${esc(id)}" aria-hidden="true">${art}` +

/* ---------- API calls (with optional PIN when hosted) ---------- */
const PIN_KEY = "telefontrainer.pin";
async function chatFetch(payload) {
  const doFetch = () => fetch("/api/chat", {
    method: "POST",
    headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
    body: JSON.stringify(payload),
  });
  let res = await doFetch();
  if (res.status === 401) {
    const pin = prompt(t().pinAsk);
    if (pin != null && pin.trim()) {
      localStorage.setItem(PIN_KEY, pin.trim());
      res = await doFetch();
    }
    if (res.status === 401) localStorage.removeItem(PIN_KEY);
  }
  if (res.status === 429 && !S.limitShown) {
    S.limitShown = true;
    showLimit();
  }
  return res;
}

let currentAudio = null;

/* while the character speaks: glowing frame + a very subtle slow camera
   drift on the portrait (like a live webcam). No facial animation - a good
   still portrait beats a fake mouth. */
let lifeRAF = null;
function lifeStart() {
  if (lifeRAF) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const img = $("vcImg");
  if (img) img.style.transition = "";
  const tick = () => {
    const el = $("vcImg");
    if (el) {
      const now = performance.now();
      const rot = Math.sin(now / 1600) * 0.4;
      const ty = Math.sin(now / 2100) * 2.2;
      const sc = 1.045 + Math.sin(now / 1200) * 0.006;
      el.style.transform = `scale(${sc.toFixed(3)}) rotate(${rot.toFixed(2)}deg) translateY(${ty.toFixed(1)}px)`;
    }
    lifeRAF = requestAnimationFrame(tick);
  };
  tick();
}
function lifeStop() {
  if (lifeRAF) { cancelAnimationFrame(lifeRAF); lifeRAF = null; }
  const el = $("vcImg");
  if (el) { el.style.transition = "transform .6s ease"; el.style.transform = ""; }
}

function setSpeaking(on) {
  S.speaking = !!on;
  try { renderCallStatus(); } catch (e) {}
  const el = $("vcAv");
  if (el) el.classList.toggle("speaking", !!on);
  const dl = $("dlgAv"); // the guided-dialogue portrait shares the glow
  if (dl) dl.classList.toggle("speaking", !!on);
  if (on) lifeStart(); else lifeStop();
}

function stopAudio() {
  if (currentAudio) {
    try { currentAudio.onended = null; currentAudio.pause(); } catch (e) {}
    currentAudio = null;
  }
  setSpeaking(false);
}

/* voice of speaker 1 (the usual contact) or 2 (doctor/boss/spouse who took over) */
function voiceOf(sp) {
  const A = S.active || S.scenario || {};
  return (sp === 2 ? A.voice2 || A.voice : A.voice) || "";
}

/* character id of the current speaker, for voice acting on the server */
function charOf(sp) {
  const A = S.active || S.scenario || {};
  if (!A.id || A.id === "custom" || A.id === "random") return "";
  return sp === 2 ? A.id + "2" : A.id;
}

async function neuralSpeak(text, rate, done, voice, pace, char) {
  if (voice === undefined) voice = voiceOf(1);
  pace = pace || "normal";
  char = char || "";
  const key = voice + "|" + pace + "|" + char + "|" + text;
  let url = ttsCache.get(key);
  if (!url) {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
      body: JSON.stringify({ text, voice, pace, char, lang: TARGET.code }),
    });
    if (res.status === 501) { neuralOK = false; throw new Error("unconfigured"); }
    if (!res.ok) throw new Error("tts " + res.status);
    url = URL.createObjectURL(await res.blob());
    ttsCache.set(key, url);
    if (ttsCache.size > 40) {
      const k = ttsCache.keys().next().value;
      URL.revokeObjectURL(ttsCache.get(k));
      ttsCache.delete(k);
    }
  }
  const a = new Audio(url);
  // the pace lives in the speech itself now; only fine-tune, never stretch
  a.playbackRate = Math.max(0.9, Math.min(1.1, rate));
  if ("preservesPitch" in a) a.preservesPitch = true;
  currentAudio = a;
  a.onended = () => {
    if (currentAudio === a) currentAudio = null;
    setSpeaking(false);
    done && setTimeout(done, 350);
  };
  await a.play();
  setSpeaking(true);
}

function deviceSpeak(text, rate, done) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = TARGET.locale;
  if (S.voice) u.voice = S.voice;
  u.rate = rate;
  u.onstart = () => setSpeaking(true);
  u.onend = () => { setSpeaking(false); done && setTimeout(done, 350); };
  u.onerror = () => { setSpeaking(false); done && setTimeout(done, 350); };
  speechSynthesis.speak(u);
}

function speak(text, slow, done, sp) {
  if (!text) { if (done) done(); return; }
  SFX.ringStop();
  speechSynthesis.cancel();
  stopAudio();
  const rate = slow ? 0.6 : LEVELS[S.level].rate * (SPEEDS[S.speed] || 1);
  if (neuralOK) {
    /* W2: explicit profiles ("clear", "real") name the delivery they promise
       and always win. "slow"/"normal" stay level-aware: a beginner's level
       rate still yields the careful slow instruction it always did. */
    const prof = VOICE_PROFILES[S.speed];
    const pace = slow ? "slow"
      : prof === "clear" || prof === "real" ? prof
      : rate < 0.92 ? "slow" : rate > 1.08 ? "fast" : "normal";
    neuralSpeak(text, rate, done, voiceOf(sp || 1), pace, charOf(sp || 1)).catch(() => deviceSpeak(text, rate, done));
    return;
  }
  deviceSpeak(text, rate, done);
}

/* ---------- MARZI-016: the learning journey ----------
   A map over the EXISTING scenarios in the EXISTING group order - no new
   characters, no new scenarios, no simulated town. Every node stays as
   reachable as it is in the picker: `future` is a look-ahead marker, never a
   lock, so navigation is unchanged. */
function journeyNodes() {
  const out = [];
  GROUPS.forEach((g, gi) => {
    g.ids.forEach((id) => {
      const s = SCENARIOS.find((x) => x.id === id);
      if (s && s.goals) out.push({ id, scenario: s, group: g, groupIndex: gi });
    });
  });
  return out;
}
/* States: done · here (the one recommended next) · open (reachable and part
   of a group already under way) · future (further along the path). */
function journeyState(st) {
  const done = (st || loadStats()).scenariosDone || {};
  const nodes = journeyNodes();
  const isDone = (n) => (done[n.id] || 0) > 0;
  const startedGroups = new Set(nodes.filter(isDone).map((n) => n.groupIndex));
  const hereIndex = nodes.findIndex((n) => !isDone(n));
  const hereGroup = hereIndex < 0 ? -1 : nodes[hereIndex].groupIndex;
  const list = nodes.map((n, i) => ({
    ...n,
    times: done[n.id] || 0,
    state: isDone(n) ? "done"
      : i === hereIndex ? "here"
      : startedGroups.has(n.groupIndex) || n.groupIndex === hereGroup ? "open"
      : "future",
  }));
  return {
    nodes: list,
    doneCount: list.filter((n) => n.state === "done").length,
    total: list.length,
    here: hereIndex < 0 ? null : list[hereIndex],
  };
}
let JOURNEY_VIEW = "map"; // "map" | "list" - the accessible alternative
function setJourneyView(v) {
  JOURNEY_VIEW = v === "list" ? "list" : "map";
  renderJourney();
  return JOURNEY_VIEW;
}
function goToScenario(id) {
  const s = SCENARIOS.find((x) => x.id === id);
  if (!s) return false;
  S.scenario = s;
  saveSettings();
  renderSetup();
  showTab("talk");
  return true;
}
/* MARZI-017: "Recommended now" — the single next action, from the journey
   model that already exists. No new recommendation logic, no provider call. */
function renderRecommended() {
  const L = t();
  const J = journeyState();
  const next = J.here || J.nodes[0];
  const el = $("recoBody");
  if (!el) return null;
  /* a recommendation that repeats the already-selected scenario is noise, not
     guidance - the PO circled exactly this duplication */
  if (!next || next.id === S.scenario.id) {
    el.innerHTML = ""; $("lblTrainNow").classList.add("hidden");
    return next ? next.id : null;
  }
  $("lblTrainNow").classList.remove("hidden");
  el.innerHTML = `<button class="act reco" type="button" id="recoBtn"` +
    ` aria-label="${esc(`${J.here ? L.jrNext : L.jrReview}: ${next.scenario.de}`)}">` +
    `<span class="reco-face" aria-hidden="true">${esc(next.scenario.avatar || "🎧")}</span>` +
    `<span class="reco-tx"><b>${esc(next.scenario.de)}</b>` +
    `<small>${esc(scenarioSubtitle(next.scenario))}</small></span></button>`;
  $("recoBtn").onclick = () => goToScenario(next.id);
  return next.id;
}
/* Recent activity: only calls the app actually recorded, newest first. */
function recentActivity(st, limit) {
  const s = st || loadStats();
  const days = s.days || {};
  return Object.keys(days)
    .filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k))
    .sort().reverse().slice(0, limit || 5)
    .map((k) => {
      const raw = days[k];
      const calls = typeof raw === "number" ? raw : (raw && typeof raw === "object" ? Number(raw.calls) || 0 : 0);
      const secs = Number((s.secDays || {})[k]) || 0;
      return { date: k, calls, minutes: Math.round(secs / 60) };
    })
    .filter((e) => e.calls > 0);
}
function renderRecentActivity() {
  const L = t();
  const el = $("recentBody");
  if (!el) return 0;
  const rows = recentActivity();
  if (!rows.length) {
    el.innerHTML = UI.emptyState({ icon: IC.phone(ICON.hero), title: L.recentNone, body: "" });
    return 0;
  }
  const fmtDate = (iso) => {
    try { return new Intl.DateTimeFormat(localeForLang(S.lang), { weekday: "short", day: "numeric", month: "short" }).format(new Date(iso + "T00:00:00")); }
    catch (e) { return iso; }
  };
  el.innerHTML = `<div class="list">` + rows.map((r) =>
    `<div class="item static"><b>${esc(fmtDate(r.date))}</b>` +
    `<small>${esc(`${fmtNum(r.calls)} ${plural(r.calls, L.callUnit)} · ${fmtNum(r.minutes)} ${plural(r.minutes, L.minUnit)}`)}</small></div>`
  ).join("") + `</div>`;
  return rows.length;
}
/* MARZI-017: Learn shows a COMPACT preview - the node you are on plus the two
   after it - and a link to the full path, which is owned by Talk. */
const JOURNEY_PREVIEW_N = 3;
function journeyPreview(J) {
  const state = J || journeyState();
  const at = Math.max(0, state.nodes.findIndex((n) => n.state === "here"));
  return state.nodes.slice(at, at + JOURNEY_PREVIEW_N);
}
function renderJourneyPreview() {
  const L = t();
  const J = journeyState();
  if (!$("jrPreview")) return 0;
  $("jrPrevTitle").textContent = L.jrTitle;
  $("jrPrevCount").textContent = `${fmtNum(J.doneCount)}/${fmtNum(J.total)}`;
  const stateLabel = { done: L.jrDone, here: L.jrHere, open: L.jrOpen, future: L.jrFuture };
  const nodes = journeyPreview(J);
  $("jrPreview").innerHTML = `<ol class="jr-path compact">` + nodes.map((n) =>
    `<li class="jr-li"><button class="jr-node" type="button" data-jp="${esc(n.id)}" data-state="${n.state}"` +
    `${n.state === "here" ? ' aria-current="step"' : ""}` +
    ` aria-label="${esc(`${n.scenario.de} · ${stateLabel[n.state]}`)}">` +
    `<span class="jr-face" aria-hidden="true">${esc(n.scenario.avatar || "🎧")}</span>` +
    `<span class="jr-nm">${esc(n.scenario.de)}</span></button></li>`).join("") + `</ol>`;
  $("jrPreview").querySelectorAll("[data-jp]").forEach((b) => b.onclick = () => goToScenario(b.dataset.jp));

  return nodes.length;
}
function renderJourney() {
  const L = t();
  if (!$("jrBody")) return;
  const J = journeyState();
  const stateLabel = { done: L.jrDone, here: L.jrHere, open: L.jrOpen, future: L.jrFuture };
  $("jrCount").textContent = `${J.doneCount}/${J.total}`;
  $("jrSeg").innerHTML =
    `<button type="button" data-jv="map" class="${JOURNEY_VIEW === "map" ? "on" : ""}" aria-pressed="${JOURNEY_VIEW === "map"}">${esc(L.jrMap)}</button>` +
    `<button type="button" data-jv="list" class="${JOURNEY_VIEW === "list" ? "on" : ""}" aria-pressed="${JOURNEY_VIEW === "list"}">${esc(L.jrList)}</button>`;
  $("jrSeg").querySelectorAll("[data-jv]").forEach((b) => b.onclick = () => setJourneyView(b.dataset.jv));

  const label = (n) => `${n.scenario.de} · ${stateLabel[n.state]}`;
  if (JOURNEY_VIEW === "map") {
    let lastGroup = -1;
    $("jrBody").innerHTML = `<ol class="jr-path">` + J.nodes.map((n) => {
      const head = n.groupIndex !== lastGroup
        ? `<li class="jr-group" role="presentation">${esc(n.group[S.lang] || n.group.en)}</li>` : "";
      lastGroup = n.groupIndex;
      return head + `<li class="jr-li"><button class="jr-node" type="button" data-jn="${esc(n.id)}"` +
        ` data-state="${n.state}"${n.state === "here" ? ' aria-current="step"' : ""}` +
        ` aria-label="${esc(label(n))}"><span class="jr-face" aria-hidden="true">${esc(n.scenario.avatar || "🎧")}</span>` +
        `<span class="jr-nm">${esc(n.scenario.de)}</span>` +
        `<span class="jr-st" aria-hidden="true">${n.state === "done" ? IC.check(ICON.xs) : ""}</span></button></li>`;
    }).join("") + `</ol>`;
  } else {
    let lastGroup = -1;
    $("jrBody").innerHTML = `<div class="list jr-list">` + J.nodes.map((n) => {
      const head = n.groupIndex !== lastGroup
        ? `<div class="label" style="margin:14px 14px 6px">${esc(n.group[S.lang] || n.group.en)}</div>` : "";
      lastGroup = n.groupIndex;
      return head + `<button class="item" type="button" data-jn="${esc(n.id)}" data-state="${n.state}"` +
        `${n.state === "here" ? ' aria-current="step"' : ""}><b>${esc(n.scenario.de)}</b>` +
        `<small>${esc(scenarioSubtitle(n.scenario) + " · " + stateLabel[n.state])}</small></button>`;
    }).join("") + `</div>`;
  }
  $("jrBody").querySelectorAll("[data-jn]").forEach((b) => b.onclick = () => goToScenario(b.dataset.jn));

  // exactly one recommended next action
  const next = J.here || J.nodes[0];
  $("jrNext").innerHTML = next
    ? IC.mic(ICON.lg) + " " + esc(`${J.here ? L.jrNext : L.jrReview}: ${next.scenario.de}`)
    : "";
  $("jrNext").classList.toggle("hidden", !next);
  if (next) $("jrNext").onclick = () => goToScenario(next.id);
}

   portraits. The drawer stays the full grouped list. */
function scenarioSubtitle(s) {
  const loc = s[S.lang] || s.en;
  return loc === s.de ? s.who : `${loc} · ${s.who}`;
}
function renderScenarioCards() {

  // drawer's full list - otherwise nothing would show as selected
  const playable = SCENARIOS.filter((s) => s.goals);

  if (!cards.some((s) => s.id === S.scenario.id)) {

  $("scnRail").setAttribute("aria-label", L.pick);
  $("scnRail").innerHTML = cards.map((s) => UI.scenarioCard({
    scenario: s, selected: s.id === S.scenario.id, subtitle: scenarioSubtitle(s),

    b.onclick = () => {
      S.scenario = SCENARIOS.find((x) => x.id === b.dataset.scn);

}

    $("limitStore").classList.add("hidden");

    $("limitBack").classList.remove("hidden");
    $("limitBox").classList.remove("hidden");
  };
  // "last celebrated stage" is its own key: the end-of-call celebration and
  // this hero animation are the same event, shown in whichever place happens
  // first. MARZI_KEY keeps its own meaning (last stage the hero rendered).
  const prevStage = +(localStorage.getItem(MARZI_KEY) || 0);
  const celebrated = +(localStorage.getItem(CELEBRATED_KEY) || 0);
  if (prevStage && stage > prevStage && celebrated < stage) {
    try { localStorage.setItem(CELEBRATED_KEY, String(stage)); } catch (e) {}
    $("marzi").classList.remove("evolve");
    void $("marzi").offsetWidth;
    $("marzi").classList.add("evolve");
    SFX.fanfare(); confettiBurst();
  }
  try { localStorage.setItem(MARZI_KEY, String(stage)); } catch (e) {}
  // learner rank stays a small secondary line - rank and evolution remain
  // separate systems (MARZI-001)
  $("heroLv").textContent = `Lv. ${r.n} · ${r.title}`;
  const inLevel = Math.max(0, xp - r.base);
  const needed = r.next ? r.next - r.base : 0;
  $("heroXp").textContent = needed ? `${inLevel} / ${needed} XP` : `${xp} XP`;
  $("xpFill").style.width = (needed ? Math.min(100, Math.round(100 * inLevel / needed)) : 100) + "%";
  $("heroSub").textContent = `${st.calls || 0} ${L.calls}`;
  $("practiceBtn").innerHTML = IC.mic(ICON.lg) + " " + esc(L.practiceNow);
  $("practiceBtn").onclick = () => goCall();
  $("lblJourney").textContent = t().jrTitle;
  renderJourney();

  const strk = currentStreak(st);
  $("heroStreak").innerHTML = `${IC.flame(ICON.btn)} ${strk} <small>${esc(L.days)}</small>`;
  // W4: weekday initials in the LEARNER's language, not hardcoded German
  const wd = (d) => {
    try { return new Intl.DateTimeFormat(localeForLang(S.lang), { weekday: "narrow" }).format(d); }
    catch (e) { return "SMTWTFS"[d.getDay()]; }
  };
  let wk = "";
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    wk += `<div class="d ${i === 0 ? "today" : ""}">${esc(wd(d))}<div class="dot ${(st.days || {})[key] ? "on" : ""}"></div></div>`;
  }
  $("heroWeek").innerHTML = wk;
  $("missionLbl").textContent = L.mission;
  const today = new Date().toISOString().slice(0, 10);
  const steps = [
    [IC.cards(ICON.xxs), L.rVocab, (st.vocabDays || {})[today], "vocab"],
    [IC.chat(ICON.xxs), L.rCall, (st.days || {})[today], "call"],
    [IC.target(ICON.xxs), L.rDrill, (st.drillDays || {})[today], "drill"],
  ];
  $("routine").innerHTML = steps.map(([ic, name, done, act]) =>
    `<button class="${done ? "done" : ""}" data-r="${act}">${done ? "✓" : ic} ${esc(name)}</button>`).join("");
  $("routine").querySelectorAll("[data-r]").forEach((b) => b.onclick = () => {
    if (b.dataset.r === "vocab") startVocab();
    else if (b.dataset.r === "call") goCall();
    else if (loadFixes().some((f) => f.corrected)) startDrill();
    else { renderMistakes(); show("mistakes"); }
  });

  // MARZI-017: the duplicated shortcut strip is gone. Guided dialogue and
  // My mistakes are owned by Talk, My progress by Profile - one canonical
  // destination each, so Learn stays a status screen.
  updateTopbar();
}

function renderStore() {
  const L = t();

    empty: !OUTFITS.some((o) => o.cat === c),
  }));

  // unlocks it — the store presents Marzi's journey, not a flat grid
  const names = marziNames();
  const stage = marziStageForXp(st.xp || 0);
  const card = (o) => {
    const state = outfitState(o.id, st);
    return UI.outfitCard({
      id: o.id, name: outfitName(o.id), price: o.price, state,

/* preview + explicit purchase / equip / unequip */
function openOutfitPreview(id) {
  const L = t();
  const item = outfitById(id);
  if (!item) return;
  STORE_PREVIEW = id;
  const state = outfitState(id, loadStats());
  const primary =
    state === "available" ? UI.buttonPrimary({ id: "storeBuy", label: L.buyBtn, icon: IC.coin(ICON.sm), cls: "store-act" })
    : state === "owned" ? UI.buttonPrimary({ id: "storeEquip", label: L.equipBtn, icon: IC.check(ICON.sm), cls: "store-act" })
    : state === "equipped" ? UI.buttonSecondary({ id: "storeUnequip", label: L.unequipBtn, cls: "store-act" })
    : "";
  // one body line: what it costs, or why it cannot be bought yet
  const body = state === "locked" ? `${L.lockedAt} ${item.stage} · ${item.price} — ${L.lockedHow}`
    : state === "insufficient" ? `${L.notEnough} · ${item.price}`
    : state === "available" ? String(item.price)
    : state === "equipped" ? L.equippedLbl : L.ownedLbl;
  // W3 try-on: Marzi herself stands beside the garment at her CURRENT earned
  // stage, so the preview answers "how would this look on her" — honest
  // composition of existing canonical art, never a pretend final render.
  $("storeModal").innerHTML = UI.modal({
    title: outfitName(id), labelledBy: "storeModalTitle", body,
    actions: `<div class="store-tryon" aria-hidden="true">
        <span class="tryon-marzi">${marziArt(currentMarziStage(), state === "equipped" ? "happy" : "neutral")}</span>
        <span class="tryon-item">${OUTFIT_ART(id)}</span>
      </div>` +
      primary + UI.buttonSecondary({ id: "storeCancel", label: L.cancelBtn, cls: "store-act" }),
  });
  $("storeModal").classList.remove("hidden");
  $("storeBack").classList.remove("hidden");
  const act = $("storeBuy") || $("storeEquip") || $("storeUnequip") || $("storeCancel");
  try { act.focus(); } catch (e) {}
  if ($("storeBuy")) $("storeBuy").onclick = () => runStoreAction(purchaseOutfit(id));
  if ($("storeEquip")) $("storeEquip").onclick = () => runStoreAction(equipOutfit(id));
  if ($("storeUnequip")) $("storeUnequip").onclick = () => runStoreAction(unequipOutfit());
  $("storeCancel").onclick = () => closeOutfitPreview();
  $("storeBack").onclick = () => closeOutfitPreview();
}
function closeOutfitPreview() {
  STORE_PREVIEW = null;
  $("storeModal").classList.add("hidden");
  $("storeBack").classList.add("hidden");
}
/* one place turns a transaction result into feedback + a re-render */
function runStoreAction(res) {
  const L = t();
  const msg = { bought: L.bought, equipped: L.equippedLbl, unequipped: L.ownedLbl,
                insufficient: L.notEnough, locked: L.comingLater, already: L.ownedLbl,
                "save-failed": L.saveFailed, "not-owned": L.notEnough }[res.code] || "";
  STORE_MSG = msg;
  // W3: every store outcome has a distinct sound — success is never silent,
  // and failure never celebrates
  if (res.ok && res.code === "bought") SFX.fanfare();
  else if (res.ok && res.code === "equipped") SFX.equip();
  else if (res.ok && res.code === "unequipped") SFX.equip();
  else if (!res.ok) SFX.error();
  closeOutfitPreview();
  renderStore();
}
function announceStore(msg) {
  const el = $("storeLive");
  if (el) el.textContent = msg;
}
function buyPack(id) {
  const p = COIN_PACKS.find((x) => x.id === id);
  if (!p) return;
  const st = loadStats();
  if ((st.coins || 0) < p.price) { STORE_MSG = t().notEnough; renderStore(); return; }
  st.coins -= p.price;
  st.extraSecs = st.extraSecs || {};
  const d = new Date().toISOString().slice(0, 10);
  st.extraSecs[d] = (st.extraSecs[d] || 0) + p.minutes * 60;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
  SFX.fanfare();
  STORE_MSG = t().bought;
  renderStore();
}

/* ---------- PROFILE: stats, settings, premium teaser ----------
   MARZI-015. Every number on this screen comes from `profileSnapshot()`,
   which reads only counters the app already writes - there is no estimated,
   projected or otherwise invented statistic anywhere below. */
function reviewedMistakeCount() {
  // a mistake counts as reviewed once the drill has actually visited it
  return loadFixes().filter((f) => f && f.drilled).length;
}
function profileSnapshot(st) {
  const s = st || loadStats();
  const xp = s.xp || 0;
  const stage = marziStageForXp(xp);
  const base = MARZI_STAGE_XP[stage - 1];
  const next = stage < MARZI_STAGE_COUNT ? MARZI_STAGE_XP[stage] : null;
  const owned = (s.ownedItemIds || []).filter((id) => OUTFITS.some((o) => o.id === id));
  return {
    xp, stage, rank: rankFor(xp),
    stageBase: base, stageNext: next,
    stageGained: xp - base,
    stageSpan: next === null ? 0 : next - base,
    xpToNext: next === null ? 0 : Math.max(0, next - xp),
    coins: s.coins || 0,
    calls: s.calls || 0,
    seconds: s.seconds || 0,
    minutes: Math.round((s.seconds || 0) / 60),
    streak: currentStreak(s),
    reviewed: reviewedMistakeCount(),
    words: loadWords().length,
    owned,
    equipped: (s.equippedItemIds || [])[0] || null,
  };
}
/* MARZI-017: the last seven days, built ONLY from stats.days, which the app
   already writes per calendar day. If no day was ever recorded, hasHistory is
   false and the caller shows an empty state - a zero-filled chart would be
   invented history. */
function weeklyActivity(st) {
  const s = st || loadStats();
  const days = s.days || {};
  const short = (d) => {
    try { return new Intl.DateTimeFormat(localeForLang(S.lang), { weekday: "narrow" }).format(d); }
    catch (e) { return String(d.getDay()); }
  };
  const long = (d) => {
    try { return new Intl.DateTimeFormat(localeForLang(S.lang), { weekday: "long", day: "numeric", month: "short" }).format(d); }
    catch (e) { return d.toISOString().slice(0, 10); }
  };
  const entries = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);

let D = null;
function startDrill(seedTexts) {
  const all = loadFixes();
  let items = all.map((f, i) => ({ f, i })).filter((x) => x.f.corrected);
  // W2: a post-call retry drills the sentences from THAT call first; if none
  // of them are stored (yet), fall back to the normal queue rather than a
  // dead end.
  if (Array.isArray(seedTexts) && seedTexts.length) {
    const seed = new Set(seedTexts);
    const sub = items.filter((x) => seed.has(x.f.text));
    if (sub.length) items = sub;
  }
  if (!items.length) return;
  // least-practised first, then least-recently practised
  items.sort((a, b) => ((a.f.box || 0) - (b.f.box || 0)) || ((a.f.drilled || "") < (b.f.drilled || "") ? -1 : 1));
  D = { q: items.slice(0, 8), i: 0, open: false, total: Math.min(8, items.length) };
  show("drill");
  renderDrill();
}
function renderDrill() {
  const L = t();

  $("drillBack").textContent = L.back;
  if (D.i >= D.q.length) {
    const xp = D.total * 3;

    $("drillCard").innerHTML =
      `<div class="said" style="font-family:var(--font-sans);font-size:19px;font-weight:700">🎉 ${esc(L.drillDone)}</div>

    return;
  }
  const item = D.q[D.i], f = item.f;
  $("drillCard").innerHTML =
    `<div class="drill-prog">${D.i + 1} / ${D.q.length}</div>
     <div class="said" style="margin-top:10px;font-size:17px">„${esc(f.text)}“</div>
     <p class="note" style="margin-top:8px">${esc(L.drillQ)}</p>` +
    (!D.open
      ? `<button class="ghost" style="width:100%;margin-top:14px" data-da="reveal">${esc(L.reveal)}</button>`
      : `<div class="drill-ok">${esc(f.corrected)}</div>
         ${f.fix ? `<div class="fix">${esc(f.fix)}</div>` : ""}
         ${verdictHTML(D, L)}
         <div class="row">
           <button class="ghost" data-da="play">&#9654; ${esc(L.sayIt)}</button>
           <button class="ghost" data-da="say" ${D.listening ? "disabled" : ""}>${D.listening ? esc(L.listening) : esc(L.sayWord)}</button>
         </div>
         <div class="row">
           <button class="ghost" data-da="knew">${esc(L.knew)}</button>
           <button class="ghost" data-da="retry">${esc(L.retry)}</button>
         </div>`);
  $("drillCard").querySelectorAll("[data-da]").forEach((b) => b.onclick = () => {
    const act = b.dataset.da;
    if (act === "play") { speak(f.corrected, true); return; }
    if (act === "say") { listenFor(f.corrected, D, renderDrill); return; }
    if (act === "reveal") {
      D.open = true; renderDrill();
      // listen -> repeat: after the corrected sentence plays, the mic opens
      speak(f.corrected, true, () => { if (D && D.open && D.q[D.i] === item && !D.listening) listenFor(f.corrected, D, renderDrill); });
      return;
    }
    const all = loadFixes(), rec = all[item.i];
    if (rec) {
      rec.box = act === "knew" ? (rec.box || 0) + 1 : 0;
      rec.drilled = new Date().toISOString().slice(0, 10);
      saveFixes(all);
    }
    if (act === "knew") addCoins(2); // corrected mistake reward (spec §14)
    if (act === "retry") D.q.push(item);
    D.i++; D.open = false; D.verdict = null; D.heard = null; D.err = null;

}

async function loadDeck() {
  const sc = S.scenario;
  const topic = sc.id === "custom" ? (S.customTopic || "").trim() : "";
  const key = VOCAB_NS + "v2." + sc.id + "." + (topic ? encodeURIComponent(topic).slice(0, 60) + "." : "") + S.lang + "." + S.level;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(c) && c.length) return c;
  } catch (e) {}
  const help = HELP_LANG[S.lang] || "English";
  const what = topic ? `a phone call about: ${topic}`
    : sc.kind === "face" ? `${sc.de} - an in-person conversation at ${sc.place}`
    : `${sc.de} - calling ${sc.place}`;
  const res = await chatFetch({
    system: `You create a vocabulary deck for a ${TARGET.name} learner at CEFR level ${S.level} preparing for ${what}.
Return ONLY a JSON array, no markdown, of exactly 12 items:
[{"de":"...","tr":"...","ex":"...","xt":"..."}]
"de": the ${TARGET.name} word with its article (for nouns) or a short key phrase. "tr": its translation in ${help}. "ex": one short natural ${TARGET.name} sentence using it, something the learner could actually say or hear in this phone call, at level ${S.level}. "xt": the translation of "ex" in ${help}.
Pick what is genuinely most useful for THIS call: core nouns, key verbs, and 2-3 fixed telephone phrases.`,
    messages: [{ role: "user", content: "Create the deck." }],
  });
  const data = await res.json();
  const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const clean = raw.replace(/```json|```/g, "").trim();
  const deck = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]") + 1))
    .filter((x) => x && x.de && x.tr).slice(0, 12)
    .map((x) => ({ de: x.de, tr: x.tr, ex: x.ex || "", exTr: x.xt || "" }));
  if (!deck.length) throw new Error("empty deck");
  try { localStorage.setItem(key, JSON.stringify(deck)); } catch (e) {}
  return deck;
}

function startVocab() {
  const L = t();
  V = { stage: "pick" };
  $("vocabTitle").textContent = L.vocab.toUpperCase();
  $("vocabSub").textContent = "";
  $("vocabBack").textContent = L.back;
  show("vocab");
  renderVocab();
}

async function openDeck(kind) {
  V = { stage: "deck", deck: null, i: 0, flipped: false, heard: null, verdict: null, listening: false, failed: false };
  if (kind === "call") {
    const sc = S.scenario;
    V.clipChar = sc.id !== "custom" && sc.id !== "random" ? sc.id : "";
    V.clipVoice = sc.voice || "";
    $("vocabSub").textContent = sc.id === "custom" ? S.customTopic : `${sc.de} · ${sc.who}`;
    renderVocab();
    try { V.deck = await loadDeck(); } catch (e) { V.failed = true; }
    renderVocab();
  } else if (kind === "mywords") {
    const L = t();
    V.mywords = true;
    V.clipChar = TARGET.deckChar; V.clipVoice = TARGET.deckVoice;
    $("vocabSub").innerHTML = `${IC.star(ICON.sm)} ${esc(L.myWords)}`;
    V.deck = loadWords().slice().reverse().slice(0, 20).map((w) => ({ de: w.de, tr: w.tr, ex: w.ex || "", exTr: w.exTr || "" }));
    renderVocab();
  } else {
    const d = BASIC_DECKS.find((x) => x.id === kind);
    V.clipChar = TARGET.deckChar; V.clipVoice = TARGET.deckVoice;
    $("vocabSub").innerHTML = `${deckIc(d.icon, 13)} ${esc(d.de)} · ${esc(d[S.lang] || d.en)}`;
    V.deck = d.items.map((it) => ({ de: it.de, tr: it[S.lang] || it.en, ex: it.ex || "", exTr: (it.xl || {})[S.lang] || (it.xl || {}).en || "" }));
    renderVocab();
  }
}

function renderVocab() {
  const L = t();
  if (V.stage === "pick") {
    const scOK = !(S.scenario.id === "random" || (S.scenario.id === "custom" && !(S.customTopic || "").trim()));
    const nw = loadWords().length;
    $("vocabBody").innerHTML = `<div class="list">
      <button class="item" data-vd="call" ${scOK ? "" : "disabled"}>
        <b>${IC.phone(ICON.chip)} ${esc(L.forCall)}</b><small>${esc(S.scenario.id === "custom" ? (S.customTopic || "—") : S.scenario.de)}</small></button>
      <button class="item" data-vd="mywords" ${nw ? "" : "disabled"}>
        <b>${IC.star(ICON.chip)} ${esc(L.myWords)}</b><small>${nw ? `${nw} ${esc(L.saved)}` : esc(L.tapWordHint)}</small></button>
      ${BASIC_DECKS.map((d) => `<button class="item" data-vd="${d.id}">
        <b>${deckIc(d.icon, 14)} ${esc(d.de)}</b><small>${esc(d[S.lang] || d.en)}</small></button>`).join("")}
    </div>`;
    $("vocabBody").querySelectorAll("[data-vd]").forEach((b) =>
      b.onclick = () => { if (!b.disabled) openDeck(b.dataset.vd); });
    return;
  }
  if (V.failed) {
    $("vocabBody").innerHTML =
      `<p class="note">${esc(L.vocabFail)}</p>
       <button class="ghost" style="width:100%;margin-top:12px" data-va="reload">${esc(L.retry)}</button>`;
  } else if (!V.deck) {
    $("vocabBody").innerHTML = `<p class="note">${esc(L.vocabLoading)}</p>`;
  } else if (V.i >= V.deck.length) {
    if (!V.deck.length) { $("vocabBody").innerHTML = `<p class="note">—</p>`; return; }
    addXp(12);
    addCoins(10);
    markDay("vocabDays");
    confettiBurst();
    $("vocabBody").innerHTML =
      `<div class="said" style="font-family:var(--font-sans);font-size:19px;font-weight:700">🎉 ${esc(L.vocabDone)}</div>
       <div style="margin-top:10px"><span class="chip">+12 XP</span> <span class="chip coin">+10 ${IC.coin(ICON.xxs)}</span></div>`;
  } else {
    const c = V.deck[V.i];
    $("vocabBody").innerHTML =
      `<div class="drill-prog">${V.i + 1} / ${V.deck.length}</div>
       <div class="v-card" data-va="flip" style="margin-top:10px">
         <div class="v-de">${esc(c.de)}</div>
         ${V.flipped
           ? `<div class="v-tr">${esc(c.tr)}</div>${c.ex ? `<div class="v-ex">„${esc(c.ex)}“${c.exTr ? `<br><span style="font-style:italic;opacity:.85">${esc(c.exTr)}</span>` : ""}</div>` : ""}${V.mywords ? `<div><button class="mini" data-va="del">✕</button></div>` : ""}`
           : `<div class="v-flip">${esc(L.vocabFlip)}</div>`}
       </div>
       ${V.flipped && clipsOK && V.clipChar ? `<div class="row"><button class="ghost" data-va="watch">▶ ${esc(L.watchIt)}</button></div>` : ""}
       ${clipHTML(V, L)}
       ${verdictHTML(V, L)}
       <div class="row">
         <button class="ghost" data-va="hear">&#9834; ${esc(L.sayIt)}</button>
         <button class="ghost ${V.listening ? "" : ""}" data-va="say" ${V.listening ? "disabled" : ""}>${V.listening ? esc(L.listening) : esc(L.sayWord)}</button>
       </div>
       <div class="row">
         <button class="ghost" data-va="next">${esc(L.next)} &rsaquo;</button>
       </div>`;
  }
  $("vocabBody").querySelectorAll("[data-va]").forEach((b) => b.onclick = (ev) => {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    const c = V.deck && V.deck[V.i];
    switch (b.dataset.va) {
      case "reload": openDeck("call"); break;
      case "del":
        if (c) {
          saveWordsList(loadWords().filter((w) => w.de !== c.de));
          V.deck.splice(V.i, 1);
          V.flipped = false; V.heard = null; V.verdict = null; V.err = null; V.clip = null; V.clipUrl = null;
          renderVocab();
        }
        break;
      case "flip":
        V.flipped = !V.flipped; renderVocab();
        if (V.flipped && c && c.ex) speak(c.ex, true);
        break;
      case "hear":
        // listen -> repeat: after the word plays, the mic opens by itself
        if (c) speak(c.de, true, () => { if (V && V.deck && V.deck[V.i] === c && !V.listening) vocabListen(c.de); });
        break;
      case "say": if (c) vocabListen(c.de); break;
      case "watch": if (c) loadClip(V, c.de, V.clipChar, V.clipVoice, renderVocab); break;
      case "next":
        stopAudio(); speechSynthesis.cancel();
        V.i++; V.flipped = false; V.heard = null; V.verdict = null; V.err = null; V.clip = null; V.clipUrl = null;
        renderVocab();
        break;
    }
  });
}

/* shared pronunciation listener: writes listening/verdict/heard/err into st.
   `target` may be a string or an array of accepted variants (first = model
   answer, spoken back on a miss - used by the guided dialogues). */
async function listenFor(target, st, rerender) {
  const L = t();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { st.err = L.noMic; rerender(); return; }
  if (st.listening) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((tr) => tr.stop());
  } catch (e) { st.err = L.micBlocked; rerender(); return; }
  speechSynthesis.cancel(); stopAudio();
  st.err = null; st.verdict = null; st.heard = null;
  const r = new SR();
  r.lang = TARGET.locale; r.interimResults = false; r.maxAlternatives = 5;
  r.onresult = (e) => {
    const alts = Array.from(e.results[0]).map((a) => a.transcript);
    const targets = Array.isArray(target) ? target : [target];
    const ok = alts.some((a) => targets.some((tg) => saidWord(a, tg)));
    st.heard = alts[0]; st.verdict = ok ? "ok" : "bad";
    rerender();
    if (!ok) speak(targets[0], true);
  };
  r.onerror = (e) => {
    st.listening = false;
    const c = e && e.error;
    if (c === "no-speech") st.err = L.noSpeech;
    else if (c === "not-allowed" || c === "service-not-allowed") st.err = L.micBlocked;
    else if (c === "audio-capture") st.err = L.noDevice;
    else if (c !== "aborted") st.err = L.micErr + ": " + c;
    rerender();
  };
  r.onend = () => { st.listening = false; rerender(); };
  try { r.start(); st.listening = true; rerender(); }
  catch (e) { st.listening = false; st.err = L.micErr; rerender(); }
}
function vocabListen(target) { return listenFor(target, V, renderVocab); }

/* pre-rendered talking clips (lip-synced videos) for fixed sentences.
   Off until the server has a Replicate token; a 501 hides the feature. */
let clipsOK = true;
const clipCache = new Map(); // hash key -> object URL
async function loadClip(st, text, char, voice, rerender) {
  const key = char + "|" + voice + "|" + text;
  st.clip = text;
  st.clipUrl = clipCache.get(key) || null;
  rerender();
  if (st.clipUrl) return;
  try {
    const res = await fetch(`/api/clip?char=${encodeURIComponent(char)}&voice=${encodeURIComponent(voice)}&text=${encodeURIComponent(text)}&lang=${TARGET.code}&pin=${encodeURIComponent(localStorage.getItem(PIN_KEY) || "")}`);
    if (res.status === 501) { clipsOK = false; st.clip = null; rerender(); return; }
    if (!res.ok) throw new Error("clip " + res.status);
    const url = URL.createObjectURL(await res.blob());
    clipCache.set(key, url);
    if (st.clip === text) { st.clipUrl = url; rerender(); }
  } catch (e) {
    if (st.clip === text) { st.clip = null; rerender(); }
  }
}
function clipHTML(st, L) {
  if (!st.clip) return "";
  return st.clipUrl
    ? `<video src="${st.clipUrl}" autoplay playsinline controls style="width:100%;border-radius:12px;margin-top:10px"></video>`
    : `<p class="note" style="margin-top:10px">${esc(L.clipLoading)}</p>`;
}
/* small verdict box shared by vocab cards and the mistake drill */
function verdictHTML(st, L) {
  return (st.err ? `<div class="v-verdict bad">${esc(st.err)}</div>` : "") +
    (st.verdict ? `<div class="v-verdict ${st.verdict}">${st.verdict === "ok" ? "✓ " + esc(L.wellSaid) : "↻ " + esc(L.almost)}${st.heard ? `<br><span style="font-weight:400">${esc(L.heardYou)} „${esc(st.heard)}“</span>` : ""}</div>` : "");
}

/* ---------- celebration ---------- */
function confettiBurst() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.createElement("div");
  c.className = "confetti";
  const cols = ["#6f9d43", "#eab54e", "#2e7d5b", "#16130d", "#ff6f59"];
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = 1.4 + Math.random() * 1.4 + "s";
    p.style.animationDelay = Math.random() * 0.4 + "s";
    c.appendChild(p);
  }
  document.body.appendChild(c);
  setTimeout(() => c.remove(), 3400);
}

/* ---------- call ---------- */
function systemPrompt() {
  const L = LEVELS[S.level], help = HELP_LANG[S.lang] || "English", s = S.active || S.scenario;
  const face = s.kind === "face";
  const custom = s.id === "custom"
    ? `\nThe learner described the situation in their own words (possibly not in ${TARGET.name}): interpret it, decide what kind of business or office would be called, and play that role realistically.\n`
    : "";
  const recent = loadFixes().slice(-8);
  const weakSpots = recent.length
    ? `\nThe learner's recent recurring mistakes (from earlier calls):\n${recent.map((f) => `- said "${f.text}" -> better: ${f.fix}`).join("\n")}\nWhen natural, steer the conversation so the learner gets a chance to practise these patterns again. Never mention that you are doing this.\n`
    : "";
  return `You are running a ${TARGET.name}-language ${face ? "face-to-face" : "telephone"} role-play for a learner at CEFR level ${S.level}.
Your role: ${s.role} at ${s.place}. The learner ${face ? "approaches you in person" : "is calling"} to ${S.currentGoal}.
${custom}${weakSpots}
Rules:
- The "reply" field is ONLY ${TARGET.name}. Stay in character for the whole ${face ? "conversation" : "call"}. Never mention that this is practice.
- Level guidance: ${L.guide}
- At most ${L.words} words per reply, at most one question per turn.
${face
  ? `- Open the conversation as this person naturally would in this place (a simple ${TARGET.faceEx}), never with telephone formulas.
- This is spoken in person: casual register where natural, react to the situation around you (queue, weather, noise), small human touches.`
  : `- Answer the phone first with a realistic ${TARGET.name} greeting for this kind of business.`}
- Drive the ${face ? "conversation" : "call"} to a real conclusion: ${face ? "resolve the learner's concern concretely, then part naturally" : "offer concrete dates and times, confirm the learner's name, then say goodbye"}.
- You are a warm real person who notices the learner is not a native speaker. When they make a clear mistake, OCCASIONALLY (at most every third turn, not always) react the way a kind ${TARGET.name} would: show you understood, then naturally model the correct phrase inside your ${TARGET.name} reply - e.g. ${TARGET.fixEx}. Keep it brief and encouraging, never lecture, then continue the conversation.
- Sometimes, when natural (especially at B1 and above, or when the learner's request needs it), hand the learner over to a SECOND person - the doctor, a supervisor, a colleague, a spouse. That person introduces themselves and continues the conversation in their own manner. From that reply on set "speaker":"second"; if the first person takes the call back, set "speaker":"main" again.
- If the learner speaks ${TARGET.slipLangs}, still answer in ${TARGET.name}, and make "suggestion" easier.

Return ONLY a JSON object. No markdown, no code fences. Keys:
"reply": your ${TARGET.name} line.
"translation": that same line in ${help}.
"feedback": at most 25 words in ${help} about the learner's last ${TARGET.name} line - what was wrong and the natural way to say it. Empty string if the learner has not spoken yet or the line was fine.
"corrected": the learner's last line rewritten as one natural, correct ${TARGET.name} sentence. Empty string if the learner has not spoken yet or the line was fine.
"suggestion": one natural ${TARGET.name} sentence the learner could say next, at level ${S.level}.
"speaker": "main" while the usual contact person is speaking, "second" while a different person (doctor, supervisor, colleague, spouse) has the conversation.
"done": true only after you have said goodbye.`;
}

/* Pre-MARZI-004 prompt history (rollback path). No longer called: the
   session transcript in ConversationSession is the single canonical source
   for prompt history now. Delete once the migration has soaked.

   NAME: a top-level `function history()` becomes a property of `window` and
   REPLACES the native History object - `window.history.back`,
   `.pushState` and `.replaceState` all became undefined, and because every
   call site is wrapped in try/catch the failures were silent. Verified in a
   clean top-level browser. Never name a global `history`. */
function legacyPromptHistory() {
  return [{ role:"user", content:TARGET.seed }]
    .concat(S.turns.map((x) => ({ role: x.me ? "user" : "assistant", content: x.text })));
}

/* ================= MARZI-003 · Conversation Engine (architecture) =================
   Provider-agnostic core for role-play conversations. Nothing in this block
   touches the network, audio APIs, rewards or UI - concrete AI/speech/voice
   providers are injected through the registry below. The live call flow
   (ask/listen/speak above) migrates onto this engine in a later task. */

/* ---- interface contracts (duck-typed, enforced at registration) ----
   ai:     async complete({system, messages}) -> {text}         (chat model)
   speech: start({lang, onResult, onError}) / stop()            (STT)
   voice:  async speak({text, voice, speed}) / stopAll()        (TTS) */
const ENGINE_CONTRACTS = {
  ai: ["complete"],
  speech: ["start", "stop"],
  voice: ["speak", "stopAll"],
};
function validateProvider(kind, impl) {
  const contract = ENGINE_CONTRACTS[kind];
  if (!contract) throw new Error("unknown provider kind: " + kind);
  const missing = contract.filter((m) => typeof (impl && impl[m]) !== "function");
  if (missing.length) throw new Error(`provider "${kind}" is missing: ${missing.join(", ")}`);
  return impl;
}

/* ---- dependency injection ---- */
function createProviderRegistry() {
  const reg = {};
  return {
    register(kind, impl) { reg[kind] = validateProvider(kind, impl); return impl; },
    get(kind) {
      if (!reg[kind]) throw new Error("no provider registered for: " + kind);
      return reg[kind];
    },
    has(kind) { return Boolean(reg[kind]); },
  };
}

/* ---- registries: read-only views over the canonical scenario data ---- */
const ScenarioRegistry = {
  ids() { return SCENARIOS.filter((s) => s.goals).map((s) => s.id); },
  get(id) {
    const s = SCENARIOS.find((x) => x.id === id && x.goals);
    if (!s) throw new Error("unknown scenario: " + id);
    return s;
  },
};
const CharacterRegistry = {
  get(scenarioId, speaker) {
    const s = ScenarioRegistry.get(scenarioId);
    const second = speaker === 2;
    return Object.freeze({
      id: scenarioId + (second ? "2" : ""), scenarioId, speaker: second ? 2 : 1,
      name: s.who, avatar: s.avatar, kind: s.kind || "phone",
      voice: second ? (s.voice2 || s.voice) : s.voice,
    });
  },
};

/* ---- transcript model ---- */
function createTranscript() {
  const turns = [];
  return {
    add(turn) {
      if (!turn || typeof turn.text !== "string" || !turn.text.trim()) throw new Error("turn needs text");
      if (turn.speaker !== "learner" && turn.speaker !== "character") throw new Error("turn speaker must be learner|character");
      const prev = turns[turns.length - 1];
      if (prev && prev.speaker === turn.speaker && prev.text === turn.text) throw new Error("duplicate turn rejected");
      turns.push(Object.freeze({ ...turn, index: turns.length }));
      return turns.length;
    },
    list() { return turns.slice(); },
    last() { return turns[turns.length - 1] || null; },
    /* provider message shape; optional seed opens the exchange */
    forPrompt(seed) {
      const msgs = turns.map((t) => ({ role: t.speaker === "learner" ? "user" : "assistant", content: t.text }));
      return seed ? [{ role: "user", content: seed }].concat(msgs) : msgs;
    },
  };
}

/* ---- prompt builder ----
   Delegates to systemPrompt(), which is byte-frozen for German by the test
   suite - the engine must not fork the prompt text. S is snapshotted and
   restored, so building a prompt never leaks state into the live app. */
const PromptBuilder = {
  rolePlay(cfg) {
    const prev = { scenario: S.scenario, level: S.level, lang: S.lang,
                   active: S.active, currentGoal: S.currentGoal };
    try {
      S.active = cfg.scenario; S.scenario = cfg.scenario;
      if (cfg.level) S.level = cfg.level;
      if (cfg.lang) S.lang = cfg.lang;
      S.currentGoal = cfg.goal;
      return systemPrompt();
    } finally { Object.assign(S, prev); }
  },
};

/* ---- conversation session + lifecycle: created -> active -> ended ----
   MARZI-004: the transcript here is the SINGLE canonical source for prompt
   history; S.turns stays a render-only mirror. ask() carries the safety
   guards: no concurrent AI requests, replies landing after end() are
   dropped, and provider errors never corrupt the session state.
   Accepts an ad-hoc scenario object (custom-topic calls) or a registry id. */
function createConversationSession({ scenario, scenarioId, level, lang, goal, providers }) {
  const sc = scenario || ScenarioRegistry.get(scenarioId);
  const transcript = createTranscript();
  let state = "created", askInFlight = false;
  const session = {
    get state() { return state; },
    get busy() { return askInFlight; },
    scenario: sc, transcript,
    character(n) {
      if (scenarioId) return CharacterRegistry.get(scenarioId, n || 1);
      const second = n === 2;
      return Object.freeze({
        id: (sc.id || "custom") + (second ? "2" : ""), scenarioId: sc.id, speaker: second ? 2 : 1,
        name: sc.who, avatar: sc.avatar, kind: sc.kind || "phone",
        voice: second ? (sc.voice2 || sc.voice) : sc.voice,
      });
    },
    start() {
      if (state !== "created") throw new Error("cannot start from state: " + state);
      state = "active";
      return session;
    },
    /* character's next line for the transcript as it stands (a call opens
       with the character, so this must not require a learner turn) */
    async ask() {
      if (state !== "active") throw new Error("session is " + state + ", not active");
      if (askInFlight) throw new Error("duplicate ai request rejected");
      askInFlight = true;
      try {
        const reply = await providers.get("ai").complete({
          system: PromptBuilder.rolePlay({ scenario: sc, level, lang, goal }),
          messages: transcript.forPrompt(TARGET.seed),
        });
        if (state !== "active") return null; // ended while waiting: drop the late reply
        if (!reply || typeof reply.text !== "string") throw new Error("ai provider must return {text}");
        transcript.add({ speaker: "character", text: reply.text, meta: reply.raw });
        return reply;
      } finally { askInFlight = false; }
    },
    async send(learnerText) {
      if (state !== "active") throw new Error("session is " + state + ", not active");
      if (askInFlight) throw new Error("duplicate ai request rejected");
      transcript.add({ speaker: "learner", text: learnerText });
      return session.ask();
    },
    end() { state = "ended"; return session; },
  };
  return session;
}

/* ---- MARZI-004: the live app behind the engine contracts ----
   Adapters wrap the EXISTING flows unchanged - chatFetch (429/PIN handling
   included), the Web Speech API recognizer, and the neural-with-device-
   fallback speak() chain - so the engine stays provider-agnostic while the
   user experience is byte-identical. */
const liveAIProvider = {
  async complete({ system, messages }) {
    const res = await chatFetch({ system, messages });
    const data = await res.json();
    const rawTxt = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = rawTxt.replace(/```json|```/g, "").trim();
    const p = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    return { text: p.reply, raw: p }; // the strict-JSON payload rides along for the UI
  },
};
const liveSpeechProvider = {
  start({ lang, onResult, onError, onEnd }) {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new SR();
    r.lang = lang; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = (e) => onResult(e.results[0][0].transcript);
    r.onerror = (e) => onError && onError(e && e.error);
    r.onend = () => onEnd && onEnd();
    r.start();
    return r;
  },
  stop() { try { S.rec && S.rec.stop(); } catch (e) {} },
};
const liveVoiceProvider = {
  async speak({ text, slow, speaker, done }) { speak(text, slow, done, speaker); },
  stopAll() { speechSynthesis.cancel(); stopAudio(); },
};
const ENGINE = createProviderRegistry();
ENGINE.register("ai", liveAIProvider);
ENGINE.register("speech", liveSpeechProvider);
ENGINE.register("voice", liveVoiceProvider);
/* =============== end MARZI-003 Conversation Engine =============== */

/* UI layer over ConversationSession.ask(): the session owns prompt history
   and the safety guards; this function owns rendering, feedback attachment,
   speaker switching and voice output - unchanged user experience. */
async function ask() {
  const ses = S.session;
  if (!ses || ses.state !== "active" || ses.busy) return;
  S.busy = true; renderCall();
  try {
    const reply = await ses.ask();
    if (!reply) { S.busy = false; return; } // call ended while waiting: drop silently
    const p = reply.raw || {};
    if (p.feedback) {
      for (let i = S.turns.length - 1; i >= 0; i--) {
        if (S.turns[i].me) {
          S.turns[i].fix = p.feedback;
          if (p.corrected) S.turns[i].corrected = p.corrected;
          saveFix(S.turns[i].text, p.feedback, p.corrected || "");
          break;
        }
      }
    }
    S.speaker = p.speaker === "second" ? 2 : 1;
    S.turns.push({ me:false, text:reply.text, tr:p.translation, sp:S.speaker });
    S.hint = p.suggestion || null;
    S.busy = false; renderCall();
    ENGINE.get("voice").speak({ text: reply.text, slow: false, speaker: S.speaker,
      done: () => { if (S.handsFree && !p.done) listen(); } });
  } catch (e) {
    S.busy = false;
    alertMsg(isOffline() ? t().offlineMsg : t().err);
    renderCall();
  }
}

function send(text) {
  const clean = (text || "").trim();
  if (!clean || S.busy) return;
  const ses = S.session;
  if (!ses || ses.state !== "active" || ses.busy) return;
  // canonical transcript first: a double submit is rejected there and never
  // reaches the render model or the provider
  try { ses.transcript.add({ speaker: "learner", text: clean }); }
  catch (e) { return; }
  // a new turn clears a stale error (e.g. an earlier mic warning) so the
  // status chip shows what is happening NOW, not what failed before
  if (S.callError) alertMsg(null);
  S.turns.push({ me:true, text:clean });
  S.hint = null;
  $("draft").value = "";
  ask();
}

function alertMsg(msg) {
  const el = $("alert");
  S.callError = !!msg;
  if (!msg) { el.classList.add("hidden"); try { renderCallStatus(); } catch (e) {} return; }
  el.textContent = msg; el.classList.remove("hidden");
  try { renderCallStatus(); } catch (e) {}
}

/* fromUser: only an explicit mic tap may escalate a failure into the typing
   panel. The hands-free auto-listen retries silently with the alert as the
   cue — auto-opening a panel the learner never asked for would also crush
   the companion band on short screens. */
async function listen(fromUser) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alertMsg(t().noMic); if (fromUser) showTypeRow(); return; }
  if (S.listening) { try { S.rec.stop(); } catch (e) {} return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    stream.getTracks().forEach((tr) => tr.stop());
  } catch (e) { alertMsg(t().micBlocked); if (fromUser) showTypeRow(); return; }

  ENGINE.get("voice").stopAll();
  alertMsg(null);
  try {
    S.rec = ENGINE.get("speech").start({
      lang: TARGET.locale,
      onResult: (text) => send(text),
      onError: (c) => {
        S.listening = false;
        if (c === "not-allowed" || c === "service-not-allowed") alertMsg(t().micBlocked);
        else if (c === "no-speech") alertMsg(t().noSpeech);
        else if (c === "audio-capture") alertMsg(t().noDevice);
        else if (c !== "aborted") alertMsg(t().micErr + ": " + c);
        renderCall();
      },
      onEnd: () => { S.listening = false; renderCall(); },
    });
    S.listening = true; renderCall();
  } catch (e) { S.listening = false; alertMsg(t().micErr + ": " + e.message); renderCall(); }
}

/* tap a word in the other person's line -> look it up and save it */
async function saveWordTap(ti, raw) {
  const turn = S.turns[ti];
  if (!turn || (turn.wsave && turn.wsave.pending)) return;
  const clean = normDe(raw);
  if (!clean) return;
  const existing = loadWords().find((w) => normDe(w.raw) === clean || normDe(w.de).split(" ").includes(clean));
  if (existing) { turn.wsave = { de: existing.de, tr: existing.tr }; renderCall(); return; }
  turn.wsave = { pending: true };
  renderCall();
  try {
    const help = HELP_LANG[S.lang] || "English";
    const res = await chatFetch({
      system: `Return ONLY a JSON object, no markdown: {"de":"...","tr":"..."}. "de": the dictionary form of the tapped ${TARGET.name} word (nouns capitalized with their article, verbs in the infinitive). "tr": a short translation in ${help} that fits this context.`,
      messages: [{ role: "user", content: `Tapped word: "${raw}"\nSentence: "${turn.text}"` }],
    });
    const data = await res.json();
    const rawTxt = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const cleanTxt = rawTxt.replace(/```json|```/g, "").trim();
    const p = JSON.parse(cleanTxt.slice(cleanTxt.indexOf("{"), cleanTxt.lastIndexOf("}") + 1));
    if (!p.de || !p.tr) throw new Error("bad lookup");
    const words = loadWords();
    words.push({ de: p.de, tr: p.tr, raw, ex: turn.text, exTr: turn.tr || "", lang: S.lang, date: new Date().toISOString().slice(0, 10) });
    saveWordsList(words);
    turn.wsave = { de: p.de, tr: p.tr };
  } catch (e) {
    turn.wsave = null;
  }
  renderCall();
}

function tappable(text, ti) {
  return String(text).split(/(\s+)/).map((tok) => {
    const clean = tok.replace(/[^A-Za-zÄÖÜäöüß-]/g, "");
    return clean.length > 1
      ? `<button type="button" class="w" data-w="${esc(clean)}" data-ti="${ti}">${esc(tok)}</button>`
      : esc(tok);
  }).join("");
}

function mmss() {
  const m = String(Math.floor(S.seconds / 60)).padStart(2, "0");
  const s = String(S.seconds % 60).padStart(2, "0");
  return m + ":" + s;
}
function timerText() {
  const A = S.active || S.scenario;
  return (A.kind === "face" ? TARGET.timerFace + " · " : TARGET.timerCall + " · ") + mmss();
}

/* Mic button state (review §7): visual + announced. busy wins over listening. */
function micStatusFor(state) {
  return state.busy ? "processing" : state.listening ? "listening" : "ready";
}
/* MARZI-005 call state: one source for the status chip, the mic button and
   the live region. Every state is icon + text + colour, never colour alone. */
function callStateFor(state) {
  if (state.session && state.session.state === "ended") return "disconnected";
  if (state.callError) return "error";
  if (state.speaking) return "speaking";
  if (state.busy) return "processing";
  if (state.listening) return "listening";
  return "ready";
}
function callStateLabel(st) {
  const L = t();
  return { ready: L.speak, listening: L.listening, processing: L.stProcessing,
           speaking: L.stSpeaking, disconnected: L.stEnded, error: L.stError }[st] || L.speak;
}
function callStateIcon(st) {
  return { ready: IC.mic(ICON.sm), listening: IC.wave(ICON.sm), processing: IC.clock(ICON.sm),
           speaking: IC.speaker(ICON.sm), disconnected: IC.phone(ICON.sm), error: IC.warn(ICON.sm) }[st] || IC.mic(ICON.sm);
}
/* light update: status chip + live region + mic button, no full re-render.
   Disconnected and error stay visible until the state itself resolves. */
function renderCallStatus() {
  const st = callStateFor(S);
  const label = callStateLabel(st);
  const chip = $("callStatus");
  chip.dataset.state = st;
  chip.innerHTML = callStateIcon(st) + `<span>${esc(label)}</span>`;
  chip.setAttribute("role", "status");
  $("callStatusLive").textContent = label;
  const mic = $("micBtn");
  if (mic) {
    mic.dataset.status = st === "error" ? "failed" : micStatusFor(S);
    mic.disabled = S.busy;

  const scr = $("vcAv");
  if (scr && scr.classList) scr.classList.toggle("speaking", st === "speaking");
  // Marzi's presentation state follows the same single source

  if (comp && comp.dataset && comp.dataset.stage) {

    if (comp.dataset.state !== mood) renderCallCompanion();
  }

/* remaining call time from the existing plan math (read-only) */
function callSecondsLeft() {
  return Math.max(0, planLimitToday() - planUsedToday() - (S.seconds || 0));
}
/* MARZI-018-R3 (R2-APP-02): the one approved replay path for the character's
   last line. The Replay pill and per-line replays share the voice provider;
   nothing owns its own speech implementation. */
function replayLastCharacterLine() {
  for (let i = S.turns.length - 1; i >= 0; i--) {
    if (!S.turns[i].me) {
      ENGINE.get("voice").speak({ text: S.turns[i].text, slow: false, speaker: S.turns[i].sp || 1 });
      return true;
    }

}
function renderCall() {
  const L = t();
  const A = S.active || S.scenario;
  // identity: kicker + name + place, centred, never truncated (board 02)
  $("callId").innerHTML = UI.callIdentity({
    kicker: L.talkingWith, name: A.who, place: A[S.lang] || A.en || A.de || "",
  });
  // MARZI-018 M-01: the emoji is the portrait's fallback. While it is the
  // thing being shown it must carry the character's accessible name; once the
  // portrait loads it leaves the scene and becomes decorative.

    else { e.removeAttribute("aria-hidden"); e.setAttribute("role", "img"); e.setAttribute("aria-label", A.who || ""); }
  };

  const finalArt = A.id && hasCallStageAsset(contactAssetPath(A.id, S.speaker))
    ? contactAssetPath(A.id, S.speaker) : "";
  const src = finalArt || (A.id && A.id !== "custom" && A.id !== "random"
    ? `/api/avatar/${A.id}${S.speaker === 2 ? "2" : ""}?v=3&pin=${encodeURIComponent(localStorage.getItem(PIN_KEY) || "")}`
    : "");

  if (stageEl && stageEl.style) stageEl.style.backgroundImage = bg ? `url("${bg}")` : "";

  $("callConn").innerHTML = IC.wave(ICON.sm) + `<span class="sr-only">${esc(callStateLabel(callStateFor(S)))}</span>`;

  $("callMinBtn").setAttribute("aria-label", A.kind === "face" ? L.endTalk : L.hangUp);

  $("callControls").innerHTML =

    UI.callControl({ id: "hangBtn", icon: IC.phone(ICON.xl), label: A.kind === "face" ? L.endTalk : L.hangUp, variant: "danger" });
  wireCallControls();

  /* the approved tool set, each with a distinct labelled value:
     Need help · Text · Slow · Replay. Auto is no longer a visible control —
     hands-free listening stays the internal default behavior. */
  $("repeatBtn").innerHTML = IC.clock(ICON.sm) + `<span>${esc(L.slowLabel)}</span>`;
  $("repeatBtn").setAttribute("aria-label", L.repeat);
  $("repeatBtn").title = L.repeat;
  $("playBtn").innerHTML = IC.speaker(ICON.sm) + `<span>${esc(L.replayLabel)}</span>`;
  $("playBtn").setAttribute("aria-label", L.playLast);
  $("playBtn").title = L.playLast;
  $("repeatBtn").disabled = !S.turns.some((x) => !x.me);
  $("playBtn").disabled = !S.turns.some((x) => !x.me);
  // W2: inline help + live-text pills
  $("helpBtn").innerHTML = IC.help(ICON.sm) + `<span>${esc(L.helpLabel)}</span>`;
  $("helpBtn").setAttribute("aria-label", L.helpLabel);
  $("helpBtn").setAttribute("aria-expanded", String(!!S.helpStage));
  $("helpBtn").setAttribute("aria-pressed", String(!!S.helpStage));
  const textOn = S.liveText !== false;

/* ---------- WORLD-CLASS W2: progressive in-call help ----------
   Stage 1: quick SOS phrases (say "sorry?" without leaving the flow).
   Stage 2: Marzi's suggested phrase for this moment.
   Stage 3: the full answer — hear it slowly, or type instead of speaking.
   The learner asks for each step; the full answer is never the first offer. */
function openHelp(stage) {

function renderHelpPanel() {

/* The dialogue renders INLINE in the call (binding decision 1: no transcript
   sheet). Every turn is a true speech bubble with word tap, per-line replay
   and inline translation beneath the line it belongs to. S.turns stays
   render-only state; the session transcript is the canonical record. */
function renderTranscript() {
  const L = t();
  const A = S.active || S.scenario;
  $("log").innerHTML = S.turns.map((x, i) => UI.bubble({
    side: x.me ? "me" : "char",
    tag: x.me ? L.you : A.tag,
    body: x.me ? esc(x.text) : tappable(x.text, i),
    extra:
      (!x.me && x.wsave ? `<div class="wsave">${x.wsave.pending ? "…" : `★ ${esc(x.wsave.de)} — ${esc(x.wsave.tr)}`}</div>` : "") +
      (x.me ? "" : `<div style="margin-top:2px">
            <button class="mini" data-play="${i}" aria-label="${esc(L.repeat)}">&#9834;</button>
            <button class="mini" data-tr="${i}" aria-expanded="${!!x.open}">${L.show}</button></div>`) +
      (!x.me && x.open ? `<div class="sub">${esc(x.tr)}</div>` : "") +
      (x.me && x.fix ? `<div class="fix">${esc(x.fix)}</div>${x.corrected ? `<div style="margin-top:4px"><button class="mini" data-say="${i}">&#9654; ${L.sayIt}</button></div>` : ""}` : ""),
  })).join("") + (S.busy ? '<div class="turn" style="opacity:.5">· · ·</div>' : "");

  const showTapHint = S.turns.some((x) => !x.me) && loadWords().length < 5;
  $("tapHint").textContent = L.tapWordHint;
  $("tapHint").classList.toggle("hidden", !showTapHint);

  $("log").querySelectorAll("[data-w]").forEach((b) =>
    b.onclick = () => saveWordTap(+b.dataset.ti, b.dataset.w));
  $("log").querySelectorAll("[data-play]").forEach((b) =>
    b.onclick = () => { const x = S.turns[+b.dataset.play]; speak(x.text, true, null, x.sp); });
  $("log").querySelectorAll("[data-say]").forEach((b) =>
    b.onclick = () => speak(S.turns[+b.dataset.say].corrected, true));
  $("log").querySelectorAll("[data-tr]").forEach((b) =>
    b.onclick = () => { const x = S.turns[+b.dataset.tr]; x.open = !x.open; renderTranscript(); });
  /* VISUAL-DIRECTOR F3: reading-first scroll anchor. When the newest turn is
     taller than the band, align its TOP so the line reads from its beginning;
     otherwise stick to the bottom like a messenger. */
  const log = $("log");
  const turns = log.querySelectorAll ? log.querySelectorAll(".turn") : [];
  const lastTurn = turns.length ? turns[turns.length - 1] : null;
  if (lastTurn && typeof lastTurn.offsetTop === "number" && typeof log.clientHeight === "number"
      && lastTurn.offsetHeight >= log.clientHeight) {
    log.scrollTop = Math.max(0, lastTurn.offsetTop - 14);
  } else {
    log.scrollTop = log.scrollHeight;
  }
}

function prefersReducedMotion() {
  try { return !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches); }
  catch (e) { return false; }
}
/* count the XP number up and grow the canonical bar; reduced motion jumps
   straight to the final values, which are still shown as text */
function animateReward(sum) {
  const fill = $("rwXpFill");
  const val = $("rwXpVal");
  if (!fill) return;
  // W3: a strong call earns a one-shot cheer from Marzi on the summary card
  if (sum.state === "high" || sum.state === "evolved") {
    try { marziOneShot($("rewardBox").querySelector(".rw-card .ui-marzi") || $("rewardBox").querySelector(".rw-top"), "celebrate"); } catch (e) {}
  }
  if (prefersReducedMotion() || !sum.xp) {
    fill.style.width = sum.stagePct + "%";
    if (val && sum.xp) val.textContent = `+${sum.xp} XP`;
    if (sum.evolved) celebrateEvolution(sum);
    return;
  }
  requestAnimationFrame(() => { fill.style.width = sum.stagePct + "%"; });
  const t0 = (window.performance && performance.now) ? performance.now() : 0;
  const dur = 900;
  const step = (now) => {
    const p = Math.min(1, ((now || t0) - t0) / dur);
    if (val) val.textContent = `+${Math.round(sum.xp * p)} XP`;
    if (p < 1) requestAnimationFrame(step);
    else {
      if (val) val.textContent = `+${sum.xp} XP`;
      flyCoins(sum);
      if (sum.evolved) celebrateEvolution(sum);
    }
  };
  requestAnimationFrame(step);
}
/* the coin chip flies to the wallet chip that is actually on screen */
function flyCoins(sum) {
  if (!sum.coins || prefersReducedMotion()) return;
  const from = $("rwCoinGain");
  const visible = (el) => el && el.getBoundingClientRect && el.getBoundingClientRect().width > 0;
  const target = visible($("tbCoins")) ? $("tbCoins") : from; // never an off-screen target
  if (!visible(from) || !target || target === from) return;
  const a = from.getBoundingClientRect(), b = target.getBoundingClientRect();
  const ghost = from.cloneNode(true);
  ghost.classList.add("rw-fly");
  ghost.classList.remove("rw-gain");
  ghost.setAttribute("aria-hidden", "true");
  ghost.style.left = a.left + "px";
  ghost.style.top = a.top + "px";
  document.body.appendChild(ghost);
  requestAnimationFrame(() => {
    ghost.style.transform = `translate(${Math.round(b.left - a.left)}px, ${Math.round(b.top - a.top)}px) scale(.6)`;
    ghost.style.opacity = "0";
  });
  setTimeout(() => { try { ghost.remove(); } catch (e) {} }, 900);
}

/* ---------- end-of-call evaluation ---------- */
async function evaluateCall() {
  const spoke = S.turns.some((x) => x.me);
  const L = t();
  if (!spoke) { $("evalBox").innerHTML = ""; return; }
  $("evalBox").innerHTML = `<div class="label" style="margin:0">${esc(L.evalTitle)}</div><p class="note">${esc(L.evalLoading)}</p>`;

    const res = await chatFetch({
      system: `You evaluate a ${TARGET.name} ${(S.active || S.scenario).kind === "face" ? "face-to-face" : "phone-call"} role-play by a learner at CEFR level ${S.level}. The learner's goal was: ${S.currentGoal}. Return ONLY a JSON object, no markdown, with keys:
"achieved" (true/false/"partial" - did the learner reach the goal),
"comment" (2 sentences in ${help}: overall impression),
"good" (array of at most 3 short points in ${help}: concrete things the learner did WELL in this conversation),
"tips" (array of at most 3 short concrete tips in ${help} to improve, most important first),
"vocab" (array of at most 5 objects {"de":"...","tr":"..."} - ${TARGET.name} words or short phrases the learner clearly lacked, misused or avoided in this conversation, with the translation in ${help}; empty array if none).`,
      messages: [{ role: "user", content: `Transcript of the call:\n${transcript}` }],

    const data = await res.json();
    const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
    const clean = raw.replace(/```json|```/g, "").trim();
    const p = JSON.parse(clean.slice(clean.indexOf("{"), clean.lastIndexOf("}") + 1));
    const badge = p.achieved === true ? '<span class="b b-ok">✓</span>' : p.achieved === "partial" ? '<span class="b b-mid">~</span>' : '<span class="b b-no">✗</span>';
    if (p.achieved === true) { addXp(25); confettiBurst(); }
    const vocab = (Array.isArray(p.vocab) ? p.vocab : []).filter((w) => w && w.de && w.tr).slice(0, 5);
    const ul = (arr) => `<ul style="margin:4px 0 0;padding-left:20px">${arr.map((x) => `<li style="font-size:13.5px;line-height:1.5;margin-top:4px">${esc(x)}</li>`).join("")}</ul>`;

         <button class="mini" type="button" data-sharegoal>${IC.share(ICON.xs)} ${esc(L.share)}</button></div>` : "") +
      `<div class="label" style="margin:0">${esc(L.evalTitle)} ${badge}</div>` +
      `<p style="font-size:14.5px;line-height:1.5;margin:10px 0 6px">${esc(p.comment)}</p>` +
      (Array.isArray(p.good) && p.good.length
        ? `<div class="label" style="margin:14px 0 0"><span class="b b-ok">✓</span> ${esc(L.didWell)}</div>` + ul(p.good) : "") +
      (Array.isArray(p.tips) && p.tips.length
        ? `<div class="label" style="margin:14px 0 0">${esc(L.toImprove)}</div>` + ul(p.tips) : "") +
      (vocab.length
        ? `<div class="label" style="margin:14px 0 0">${esc(L.learnWords)}</div>` +
          `<ul style="margin:4px 0 0;padding-left:20px">${vocab.map((w) => `<li style="font-size:13.5px;line-height:1.5;margin-top:4px"><b>${esc(w.de)}</b> — ${esc(w.tr)}</li>`).join("")}</ul>` +
          `<button class="toggle" data-addw style="margin-top:12px">${IC.star(ICON.sm)} ${esc(L.addWords)}</button>`
        : "");
    const shareGoalBtn = $("evalBox").querySelector("[data-sharegoal]");
    if (shareGoalBtn) shareGoalBtn.onclick = () => shareMoment(L.shareGoal);
    const addBtn = $("evalBox").querySelector("[data-addw]");
    if (addBtn) addBtn.onclick = () => {
      const words = loadWords();
      for (const w of vocab) {
        if (!words.some((x) => normDe(x.de) === normDe(w.de))) {
          words.push({ de: w.de, tr: w.tr, raw: w.de, ex: "", exTr: "", lang: S.lang, date: new Date().toISOString().slice(0, 10) });
        }
      }
      saveWordsList(words);
      addBtn.textContent = L.addedWords;
      addBtn.disabled = true;
    };
  } catch (e) {
    $("evalBox").innerHTML = `<div class="label" style="margin:0">${esc(L.evalTitle)}</div><p class="note">${esc(L.evalFail)}</p>`;
  }
}
