  .rw-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-3); }
  .rw-stats > div { text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: var(--space-2) 4px; }
  .rw-stats strong { display: block; font: 800 var(--text-f16) var(--font-sans); }
  .rw-stats span { display: block; font: 600 var(--text-f10-5) var(--font-sans); color: var(--muted); }
  .rw-stage { margin-top: var(--space-3); font: 700 var(--text-f12) var(--font-sans); color: var(--marzi-dark); text-align: center; }
  .rw-card[data-state="save-failed"] { background: var(--danger-soft); border-color: var(--tint-danger-35); }
  .rw-card[data-state="high"] { box-shadow: 0 0 0 2px var(--tint-primary-35), var(--shadow); }
  .evo-cel { text-align: center; }
  .evo-cel-row { display: flex; align-items: center; justify-content: center; gap: var(--space-2); margin: var(--space-2) 0; }
  .evo-cel-row .ui-marzi-art { width: 72px; height: 72px; }
  .evo-cel-row .evo-arrow { color: var(--primary); }
  .evo-cel-row .was { opacity: .45; filter: grayscale(.5); }
  .evo-cel-name { font: 800 var(--text-lg) var(--font-sans); color: var(--marzi-dark); }
  .evo-cel-desc { font: 600 var(--text-f12-5) var(--font-sans); color: var(--muted); margin-top: 4px; line-height: 1.4; }
  /* ---------- MARZI-007: canonical store (board 04_progress panel) ---------- */
  .store-head {
    display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2);
  }
  .store-head .store-coins { font: 800 var(--text-f18) var(--font-sans); display: inline-flex; align-items: center; gap: 6px; }
  .store-head .store-coins .ic { color: var(--coin); }
  .store-head .store-x { margin-inline-start: auto; width: var(--touch-min); height: var(--touch-min); border-radius: 50%;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .cat-tabs {
    display: flex; gap: var(--space-1); padding: 4px; margin-bottom: var(--space-3);
    background: var(--surface-soft); border: 1px solid var(--line); border-radius: 999px; overflow-x: auto; scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    flex: 1 0 auto; min-height: var(--touch-min); min-width: var(--touch-min);
    display: grid; place-items: center; gap: 1px; padding: 0 var(--space-2);
    border: 0; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer;
    font: 700 var(--text-f8) var(--font-sans);
  }
  .cat-tab[aria-selected="true"] { background: var(--primary); color: var(--white); }
  .cat-tab[data-empty="1"] { opacity: .55; }
  .cat-tab .cat-lb { max-width: 62px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .outfit-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); }
  .outfit-card {
    display: flex; flex-direction: column; overflow: hidden; cursor: pointer; text-align: center;
    border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--card);
    box-shadow: var(--shadow-sm); padding: 0 0 var(--space-2); font: inherit; color: var(--ink);
    min-height: var(--touch-min);
  }
  .outfit-card .outfit-preview {
    display: grid; place-items: center; aspect-ratio: 1 / 1; width: 100%;
    background: linear-gradient(150deg, var(--stage-from), var(--stage-to)); color: var(--marzi-dark);
  }
  .outfit-card .outfit-preview svg { width: 54%; height: 54%; opacity: .55; }
  .outfit-card .outfit-copy { display: block; padding: var(--space-2) 4px 0; }
  .outfit-card .outfit-copy strong { display: block; font: 800 var(--text-f11-5) var(--font-sans); line-height: 1.2; }
  .outfit-card .outfit-foot {
    display: inline-flex; align-items: center; justify-content: center; gap: 3px; margin-top: 3px;
    font: 700 var(--text-f10-5) var(--font-sans); color: var(--coin-ink);
  }
  .outfit-card[data-state="locked"] { opacity: .72; }
  .outfit-card[data-state="locked"] .outfit-preview { filter: grayscale(.55); }
  .outfit-card[data-state="locked"] .outfit-foot { color: var(--muted); }
  .outfit-card[data-state="insufficient"] .outfit-foot { color: var(--muted); }
  .outfit-card[data-state="owned"] .outfit-foot { color: var(--marzi-dark); }
  .outfit-card[data-state="equipped"] { border-color: var(--primary); box-shadow: 0 0 0 2px var(--tint-primary-35), var(--shadow-sm); }
  .outfit-card[data-state="equipped"] .outfit-foot { color: var(--marzi-dark); }
  .store-modal-art { width: 116px; height: 116px; margin: 0 auto; display: grid; place-items: center;
    border-radius: var(--radius); background: linear-gradient(150deg, var(--stage-from), var(--stage-to)); color: var(--marzi-dark); }
  .store-modal-art svg { width: 58%; height: 58%; opacity: .6; }
  .store-note { text-align: center; font: 700 var(--text-f11-5) var(--font-sans); color: var(--marzi-dark); margin-top: var(--space-3); }
  /* ---------- MARZI-006 + DOCTOR GOLD PILOT: call layer ----------
     Gold Reference composition (reference/MARZI_CALL_SCREEN_GOLD_REFERENCE.png):
     compact identity header, bounded illustrated stage (production background
     + transparent character from asset-manifest.json), inline dialogue with
     inline translation, Marzi beside the suggestion, compact pills, primary
     mic + hang-up, product-style connection footer. Generated portraits and
     SVG Marzi remain the fallback chain. */
  .callscreen {
    position: fixed; inset: 0; z-index: 70; overflow: hidden;
    background: var(--bg); color: var(--ink);
    height: 100dvh; min-height: 100vh;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + var(--space-2)) 0
             calc(env(safe-area-inset-bottom, 0px) + var(--space-2));
  }
  .call-top {
    position: relative; z-index: 4; flex: 0 0 auto;
    display: grid; grid-template-columns: var(--touch-min) minmax(0, 1fr) var(--touch-min);
    align-items: start; gap: var(--space-2); padding: 0 var(--space-2);
  }
  /* visibly compact close control; the ::after box keeps the 48px touch floor */
  .call-x {
    width: 40px; height: 40px; border-radius: 50%; position: relative;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-sm);
  }
  .call-x::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: var(--touch-min); height: var(--touch-min);
  }
  .call-id { min-width: 0; text-align: center; display: grid; }
  .call-id-kicker {
    font: 600 var(--text-f11-5) var(--font-sans); color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .call-id-name { font: 800 var(--text-f18) var(--font-sans); line-height: 1.2; }
  .call-id-place { font: 600 var(--text-f12) var(--font-sans); color: var(--muted); line-height: 1.3; }
  .call-conn {
    justify-self: end; display: inline-flex; align-items: center; gap: 4px; min-height: var(--touch-min);
    font: 700 var(--text-f10) 'JetBrains Mono', monospace; color: var(--primary);
  }
  /* the illustrated stage: gold geometry, stable across states — the doctor
     must not jump in scale between Text/Help modes */
  .call-stage {
    position: relative; flex: 0 0 auto; overflow: hidden;
    height: clamp(230px, 30dvh, 258px);
    margin: var(--space-2) var(--space-3) 0; border-radius: 20px;
    border: 1.5px solid var(--stage-line); box-shadow: var(--shadow);
    background: var(--paper-3) center / cover no-repeat;
  }
  .callscreen.speaking .call-stage { box-shadow: inset 0 0 0 3px var(--tint-primary-35), var(--shadow); }
  .call-portrait {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 22%; display: none;
  }
  .call-portrait.ok { display: block; }
  /* manifest: transparent character foreground, contained, on the stage floor */
  .call-stage.prod .call-portrait { object-fit: contain; object-position: 50% 100%; }
  /* the emoji is the last fallback: never over a loaded (transparent) portrait */
  .call-portrait.ok ~ .call-emoji { display: none; }
  /* NO-FLASH: with approved production art, "not loaded yet" is not "failed".
     The emoji/generated stand-ins never paint; while the gold artwork is
     pending the stage shows only the scene with a subtle cream treatment.
     A real load failure drops the .prod state and re-enters the old chain. */
  .call-stage.prod .call-emoji { display: none; }
  .call-stage.prod:not(.art-ok)::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--paper-3), var(--paper));
    opacity: .55; animation: artPending var(--loop-pulse) var(--ease) infinite alternate;
  }
  @keyframes artPending { from { opacity: .4; } to { opacity: .65; } }
  .call-emoji {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: var(--text-f64); opacity: .9;
  }
  .call-scrim { display: none; }
  /* status chip sits on the stage floor (gold "Thinking…" pill) */
  .call-status-chip {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 5; bottom: 10px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
    background: var(--card); border: 1px solid var(--line);
    color: var(--ink); border-radius: 999px; padding: 6px var(--space-3);
    font: 700 var(--text-f11-5) var(--font-sans); box-shadow: var(--shadow-sm);
  }
  .call-status-chip[data-state="error"], .call-status-chip[data-state="disconnected"] {
    background: var(--danger-soft); color: var(--danger-ink); border-color: var(--tint-danger-35);
  }
  /* conversation column: inline dialogue + inline translation + coach row */
  .call-mid { position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .call-convo {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: var(--space-2);
    padding: var(--space-2) var(--space-3) var(--space-1);
  }
  .call-turns { display: flex; flex-direction: column; gap: var(--space-2); }
  /* compact per-message actions (replay, Translation): quiet chips, not links */
  .call-acts { display: flex; gap: 6px; margin-top: 6px; }
  .call-acts .mini {
    text-decoration: none; margin: 0; min-height: 30px; padding: 0 10px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    font: 700 var(--text-f10-5) var(--font-sans); color: var(--muted);
  }
  .call-acts .mini[aria-expanded="true"] { color: var(--primary); border-color: var(--tint-primary-35); }
  /* progressive inline help panel, beside Marzi in the coach row */
  .call-help {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column; gap: var(--space-2); align-items: stretch;
    background: var(--paper); border: 1.5px dashed var(--tint-leaf-35);
    border-radius: 14px; border-end-start-radius: 6px; padding: var(--space-2) var(--space-3);
  }
  .call-help .row { margin: 0; }
  .call-help .mini { align-self: center; }
  .call-help-sug { display: grid; gap: 2px; font: 600 var(--text-f13-5) var(--font-sans); color: var(--ink); }
  .call-help-sug b { font: 700 var(--text-f10-5) var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  /* premium coaching affordances — intentional chips, not bare links */
  .call-help-acts { display: flex; gap: var(--space-2); justify-content: center; flex-wrap: wrap; }
  .call-help-act {
    min-height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    background: var(--card); color: var(--marzi-dark); border: 1px solid var(--tint-leaf-35);
    font: 700 var(--text-f11-5) var(--font-sans); box-shadow: var(--shadow-sm);
  }
  /* Text OFF: identical stage geometry; the coach block moves up beneath the
     stage so the hidden dialogue space is reclaimed, breathing room stays below */
  .callscreen.text-off .call-convo { justify-content: flex-start; }
  .callscreen.text-off .call-coach { margin-top: var(--space-2); }
  /* Text OFF + Help closed: the middle band stops stretching, so the controls
     follow the coach row (~32px) and leftover space settles at the bottom
     instead of forming a dead central region */
  .callscreen.coach-flow .call-mid { flex: 0 0 auto; }
  .callscreen.coach-flow .call-stack { padding-top: 28px; }
  /* anchored Speed popover above the pills; never covers the conversation */
  .call-pop {
    position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    z-index: 8; display: flex; flex-direction: column; gap: 2px; min-width: 150px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow-lg); padding: 6px;
  }
  .call-pop.hidden { display: none; }
  .call-pop-it {
    min-height: var(--touch-min); border: 0; background: transparent; color: var(--ink);
    font: 700 var(--text-f12-5) var(--font-sans); border-radius: 10px; cursor: pointer;
    text-align: start; padding: 0 12px;
  }
  .call-pop-it[aria-checked="true"] { background: var(--tint-primary-04); color: var(--primary); }
  .call-bubble {
    max-width: 86%; text-align: start;
    background: var(--paper-3); color: var(--ink);
    border: 1.5px solid var(--stage-line); border-radius: 18px;
    padding: var(--space-2) var(--space-3); box-shadow: var(--shadow-sm);
    font: 600 var(--text-f13-5) var(--font-sans); line-height: 1.35;
  }
  .call-bubble.char {
    align-self: flex-start; border-end-start-radius: 6px; cursor: pointer;
    display: flex; gap: var(--space-2); align-items: flex-start;
  }
  .call-say-av {
    flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper);
    object-fit: cover; object-position: 50% 12%;
    display: inline-grid; place-items: center; font-size: var(--text-f18);
  }
  .call-say-body { min-width: 0; }
  .call-say-tr {
    display: block; margin-top: 6px; padding: 5px 8px; border-radius: 8px;
    background: var(--tint-primary-04); color: var(--muted); font-weight: 600;
  }
  .call-bubble.me {
    align-self: flex-end; border-end-end-radius: 6px;
    background: var(--tint-primary-04); border-color: var(--tint-primary-35);
  }
  /* Marzi beside the coaching/suggestion bubble (gold), never a lone center */
  .call-coach { display: flex; align-items: flex-end; gap: var(--space-1); margin-top: auto; }
  .call-marzi {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px;
    pointer-events: none;
  }
  .call-marzi .vc-marzi-art { width: 92px; height: 92px; display: block; }
  .call-marzi .vc-marzi-art svg { width: 100%; height: 100%; }
  .call-marzi .vc-marzi-art .marzi-art-img {
    width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%;
  }
  /* generated stages 1-3 keep the badge treatment (FALLBACK_ONLY)… */
  .call-marzi[data-stage="1"] .vc-marzi-art,
  .call-marzi[data-stage="2"] .vc-marzi-art,
  .call-marzi[data-stage="3"] .vc-marzi-art {
    width: 76px; height: 76px; padding: 6px; box-sizing: border-box;
    border: 2px solid var(--card); border-radius: 50%;
    background: var(--paper);
  }
  /* …but approved production art renders as the full supplied pose */
  .call-marzi .vc-marzi-art:has(> .marzi-art-img) {
    width: 92px; height: 92px; padding: 0; border: 0; border-radius: 0;
    background: transparent; box-shadow: none;
    filter: drop-shadow(0 4px 10px rgba(16,12,8,.18));
  }
  .call-marzi .vc-marzi-cap { display: none; }
  .call-bubble.marzi {
    flex: 1 1 auto; max-width: none; cursor: pointer; border-end-start-radius: 6px;
    background: var(--paper); border: 1.5px dashed var(--tint-leaf-35);
  }
  /* bottom stack: pills, primary controls, product footer */
  .call-stack {
    position: relative; z-index: 4; flex: 0 0 auto;
    display: grid; justify-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3) 0;
  }
  .call-tools { display: flex; gap: var(--space-2); flex-wrap: wrap; justify-content: center; }
  .call-pill {
    min-height: var(--touch-min); display: inline-flex; align-items: center; gap: 5px;
    padding: 0 var(--space-3); border-radius: 999px; cursor: pointer; white-space: nowrap;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    font: 700 var(--text-f11-5) var(--font-sans); box-shadow: var(--shadow-sm);
  }
  .call-pill[aria-pressed="true"], .call-pill[aria-expanded="true"] {
    background: var(--primary); border-color: var(--primary); color: var(--white);
  }
  .call-pill[disabled] { opacity: .45; cursor: not-allowed; }
  .call-pill .call-pill-chev { font-size: var(--text-f10); opacity: .7; margin-inline-start: 1px; }
  .call-controls { display: flex; align-items: center; gap: var(--space-4); }
  .call-ctrl {
    width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; gap: 1px; color: var(--white);
    background: var(--primary); box-shadow: var(--shadow);
    transition: background var(--dur-fast) var(--ease);
  }
  .call-ctrl .call-ctrl-lb {
    font: 700 var(--text-f8) var(--font-sans); letter-spacing: .02em;
    max-width: 68px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .call-ctrl.danger { background: var(--red); }
  .call-ctrl.danger:hover { filter: brightness(1.08); }
  .call-ctrl[disabled] { opacity: .45; cursor: not-allowed; }
  .call-ctrl[data-status="listening"] { background: var(--primary); animation: listeningPulse var(--loop-pulse) var(--ease) infinite; }
  .call-ctrl[data-status="processing"] { background: var(--disabled-fill); color: var(--ink); }
  .call-ctrl[data-status="failed"] { background: var(--red); }
  /* the mic is the sole dominant bottom action: a wide pill keeps the label
     on one line, fully visible and vertically centred, above the safe area */
  .call-ctrl.wide {
    width: auto; min-width: 230px; height: 64px; border-radius: 999px;
    display: inline-flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 10px; padding: 0 30px;
  }
  .call-ctrl.wide .call-ctrl-lb {
    max-width: none; font: 800 var(--text-f15-5) var(--font-sans);
    letter-spacing: .01em; line-height: 1;
  }
  /* product-style connection/time footer */
  .call-meta {
    display: flex; align-items: center; gap: var(--space-2); min-height: 20px;
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px var(--space-4); box-shadow: var(--shadow-sm);
    font: 700 var(--text-f11-5) 'JetBrains Mono', monospace; color: var(--ink);
  }
  .call-meta::before { content: ""; flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
  .call-meta .low { color: var(--coin); }
  .call-alert {
    position: absolute; left: var(--space-3); right: var(--space-3); z-index: 6; top: 40px;
    background: var(--danger-soft); color: var(--danger-ink);
    border: 1px solid var(--tint-danger-35); border-radius: var(--radius);
    padding: var(--space-2) var(--space-3); font: 700 var(--text-f12) var(--font-sans);
    display: flex; align-items: center; gap: var(--space-2); box-shadow: var(--shadow);
  }
  .call-alert button { margin-left: auto; min-height: var(--touch-min); }
  /* transcript + tools sheet */
  .sheet-back { position: fixed; inset: 0; z-index: 80; background: rgba(16,12,8,.5); }
  .call-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 81;
    max-height: 74dvh; display: flex; flex-direction: column;
    background: var(--card); color: var(--ink);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-lg);
    padding: var(--space-2) var(--space-3) calc(env(safe-area-inset-bottom, 0px) + var(--space-3));
    animation: sheetUp var(--dur) var(--ease);
  }
  @keyframes sheetUp { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet-grab { width: 40px; height: 4px; border-radius: 999px; background: var(--line); margin: 0 auto var(--space-2); }
  .sheet-head { display: flex; align-items: center; gap: var(--space-2); }
  .sheet-head b { font: 800 var(--text-md) var(--font-sans); }
  .sheet-head .btn { margin-inline-start: auto; }
  .sheet-body { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .call-sheet .log {
    background: transparent; border: 0; box-shadow: none; border-radius: 0;
    min-height: 80px; max-height: none; overflow: visible;
  }
  /* MARZI-010: compact chrome keeps its board size but gains a full 48px
     hit area, so the touch floor is met without changing the visuals.
     The box is centred on the control (physical left/translate, so it is
     symmetric in both directions): anchoring it to the inline start made it
     grow outwards only, and the last top-bar chip then pushed its hit area
     past the viewport and gave the page a few pixels of horizontal scroll. */
  .chip-res, .menu-btn, .drawer-close, .store-head .store-x { position: relative; }
  .chip-res::after, .menu-btn::after, .drawer-close::after, .store-head .store-x::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 100%; height: var(--touch-min); min-width: var(--touch-min);
  }
  /* segmented controls and legal links meet the floor directly */
  .seg button { min-height: var(--touch-min); }
  .legal a { display: inline-flex; align-items: center; min-height: var(--touch-min); }
  /* visible keyboard focus everywhere */
  :focus-visible { outline: 3px solid var(--marzi-dark); outline-offset: 2px; border-radius: 8px; }
  /* reduced motion: keep every state legible, drop the movement */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .big[data-status="listening"] { animation: none; box-shadow: 0 0 0 3px rgba(95,150,45,.5); }
    .vc-stage.speaking::after { animation: none; box-shadow: inset 0 0 0 3px rgba(95,150,45,.75); }
  }
  /* MARZI-015: the same result from the in-app control. It can only ADD
     reduction - the OS preference above is never overridden downwards. */
  body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
    animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important;
  }
  body.reduce-motion .big[data-status="listening"] { animation: none; box-shadow: 0 0 0 3px rgba(95,150,45,.5); }
  body.reduce-motion .vc-stage.speaking::after { animation: none; box-shadow: inset 0 0 0 3px rgba(95,150,45,.75); }
  /* ---------- MARZI-015: profile identity, achievements ---------- */
  .prof-id { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--space-1); }
  .prof-id-stage { font: 800 var(--text-lg) var(--font-sans); color: var(--marzi-dark); }
  .prof-id-desc { margin: 0; max-width: 30ch; font: 500 var(--text-sm) var(--font-sans); color: var(--muted); }
  .prof-id-rank {
    font: 700 var(--text-xs) var(--font-sans); color: var(--muted);
    background: var(--surface-strong); border-radius: 999px; padding: 4px var(--space-3);
  }
  .label.prof-achv-lbl { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
  .prof-achv-n { color: var(--muted); }
  .achv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
  .achv {
    display: flex; align-items: center; gap: var(--space-2);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--space-2) var(--space-3); min-height: var(--touch-min);
  }
  /* the text column must be allowed to shrink and wrap, or a long localized
     name pushes the card past the viewport on a 360px phone */
  .achv-txt { min-width: 0; overflow-wrap: anywhere; }
  .achv b { display: block; font: 800 var(--text-xs) var(--font-sans); color: var(--ink); }
  .achv small { display: block; font: 700 var(--text-f11-5) var(--font-sans); color: var(--muted); }
  .achv-ic { display: inline-flex; flex: 0 0 auto; color: var(--muted); }
  .achv[data-state="earned"] { border-color: var(--primary); background: var(--tint-primary-04); }
  /* ---------- MARZI-016: learning journey ----------
     A path over the existing scenarios. `future` is dimmer, never disabled -
     every node opens exactly as it does in the picker. */
  .jr-path { list-style: none; margin: 0; padding: 0 0 0 var(--space-5); position: relative; }
  .jr-path::before {
    content: ""; position: absolute; inset-block: 12px; inset-inline-start: 9px;
    width: 2px; background: var(--track); border-radius: 2px;
  }
  .jr-group {
    font-family: 'JetBrains Mono', monospace; font-size: var(--text-f10-5);
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px;
  }
  .jr-li { position: relative; margin-bottom: var(--space-2); }
  .jr-node {
    display: flex; align-items: center; gap: var(--space-2); width: 100%;
    min-height: var(--touch-min); padding: var(--space-2) var(--space-3);
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); cursor: pointer; text-align: start;
  }
  .jr-node::before {
    content: ""; position: absolute; inset-inline-start: calc(-1 * var(--space-5) + 4px); top: 50%;
    width: 12px; height: 12px; margin-top: -6px; border-radius: 50%;
    background: var(--track); border: 2px solid var(--card);

<script>
/* ---------- brand migration (review §9): Telefontrainer → Marzi ----------
   One-time copy of legacy localStorage keys to the new marzi.*.v1 names.
   Legacy keys stay in place untouched (rollback safety); all reads/writes
   below go through the new names. Must run before anything reads settings. */
const STORAGE_MIGRATIONS = [
  ["telefontrainer.settings", "marzi.settings.v1"],
  ["telefontrainer.stats", "marzi.stats.v1"],
  ["telefontrainer.fixes", "marzi.fixes.v1"],
  ["telefontrainer.words", "marzi.words.v1"],
  ["telefontrainer.tests", "marzi.tests.v1"],
  ["telefontrainer.pin", "marzi.pin.v1"],
  ["telefontrainer.marzi", "marzi.stage.v1"],
  ["telefontrainer.wish", "marzi.wish.v1"],
];
function migratedName(k) {
  const hit = STORAGE_MIGRATIONS.find(([legacy]) => legacy === k);
  if (hit) return hit[1];
  if (k.indexOf("telefontrainer.vocab.") === 0) return "marzi.vocab.v1." + k.slice("telefontrainer.vocab.".length);
  return null;
}
function migrateStorageKeys() {
  try {
    const keys = [];
    for (let i = 0; i < (localStorage.length || 0); i++) keys.push(localStorage.key(i));
    for (const k of keys) {
      const next = k && migratedName(k);
      if (next && localStorage.getItem(next) === null) {
        localStorage.setItem(next, localStorage.getItem(k));
      }
    }
  } catch (e) {}
}
migrateStorageKeys();

/* The languages being TAUGHT. All logic (recognition locale, prompt templates,
   voice picking) reads from TARGET; scenario/deck text is a separate content
   pack per target language (refs wired below as TARGETS.<code>.scenarios/
   groups/decks). UI help-languages (T, es/en/it/tr/ar/uk) are an independent
   axis. TARGET resolves from the persisted settings ONCE at load; German is
   the default and its prompts must stay byte-identical.
   See docs/EXPANSION.md before adding a new target. */
const TARGETS = {
  de: { code:"de", locale:"de-DE", name:"German", nativeName:"Deutsch", exam:"DTZ",
        charset:"a-zäöüß", seed:"[Das Telefon klingelt. Nimm ab.]",
        fixEx:`"Ach, ich verstehe schon! Man sagt übrigens: 'Ich hätte gern einen Termin.' Also, wann passt es Ihnen?"`,
        faceEx:`"Guten Tag" / "Hallo" / "Was darf's sein?"`,
        optEx:"'Montag oder Dienstag?'", slipLangs:"English or Spanish",
        timerCall:"VERBUNDEN", timerFace:"IM GESPRÄCH",
        skip:["der","die","das","den","dem","des","ein","eine","einen","einem","einer"],
        deckChar:"kollegen", deckVoice:"coral", voiceHint:"google|deutsch|anna|katja",
        sos:[["Wie bitte?","Wie bitte?"],["Langsamer, bitte.","Langsamer, bitte"],["Können Sie das noch einmal sagen?","Noch einmal, bitte"]],
        draftPH:"Guten Tag, ich möchte…" },
  en: { code:"en", locale:"en-US", name:"English", nativeName:"English", exam:"IELTS",
        charset:"a-z", seed:"[The phone rings. Pick up.]",
        fixEx:`"Oh, I see what you mean! By the way, we'd usually say: 'I'd like to make an appointment.' So, when suits you best?"`,
        faceEx:`"Hi there" / "Hello" / "What can I get you?"`,
        optEx:"'Monday or Tuesday?'", slipLangs:"their native language instead of English",
        timerCall:"ON CALL", timerFace:"IN PERSON",
        skip:["the","a","an"],
        deckChar:"enjob", deckVoice:"sage", voiceHint:"google|english|samantha|allison|ava",
        sos:[["Sorry?","Sorry?"],["Slower, please.","Slower, please"],["Could you say that again?","Again, please"]],
        draftPH:"Hello, I'd like to…" },
};
const TARGET = (() => {
  try {
    const s = JSON.parse(localStorage.getItem("marzi.settings.v1")) || {};
    if (TARGETS[s.targetLang]) return TARGETS[s.targetLang];
  } catch (e) {}
  return TARGETS.de;
})();

const SCENARIOS = [
  { id:"arzt", avatar:"👩‍⚕️", voice:"coral", voice2:"onyx", de:"Beim Hausarzt anrufen", es:"Pedir cita en el médico de cabecera", en:"Book a doctor's appointment",
    who:"Praxis Dr. Wagner", tag:"PRAXIS", role:"a receptionist at a family doctor's practice",
    place:"Hausarztpraxis Dr. Wagner in Odenthal",
    goals:["book an appointment because of a persistent cough",
           "book an appointment because of strong back pain",

    who:"Bürgeramt", tag:"AMT", role:"a clerk at the municipal citizens' office",

    who:"KFZ-Werkstatt Reuter", tag:"WERKSTATT", role:"a service adviser at a car workshop",

    goals:["book the car in for its service and ask what it costs",

const DEFAULT_STATS = Object.freeze({
  version: 1, days: {}, calls: 0, seconds: 0, secDays: {}, extraSecs: {},
  vocabDays: {}, drillDays: {}, xp: 0, coins: 0, ownedItemIds: [], equippedItemIds: [],
  legacyUnknownItemIds: [], scenariosDone: {},
});
function finiteNonNegative(value, fallback = 0) {
  return Number.isFinite(value) && value >= 0 ? value : fallback;
}
function normalizeStats(value) {
  const s = value && typeof value === "object" ? value : {};
  const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : {});
  const idList = (v) => (Array.isArray(v) ? v.filter((id) => typeof id === "string") : []);
  return {
    version: 1,
    days: obj(s.days), secDays: obj(s.secDays), extraSecs: obj(s.extraSecs),
    vocabDays: obj(s.vocabDays), drillDays: obj(s.drillDays), scenariosDone: obj(s.scenariosDone),
    calls: finiteNonNegative(s.calls), seconds: finiteNonNegative(s.seconds),
    xp: finiteNonNegative(s.xp), coins: finiteNonNegative(s.coins),
    ...normalizeWardrobe(idList(s.ownedItemIds), idList(s.equippedItemIds), idList(s.legacyUnknownItemIds)),
  };
}
/* Wardrobe normalization + migration (MARZI-007).
   - legacy ids that map onto a canonical item are migrated;
   - ids we do not recognise are NEVER deleted - they move to
     legacyUnknownItemIds so nothing a learner owned is lost;
   - at most ONE outfit can be equipped, and only if it is owned. */
function normalizeWardrobe(owned, equipped, unknownSoFar) {
  const known = new Set(OUTFITS.map((o) => o.id));
  const out = [], unknown = (unknownSoFar || []).slice();
  for (const raw of owned) {
    const id = known.has(raw) ? raw : (LEGACY_OUTFIT_IDS[raw] || null);
    if (id && known.has(id)) { if (!out.includes(id)) out.push(id); }
    else if (!unknown.includes(raw)) unknown.push(raw);
  }
  const eq = [];
  for (const raw of equipped) {
    const id = known.has(raw) ? raw : (LEGACY_OUTFIT_IDS[raw] || null);
    if (id && out.includes(id) && eq.length === 0) eq.push(id);
    else if (!id && !unknown.includes(raw)) unknown.push(raw);
  }
  return { ownedItemIds: out, equippedItemIds: eq, legacyUnknownItemIds: unknown };
}

function loadStats() {

/* ---------- idempotent reward ledger (review §1.3, ADR-8) ----------
   Every completion claims its reward exactly once under a unique id, so
   double taps, re-rendered listeners or browser restoration can never pay
   twice. Coin values follow spec §14: call 20, vocabulary set 10,
   preparation batch 10, corrected drill item 2, guided dialogue 10. */
const REWARD_LEDGER_KEY = "marzi.reward-ledger.v1";
function newRewardId() {
  try { if (typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
}
function loadRewardLedger() {
  try {
    const parsed = JSON.parse(localStorage.getItem(REWARD_LEDGER_KEY));
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (e) { return {}; }
}
/* Result of the most recent claim, so the reward summary can tell a
   duplicate apart from a persistence failure without changing signatures. */
let LAST_CLAIM = { claimed: false, saved: true, duplicate: false };
function claimReward(rewardId, reward) {
  const ledger = loadRewardLedger();
  if (ledger[rewardId]) {
    LAST_CLAIM = { claimed: false, saved: true, duplicate: true };
    return { claimed: false, reward: ledger[rewardId], saved: true };
  }
  // snapshot of the last committed state, restored if either write fails
  const prevStats = localStorage.getItem(STAT_KEY);
  const prevLedger = localStorage.getItem(REWARD_LEDGER_KEY);
  const st = loadStats();
  const xp = Math.max(0, Number(reward && reward.xp) || 0);
  const coins = Math.max(0, Number(reward && reward.coins) || 0);
  st.xp += xp;
  st.coins += coins;
  ledger[rewardId] = { xp, coins, claimedAt: new Date().toISOString() };
  const ids = Object.keys(ledger); // bounded: drop the oldest entries
  if (ids.length > 600) {
    ids.sort((a, b) => String(ledger[a].claimedAt).localeCompare(String(ledger[b].claimedAt)));
    for (const drop of ids.slice(0, ids.length - 500)) delete ledger[drop];
  }
  try {
    localStorage.setItem(STAT_KEY, JSON.stringify(st));
    localStorage.setItem(REWARD_LEDGER_KEY, JSON.stringify(ledger));
  } catch (e) {
    // roll back to the snapshot: stats and ledger move together or not at all
    try { prevStats === null ? localStorage.removeItem(STAT_KEY) : localStorage.setItem(STAT_KEY, prevStats); } catch (e2) {}
    try { prevLedger === null ? localStorage.removeItem(REWARD_LEDGER_KEY) : localStorage.setItem(REWARD_LEDGER_KEY, prevLedger); } catch (e2) {}
    LAST_CLAIM = { claimed: false, saved: false, duplicate: false };
    return { claimed: false, reward: null, saved: false };
  }
  if (coins) SFX.coin();
  updateTopbar();
  LAST_CLAIM = { claimed: true, saved: true, duplicate: false };
  return { claimed: true, reward: ledger[rewardId], saved: true };
}

/* ---------- MARZI-007: one canonical wallet/wardrobe transaction ----------
   Every coin deduction and ownership change goes through commitStats: it
   writes ONE object in ONE localStorage call. If that write fails, nothing
   changed - the caller's copy is discarded and storage still holds the old
   balance and the old wardrobe. */
function commitStats(next) {
  try { localStorage.setItem(STAT_KEY, JSON.stringify(next)); return true; }
  catch (e) { return false; }
}
/* state of one catalog item for the current learner */
function outfitState(id, st) {
  const s = st || loadStats();
  const item = outfitById(id);
  if (!item) return "unknown";
  if ((s.equippedItemIds || [])[0] === id) return "equipped";
  if ((s.ownedItemIds || []).includes(id)) return "owned";
  if (marziStageForXp(s.xp) < item.stage) return "locked";
  return (s.coins || 0) < item.price ? "insufficient" : "available";
}
/* Idempotent purchase: an already-owned item never deducts again, and the
   deduction + ownership land together or not at all. Buying does NOT equip. */
function purchaseOutfit(id) {
  const item = outfitById(id);
  if (!item) return { ok: false, code: "unknown" };
  const st = loadStats();
  if ((st.ownedItemIds || []).includes(id)) return { ok: false, code: "already" };
  if (marziStageForXp(st.xp) < item.stage) return { ok: false, code: "locked" };
  if ((st.coins || 0) < item.price) return { ok: false, code: "insufficient" };
  const next = { ...st, coins: st.coins - item.price, ownedItemIds: (st.ownedItemIds || []).concat(id) };
  if (!commitStats(next)) return { ok: false, code: "save-failed" };
  return { ok: true, code: "bought" };
}
/* Exactly one outfit may be worn; equipping another replaces it. */
function equipOutfit(id) {
  const st = loadStats();
  if (!(st.ownedItemIds || []).includes(id)) return { ok: false, code: "not-owned" };
  const next = { ...st, equippedItemIds: [id] };
  return commitStats(next) ? { ok: true, code: "equipped" } : { ok: false, code: "save-failed" };
}
function unequipOutfit() {
  const st = loadStats();
  const next = { ...st, equippedItemIds: [] };
  return commitStats(next) ? { ok: true, code: "unequipped" } : { ok: false, code: "save-failed" };
}

/* ---------- MARZI-008: canonical reward summary ----------
   Built AFTER persistence, from committed state only. Frozen: animation code
   reads it and never mutates XP, coins or the ledger.

   High-performance rule (transparent, no hidden scoring):
     learner turns >= 4
     AND the call was not abandoned (no AI request was still pending at hang-up)
     AND corrections <= floor(learner turns / 4)   (at most one per four turns)
*/
const CELEBRATED_KEY = "marzi.celebrated-stage.v1";
function isHighPerformance({ turns, mistakes, abandoned }) {
  return turns >= 4 && !abandoned && mistakes <= Math.floor(turns / 4);
}
function buildRewardSummary({ xpBefore, coinsBefore, gained, claim, turns, mistakes, seconds, abandoned }) {
  const after = loadStats();
  const saved = claim.saved !== false;
  // never report a gain that is not in committed storage
  const xpAfter = saved ? (after.xp || 0) : xpBefore;
  const coinsAfter = saved ? (after.coins || 0) : coinsBefore;
  const xp = saved ? Math.max(0, xpAfter - xpBefore) : 0;
  const coins = saved ? Math.max(0, coinsAfter - coinsBefore) : 0;
  const stageBefore = marziStageForXp(xpBefore);
  const stageAfter = marziStageForXp(xpAfter);
  const base = MARZI_STAGE_XP[stageAfter - 1] || 0;
  const nextAt = MARZI_STAGE_XP[stageAfter] || null;
  const state = !saved ? "save-failed"
    : claim.duplicate ? "duplicate"
    : gained <= 0 ? "none"
    : stageAfter > stageBefore ? "evolved"
    : isHighPerformance({ turns, mistakes, abandoned }) ? "high"
    : "normal";
  return Object.freeze({
    xp, coins, seconds, turns, mistakes,
    xpBefore, xpAfter, coinsAfter,
    stageBefore, stageAfter, evolved: stageAfter > stageBefore,
    stagePct: nextAt ? Math.min(100, Math.round(100 * (xpAfter - base) / (nextAt - base))) : 100,
    stagePctBefore: nextAt ? Math.min(100, Math.round(100 * (Math.max(base, xpBefore) - base) / (nextAt - base))) : 100,
    state, saved,
  });
}

function recordCall() {
  if (!S.turns.some((x) => x.me)) return 0;
  const gained = 15 + Math.min(20, S.turns.filter((x) => x.me).length * 2);
  const claim = claimReward("call:" + (S.callId || (S.callId = newRewardId())), { xp: gained, coins: 20 });
  if (!claim.claimed) return 0; // this call was already counted
  const st = loadStats();
  const d = new Date().toISOString().slice(0, 10);
  st.days[d] = (st.days[d] || 0) + 1;
  st.calls += 1;
  st.seconds += S.seconds;
  st.secDays[d] = (st.secDays[d] || 0) + S.seconds;
  // MARZI-016: which scenario this call completed, so the learning map can
  // show real progress. Ad-hoc topics have no node and are not recorded.
  const sid = (S.active || S.scenario || {}).id;
  if (sid && sid !== "custom" && sid !== "random") {
    st.scenariosDone = st.scenariosDone || {};
    st.scenariosDone[sid] = (st.scenariosDone[sid] || 0) + 1;
  }
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
  return gained;
}

/* ---------- Marzi, the learning companion frog ----------
   Seven stages mapped 1:1 onto the XP ranks. Designed by the family,
   drawn as layered SVG so outfits can be added later. */
/* SIX canonical lamina stages (master spec §15): eggs, tadpole, tadpole with
   legs, young frog, studious frog (glasses + book), expert frog (cap + pencil).
   Evolution has its OWN XP thresholds (review §1.2) - learner rank (rankFor)
   is a separate system and stays untouched for level titles. */
/* Stage names and descriptions are localized (concept boards 01/04 are
   canonical; Spanish is transcribed verbatim from them). The six XP
   thresholds below are unchanged. */
const MARZI_STAGE_COUNT = 6;
function marziNames() {
  const L = t();
  return (L && L.stageNames && L.stageNames.length === MARZI_STAGE_COUNT) ? L.stageNames : T.en.stageNames;
}
function marziDescs() {
  const L = t();
  return (L && L.stageDescs && L.stageDescs.length === MARZI_STAGE_COUNT) ? L.stageDescs : T.en.stageDescs;
}
const MARZI_STAGE_XP = [0, 150, 400, 800, 1500, 2600];
function marziStageForXp(xp) {
  const n = Number(xp);
  const safe = Number.isFinite(n) && n > 0 ? n : 0;
  let stage = 1;
  for (let i = 0; i < MARZI_STAGE_XP.length; i++) if (safe >= MARZI_STAGE_XP[i]) stage = i + 1;
  return stage;
}
function currentMarziStage() { return marziStageForXp(loadStats().xp); }
/* Call companion (review §1.1): the EARNED stage, never forced. Stages 1-3
   render inside a circular badge with a caption so early Marzi stays
   recognizable without pretending an egg stands in the scene. */
function renderCallCompanion() {
  const stage = currentMarziStage();
  const el = $("vcMarzi");
  const state = marziStateForCall(callStateFor(S));   // deterministic, no new inference
  el.dataset.stage = String(stage);
  el.dataset.state = state;
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", `Marzi, ${marziNames()[stage - 1]}, ${stage}/${MARZI_STAGE_COUNT}`);
  // production first: the supplied call pose serves every call state until
  // per-state files ship; the generated SVG stays the fallback
  const prodSrc = marziAssetSrc(stage, state) || marziAssetSrc(stage, "listening");
  const art = prodSrc ? `<img class="marzi-art-img" src="${esc(prodSrc)}" alt="" />` : marziSVG(stage, state);
  el.innerHTML = `<span class="vc-marzi-art" data-state="${state}">${art}</span>` +
    `<span class="vc-marzi-cap">Marzi · ${esc(marziNames()[stage - 1])} · ${stage}/${MARZI_STAGE_COUNT}</span>`;
}
/* ---------- MARZI-013: canonical presentation states ----------
   Eight states, mapped deterministically from state the app already owns:
   the call state machine (callStateFor) and the reward summary state.
   Nothing new is inferred and no artwork is invented - the shipped SVG is
   always the fallback, and a resolver is prepared so approved production
   files can be dropped in without touching any call site. */
const MARZI_STATES = ["neutral", "happy", "listening", "thinking", "speaking", "sad", "error", "celebrating"];

/* call state -> presentation state (call screen, companion) */
const CALL_STATE_MOOD = {
  ready: "neutral", listening: "listening", processing: "thinking",
  speaking: "speaking", disconnected: "sad", error: "error",
};
/* reward summary state -> presentation state (end of call) */
const REWARD_STATE_MOOD = {
  normal: "happy", high: "celebrating", evolved: "celebrating",
  none: "sad", duplicate: "neutral", "save-failed": "error",
};
function marziStateForCall(state) { return CALL_STATE_MOOD[state] || "neutral"; }
function marziStateForReward(state) { return REWARD_STATE_MOOD[state] || "neutral"; }
function isMarziState(x) { return MARZI_STATES.includes(x); }

/* Where an approved production file WOULD live (docs/design/MARZI_ASSET_SPEC.md
   naming). The registry is empty until real files are added, so every lookup
   falls back to the shipped SVG - no requests are made for files that do not

/* ---------- tiny synth: jingle, coin, fanfare, German ringback ---------- */
const SFX = (() => {
  let ctx = null, ringT = null, jingled = false;
  const on = () => S.sound !== false;
  function ac() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === "suspended") ctx.resume().catch(() => {});
    return ctx;
  }
  function note(c, f, t, d, type, g) {
    const o = c.createOscillator(), v = c.createGain();
    o.type = type; o.frequency.value = f;
    v.gain.setValueAtTime(0.0001, t);
    v.gain.linearRampToValueAtTime(g, t + 0.015);
    v.gain.exponentialRampToValueAtTime(0.0008, t + d);
    o.connect(v); v.connect(c.destination); o.start(t); o.stop(t + d + 0.05);
  }
  function melody(notes, type, g) {
    if (!on()) return; const c = ac(); if (!c) return;
    const t0 = c.currentTime + 0.03;
    notes.forEach(([f, at, d]) => note(c, f, t0 + at, d, type, g));
  }
  return {
    jingle() { if (jingled) return; jingled = true; melody([[523.25, 0, .45], [659.25, .13, .45], [783.99, .26, .45], [1046.5, .39, .85]], "triangle", .05); },
    coin() { melody([[987.77, 0, .1], [1318.5, .09, .22]], "square", .035); },
    fanfare() { melody([[523.25, 0, .16], [659.25, .13, .16], [783.99, .26, .16], [659.25, .42, .4], [783.99, .42, .4], [1046.5, .42, .55]], "triangle", .055); },
    ringStart() {
      this.ringStop(); if (!on()) return; const c = ac(); if (!c) return;
      const beep = () => { if (!on() || !ctx) return; note(ctx, 425, ctx.currentTime, 0.95, "sine", 0.04); };
      beep(); ringT = setInterval(beep, 4500);
    },
    ringStop() { clearInterval(ringT); ringT = null; },
  };
})();
document.addEventListener("pointerdown", () => SFX.jingle(), { once: true });

/* ---------- API calls (with optional PIN when hosted) ---------- */
const PIN_KEY = "telefontrainer.pin";
async function chatFetch(payload) {
  const doFetch = () => fetch("/api/chat", {
    method: "POST",
    headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
    body: JSON.stringify(payload),
  });
  let res = await doFetch();
  if (res.status === 401) {
    const pin = prompt(t().pinAsk);
    if (pin != null && pin.trim()) {
      localStorage.setItem(PIN_KEY, pin.trim());
      res = await doFetch();
    }
    if (res.status === 401) localStorage.removeItem(PIN_KEY);
  }
  if (res.status === 429 && !S.limitShown) {
    S.limitShown = true;
    showLimit();
  }
  return res;
}

/* ---------- voices ---------- */

  S.voice = v.find((x) => x.lang === TARGET.locale && hint.test(x.name))

/* Neural voice via /api/tts when the server has a TTS key; device voice otherwise.
   The 501 probe result is remembered for the session so unconfigured servers
   cost one extra request per page load, not one per line. */
let neuralOK = true;
const ttsCache = new Map(); // text -> object URL (mp3)
let currentAudio = null;

/* while the character speaks: glowing frame + a very subtle slow camera
   drift on the portrait (like a live webcam). No facial animation - a good
   still portrait beats a fake mouth. */
let lifeRAF = null;
function lifeStart() {
  if (lifeRAF) return;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const img = $("vcImg");
  if (img) img.style.transition = "";
  const tick = () => {
    const el = $("vcImg");
    if (el) {
      const now = performance.now();
      const rot = Math.sin(now / 1600) * 0.4;
      const ty = Math.sin(now / 2100) * 2.2;
      const sc = 1.045 + Math.sin(now / 1200) * 0.006;
      el.style.transform = `scale(${sc.toFixed(3)}) rotate(${rot.toFixed(2)}deg) translateY(${ty.toFixed(1)}px)`;
    }
    lifeRAF = requestAnimationFrame(tick);
  };
  tick();
}
function lifeStop() {
  if (lifeRAF) { cancelAnimationFrame(lifeRAF); lifeRAF = null; }
  const el = $("vcImg");
  if (el) { el.style.transition = "transform .6s ease"; el.style.transform = ""; }
}

function setSpeaking(on) {
  S.speaking = !!on;
  try { renderCallStatus(); } catch (e) {}
  const el = $("vcAv");
  if (el) el.classList.toggle("speaking", !!on);
  const dl = $("dlgAv"); // the guided-dialogue portrait shares the glow
  if (dl) dl.classList.toggle("speaking", !!on);
  if (on) lifeStart(); else lifeStop();
}

function stopAudio() {
  if (currentAudio) {
    try { currentAudio.onended = null; currentAudio.pause(); } catch (e) {}
    currentAudio = null;
  }
  setSpeaking(false);
}

/* voice of speaker 1 (the usual contact) or 2 (doctor/boss/spouse who took over) */
function voiceOf(sp) {
  const A = S.active || S.scenario || {};
  return (sp === 2 ? A.voice2 || A.voice : A.voice) || "";
}

/* character id of the current speaker, for voice acting on the server */
function charOf(sp) {
  const A = S.active || S.scenario || {};
  if (!A.id || A.id === "custom" || A.id === "random") return "";
  return sp === 2 ? A.id + "2" : A.id;
}

async function neuralSpeak(text, rate, done, voice, pace, char) {
  if (voice === undefined) voice = voiceOf(1);
  pace = pace || "normal";
  char = char || "";
  const key = voice + "|" + pace + "|" + char + "|" + text;
  let url = ttsCache.get(key);
  if (!url) {
    const res = await fetch("/api/tts", {
      method: "POST",
      headers: { "content-type": "application/json", "x-trainer-pin": localStorage.getItem(PIN_KEY) || "" },
      body: JSON.stringify({ text, voice, pace, char, lang: TARGET.code }),
    });
    if (res.status === 501) { neuralOK = false; throw new Error("unconfigured"); }
    if (!res.ok) throw new Error("tts " + res.status);
    url = URL.createObjectURL(await res.blob());
    ttsCache.set(key, url);
    if (ttsCache.size > 40) {
      const k = ttsCache.keys().next().value;
      URL.revokeObjectURL(ttsCache.get(k));
      ttsCache.delete(k);
    }
  }
  const a = new Audio(url);
  // the pace lives in the speech itself now; only fine-tune, never stretch
  a.playbackRate = Math.max(0.9, Math.min(1.1, rate));
  if ("preservesPitch" in a) a.preservesPitch = true;
  currentAudio = a;
  a.onended = () => {
    if (currentAudio === a) currentAudio = null;
    setSpeaking(false);
    done && setTimeout(done, 350);
  };
  await a.play();
  setSpeaking(true);
}

function deviceSpeak(text, rate, done) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = TARGET.locale;
  if (S.voice) u.voice = S.voice;
  u.rate = rate;
  u.onstart = () => setSpeaking(true);
  u.onend = () => { setSpeaking(false); done && setTimeout(done, 350); };
  u.onerror = () => { setSpeaking(false); done && setTimeout(done, 350); };
  speechSynthesis.speak(u);
}

function speak(text, slow, done, sp) {
  if (!text) { if (done) done(); return; }
  SFX.ringStop();
  speechSynthesis.cancel();
  stopAudio();
  const rate = slow ? 0.6 : LEVELS[S.level].rate * (SPEEDS[S.speed] || 1);
  if (neuralOK) {
    const pace = slow || rate < 0.92 ? "slow" : rate > 1.08 ? "fast" : "normal";
    neuralSpeak(text, rate, done, voiceOf(sp || 1), pace, charOf(sp || 1)).catch(() => deviceSpeak(text, rate, done));
    return;
  }
  deviceSpeak(text, rate, done);
}

/* ---------- MARZI-016: the learning journey ----------
   A map over the EXISTING scenarios in the EXISTING group order - no new
   characters, no new scenarios, no simulated town. Every node stays as
   reachable as it is in the picker: `future` is a look-ahead marker, never a
   lock, so navigation is unchanged. */
function journeyNodes() {
  const out = [];
  GROUPS.forEach((g, gi) => {
    g.ids.forEach((id) => {
      const s = SCENARIOS.find((x) => x.id === id);
      if (s && s.goals) out.push({ id, scenario: s, group: g, groupIndex: gi });
    });
  });
  return out;
}
/* States: done · here (the one recommended next) · open (reachable and part
   of a group already under way) · future (further along the path). */
function journeyState(st) {
  const done = (st || loadStats()).scenariosDone || {};
  const nodes = journeyNodes();
  const isDone = (n) => (done[n.id] || 0) > 0;
  const startedGroups = new Set(nodes.filter(isDone).map((n) => n.groupIndex));
  const hereIndex = nodes.findIndex((n) => !isDone(n));
  const hereGroup = hereIndex < 0 ? -1 : nodes[hereIndex].groupIndex;
  const list = nodes.map((n, i) => ({
    ...n,
    times: done[n.id] || 0,
    state: isDone(n) ? "done"
      : i === hereIndex ? "here"
      : startedGroups.has(n.groupIndex) || n.groupIndex === hereGroup ? "open"
      : "future",
  }));
  return {
    nodes: list,
    doneCount: list.filter((n) => n.state === "done").length,
    total: list.length,
    here: hereIndex < 0 ? null : list[hereIndex],
  };
}
let JOURNEY_VIEW = "map"; // "map" | "list" - the accessible alternative
function setJourneyView(v) {
  JOURNEY_VIEW = v === "list" ? "list" : "map";
  renderJourney();
  return JOURNEY_VIEW;
}
function goToScenario(id) {
  const s = SCENARIOS.find((x) => x.id === id);
  if (!s) return false;
  S.scenario = s;
  saveSettings();
  renderSetup();
  showTab("talk");
  return true;
}
function renderJourney() {
  const L = t();
  const J = journeyState();
  const stateLabel = { done: L.jrDone, here: L.jrHere, open: L.jrOpen, future: L.jrFuture };
  $("jrTitle").textContent = L.jrTitle;
  $("jrCount").textContent = `${J.doneCount}/${J.total}`;
  $("jrSeg").innerHTML =
    `<button type="button" data-jv="map" class="${JOURNEY_VIEW === "map" ? "on" : ""}" aria-pressed="${JOURNEY_VIEW === "map"}">${esc(L.jrMap)}</button>` +
    `<button type="button" data-jv="list" class="${JOURNEY_VIEW === "list" ? "on" : ""}" aria-pressed="${JOURNEY_VIEW === "list"}">${esc(L.jrList)}</button>`;
  $("jrSeg").querySelectorAll("[data-jv]").forEach((b) => b.onclick = () => setJourneyView(b.dataset.jv));

  const label = (n) => `${n.scenario.de} · ${stateLabel[n.state]}`;
  if (JOURNEY_VIEW === "map") {
    let lastGroup = -1;
    $("jrBody").innerHTML = `<ol class="jr-path">` + J.nodes.map((n) => {
      const head = n.groupIndex !== lastGroup
        ? `<li class="jr-group" role="presentation">${esc(n.group[S.lang] || n.group.en)}</li>` : "";
      lastGroup = n.groupIndex;
      return head + `<li class="jr-li"><button class="jr-node" type="button" data-jn="${esc(n.id)}"` +
        ` data-state="${n.state}"${n.state === "here" ? ' aria-current="step"' : ""}` +
        ` aria-label="${esc(label(n))}"><span class="jr-face" aria-hidden="true">${esc(n.scenario.avatar || "🎧")}</span>` +
        `<span class="jr-nm">${esc(n.scenario.de)}</span>` +
        `<span class="jr-st" aria-hidden="true">${n.state === "done" ? IC.check(ICON.xs) : ""}</span></button></li>`;
    }).join("") + `</ol>`;
  } else {
    let lastGroup = -1;
    $("jrBody").innerHTML = `<div class="list jr-list">` + J.nodes.map((n) => {
      const head = n.groupIndex !== lastGroup
        ? `<div class="label" style="margin:14px 14px 6px">${esc(n.group[S.lang] || n.group.en)}</div>` : "";
      lastGroup = n.groupIndex;
      return head + `<button class="item" type="button" data-jn="${esc(n.id)}" data-state="${n.state}"` +
        `${n.state === "here" ? ' aria-current="step"' : ""}><b>${esc(n.scenario.de)}</b>` +
        `<small>${esc(scenarioSubtitle(n.scenario) + " · " + stateLabel[n.state])}</small></button>`;
    }).join("") + `</div>`;
  }
  $("jrBody").querySelectorAll("[data-jn]").forEach((b) => b.onclick = () => goToScenario(b.dataset.jn));

  // exactly one recommended next action
  const next = J.here || J.nodes[0];
  $("jrNext").innerHTML = next
    ? IC.mic(ICON.lg) + " " + esc(`${J.here ? L.jrNext : L.jrReview}: ${next.scenario.de}`)
    : "";
  $("jrNext").classList.toggle("hidden", !next);
  if (next) $("jrNext").onclick = () => goToScenario(next.id);
}

/* ---------- MARZI-005: practice scenario + character cards ----------
   Cards over the existing SCENARIOS data only - no new characters, no new
   portraits. The drawer stays the full grouped list. */
function scenarioSubtitle(s) {
  const loc = s[S.lang] || s.en;
  return loc === s.de ? s.who : `${loc} · ${s.who}`;
}
function renderScenarioCards() {

/* selecting a contact resets coaching/translation state (nothing may leak

/* ---------- LEARN home: greeting, Marzi hero, today's mission (spec §23) ---------- */
function renderLearn() {
  const L = t();
  const st = loadStats();
  const xp = st.xp || 0, r = rankFor(xp);
  const stage = marziStageForXp(xp);
  const stageName = marziNames()[stage - 1];
  $("learnHi").textContent = L.hello;
  $("marzi").innerHTML = marziSVG(stage);
  // board hierarchy: Marzi, then stage number + stage name as the identity
  $("heroStage").textContent = `${L.stageWord} ${stage}`;
  $("heroStageName").textContent = stageName;
  // the whole hero button opens the evolution showcase (clickable + keyboard)
  $("marziBtn").setAttribute("aria-label", `Marzi · ${stageName} · ${stage}/${MARZI_STAGE_COUNT} — ${L.evoTitle}`);
  $("marziBtn").onclick = () => {
    $("limitBox").classList.remove("limit-full");
    $("limitPlan").classList.add("hidden");
    $("limitMarzi").innerHTML = "";
    $("limitTitle").textContent = t().evoTitle;
    $("limitBody").innerHTML = evolutionHTML(stage);
    $("limitReset").textContent = "";
    $("limitStore").classList.add("hidden");
    $("limitOk").textContent = t().ok;
    $("limitBack").classList.remove("hidden");
    $("limitBox").classList.remove("hidden");
  };
  // "last celebrated stage" is its own key: the end-of-call celebration and
  // this hero animation are the same event, shown in whichever place happens
  // first. MARZI_KEY keeps its own meaning (last stage the hero rendered).
  const prevStage = +(localStorage.getItem(MARZI_KEY) || 0);
  const celebrated = +(localStorage.getItem(CELEBRATED_KEY) || 0);
  if (prevStage && stage > prevStage && celebrated < stage) {
    try { localStorage.setItem(CELEBRATED_KEY, String(stage)); } catch (e) {}
    $("marzi").classList.remove("evolve");
    void $("marzi").offsetWidth;
    $("marzi").classList.add("evolve");
    SFX.fanfare(); confettiBurst();
  }
  try { localStorage.setItem(MARZI_KEY, String(stage)); } catch (e) {}
  // learner rank stays a small secondary line - rank and evolution remain
  // separate systems (MARZI-001)
  $("heroLv").textContent = `Lv. ${r.n} · ${r.title}`;
  const inLevel = Math.max(0, xp - r.base);
  const needed = r.next ? r.next - r.base : 0;
  $("heroXp").textContent = needed ? `${inLevel} / ${needed} XP` : `${xp} XP`;
  $("xpFill").style.width = (needed ? Math.min(100, Math.round(100 * inLevel / needed)) : 100) + "%";
  $("heroSub").textContent = `${st.calls || 0} ${L.calls}`;
  $("practiceBtn").innerHTML = IC.mic(ICON.lg) + " " + esc(L.practiceNow);
  $("practiceBtn").onclick = () => goCall();
  renderJourney();

  const strk = currentStreak(st);
  $("heroStreak").innerHTML = `${IC.flame(ICON.btn)} ${strk} <small>${esc(L.days)}</small>`;
  const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
  let wk = "";
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toISOString().slice(0, 10);
    wk += `<div class="d ${i === 0 ? "today" : ""}">${WD[d.getDay()]}<div class="dot ${(st.days || {})[key] ? "on" : ""}"></div></div>`;
  }
  $("heroWeek").innerHTML = wk;
  $("missionLbl").textContent = L.mission;
  const today = new Date().toISOString().slice(0, 10);
  const steps = [
    [IC.cards(ICON.xxs), L.rVocab, (st.vocabDays || {})[today], "vocab"],
    [IC.chat(ICON.xxs), L.rCall, (st.days || {})[today], "call"],
    [IC.target(ICON.xxs), L.rDrill, (st.drillDays || {})[today], "drill"],
  ];
  $("routine").innerHTML = steps.map(([ic, name, done, act]) =>
    `<button class="${done ? "done" : ""}" data-r="${act}">${done ? "✓" : ic} ${esc(name)}</button>`).join("");
  $("routine").querySelectorAll("[data-r]").forEach((b) => b.onclick = () => {
    if (b.dataset.r === "vocab") startVocab();
    else if (b.dataset.r === "call") goCall();
    else if (loadFixes().some((f) => f.corrected)) startDrill();
    else { renderMistakes(); show("mistakes"); }
  });

  // one compact strip: guided dialogue · progress · mistakes (details open on tap;
  // the evolution preview lives behind tap-on-Marzi to keep Learn on one screen)
  const nFix = loadFixes().length;
  $("learnActs").innerHTML =
    `<button class="act col" data-la="dialog" ${dialogAvailable().length ? "" : "disabled"}>${IC.chat(ICON.lg)}<span>${esc(L.dialog)}</span></button>
     <button class="act col" data-la="progress">${IC.trend(ICON.lg)}<span>${esc(L.progress)}</span></button>
     <button class="act col" data-la="mistakes">${IC.list(ICON.lg)}<span>${esc(L.mistakes)}${nFix ? ` (${nFix})` : ""}</span></button>`;
  $("learnActs").querySelectorAll("[data-la]").forEach((b) => b.onclick = () => {
    if (b.dataset.la === "dialog") startDialog();
    else if (b.dataset.la === "progress") startProgress();
    else { renderMistakes(); show("mistakes"); }
  });
  updateTopbar();
}

/* preview + explicit purchase / equip / unequip */
function openOutfitPreview(id) {
  const L = t();
  const item = outfitById(id);
  if (!item) return;
  STORE_PREVIEW = id;
  const state = outfitState(id, loadStats());
  const primary =
    state === "available" ? UI.buttonPrimary({ id: "storeBuy", label: L.buyBtn, icon: IC.coin(ICON.sm), cls: "store-act" })
    : state === "owned" ? UI.buttonPrimary({ id: "storeEquip", label: L.equipBtn, icon: IC.check(ICON.sm), cls: "store-act" })
    : state === "equipped" ? UI.buttonSecondary({ id: "storeUnequip", label: L.unequipBtn, cls: "store-act" })
    : "";
  // one body line: what it costs, or why it cannot be bought yet
  const body = state === "locked" ? `${L.needStage} ${item.stage}`
    : state === "insufficient" ? `${L.notEnough} · ${item.price}`
    : state === "available" ? String(item.price)
    : state === "equipped" ? L.equippedLbl : L.ownedLbl;
  $("storeModal").innerHTML = UI.modal({
    title: outfitName(id), labelledBy: "storeModalTitle", body,
    actions: `<div class="store-modal-art" aria-hidden="true">${OUTFIT_ART(id)}</div>` +
      primary + UI.buttonSecondary({ id: "storeCancel", label: L.cancelBtn, cls: "store-act" }),
  });
  $("storeModal").classList.remove("hidden");
  $("storeBack").classList.remove("hidden");
  const act = $("storeBuy") || $("storeEquip") || $("storeUnequip") || $("storeCancel");
  try { act.focus(); } catch (e) {}
  if ($("storeBuy")) $("storeBuy").onclick = () => runStoreAction(purchaseOutfit(id));
  if ($("storeEquip")) $("storeEquip").onclick = () => runStoreAction(equipOutfit(id));
  if ($("storeUnequip")) $("storeUnequip").onclick = () => runStoreAction(unequipOutfit());
  $("storeCancel").onclick = () => closeOutfitPreview();
  $("storeBack").onclick = () => closeOutfitPreview();
}
function closeOutfitPreview() {
  STORE_PREVIEW = null;
  $("storeModal").classList.add("hidden");
  $("storeBack").classList.add("hidden");
}
/* one place turns a transaction result into feedback + a re-render */
function runStoreAction(res) {
  const L = t();
  const msg = { bought: L.bought, equipped: L.equippedLbl, unequipped: L.ownedLbl,
                insufficient: L.notEnough, locked: L.comingLater, already: L.ownedLbl,
                "save-failed": L.saveFailed, "not-owned": L.notEnough }[res.code] || "";
  STORE_MSG = msg;
  if (res.ok && res.code === "bought") SFX.fanfare();
  closeOutfitPreview();
  renderStore();
}
function announceStore(msg) {
  const el = $("storeLive");
  if (el) el.textContent = msg;
}
function buyPack(id) {
  const p = COIN_PACKS.find((x) => x.id === id);
  if (!p) return;
  const st = loadStats();
  if ((st.coins || 0) < p.price) { STORE_MSG = t().notEnough; renderStore(); return; }
  st.coins -= p.price;
  st.extraSecs = st.extraSecs || {};
  const d = new Date().toISOString().slice(0, 10);
  st.extraSecs[d] = (st.extraSecs[d] || 0) + p.minutes * 60;
  try { localStorage.setItem(STAT_KEY, JSON.stringify(st)); } catch (e) {}
  SFX.fanfare();
  STORE_MSG = t().bought;
  renderStore();
}

/* ---------- PROFILE: stats, settings, premium teaser ----------
   MARZI-015. Every number on this screen comes from `profileSnapshot()`,
   which reads only counters the app already writes - there is no estimated,

/* ---------- MARZI-010: right-to-left support ----------

   identical and RTL mirrors correctly. */
const RTL_LANGS = ["ar"];

  const l = lang || S.lang || "en";
  const dir = RTL_LANGS.includes(l) ? "rtl" : "ltr";

function syncTabHash(tab) {

  // least-practised first, then least-recently practised
  items.sort((a, b) => ((a.f.box || 0) - (b.f.box || 0)) || ((a.f.drilled || "") < (b.f.drilled || "") ? -1 : 1));
  D = { q: items.slice(0, 8), i: 0, open: false, total: Math.min(8, items.length) };

      : `<div class="drill-ok">${esc(f.corrected)}</div>

         <div class="row">
           <button class="ghost" data-da="play">&#9654; ${esc(L.sayIt)}</button>
           <button class="ghost" data-da="say" ${D.listening ? "disabled" : ""}>${D.listening ? esc(L.listening) : esc(L.sayWord)}</button>
         </div>
         <div class="row">
           <button class="ghost" data-da="knew">${esc(L.knew)}</button>

         </div>`);
  $("drillCard").querySelectorAll("[data-da]").forEach((b) => b.onclick = () => {
    const act = b.dataset.da;
    if (act === "play") { speak(f.corrected, true); return; }
    if (act === "say") { listenFor(f.corrected, D, renderDrill); return; }
    if (act === "reveal") {
      D.open = true; renderDrill();
      // listen -> repeat: after the corrected sentence plays, the mic opens
      speak(f.corrected, true, () => { if (D && D.open && D.q[D.i] === item && !D.listening) listenFor(f.corrected, D, renderDrill); });
      return;
    }
    const all = loadFixes(), rec = all[item.i];
    if (rec) {
      rec.box = act === "knew" ? (rec.box || 0) + 1 : 0;
      rec.drilled = new Date().toISOString().slice(0, 10);
      saveFixes(all);
    }
    if (act === "knew") addCoins(2); // corrected mistake reward (spec §14)
    if (act === "retry") D.q.push(item);
    D.i++; D.open = false; D.verdict = null; D.heard = null; D.err = null;
    renderDrill();
  });
}

/* normalize to the TARGET language's letters (historical name: was German-only) */
const NORM_RE = new RegExp("[^" + TARGET.charset + " ]", "g");
function normDe(s) {
  return String(s || "").toLowerCase().replace(NORM_RE, " ").replace(/\s+/g, " ").trim();
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
/* the learner said the word if every content word of the target appears
   (fuzzily) in what the recognizer heard - articles don't count */
function saidWord(heard, target) {
  const SKIP = TARGET.skip;
  const H = normDe(heard).split(" ").filter(Boolean);
  const Hjoin = H.join("");
  const all = normDe(target).split(" ").filter((w) => w && !SKIP.includes(w));
  // prefer content words, but fall back to short ones ("wo", "was") for one-word cards
  let Tw = all.filter((w) => w.length > 2);
  if (!Tw.length) Tw = all;
  if (!Tw.length) return false;
  // forgiving on purpose: this is encouragement, not an exam. The recognizer
  // itself mangles learner speech, so allow 2 edits on short words, accept the
  // word inside the joined transcript (recognizers split compounds), and for
  // phrases require 60% of the content words instead of all of them.
  const hit = (tw) => {
    const tol = tw.length <= 2 ? 0 : tw.length <= 7 ? 2 : 3;
    return H.some((h) => lev(h, tw) <= tol) || (tw.length >= 5 && Hjoin.includes(tw));
  };
  const need = Math.max(1, Math.ceil(Tw.length * 0.6));
  return Tw.filter(hit).length >= need;
}

async function loadDeck() {
  const sc = S.scenario;
  const topic = sc.id === "custom" ? (S.customTopic || "").trim() : "";
  const key = VOCAB_NS + "v2." + sc.id + "." + (topic ? encodeURIComponent(topic).slice(0, 60) + "." : "") + S.lang + "." + S.level;
  try {
    const c = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(c) && c.length) return c;
  } catch (e) {}
  const help = HELP_LANG[S.lang] || "English";
  const what = topic ? `a phone call about: ${topic}`
    : sc.kind === "face" ? `${sc.de} - an in-person conversation at ${sc.place}`
    : `${sc.de} - calling ${sc.place}`;
  const res = await chatFetch({
    system: `You create a vocabulary deck for a ${TARGET.name} learner at CEFR level ${S.level} preparing for ${what}.
Return ONLY a JSON array, no markdown, of exactly 12 items:
[{"de":"...","tr":"...","ex":"...","xt":"..."}]
"de": the ${TARGET.name} word with its article (for nouns) or a short key phrase. "tr": its translation in ${help}. "ex": one short natural ${TARGET.name} sentence using it, something the learner could actually say or hear in this phone call, at level ${S.level}. "xt": the translation of "ex" in ${help}.
Pick what is genuinely most useful for THIS call: core nouns, key verbs, and 2-3 fixed telephone phrases.`,
    messages: [{ role: "user", content: "Create the deck." }],
  });
  const data = await res.json();
  const raw = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  const clean = raw.replace(/```json|```/g, "").trim();
  const deck = JSON.parse(clean.slice(clean.indexOf("["), clean.lastIndexOf("]") + 1))
    .filter((x) => x && x.de && x.tr).slice(0, 12)
    .map((x) => ({ de: x.de, tr: x.tr, ex: x.ex || "", exTr: x.xt || "" }));
  if (!deck.length) throw new Error("empty deck");
  try { localStorage.setItem(key, JSON.stringify(deck)); } catch (e) {}
  return deck;
}

async function openDeck(kind) {
  V = { stage: "deck", deck: null, i: 0, flipped: false, heard: null, verdict: null, listening: false, failed: false };
  if (kind === "call") {

    V.clipChar = sc.id !== "custom" && sc.id !== "random" ? sc.id : "";

    renderVocab();
    try { V.deck = await loadDeck(); } catch (e) { V.failed = true; }
    renderVocab();
  } else if (kind === "mywords") {

  } else if (!V.deck) {
